/* Chapter 13: Application Security with Machine Learning (Guide to AI for Cybersecurity) */
const CH = {"id":"ch13","num":"13","title":"Application Security with Machine Learning","summary":"How machine learning strengthens application security: smarter dynamic testing, IAST and taint tracking, API discovery and anomaly detection, container and supply chain security, service mesh protection for microservices, and a phased adoption roadmap.","outcomes":["Explain why modern applications need ML-assisted security testing","Describe ML-enhanced DAST and IAST taint tracking","Match ML techniques to API security tasks, including BOLA","Design an API anomaly detection pipeline with good features","Apply ML across the container lifecycle and supply chain","Plan a phased roadmap and state ML's limits honestly"],"starter":[{"q":"Can a scanner reliably find business-logic flaws such as negative prices?","o":["Yes","Often not, because they are not known patterns"],"a":1,"e":"Behavioural models and experts help."},{"q":"Seeing another customer's data by changing an ID in a request is called…","o":["BOLA","Phishing","Encryption"],"a":0,"e":"It tops the OWASP API Security Top 10."},{"q":"Should you test a website you do not own without permission?","o":["Yes","No"],"a":1,"e":"Always get written permission."}],"lessons":[{"title":"The application security challenge","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four eras of application security testing","nodes":[{"id":"m","label":"Manual testing\n1990–2005","p":[-5.2,0.0,-0.3],"c":"slate","shape":"sphere","size":0.8,"ls":0.62},{"id":"a","label":"Automated scanning\n2005–2015","p":[-1.73,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"d","label":"DevSecOps\n2015–2020","p":[1.73,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ai","label":"AI-powered security\n2020 onwards","p":[5.2,1.5,0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62}],"links":[["m","a",2],["a","d",2],["d","ai",2]],"steps":["all",["m"],["a"],["d"],["ai"]]},"say":["Welcome to Chapter 13, Application Security with Machine Learning, and I'm Sam, your tutor. Web applications are one of the most common routes into an organisation, most codebases contain known flaws in reused open-source components, and breaches cost millions.","In the manual era, experts read code and tried attacks by hand: thorough, but weeks per application.","Automated scanners were faster but raised many false alarms and missed business-logic flaws, such as buying an item for a negative price.","DevSecOps moved checks into the delivery pipeline, but brought tool sprawl.","AI-powered tools learn normal behaviour and adapt as the application changes, though they depend on good data. Static testing, SAST, reads code like proofreading; dynamic testing, DAST, probes the running app like a mystery shopper; interactive testing, IAST, watches from inside while it runs. Machine learning is a detection aid, not a replacement for experts and tools."]}],"keyPoint":"Applications are the main target and change too fast for manual testing. ML helps detect problems at that pace, alongside SAST, DAST, IAST and experts.","plain":["SAST is proofreading; DAST is a mystery shopper; IAST is a reporter inside the building.","Hundreds of microservices and daily releases leave no time for manual tests.","Business-logic flaws are hard for rule-based scanners.","ML helps mainly with detection, not fixing."],"check":{"q":"Which testing type watches the application from inside while it runs?","o":["IAST","SAST","DAST"],"a":0,"e":"It combines the strengths of static and dynamic testing.","retry":{"q":"In the mystery shopper picture, what can DAST NOT tell you?","o":["Where in the code the fault lies","What an attacker sees","Whether a page loads"],"a":0,"e":"It sees from outside only."}},"scenario":{"title":"Negative prices","setting":"A tester finds customers can buy items for a negative price, so the shop pays them. The scanner never flagged it.","steps":[{"prompt":"Why did the scanner miss it?","choices":[{"t":"It is a business-logic flaw, not a known pattern","s":2,"fb":"Right. Rules only find what they describe."},{"t":"Scanners are broken","s":0,"fb":"It works as designed."},{"t":"It is not a real flaw","s":0,"fb":"It certainly is."}]},{"prompt":"Which approach might catch such issues?","choices":[{"t":"Behavioural ML plus expert review of business rules","s":2,"fb":"Right. Learning normal plus human judgement."},{"t":"More of the same rules","s":0,"fb":"Rules do not know business intent."},{"t":"Nothing can","s":0,"fb":"Experts and behaviour models can."}]}]},"lab":{"type":"sort","title":"SAST, DAST or IAST?","prompt":"Match each description to its testing type.","buckets":["SAST","DAST","IAST"],"items":[{"t":"Reads source code without running it","b":0},{"t":"Tests the running app from outside","b":1},{"t":"Agent inside the running app follows data","b":2},{"t":"Can point to the exact faulty line","b":0},{"t":"Sees only what an attacker sees","b":1}],"explain":"Each type sees the application from a different angle."}},{"title":"Smarter dynamic testing with machine learning","minutes":3,"slides":[{"scene":{"type":"graph","title":"ML-enhanced DAST in six phases","nodes":[{"id":"ob","label":"Observe\nnormal use","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"tr","label":"Train a\nbaseline","p":[3.64,1.9,0],"c":"violet","shape":"ico","size":0.8,"ls":0.6},{"id":"gn","label":"Generate tests\n(reinforcement learning)","p":[3.64,-0.7,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"ts","label":"Test the\napplication","p":[0.0,-2.0,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"cl","label":"Classify findings,\nfilter false alarms","p":[-3.64,-0.7,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6},{"id":"fb","label":"Feed results\nback","p":[-3.64,1.9,0],"c":"slate","shape":"torus","size":0.8,"ls":0.6}],"links":[["ob","tr",2],["tr","gn",2],["gn","ts",2],["ts","cl",2],["cl","fb",2],["fb","ob",2]],"steps":["all",["ob"],["tr"],["gn"],["ts"],["cl"],["fb"]],"orbit":0.4},"say":["Traditional dynamic testing sends a fixed list of known test inputs. ML-enhanced testing learns first.","It observes normal use of the application.","It trains a baseline. An autoencoder learns to compress and rebuild normal requests; unusual ones are rebuilt badly, and that reconstruction error becomes an anomaly score.","Reinforcement learning chooses test inputs, rewarded for finding new behaviour and penalised for repeating itself or breaking things.","It tests the application.","Neural networks or an ensemble classify findings and filter false alarms.","Confirmed results retrain the models. Only test systems you own or have written permission to test, in an isolated environment."]}],"keyPoint":"ML-enhanced DAST learns normal behaviour, chooses smart tests, classifies findings and learns from confirmed results. Test only with permission, in isolation.","plain":["An autoencoder is like an artist who can only redraw familiar faces well.","Reconstruction error is how badly the copy matches.","Reinforcement learning is learning by trial and reward.","Testing without permission is unethical and often illegal."],"check":{"q":"What does a high autoencoder reconstruction error suggest?","o":["The input is unusual","The input is normal","The server is fast"],"a":0,"e":"It was trained only on normal traffic.","retry":{"q":"What should an RL tester be penalised for?","o":["Repeating itself or breaking the application","Finding new behaviour","Running tests"],"a":0,"e":"Rewards and penalties shape useful testing."}},"scenario":{"title":"The eager tester","setting":"A student wants to point an ML fuzzer at a popular shopping website to practise.","steps":[{"prompt":"Is that acceptable?","choices":[{"t":"No, only test systems you own or have written permission to test","s":2,"fb":"Right. Permission is essential."},{"t":"Yes, it is public","s":0,"fb":"Public does not mean permitted."},{"t":"Only at night","s":0,"fb":"Timing does not create permission."}]},{"prompt":"A finding is confirmed as a false positive. What should happen?","choices":[{"t":"Feed it back to retrain the classifier","s":2,"fb":"Right. The loop improves accuracy."},{"t":"Ignore it","s":0,"fb":"The lesson is lost."},{"t":"Delete the model","s":0,"fb":"Too drastic."}]}]},"lab":{"type":"order","title":"Order the phases","prompt":"Put the ML-enhanced DAST phases in order.","items":["Observe normal use","Train a baseline","Generate tests","Test the application","Classify findings","Feed results back"],"explain":"Each round makes the next round more accurate."}},{"title":"IAST and taint tracking","minutes":3,"slides":[{"scene":{"type":"graph","title":"Following untrusted data from source to sink","nodes":[{"id":"src","label":"Source: form\nfield (tainted)","p":[-5.2,0.0,-0.3],"c":"amber","shape":"slab","size":0.8,"ls":0.62},{"id":"fn","label":"Through functions\nand services","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"chk","label":"Validated or\nsanitised?","p":[0.0,0.0,-0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"snk","label":"Sink: database\nquery","p":[2.6,1.5,0.3],"c":"red","shape":"cyl","size":0.8,"ls":0.62},{"id":"al","label":"Alert or\nblock","p":[5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["src","fn",2],["fn","chk",2],["chk","snk",2],["snk","al",2]],"steps":["all",["src"],["fn"],["chk"],["snk"],["al"]]},"say":["Interactive testing, IAST, places a small monitoring agent inside the running application. This is called instrumentation, and it lets the agent see what an outside tester cannot.","Taint tracking treats any outside data, such as a form field, as tainted, meaning untrusted.","The agent follows it through functions and services.","If it is validated or sanitised, checked or cleaned, it becomes safe.","If tainted data reaches a sensitive operation, a sink such as a database query, without checks, that is a likely injection flaw.","IAST raises an alert or blocks the action. Real applications have huge numbers of paths, so graph neural networks, which learn from networks of connected things, help spot dangerous path patterns. Overhead should be low, though it depends on the application."]}],"keyPoint":"IAST follows untrusted data inside the running app. Tainted data reaching a sink unchecked signals injection, and graph neural networks help with complex paths.","plain":["Taint tracking is like dye in water: you can see where it flows.","A sink is any sensitive operation such as a database query.","An agent that sees everything raises privacy questions.","Graph neural networks learn from connected points and lines."],"check":{"q":"What does IAST flag?","o":["Tainted data reaching a sink without checks","Every database query","Slow pages"],"a":0,"e":"Unchecked flow from source to sink.","retry":{"q":"In the dye picture, what does the dye show?","o":["Where untrusted data flows","The server's colour","Who wrote the code"],"a":0,"e":"Taint tracking follows untrusted input."}},"scenario":{"title":"The search box","setting":"IAST shows text from a search box flowing straight into a database query with no checks.","steps":[{"prompt":"What is the likely vulnerability?","choices":[{"t":"SQL injection","s":2,"fb":"Right. Tainted data reached a sink."},{"t":"Denial of service","s":0,"fb":"Nothing is overloaded."},{"t":"None","s":0,"fb":"Unchecked input at a sink is dangerous."}]},{"prompt":"What fix closes it?","choices":[{"t":"Validate input and use a parameterised query","s":2,"fb":"Right. Clean the data and separate it from commands."},{"t":"Hide the search box","s":1,"fb":"Removes the feature, not the pattern."},{"t":"Add more logging only","s":0,"fb":"Logging does not stop injection."}]}]},"lab":{"type":"order","title":"Trace the taint","prompt":"Put the taint tracking steps in order.","items":["Data enters from a source","It flows through functions","It is checked or not","It reaches a sink","IAST alerts or blocks"],"explain":"Unchecked data at a sink is the warning sign."}},{"title":"API security in the AI era","minutes":3,"slides":[{"scene":{"type":"graph","title":"ML techniques for API security tasks","nodes":[{"id":"di","label":"Discovery:\nclustering finds\nshadow APIs","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"au","label":"Authentication:\nbehavioural modelling","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"az","label":"Authorisation:\ngraph models (BOLA)","p":[0.0,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"an","label":"Anomalies:\nIsolation Forest,\nautoencoders","p":[2.6,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"pii","label":"Data leaks:\nNLP finds personal\ndata in responses","p":[5.2,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["di"],["au"],["az"],["an"],["pii"]]},"say":["An API, application programming interface, is how programs talk to each other, like a phone app fetching your bank balance. APIs have no screens, use machine keys and tokens, and change often, leaving forgotten 'shadow' or 'zombie' APIs running.","Discovery: clustering groups similar traffic into a catalogue of every endpoint in use, including shadow APIs.","Authentication: behavioural models learn how each client normally signs in, so credential stuffing, trying stolen passwords at scale, stands out.","Authorisation: the top OWASP API risk is BOLA, broken object level authorisation, where changing an ID from account 1001 to 1002 shows someone else's data. Graph models learn who normally accesses which objects.","Anomalies: Isolation Forest and autoencoders flag unusual traffic.","Data leaks: language processing spots card numbers or addresses in responses that should not be there."]}],"keyPoint":"APIs are a prime target. Discovery comes first; then behavioural authentication, graph-based authorisation, anomaly detection and leak detection.","plain":["BOLA is changing an ID to see someone else's data.","Shadow APIs are endpoints nobody remembers are running.","You cannot protect what you do not know exists.","Apply data minimisation to API monitoring too."],"check":{"q":"What is BOLA?","o":["Seeing another user's data by changing an ID in a request","A type of encryption","A slow API"],"a":0,"e":"It ranks first in the OWASP API Security Top 10.","retry":{"q":"Which capability should come first for a new online shop?","o":["Discovery of all endpoints","Advanced graph models","Nothing"],"a":0,"e":"Everything else depends on knowing your endpoints."}},"scenario":{"title":"Account 1002","setting":"A customer notices that changing the number in the app's request URL shows another customer's orders.","steps":[{"prompt":"What vulnerability is this?","choices":[{"t":"Broken object level authorisation","s":2,"fb":"Right. BOLA."},{"t":"Credential stuffing","s":0,"fb":"No passwords were guessed."},{"t":"Phishing","s":0,"fb":"No trickery by email."}]},{"prompt":"Why do traditional scanners struggle to spot it?","choices":[{"t":"The request looks normal; only context reveals the problem","s":2,"fb":"Right. Behavioural models learn that context."},{"t":"Scanners cannot read numbers","s":0,"fb":"They can."},{"t":"It is not a real flaw","s":0,"fb":"It is a serious one."}]}]},"lab":{"type":"sort","title":"Match the technique","prompt":"Which ML technique fits each API task?","buckets":["Clustering","Behavioural modelling","Graph model","Isolation Forest","NLP"],"items":[{"t":"Build a catalogue of every endpoint","b":0},{"t":"Spot credential stuffing at login","b":1},{"t":"Learn who normally accesses which records","b":2},{"t":"Flag unusual request patterns","b":3},{"t":"Find card numbers leaking in responses","b":4}],"explain":"Match the technique to the task."}},{"title":"Anomaly detection for APIs","minutes":3,"slides":[{"scene":{"type":"graph","title":"From raw traffic to a security action","nodes":[{"id":"tr","label":"Raw API\ntraffic","p":[-5.2,0.0,-0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"fe","label":"Features: statistical,\ncontextual, sequential,\nsemantic","p":[-3.12,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"un","label":"Unsupervised models:\nunknown threats","p":[-1.04,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"su","label":"Supervised models:\nknown attack types","p":[1.04,1.5,0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"en","label":"Ensemble\nfusion","p":[3.12,0.0,-0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"dc","label":"Decide by score,\nconfidence, context","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["tr","fe",2],["fe","un",2],["un","su",2],["su","en",2],["en","dc",2]],"steps":["all",["tr"],["fe"],["un"],["su"],["en"],["dc"]]},"say":["Turning raw logs into an action follows a pipeline, and feature engineering often matters more than the choice of algorithm.","Raw traffic arrives.","It becomes features: statistical, such as requests per minute; contextual, such as user role and location; sequential, such as a login followed by a bulk download; and semantic, such as database commands typed into a search box.","Unsupervised models, such as Isolation Forest, learn normal and flag what does not fit, catching new attacks. Isolation Forest separates unusual points in only a few random splits.","Supervised models learn from labelled examples, so they can say 'this looks like credential stuffing'.","An ensemble combines their scores.","The decision weighs score, confidence and how critical the endpoint is, from logging to blocking, and outcomes are fed back. Because attacks are rare, use precision and recall, not accuracy."]}],"keyPoint":"Engineer good features, combine unsupervised and supervised models, and decide by score, confidence and context. Measure with precision, recall and F1.","plain":["A feature is one measurable input to a model.","Unsupervised catches the unknown; supervised names the known.","Block automatically only when confident and a wrong block is cheap.","Accuracy misleads when attacks are rare."],"check":{"q":"Why is accuracy misleading for API attack detection?","o":["Attacks are rare, so 'always normal' looks accurate","Accuracy is hard to compute","It is illegal"],"a":0,"e":"Use precision, recall and F1.","retry":{"q":"A login followed immediately by a bulk download is which feature type?","o":["Sequential","Statistical","Semantic"],"a":0,"e":"It captures order and timing."}},"scenario":{"title":"The marketing campaign","setting":"A marketing campaign triples traffic to the shop's API, and the detector floods analysts with alerts.","steps":[{"prompt":"What would reduce false alarms?","choices":[{"t":"Use context features and let the baseline adapt to legitimate changes","s":2,"fb":"Right. Context distinguishes campaigns from attacks."},{"t":"Turn off detection during campaigns","s":0,"fb":"Attackers love that window."},{"t":"Block all new users","s":0,"fb":"That blocks real customers."}]},{"prompt":"How would you catch 'low and slow' attacks under thresholds?","choices":[{"t":"Sequential features over longer time windows","s":2,"fb":"Right. Patterns emerge over time."},{"t":"Raise all thresholds","s":0,"fb":"That misses more."},{"t":"Ignore small activity","s":0,"fb":"That is exactly what they exploit."}]}]},"lab":{"type":"sort","title":"Feature type","prompt":"Classify each feature for a login API.","buckets":["Statistical","Contextual","Sequential","Semantic"],"items":[{"t":"Failed logins per minute","b":0},{"t":"User's usual country","b":1},{"t":"Password reset followed by email change","b":2},{"t":"SQL keywords in the username field","b":3},{"t":"Error rate per hour","b":0}],"explain":"Good features describe behaviour from several angles."}},{"title":"Container security and the supply chain","minutes":3,"slides":[{"scene":{"type":"graph","title":"ML across the container lifecycle","nodes":[{"id":"bd","label":"Build: scan images,\nrank real risk","p":[0.0,3.2,0],"c":"cyan","shape":"box","size":0.8,"ls":0.6},{"id":"dp","label":"Deploy: learned\npolicies, admission control","p":[4.2,0.6,0],"c":"violet","shape":"shield","size":0.8,"ls":0.6},{"id":"rn","label":"Run: watch system\ncalls and network","p":[0.0,-2.0,0],"c":"amber","shape":"ico","size":0.8,"ls":0.6},{"id":"rs","label":"Respond: isolate or\nstop, then alert","p":[-4.2,0.6,0],"c":"red","shape":"sphere","size":0.8,"ls":0.6}],"links":[["bd","dp",2],["dp","rn",2],["rn","rs",2],["rs","bd",2]],"steps":["all",["bd"],["dp"],["rn"],["rs"],"all"],"orbit":0.4},"say":["A container packages an application with everything it needs, so it runs the same everywhere. Organisations may run thousands, many living only minutes, and they are usually replaced rather than patched.","At build, images are scanned for known flaws, ranked by real risk, and risky settings such as running as the all-powerful root user are flagged.","At deploy, ML learns which system calls, connections and files each container type normally uses and writes an allow-list policy. Admission control, a gatekeeper, refuses to start containers that break the rules.","At run time, it watches system calls, requests a program makes to the operating system, and network activity for departures from normal.","When something goes wrong, it isolates or stops the container automatically and alerts the team.","For the supply chain, keep a software bill of materials listing every component, and rank vulnerable components by whether the code is reachable and whether the service faces the internet."]}],"keyPoint":"Secure containers at build, deploy, run and respond, with learned per-type policies. Rank supply chain risk by reachability and exposure.","plain":["Immutable containers are replaced, not patched.","A system call is a program asking the operating system for something.","Policies are set per container type, which suits short-lived containers.","An SBOM is the ingredients list."],"check":{"q":"Why do learned policies suit short-lived containers?","o":["They are set per container type, not per instance","Containers never change","They are free"],"a":0,"e":"A new instance inherits its type's policy.","retry":{"q":"What does admission control do?","o":["Refuses to start containers that break the rules","Speeds up containers","Deletes logs"],"a":0,"e":"It is the gatekeeper at deployment."}},"scenario":{"title":"The surprise shell","setting":"A web container that never runs a command shell suddenly starts one and connects to an unknown address.","steps":[{"prompt":"What should happen?","choices":[{"t":"Isolate the container automatically and alert the team","s":2,"fb":"Right. A departure from its learned baseline."},{"t":"Ignore it","s":0,"fb":"This looks like compromise."},{"t":"Restart all servers","s":1,"fb":"Disruptive; isolate the one container."}]},{"prompt":"Which supply chain finding matters most?","choices":[{"t":"A reachable vulnerable library in an internet-facing service","s":2,"fb":"Right. Reachability and exposure raise risk."},{"t":"An unused library in an internal tool","s":1,"fb":"Lower risk."},{"t":"A spelling error in documentation","s":0,"fb":"Not a security risk."}]}]},"lab":{"type":"order","title":"Follow the lifecycle","prompt":"Put the container security stages in order.","items":["Build: scan and rank","Deploy: learned policy and admission control","Run: monitor behaviour","Respond: isolate and alert"],"explain":"Each stage catches different problems."}},{"title":"Microservices and the service mesh","minutes":3,"slides":[{"scene":{"type":"graph","title":"A sidecar beside every service","nodes":[{"id":"s1","label":"Orders\nservice","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"sphere","size":0.8,"ls":0.62},{"id":"s2","label":"Payments\nservice","p":[-2.6,1.5,0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"s3","label":"Accounts\nservice","p":[0.0,0.0,-0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62},{"id":"s4","label":"Search\nservice","p":[2.6,1.5,0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"x","label":"Unexpected new\nconnection","p":[5.2,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[["s1","s2",2],["s1","s3",1],["s4","s1",1],["s4","s2",3,"red"]],"steps":["all",["s1"],["s2"],["s3"],["s4"],["x"]]},"say":["In a microservices application, many small services call each other constantly. A service mesh puts a sidecar proxy, a small helper, beside each service, so all traffic passes through them and can be encrypted, controlled and recorded. Istio, Linkerd and Consul are examples.","ML learns the normal map: orders talks to payments…","…and accounts…","…search talks to orders…","…and so on, turning the normal map into an allow-list.","A brand-new connection, like search suddenly talking to payments, is flagged. That may be lateral movement, an attacker hopping from one compromised service to others. Context-aware access control also considers identity, time and request history."]}],"keyPoint":"A service mesh gives one place to see and control service traffic. ML learns the normal communication graph and flags new or unusual connections that may signal lateral movement.","plain":["Like a social network: someone who never talks to finance suddenly messages them hundreds of times.","A sidecar proxy handles each service's traffic.","Lateral movement is an attacker hopping between services.","New edges in the graph deserve a look."],"check":{"q":"What is lateral movement?","o":["An attacker hopping from one compromised service to others","Moving servers between racks","Sideways scrolling"],"a":0,"e":"New unexpected paths are a strong sign.","retry":{"q":"In the social network picture, what is suspicious?","o":["Someone suddenly messaging a group they never contact","Regular chats between colleagues","A quiet day"],"a":0,"e":"New edges break the learned pattern."}},"scenario":{"title":"The new path","setting":"The mesh detects the search service calling the payments service for the first time ever.","steps":[{"prompt":"What should happen first?","choices":[{"t":"Block or hold the call and alert the team to investigate","s":2,"fb":"Right. Unexpected paths may be lateral movement."},{"t":"Allow it permanently","s":0,"fb":"It may be an attack."},{"t":"Delete the search service","s":0,"fb":"Too drastic."}]},{"prompt":"Does a service mesh increase or decrease the attack surface?","choices":[{"t":"Both: more components, but central control and visibility","s":2,"fb":"Right. Weigh both sides."},{"t":"It removes all risk","s":0,"fb":"Nothing does."},{"t":"It only adds risk","s":0,"fb":"It also adds strong controls."}]}]},"lab":{"type":"sort","title":"Which anomaly type?","prompt":"Classify each service mesh anomaly.","buckets":["Structural (new edge)","Feature-based (traffic spike)","Temporal (pattern change)"],"items":[{"t":"A service calls another for the first time","b":0},{"t":"Calls between two services jump tenfold","b":1},{"t":"A batch job starts running at 3 am instead of midnight","b":2},{"t":"A brand-new outbound connection","b":0}],"explain":"Different anomalies need different detectors."}},{"title":"A roadmap and honest limits","minutes":3,"slides":[{"scene":{"type":"graph","title":"Adopt in phases","nodes":[{"id":"p1","label":"Months 1–3:\ndata foundation,\nquick wins","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"p2","label":"Months 4–9:\ncore capabilities,\nSIEM integration","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"p3","label":"Months 10–15:\nIAST, mesh, supply\nchain, governance","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"p4","label":"Month 16 onwards:\noptimise, explain,\nreview return","p":[5.2,1.5,0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[["p1","p2",2],["p2","p3",2],["p3","p4",2]],"steps":["all",["p1"],["p2"],["p3"],["p4"]]},"say":["No organisation should try to do everything at once. Assess current tools, data and skills; build the data foundation; start with quick wins; train teams; pilot on one application; then learn and scale.","Months one to three: logging and data infrastructure, plus quick wins in vulnerability ranking and API anomaly detection.","Months four to nine: behavioural monitoring, an API security suite, container security and integration with the SIEM, where alerts are collected.","Months ten to fifteen: IAST, service mesh security, supply chain analysis and model governance.","From month sixteen: ensembles, explainable AI and reviewing the return. Be honest about limits: models can be attacked, probed or poisoned; black-box decisions are hard to explain to blocked customers; monitoring processes personal data; integration is hard; and skills are scarce."]}],"keyPoint":"Phase adoption from data foundations to advanced integration, with feedback loops and model governance. Be honest about adversarial, explainability, privacy, integration, cost and skills limits.","plain":["Pilot on one application before the whole estate.","Feed ML alerts into the SIEM, not another separate console.","Model governance covers approval, monitoring, retraining and retirement.","Smaller organisations can use managed services and pre-trained models."],"check":{"q":"Why pilot on one application first?","o":["To learn and fix problems before scaling","It is required by law","Pilots are free"],"a":0,"e":"Learn small, then scale.","retry":{"q":"Where should ML alerts go?","o":["Into the existing SIEM","A new separate console","Nowhere"],"a":0,"e":"Avoid yet another console."}},"scenario":{"title":"The small firm","setting":"A 50-person firm with little data wants ML application security.","steps":[{"prompt":"How can it still benefit?","choices":[{"t":"Managed services, pre-trained models and one quick win","s":2,"fb":"Right. Start small and borrow capability."},{"t":"Build everything in-house immediately","s":0,"fb":"Too costly for its size."},{"t":"It cannot benefit","s":0,"fb":"There are good options."}]},{"prompt":"How would you show return on investment?","choices":[{"t":"Track flaws caught earlier, time to fix and incidents avoided","s":2,"fb":"Right. Measurable outcomes."},{"t":"Count dashboards","s":0,"fb":"Not an outcome."},{"t":"Assume it works","s":0,"fb":"Measure it."}]}]},"lab":{"type":"order","title":"Order the roadmap","prompt":"Put the adoption phases in order.","items":["Data foundation and quick wins","Core capabilities and SIEM integration","IAST, mesh and supply chain","Optimise and review the return"],"explain":"Each phase builds on the data and trust of the one before."}}],"test":[{"q":"SAST is like…","o":["Proofreading code","A mystery shopper","A fire drill"],"a":0,"e":"","lesson":0},{"q":"IAST works by…","o":["An agent inside the running application","Reading printouts","Phoning users"],"a":0,"e":"","lesson":0},{"q":"An autoencoder flags inputs with…","o":["High reconstruction error","Low price","Short names"],"a":0,"e":"","lesson":1},{"q":"ML-enhanced DAST should run…","o":["Only with permission, in isolation","On any public site","Without logs"],"a":0,"e":"","lesson":1},{"q":"In taint tracking, a sink is…","o":["A sensitive operation such as a database query","A kitchen fitting","A firewall"],"a":0,"e":"","lesson":2},{"q":"Graph neural networks help IAST by…","o":["Learning dangerous patterns across many data paths","Drawing charts","Encrypting data"],"a":0,"e":"","lesson":2},{"q":"Shadow APIs are…","o":["Forgotten endpoints still running","Encrypted APIs","APIs at night"],"a":0,"e":"","lesson":3},{"q":"The top OWASP API risk is…","o":["BOLA","Slow responses","Large images"],"a":0,"e":"","lesson":3},{"q":"Isolation Forest flags points that…","o":["Are separated in few random splits","Are most common","Are encrypted"],"a":0,"e":"","lesson":4},{"q":"Supervised models can…","o":["Name known attack types","Only find unknowns","Never be wrong"],"a":0,"e":"","lesson":4},{"q":"Containers are usually…","o":["Replaced rather than patched","Patched in place forever","Never updated"],"a":0,"e":"","lesson":5},{"q":"Admission control…","o":["Refuses to start rule-breaking containers","Speeds up builds","Writes code"],"a":0,"e":"","lesson":5},{"q":"A sidecar proxy…","o":["Handles a service's network traffic in a mesh","Is a motorbike part","Stores passwords"],"a":0,"e":"","lesson":6},{"q":"A new unexpected connection between services may indicate…","o":["Lateral movement","Faster performance","A backup"],"a":0,"e":"","lesson":6},{"q":"ML alerts should feed into…","o":["The SIEM","A new separate console","Email only"],"a":0,"e":"","lesson":7},{"q":"Which is an honest limit of ML security?","o":["Models can be attacked or poisoned","ML never errs","ML needs no data"],"a":0,"e":"","lesson":7}]};
