/* Chapter 12: Data Protection and Privacy in AI Systems (Guide to AI for Cybersecurity) */
const CH = {"id":"ch12","num":"12","title":"Data Protection and Privacy in AI Systems","summary":"How AI security tools can protect personal data: the GDPR principles, legal bases and legitimate interests, data minimisation, differential privacy, federated learning, homomorphic encryption, governance, cross-border transfers, privacy by design and DPIAs.","outcomes":["Apply the seven GDPR principles to AI security data","Choose a legal basis and carry out a legitimate interests assessment","Minimise data with feature selection, aggregation, pseudonymisation and retention","Explain differential privacy and the epsilon trade-off","Compare federated learning and homomorphic encryption","Design governance, transfers and DPIAs for an AI security system"],"starter":[{"q":"Does GDPR apply to security logs that contain IP addresses?","o":["No","Yes, IP addresses can be personal data"],"a":1,"e":"Personal data includes identifiers such as IP addresses."},{"q":"Is consent usually the best legal basis for monitoring staff?","o":["Yes","No, staff cannot freely refuse their employer"],"a":1,"e":"Legitimate interests is usually more suitable."},{"q":"Can organisations train a shared model without pooling raw data?","o":["No","Yes, with federated learning"],"a":1,"e":"Lesson 5 explains how."}],"lessons":[{"title":"AI security runs on personal data","minutes":3,"slides":[{"scene":{"type":"graph","title":"The seven GDPR principles (Article 5)","nodes":[{"id":"lf","label":"Lawful, fair,\ntransparent","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"pl","label":"Purpose\nlimitation","p":[3.28,2.22,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"dm","label":"Data\nminimisation","p":[4.09,0.02,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"ac","label":"Accuracy","p":[1.82,-1.75,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"sl","label":"Storage\nlimitation","p":[-1.82,-1.75,0],"c":"slate","shape":"sphere","size":0.8,"ls":0.6},{"id":"ic","label":"Integrity and\nconfidentiality","p":[-4.09,0.02,0],"c":"red","shape":"shield","size":0.8,"ls":0.6},{"id":"acc","label":"Accountability","p":[-3.28,2.22,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6}],"links":[],"steps":["all",["lf"],["pl"],["dm"],["ac"],["sl"],["ic"],["acc"]],"orbit":0.4},"say":["Welcome to Chapter 12, Data Protection and Privacy in AI Systems, and I'm Sam, your tutor. Almost every AI security tool processes personal data: login logs, network activity, email metadata, behaviour patterns, even biometrics. Personal data is any information about an identifiable person, including IP addresses and device IDs.","Lawfulness, fairness and transparency: have a legal basis and be open about it.","Purpose limitation: data collected for security should not quietly be reused for performance reviews.","Data minimisation: collect only what you need.","Accuracy: if an AI wrongly flags someone, correct the record.","Storage limitation: set retention periods instead of keeping logs forever.","Integrity and confidentiality: protect the data, because security logs are themselves an attractive target.","Accountability: be able to prove compliance, so write decisions down. In the UK, the same principles apply under UK GDPR and the Data Protection Act 2018."]}],"keyPoint":"AI security tools process personal data, so the seven Article 5 principles apply. Each becomes a design rule.","plain":["Email metadata, who emails whom and when, is personal data.","Biometric data used to identify people needs extra protection.","Article 5 is the principles; Article 6 is the legal bases.","Security logs need protecting too."],"check":{"q":"Which principle stops security data being reused for performance reviews?","o":["Purpose limitation","Accuracy","Storage limitation"],"a":0,"e":"Data collected for one purpose should not quietly be used for another.","retry":{"q":"Is an IP address personal data?","o":["Yes, it can identify a person","No, never","Only in the US"],"a":0,"e":"It relates to an identifiable person."}},"scenario":{"title":"The forever logs","setting":"Your security team keeps every login log forever 'in case it helps one day'.","steps":[{"prompt":"Which principle does this break?","choices":[{"t":"Storage limitation","s":2,"fb":"Right. Set retention periods."},{"t":"Accuracy","s":0,"fb":"The logs may be accurate."},{"t":"None","s":0,"fb":"Keeping data forever breaks a principle."}]},{"prompt":"What should you introduce?","choices":[{"t":"A justified retention schedule, then deletion","s":2,"fb":"Right. Keep detail only as long as useful."},{"t":"Keep them but encrypt","s":1,"fb":"Helps, but does not fix over-retention."},{"t":"Delete everything today","s":0,"fb":"You still need recent logs."}]}]},"lab":{"type":"sort","title":"Name the principle","prompt":"Match each practice to the GDPR principle it serves.","buckets":["Purpose limitation","Data minimisation","Accuracy","Storage limitation","Integrity and confidentiality","Accountability"],"items":[{"t":"Not using security logs for appraisals","b":0},{"t":"Collecting country rather than exact location","b":1},{"t":"Correcting a wrongly flagged staff record","b":2},{"t":"Deleting full logs after a set period","b":3},{"t":"Encrypting the log database","b":4},{"t":"Writing down the legitimate interests assessment","b":5}],"explain":"Every principle becomes a concrete design choice."}},{"title":"Choosing a legal basis","minutes":3,"slides":[{"scene":{"type":"graph","title":"The legitimate interests assessment","nodes":[{"id":"pu","label":"Purpose test:\ngenuine, specific interest","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ne","label":"Necessity test:\nis this data needed?","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ba","label":"Balancing test:\npeople's rights and\nexpectations","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"sg","label":"Safeguards and\na written record","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["pu","ne",2],["ne","ba",2],["ba","sg",2]],"steps":["all",["pu"],["ne"],["ba"],["sg"]]},"say":["Every use of personal data needs at least one legal basis under Article 6. For security monitoring, it is usually legitimate interests, backed by a written assessment. Consent rarely works at work: employees cannot freely say no to their employer, and if they withdrew consent, monitoring would have to stop.","The purpose test: a genuine, specific interest. 'Security' is too vague; 'detecting stolen staff accounts within an hour' is specific.","The necessity test: is this data really needed, or would something less intrusive work?","The balancing test: do people's rights and reasonable expectations outweigh the interest? A chilling effect, people avoiding legitimate activity because they feel watched, weighs against intrusive monitoring.","Then add safeguards, such as pseudonymisation and human review of any alert before action, and write it all down. If the balance tips against you, reduce the data or add safeguards until it does not."]}],"keyPoint":"Security monitoring usually rests on legitimate interests, tested by purpose, necessity and balance, then safeguarded and documented. Consent is rarely suitable at work.","plain":["Consent must be free, specific, informed and easy to withdraw.","A chilling effect is people self-censoring because they feel watched.","Pseudonymisation hides who is who until there is real reason.","'Legal obligation' covers only what a specific law requires."],"check":{"q":"Why is consent usually a weak basis for monitoring staff?","o":["Staff cannot freely refuse their employer, and can withdraw consent","Consent is illegal","It takes too long to print"],"a":0,"e":"Power imbalance undermines free consent.","retry":{"q":"Which LIA test asks whether a less intrusive option would work?","o":["Necessity","Purpose","Balancing"],"a":0,"e":"Necessity asks if the data is really needed."}},"scenario":{"title":"Subject lines","setting":"A phishing detection tool wants to read the subject line of every staff email.","steps":[{"prompt":"What does the necessity test ask?","choices":[{"t":"Could you detect phishing with less intrusive data, such as sender and link reputation?","s":2,"fb":"Right. Choose the least intrusive option that works."},{"t":"Whether subject lines are interesting","s":0,"fb":"Interest is not necessity."},{"t":"Nothing, security always wins","s":0,"fb":"The balance must be weighed."}]},{"prompt":"Who should sign off the LIA?","choices":[{"t":"An accountable role such as the DPO with security and HR input","s":2,"fb":"Right. Accountable and informed."},{"t":"The vendor","s":0,"fb":"The organisation is accountable."},{"t":"Any analyst","s":0,"fb":"Sign-off needs authority."}]}]},"lab":{"type":"order","title":"Run the LIA","prompt":"Put the legitimate interests assessment steps in order.","items":["Purpose test","Necessity test","Balancing test","Add safeguards and record it"],"explain":"Write it down: accountability means you can prove the reasoning."}},{"title":"Data minimisation in practice","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four ways to collect less","nodes":[{"id":"fs","label":"Feature\nselection","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ag","label":"Abstraction and\naggregation","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ps","label":"Pseudonymisation","p":[1.73,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"gr","label":"Graduated\nretention","p":[5.2,1.5,0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[],"steps":["all",["fs"],["ag"],["ps"],["gr"]]},"say":["The key question is: can you reach the security goal with less data? Usually yes, at little cost to detection.","Feature selection: a feature is one input a model uses. Measure which ones actually improve detection, and drop the rest before they are stored.","Abstraction and aggregation: store 'ten failed logins this hour' instead of every attempt with exact location, or country instead of precise location.","Pseudonymisation: replace identities with consistent codes, re-identifying only when an incident justifies it. It is still personal data, because the key can link it back.","Graduated retention: keep full detail briefly, then summarise, then delete on a set schedule. Less data means less to protect, less to leak and less to justify."]}],"keyPoint":"Select only useful features, store summaries, pseudonymise identities and retain detail only briefly. Less data, less risk.","plain":["Truly anonymous data is much harder to achieve than most people think.","Pseudonymised data still counts as personal data.","Justify retention periods by investigative need and legal duty.","Minimisation is good engineering as well as good law."],"check":{"q":"Is pseudonymised data still personal data under GDPR?","o":["Yes, it can be linked back with the key","No, never","Only on weekends"],"a":0,"e":"Only truly anonymous data falls outside GDPR.","retry":{"q":"Storing 'ten failed logins this hour' instead of every attempt is…","o":["Aggregation","Encryption","Deletion"],"a":0,"e":"Summaries keep the signal with less detail."}},"scenario":{"title":"The login dataset","setting":"Your login detection model uses 40 fields, including home address and date of birth.","steps":[{"prompt":"Which fields would you drop first?","choices":[{"t":"Those that do not improve detection, such as home address and date of birth","s":2,"fb":"Right. Feature selection."},{"t":"Login time","s":0,"fb":"Often genuinely useful."},{"t":"None","s":0,"fb":"Minimisation demands less."}]},{"prompt":"When should an analyst re-identify a pseudonymised user?","choices":[{"t":"Only when an incident justifies it, with approval and a record","s":2,"fb":"Right. Controlled re-identification."},{"t":"Whenever curious","s":0,"fb":"That defeats the safeguard."},{"t":"Never","s":1,"fb":"Sometimes investigation needs it."}]}]},"lab":{"type":"sort","title":"Which technique?","prompt":"Match each action to its minimisation technique.","buckets":["Feature selection","Abstraction and aggregation","Pseudonymisation","Graduated retention"],"items":[{"t":"Dropping a field that adds no detection value","b":0},{"t":"Storing city instead of GPS coordinates","b":1},{"t":"Replacing usernames with codes","b":2},{"t":"Summarising logs after 30 days, deleting after a year","b":3}],"explain":"Each technique cuts risk with little loss of security value."}},{"title":"Differential privacy","minutes":3,"slides":[{"scene":{"type":"graph","title":"A formal privacy promise","nodes":[{"id":"d1","label":"Database\nwith you","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"d2","label":"Database\nwithout you","p":[-2.6,1.5,0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62},{"id":"ns","label":"Add calibrated noise:\nscale = sensitivity ÷ ε","p":[0.0,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"out","label":"Answers look\nalmost the same","p":[2.6,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"bud","label":"Every query spends\nprivacy budget","p":[5.2,0.0,-0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["d1","ns",1],["d2","ns",1],["ns","out",2],["out","bud",1]],"steps":["all",["d1"],["d2"],["ns"],["out"],["bud"]]},"say":["Differential privacy promises that adding or removing any one person barely changes the chance of any output.","Imagine two databases, one with you in it…","…and one without.","Random noise is added to each answer. Its size is the sensitivity, the most one person could change the answer, divided by epsilon. For a count, sensitivity is one.","If the published answers look almost the same either way, nobody can tell whether you were in the data.","Epsilon is the privacy dial: smaller means more noise and stronger privacy; larger means better accuracy. Every query spends privacy budget, because averaging many noisy answers would remove the noise. The chapter's indicative ranges: epsilon 0.1 may cost 15 to 25 per cent accuracy, 1.0 about 5 to 10, and 3.0 about 2 to 5. DP-SGD trains models so they cannot memorise and leak individual records."]}],"keyPoint":"Differential privacy adds calibrated noise so no individual can be detected. Epsilon trades privacy against accuracy, and a privacy budget limits how many answers you release.","plain":["Like a crowd photo slightly blurred so nobody can be picked out, but the crowd's size is still clear.","Laplace noise is usually small and occasionally larger.","Tidying a noisy answer, such as rounding, does not weaken the guarantee.","There is no universally right epsilon."],"check":{"q":"What does a smaller epsilon give?","o":["More noise and stronger privacy","Less noise","No change"],"a":0,"e":"Smaller epsilon, stronger privacy, lower accuracy.","retry":{"q":"Why is a privacy budget needed?","o":["Averaging many noisy answers would remove the noise","Noise costs money","Regulators like budgets"],"a":0,"e":"Each query spends some privacy."}},"scenario":{"title":"The shared threat feed","setting":"Ten organisations want to share statistics about attacks on their staff without exposing individuals.","steps":[{"prompt":"Which technique fits?","choices":[{"t":"Differential privacy on the published statistics","s":2,"fb":"Right. DP suits sharing results."},{"t":"Share raw logs","s":0,"fb":"That exposes individuals."},{"t":"Share nothing","s":1,"fb":"Safe but loses the benefit."}]},{"prompt":"Who should choose epsilon?","choices":[{"t":"Security, privacy and data owners together, weighing missed detections against privacy loss","s":2,"fb":"Right. It is a joint judgement."},{"t":"The intern","s":0,"fb":"It needs accountable owners."},{"t":"Always pick the largest","s":0,"fb":"That weakens privacy."}]}]},"lab":{"type":"sort","title":"Privacy or accuracy?","prompt":"For each setting, which does it favour?","buckets":["Stronger privacy","Better accuracy"],"items":[{"t":"Epsilon of 0.1","b":0},{"t":"Epsilon of 3.0","b":1},{"t":"Adding more noise","b":0},{"t":"A larger privacy budget per query","b":1}],"explain":"Every DP design is a deliberate trade-off."}},{"title":"Federated learning and homomorphic encryption","minutes":4,"slides":[{"scene":{"type":"graph","title":"Federated learning: move the training, not the data","nodes":[{"id":"sh","label":"Share a\nstarting model","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"lt","label":"Each site\ntrains locally","p":[3.99,1.4,0],"c":"violet","shape":"cyl","size":0.8,"ls":0.6},{"id":"up","label":"Send only model\nupdates","p":[2.47,-1.51,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"fa","label":"Combine with\nFederated Averaging","p":[-2.47,-1.51,0],"c":"green","shape":"ico","size":0.8,"ls":0.6},{"id":"rp","label":"Repeat","p":[-3.99,1.4,0],"c":"slate","shape":"torus","size":0.8,"ls":0.6}],"links":[["sh","lt",2],["lt","up",2],["up","fa",2],["fa","rp",2],["rp","sh",2]],"steps":["all",["sh"],["lt"],["up"],["fa"],["rp"],"all"],"orbit":0.4},"say":["Imagine five banks that each see different fraud but cannot share customer data. Federated learning lets them build one model together.","A coordinating server shares a starting model.","Each bank trains it on its own data, which never leaves.","Only the model changes, called updates, are sent back.","The server combines them using Federated Averaging, or FedAvg.","And the cycle repeats.","Updates can still leak information, so add secure aggregation, where the server sees only the combined total, and differential privacy noise. Challenges include very different data at each site, slow participants and communication cost."]},{"scene":{"type":"graph","title":"Homomorphic encryption: compute on locked data","nodes":[{"id":"ph","label":"Partial (Paillier):\naddition only, ~100× slower","p":[-5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"sw","label":"Somewhat (BGV levelled):\nlimited depth, ~1,000×","p":[0.0,1.5,0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"fh","label":"Fully (CKKS, BFV):\nany computation, ~10,000×+","p":[5.2,0.0,-0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62}],"links":[["ph","sw",2],["sw","fh",2]],"steps":["all",["ph"],["sw"],["fh"]]},"say":["Homomorphic encryption lets a computer work on data while it stays encrypted, like a locked box with built-in gloves: you can work on the contents without opening it.","Partially homomorphic schemes, such as Paillier, support only addition, at around a hundred times slower.","Somewhat homomorphic schemes allow limited computation, around a thousand times slower.","Fully homomorphic schemes, such as CKKS and BFV with a refresh step called bootstrapping, allow any computation, ten thousand times slower or more. Figures are indicative. Choose differential privacy to publish results, federated learning when data cannot move, and homomorphic encryption when an untrusted party must compute, and combine them for defence in depth."]}],"keyPoint":"Federated learning keeps data where it is; homomorphic encryption keeps it locked during computation. Each has costs, so choose by need and combine for depth.","plain":["Secure aggregation means the server sees only the total.","Homomorphic encryption is a locked box with gloves.","Ordinary AES encryption is not homomorphic.","No technique is free: accuracy, complexity or speed."],"check":{"q":"In federated learning, what leaves each site?","o":["Only model updates","All raw data","Nothing at all"],"a":0,"e":"Raw data stays put; updates travel.","retry":{"q":"What is homomorphic encryption's main drawback?","o":["It is much slower","It is insecure","It cannot add numbers"],"a":0,"e":"Fully homomorphic schemes can be 10,000 times slower or more."}},"scenario":{"title":"The councils' phishing model","setting":"Several councils want a shared phishing model but cannot pool staff emails.","steps":[{"prompt":"Which combination would you choose?","choices":[{"t":"Federated learning with secure aggregation and differential privacy","s":2,"fb":"Right. Defence in depth."},{"t":"Email everything to one council","s":0,"fb":"That pools sensitive data."},{"t":"Homomorphic encryption alone","s":1,"fb":"Possible but very slow."}]},{"prompt":"Why might a hospital group prefer federated learning to a central data lake?","choices":[{"t":"Patient data never leaves each hospital","s":2,"fb":"Right. Less transfer, less risk."},{"t":"It is always faster","s":0,"fb":"It can be slower."},{"t":"Data lakes are illegal","s":0,"fb":"They are not, but they concentrate risk."}]}]},"lab":{"type":"sort","title":"Pick the technique","prompt":"Which privacy technique best fits each need?","buckets":["Differential privacy","Federated learning","Homomorphic encryption"],"items":[{"t":"Publish attack statistics without exposing individuals","b":0},{"t":"Train one model across banks that cannot move data","b":1},{"t":"Let an untrusted cloud compute on encrypted values","b":2},{"t":"Release usage counts from a staff survey","b":0},{"t":"Hospitals jointly train a ransomware detector","b":1}],"explain":"Choose by whether you publish, cannot move data, or must compute on locked data."}},{"title":"Governance and cross-border transfers","minutes":3,"slides":[{"scene":{"type":"graph","title":"Keeping data where it belongs","nodes":[{"id":"gc","label":"Governance\ncommittee","p":[-5.2,0.0,-0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"cl","label":"Data\nclassification","p":[-3.12,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"acx","label":"Access control\nand logging","p":[-1.04,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"rd","label":"Retention and\ndisposal","p":[1.04,1.5,0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"rn","label":"Regional processing\nnodes","p":[3.12,0.0,-0.3],"c":"pink","shape":"cyl","size":0.8,"ls":0.62},{"id":"sh","label":"Share only DP stats\nor federated updates","p":[5.2,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["gc"],["cl"],["acx"],["rd"],["rn"],["sh"]]},"say":["Technology alone does not keep data safe; people and rules do.","A governance committee of security, privacy, legal and HR sets rules, approves new uses and reviews incidents.","Data classification labels each dataset, for example public, internal, confidential or special category.","Role-based access, least privilege, logging of who viewed what, and approval before re-identification.","Retention and disposal on a set schedule.","Moving data abroad is restricted unless protection is equivalent. The Schrems II ruling in 2020 struck down the EU–US Privacy Shield, so transfers usually rely on standard contract clauses plus a transfer impact assessment. Some countries, such as China, Russia and India, require certain data to stay local. The architectural answer is regional processing nodes…","…sharing only differentially private statistics or federated model updates centrally. The best transfer is often the one that does not happen."]}],"keyPoint":"Governance needs a committee, classification, access control and retention. For cross-border work, keep raw data in its region and share only protected outputs.","plain":["A SOC watching from another country may be a transfer.","Standard Contractual Clauses are approved contract terms for transfers.","A transfer impact assessment checks the destination's laws.","Compliance is continuous, not a one-off fix."],"check":{"q":"What did Schrems II do?","o":["Struck down the EU–US Privacy Shield","Created GDPR","Banned encryption"],"a":0,"e":"Transfers now usually need SCCs and a TIA.","retry":{"q":"What is the architectural answer to data localisation laws?","o":["Regional processing, sharing only protected outputs","Copy everything to one country","Ignore the laws"],"a":0,"e":"Keep raw personal data in its region."}},"scenario":{"title":"The global SOC","setting":"Your security operations centre in another country wants raw staff logs from every office.","steps":[{"prompt":"What is a better design?","choices":[{"t":"Process locally and share only aggregated, DP-protected or federated outputs","s":2,"fb":"Right. Avoid unnecessary transfers."},{"t":"Send everything and hope","s":0,"fb":"That creates legal and security risk."},{"t":"Close the SOC","s":0,"fb":"Not necessary."}]},{"prompt":"Who should sit on the governance committee?","choices":[{"t":"Security, privacy, legal and HR","s":2,"fb":"Right. Each brings a needed view."},{"t":"Only IT","s":0,"fb":"Too narrow."},{"t":"Only the vendor","s":0,"fb":"The organisation is accountable."}]}]},"lab":{"type":"sort","title":"Governance layer","prompt":"Place each activity in its governance layer.","buckets":["Committee","Classification","Access control","Retention"],"items":[{"t":"Approve a new use of security logs","b":0},{"t":"Label a dataset as special category","b":1},{"t":"Log who viewed an investigation file","b":2},{"t":"Delete detailed logs after a year","b":3},{"t":"Require approval before re-identification","b":2}],"explain":"Layers work together to keep processing compliant over time."}},{"title":"Privacy by design and DPIAs","minutes":3,"slides":[{"scene":{"type":"graph","title":"The DPIA process (Article 35)","nodes":[{"id":"sc","label":"Screen: is it\nhigh risk?","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"de","label":"Describe the\nprocessing","p":[-3.12,1.5,0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"ar","label":"Assess risks\nto people","p":[-1.04,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"mi","label":"Mitigate","p":[1.04,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"cr","label":"Consult and\nrecord","p":[3.12,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ico","label":"Consult the ICO if\nhigh risk remains","p":[5.2,1.5,0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62}],"links":[["sc","de",2],["de","ar",2],["ar","mi",2],["mi","cr",2],["cr","ico",2]],"steps":["all",["sc"],["de"],["ar"],["mi"],["cr"],["ico"]]},"say":["Article 25 makes data protection by design and by default a legal duty. By design means privacy requirements are set at the start and built into the architecture. By default means the most protective setting applies automatically; users should not have to opt out.","A data protection impact assessment, or DPIA, is required when processing is likely to be high risk, such as large-scale profiling, biometrics or systematic monitoring. First, screen.","Describe the processing.","Assess risks to people, not just the organisation: misuse, breach, unfair decisions and chilling effects.","Mitigate them.","Consult the Data Protection Officer and, where sensible, the people affected, and record it.","If high risk remains, consult the regulator, in the UK the Information Commissioner's Office, before going ahead."]}],"keyPoint":"Privacy by design and by default is a legal duty. Run a DPIA for high-risk processing, assess risks to people, mitigate, record, and consult the ICO if high risk remains.","plain":["By default means protective settings out of the box.","A DPIA is done before processing starts.","Risks are assessed to people, not just the organisation.","Review the DPIA when the system or its use changes."],"check":{"q":"When must the ICO be consulted?","o":["When high risk remains after mitigation","For every app","Never"],"a":0,"e":"Consult before going ahead.","retry":{"q":"What does 'by default' mean?","o":["The most protective setting applies automatically","Users must opt in to privacy","Defaults are optional"],"a":0,"e":"Users should not have to change settings to be protected."}},"scenario":{"title":"The face recognition entrance","setting":"A company plans face recognition at its office entrance for security.","steps":[{"prompt":"Is a DPIA needed?","choices":[{"t":"Yes, biometric identification is special category data and high risk","s":2,"fb":"Right. It triggers a DPIA."},{"t":"No, it is only for security","s":0,"fb":"Purpose does not remove the duty."},{"t":"Only if staff complain","s":0,"fb":"Assess before starting."}]},{"prompt":"High risk remains after mitigation. What now?","choices":[{"t":"Consult the ICO before going ahead","s":2,"fb":"Right. That is the legal requirement."},{"t":"Go ahead quietly","s":0,"fb":"That breaches GDPR."},{"t":"Delete the DPIA","s":0,"fb":"Records must be kept."}]}]},"lab":{"type":"order","title":"Run a DPIA","prompt":"Put the DPIA steps in order.","items":["Screen for high risk","Describe the processing","Assess risks to people","Mitigate","Consult and record","Consult the ICO if high risk remains"],"explain":"A DPIA is done before processing begins."}},{"title":"Emerging challenges","minutes":3,"slides":[{"scene":{"type":"graph","title":"Where law and technology are still catching up","nodes":[{"id":"ex","label":"Explaining AI\ndecisions (Articles 13–15, 22)","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"qu","label":"Quantum threats:\nharvest now, decrypt later","p":[-1.73,1.5,0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"rg","label":"New AI regulation:\nEU AI Act","p":[1.73,0.0,-0.3],"c":"violet","shape":"shield","size":0.8,"ls":0.62},{"id":"np","label":"Necessity and\nproportionality","p":[5.2,1.5,0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ex"],["qu"],["rg"],["np"]]},"say":["The chapter closes with challenges where law and technology are still catching up.","Explaining AI decisions: Article 22 restricts solely automated decisions with significant effects, and the duty to give meaningful information about the logic comes mainly from Articles 13 to 15. Too much detail could teach attackers to evade detection, so use layered explanations and human review.","Quantum threats: attackers may steal encrypted data now to decrypt later, once quantum computers are powerful enough. NIST published its first post-quantum encryption standards in 2024.","New AI regulation, such as the EU AI Act, adds duties for high-risk AI.","And the enduring test for any monitoring: necessity, is it really needed, and proportionality, is the intrusion reasonable compared with the benefit?"]}],"keyPoint":"Explain decisions in layers with human review, plan for post-quantum encryption, track new AI regulation, and test every monitoring idea for necessity and proportionality.","plain":["Progressive disclosure gives different detail to different audiences.","Harvest now, decrypt later threatens long-lived secrets.","Post-quantum cryptography resists quantum attacks.","Necessity and proportionality settle most privacy-security debates."],"check":{"q":"Why might a very detailed explanation of a security model be risky?","o":["It could teach attackers how to evade detection","It is always illegal","It costs too much ink"],"a":0,"e":"Use layered explanations instead.","retry":{"q":"What is 'harvest now, decrypt later'?","o":["Stealing encrypted data now to decrypt with future quantum computers","A farming technique","A backup policy"],"a":0,"e":"Long-lived sensitive data is most at risk."}},"scenario":{"title":"Explaining the flag","setting":"A staff member asks why the security model flagged them.","steps":[{"prompt":"How should you respond?","choices":[{"t":"Give a meaningful, layered explanation and a human review, without revealing evasion details","s":2,"fb":"Right. Fair and safe."},{"t":"Refuse to explain","s":0,"fb":"People have rights to information."},{"t":"Send them the model's code","s":0,"fb":"That helps attackers."}]},{"prompt":"Which data is most at risk from future quantum attacks?","choices":[{"t":"Sensitive data that must stay secret for many years","s":2,"fb":"Right. Plan post-quantum migration for it."},{"t":"Yesterday's lunch menu","s":0,"fb":"Not sensitive."},{"t":"Public press releases","s":0,"fb":"Already public."}]}]},"lab":{"type":"sort","title":"Which challenge?","prompt":"Match each issue to the emerging challenge.","buckets":["Explainability","Quantum","AI regulation","Proportionality"],"items":[{"t":"A person asks why an algorithm refused them","b":0},{"t":"Planning migration to post-quantum encryption","b":1},{"t":"High-risk AI duties under the EU AI Act","b":2},{"t":"Is reading all staff messages reasonable for the benefit?","b":3}],"explain":"Each needs a deliberate, documented answer."}}],"test":[{"q":"Personal data includes…","o":["Any information about an identifiable person","Only names","Only passwords"],"a":0,"e":"","lesson":0},{"q":"Storage limitation means…","o":["Set retention periods","Buy more storage","Never delete"],"a":0,"e":"","lesson":0},{"q":"Security monitoring usually relies on which legal basis?","o":["Legitimate interests","Consent","Vital interests"],"a":0,"e":"","lesson":1},{"q":"The LIA's three tests are…","o":["Purpose, necessity, balancing","Cost, speed, colour","Who, when, where"],"a":0,"e":"","lesson":1},{"q":"Pseudonymised data is…","o":["Still personal data","Anonymous","Illegal"],"a":0,"e":"","lesson":2},{"q":"Feature selection means…","o":["Keeping only inputs that improve detection","Collecting every field","Encrypting features"],"a":0,"e":"","lesson":2},{"q":"In differential privacy, noise scale equals…","o":["Sensitivity ÷ epsilon","Epsilon × 100","Data size"],"a":0,"e":"","lesson":3},{"q":"DP-SGD prevents a model from…","o":["Memorising individual records","Training at all","Using GPUs"],"a":0,"e":"","lesson":3},{"q":"Federated Averaging combines…","o":["Model updates from many sites","Raw data","Passwords"],"a":0,"e":"","lesson":4},{"q":"Which scheme supports addition only?","o":["Paillier","CKKS fully homomorphic","AES"],"a":0,"e":"","lesson":4},{"q":"Is AES homomorphic?","o":["No","Yes","Only on weekends"],"a":0,"e":"","lesson":4},{"q":"Schrems II struck down…","o":["The EU–US Privacy Shield","GDPR","The NIS Regulations"],"a":0,"e":"","lesson":5},{"q":"A transfer impact assessment checks…","o":["Whether destination laws undermine protection","Network speed","Server cost"],"a":0,"e":"","lesson":5},{"q":"Data protection by design is required by…","o":["Article 25","Article 99","No law"],"a":0,"e":"","lesson":6},{"q":"In the UK, high residual DPIA risk means consulting…","o":["The ICO","The police","The vendor"],"a":0,"e":"","lesson":6},{"q":"Post-quantum cryptography resists…","o":["Attacks by future quantum computers","Phishing","Power cuts"],"a":0,"e":"","lesson":7}]};
