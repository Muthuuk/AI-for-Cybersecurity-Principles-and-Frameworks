/* Chapter 9: AI-Powered Secure Software Development and Static Code Analysis (Guide to AI for Cybersecurity) */
const CH = {"id":"ch09","num":"9","title":"AI-Powered Secure Software Development and Static Code Analysis","summary":"How AI helps write, analyse, test and review code securely: coding assistants and their risks, secure prompting, AI static analysis, ML-guided fuzzing, AI-assisted review, DevSecOps pipelines with an SBOM, and adopting the tools well.","outcomes":["Explain where AI fits in each stage of a secure development lifecycle","Identify the common flaws in AI-generated code and prompt for safer code","Compare rule-based and AI-powered static analysis","Describe how machine learning guides fuzzing","Divide code review between AI and people, and measure it","Design a DevSecOps pipeline with an SBOM and plan a phased roll-out"],"starter":[{"q":"Is code written by an AI assistant safe by default?","o":["Yes","No, it needs review like any outside code"],"a":1,"e":"Assistants write typical code, not safe code."},{"q":"A tool that warns about code that is actually fine has produced…","o":["A false positive","A false negative","A patch"],"a":0,"e":"Too many false positives cause alert fatigue."},{"q":"An ingredients list of every software component is called…","o":["An SBOM","A SIEM","A VPN"],"a":0,"e":"Lesson 7 covers SBOMs."}],"lessons":[{"title":"The AI-powered secure SDLC","minutes":3,"slides":[{"scene":{"type":"graph","title":"Security checks at every stage","nodes":[{"id":"rq","label":"Requirements\nand threats","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"ds","label":"Secure\ndesign","p":[3.64,1.9,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"cd","label":"AI-assisted\ncoding","p":[3.64,-0.7,0],"c":"amber","shape":"ico","size":0.8,"ls":0.6},{"id":"rt","label":"Review and\ntesting","p":[0.0,-2.0,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"pr","label":"Pipeline and\nrelease","p":[-3.64,-0.7,0],"c":"green","shape":"shield","size":0.8,"ls":0.6},{"id":"mo","label":"Monitor\nand learn","p":[-3.64,1.9,0],"c":"slate","shape":"torus","size":0.8,"ls":0.6}],"links":[["rq","ds",2],["ds","cd",2],["cd","rt",2],["rt","pr",2],["pr","mo",2],["mo","rq",2]],"steps":["all",["rq"],["ds"],["cd"],["rt"],["pr"],["mo"],"all"],"orbit":0.4},"say":["Welcome to Chapter 9, AI-Powered Secure Software Development and Static Code Analysis, and I'm Sam, your tutor. Teams now deploy many times a day across hundreds of libraries, and human review alone cannot keep up.","At the start, language-reading AI scans requirement documents for security needs and likely threats.","In design, models compare designs with known secure patterns and flag risky ones.","While coding, the editor warns as you type.","Then automated review and testing.","Automatic security gates in the delivery pipeline can stop a risky release.","And live monitoring feeds lessons back into the models.","A false positive is a tool reporting a flaw in code that is actually fine. Too many false alarms are dangerous, because developers learn to ignore the tool, including its real warnings. The chapter's improvement figures are indicative ranges."]}],"keyPoint":"In the AI-powered lifecycle, security checks run at every stage and lessons from live use retrain the models. Find problems early, when they are cheapest to fix.","plain":["A false positive is a fire alarm that goes off for burnt toast.","Too many false alarms train people to ignore all alarms.","AI tools are opaque and do worse on unfamiliar code.","Early fixes are cheapest."],"check":{"q":"Why is a high false-alarm rate dangerous, not just annoying?","o":["Developers learn to ignore the tool, including real warnings","It uses more electricity","It makes code slower"],"a":0,"e":"Alert fatigue hides real problems.","retry":{"q":"In the fire alarm picture, a false positive is…","o":["An alarm for burnt toast","A real fire","A broken alarm"],"a":0,"e":"A warning about code that is actually fine."}},"scenario":{"title":"The ignored scanner","setting":"Developers say the security scanner 'always cries wolf', and they now merge code without reading its findings.","steps":[{"prompt":"What is the real risk?","choices":[{"t":"Real vulnerabilities are being ignored along with the false ones","s":2,"fb":"Right. Alert fatigue is a security risk."},{"t":"None, they are experienced","s":0,"fb":"Experience does not see hidden flaws."},{"t":"The scanner will break","s":0,"fb":"The tool is fine; trust is broken."}]},{"prompt":"What would help most?","choices":[{"t":"Tune the tool to cut false alarms and rank findings by risk","s":2,"fb":"Right. Fewer, better alerts rebuild trust."},{"t":"Turn the scanner off","s":0,"fb":"That removes the safety net."},{"t":"Add more rules","s":0,"fb":"Likely more false alarms."}]}]},"lab":{"type":"order","title":"Order the lifecycle","prompt":"Put the six grouped stages of the AI-powered SDLC in order.","items":["Requirements and threats","Secure design","AI-assisted coding","Review and testing","Pipeline and release","Monitor and learn"],"explain":"Lessons from live use feed back into the start of the loop."}},{"title":"AI coding assistants and their risks","minutes":3,"slides":[{"scene":{"type":"graph","title":"How an assistant writes code","nodes":[{"id":"rq","label":"Your request\nand open files","p":[-5.2,0.0,-0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"tk","label":"Split into\ntokens","p":[-1.73,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"pr","label":"Predict the next\ntoken, repeatedly","p":[1.73,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"out","label":"Draft code:\ntypical, not\nnecessarily safe","p":[5.2,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["rq","tk",2],["tk","pr",2],["pr","out",2]],"steps":["all",["rq"],["tk"],["pr"],["out"]]},"say":["AI coding assistants are built on large language models trained on huge amounts of public code.","Your request and the files you have open give the context.","The words are split into small pieces called tokens.","The model predicts the most likely next token again and again until it has written a block of code.","It predicts what code usually looks like; it does not understand your security needs. Because it learned from public code full of insecure examples, common flaws appear: SQL injection, cross-site scripting, weak cryptography, broken access control and unsafe deserialisation."]}],"keyPoint":"Assistants write typical code, not safe code. Treat their output like code from an unknown contributor: review and test it.","plain":["An assistant is like a very fast intern who has read the whole internet, including the bad advice.","SQL injection: input pasted into a database command changes what it does.","Cross-site scripting: unsafe input runs as a script in someone else's browser.","Faster code means more chances for a flaw to slip in."],"check":{"q":"Why do AI assistants often produce insecure code?","o":["They learned from public code full of insecure examples and aim for typical code","They are deliberately malicious","They cannot write code"],"a":0,"e":"Typical is not the same as safe.","retry":{"q":"In the intern picture, why check the intern's work?","o":["They have read bad advice as well as good","They type slowly","They are always wrong"],"a":0,"e":"Speed without judgement needs review."}},"scenario":{"title":"Merged without review","setting":"A team accepts AI-generated code without review to meet a release date. A month later, customer data leaks through SQL injection.","steps":[{"prompt":"What was the root cause?","choices":[{"t":"Unreviewed AI code containing a common flaw","s":2,"fb":"Right. Review is not optional."},{"t":"The database vendor","s":0,"fb":"The query was built unsafely."},{"t":"Bad luck","s":0,"fb":"It was preventable."}]},{"prompt":"What policy would you introduce?","choices":[{"t":"Treat AI code like an unknown contributor: review and test it","s":2,"fb":"Right. Same standard as any outside code."},{"t":"Ban all AI tools","s":1,"fb":"Possible, but you lose the benefits."},{"t":"Trust AI code from paid tools","s":0,"fb":"Paid tools make the same mistakes."}]}]},"lab":{"type":"sort","title":"Name the flaw","prompt":"Match each problem to the common AI-code flaw.","buckets":["SQL injection","Cross-site scripting","Weak cryptography","Broken access control","Unsafe deserialisation"],"items":[{"t":"User input pasted straight into a database query","b":0},{"t":"A comment shown on a page without encoding","b":1},{"t":"Passwords hashed with an outdated method","b":2},{"t":"No check that the user owns the record they edit","b":3},{"t":"Rebuilding objects from untrusted uploaded data","b":4}],"explain":"These are the flaws assistants most often reproduce."}},{"title":"Prompting for secure code","minutes":3,"slides":[{"scene":{"type":"graph","title":"The secure query pattern","nodes":[{"id":"al","label":"Allow-list\nvalidation","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"pq","label":"Parameterised\nquery","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"col","label":"Only the columns\nneeded","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"fs","label":"Fail\nsafely","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["al","pq",2],["pq","col",2],["col","fs",2]],"steps":["all",["al"],["pq"],["col"],["fs"],"all"]},"say":["The quality of the request shapes the security of the result. 'Create a login function' leaves the model to fill gaps with typical, often insecure code. A security-aware prompt asks for bcrypt hashing, timing-attack protection, rate limiting, secure cookies and audit logging. Even then, review and test.","For database queries, first check input against an allow-list, for example only letters, digits and underscores, 3 to 20 characters, and reject anything else.","Then use a parameterised query: the command and the user's data travel separately, so data never becomes part of the command.","Select only the columns you need, not the whole table.","And fail safely if anything looks wrong.","Some older scanners wrongly flag correct parameterised queries as SQL injection. Spotting that false positive, and explaining why, is a core skill."]}],"keyPoint":"State security requirements in your prompt, but still review. For queries: allow-list, parameterise, select only what you need, fail safely.","plain":["A parameterised query is like a form with labelled boxes: data stays in its box.","Bcrypt is deliberately slow so stolen password files are hard to crack.","Rate limiting stops automated password guessing.","A timing attack learns from how long the system takes to answer."],"check":{"q":"What makes a parameterised query safe from SQL injection?","o":["The command and the data travel separately","It is shorter","It uses capital letters"],"a":0,"e":"Data can never become part of the command.","retry":{"q":"A scanner flags a correctly parameterised query as SQL injection. That finding is…","o":["A false positive","A real vulnerability","A false negative"],"a":0,"e":"The pattern is safe; the tool did not recognise it."}},"scenario":{"title":"The login prompt","setting":"A developer asks an assistant: 'Create a login function'.","steps":[{"prompt":"What is the risk?","choices":[{"t":"The model fills gaps with typical, often insecure code","s":2,"fb":"Right. Vague prompts get vague security."},{"t":"None, assistants are secure by default","s":0,"fb":"They are not."},{"t":"It will refuse","s":0,"fb":"It will happily write something."}]},{"prompt":"Which prompt is best?","choices":[{"t":"Create a login using bcrypt, timing-attack protection, rate limiting, secure cookies and audit logging","s":2,"fb":"Right. Requirements in, better code out, still reviewed."},{"t":"Make it secure please","s":1,"fb":"Better than nothing, but too vague."},{"t":"Make it fast","s":0,"fb":"Speed is not security."}]}]},"lab":{"type":"spot","title":"Spot the unsafe lines","prompt":"These lines come from a user lookup function. Pick the unsafe ones.","parts":[{"lbl":"Query","t":"query = \"SELECT * FROM users WHERE name = '\" + username + \"'\"","bad":true,"why":"User input pasted into the command allows SQL injection."},{"lbl":"Check","t":"if not re.fullmatch(r'[A-Za-z0-9_]{3,20}', username): reject()","bad":false,"why":"Allow-list validation, a good first line of defence."},{"lbl":"Safe query","t":"cur.execute('SELECT id, username FROM users WHERE username = %s', (username,))","bad":false,"why":"Parameterised, and only the needed columns."},{"lbl":"Password","t":"hash = md5(password)","bad":true,"why":"MD5 is outdated and fast to crack; use bcrypt."},{"lbl":"Errors","t":"print(full_stack_trace_to_user)","bad":true,"why":"Showing internal errors to users leaks useful details to attackers."}],"explain":"Pasted input, weak hashing and leaky errors are classic flaws; allow-lists and parameterised queries are the fix."}},{"title":"Rule-based versus AI-powered static analysis","minutes":3,"slides":[{"scene":{"type":"graph","title":"How an AI analyser turns code into fixable findings","nodes":[{"id":"rep","label":"Code\nrepository","p":[-5.2,0.0,-0.3],"c":"slate","shape":"cyl","size":0.8,"ls":0.62},{"id":"par","label":"Parse: syntax tree,\ncontrol-flow graph","p":[-3.12,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ml","label":"ML analysis","p":[-1.04,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"rk","label":"Rank by severity\nand exploitability","p":[1.04,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"fx","label":"Explain and\nsuggest fixes","p":[3.12,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"ln","label":"Developer verdicts\nretrain the model","p":[5.2,1.5,0.3],"c":"pink","shape":"torus","size":0.8,"ls":0.62}],"links":[["rep","par",2],["par","ml",2],["ml","rk",2],["rk","fx",2],["fx","ln",2]],"steps":["all",["rep"],["par"],["ml"],["rk"],["fx"],["ln"]]},"say":["Static analysis examines code without running it. Rule-based tools are quick to set up, cover many languages and explain each finding by the rule that fired. AI tools are better at complex, context-dependent flaws and raise fewer false alarms, but they are often opaque.","The AI tool connects to the code repository and analyses every change.","It turns code into structures: an abstract syntax tree is like a sentence diagram for code, and a control-flow graph shows every path the program can take.","Specialised models analyse those structures.","Findings are merged and ranked by severity and how exploitable they are.","The developer gets a plain explanation and a suggested fix.","Developer verdicts retrain the model, so feedback needs oversight. Best practice is hybrid: AI for detection and ranking, rules where clear explanations are needed."]}],"keyPoint":"Hybrid works best: AI finds and ranks, rules explain. Developer feedback retrains the model, so it must be honest.","plain":["Data flow analysis traces a value from a web form to a database call.","An abstract syntax tree is a sentence diagram for code.","In a regulated bank, explaining each finding may matter more than fewer false alarms.","Marking real findings as false teaches the model the wrong lesson."],"check":{"q":"What is the main weakness of AI-powered static analysis?","o":["It is often opaque about why it flagged something","It cannot read code","It never finds anything"],"a":0,"e":"Rules explain themselves; models often do not.","retry":{"q":"In the sentence picture, what is an abstract syntax tree?","o":["A diagram of the structure of code","A list of passwords","A network map"],"a":0,"e":"Models read code through such structures."}},"scenario":{"title":"Gaming the feedback","setting":"Developers routinely mark real findings as 'false' so their code can merge quickly.","steps":[{"prompt":"What will happen to the AI tool?","choices":[{"t":"It learns to stop flagging real flaws","s":2,"fb":"Right. Bad feedback retrains it badly."},{"t":"Nothing","s":0,"fb":"Feedback retrains the model."},{"t":"It gets more accurate","s":0,"fb":"It gets worse."}]},{"prompt":"What control would you add?","choices":[{"t":"Security staff review a sample of dismissed findings","s":2,"fb":"Right. Feedback needs oversight."},{"t":"Remove the feedback button","s":1,"fb":"Loses the learning benefit."},{"t":"Reward faster merges","s":0,"fb":"That worsens the incentive."}]}]},"lab":{"type":"order","title":"Follow the workflow","prompt":"Put the AI static analysis workflow in order.","items":["Connect to the code repository","Parse code into structures","Run ML analysis","Rank findings by priority","Explain and suggest fixes","Retrain from developer verdicts"],"explain":"The loop improves the tool for your organisation's code."}},{"title":"Fuzzing guided by machine learning","minutes":3,"slides":[{"scene":{"type":"graph","title":"The ML-guided fuzzing loop","nodes":[{"id":"lr","label":"Learn how\nthe app behaves","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"gn","label":"Generate promising\ninputs","p":[3.64,1.9,0],"c":"violet","shape":"ico","size":0.8,"ls":0.6},{"id":"ex","label":"Execute and record\ncoverage","p":[3.64,-0.7,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"an","label":"Analyse: group\ncrashes, spot oddities","p":[0.0,-2.0,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"cf","label":"Confirm the\nflaw is real","p":[-3.64,-0.7,0],"c":"red","shape":"shield","size":0.8,"ls":0.6},{"id":"up","label":"Update the\nmodel","p":[-3.64,1.9,0],"c":"green","shape":"torus","size":0.8,"ls":0.6}],"links":[["lr","gn",2],["gn","ex",2],["ex","an",2],["an","cf",2],["cf","up",2],["up","lr",2]],"steps":["all",["lr"],["gn"],["ex"],["an"],["cf"],["up"]],"orbit":0.4},"say":["Fuzzing feeds a program huge numbers of unexpected or slightly broken inputs to find crashes and misbehaviour. Random fuzzing wastes effort on inputs that all follow the same path.","Machine learning first learns how the application behaves.","It generates promising inputs. Reinforcement learning works like training a dog with treats: the fuzzer is rewarded for reaching new code or triggering a crash.","Each input is run and its coverage, how much of the code it reached, is recorded.","Crashes are grouped and odd behaviour is flagged.","A suspected flaw is confirmed before it is reported, so developers are not flooded with noise.","The model is updated for the next round. Tools such as AFL and libFuzzer guide by coverage, and research such as NEUZZ adds neural networks. Always fuzz in an isolated lab or sandbox."]}],"keyPoint":"Fuzzing throws odd inputs at a running program. ML guides it towards new code and deep, multi-step bugs. Confirm before reporting, and fuzz only in a sandbox.","plain":["Fuzzing is like shaking a vending machine in every possible way to see what falls out.","Coverage is how much of the code your tests have reached.","A reinforcement learning fuzzer learns from rewards.","A sandbox keeps the chaos contained."],"check":{"q":"Why is coverage a better guide than simply running more random inputs?","o":["It focuses effort on inputs that reach new code","It is cheaper to print","Random inputs never work"],"a":0,"e":"New code is where undiscovered bugs live.","retry":{"q":"In the treats picture, what earns the fuzzer a reward?","o":["Reaching new code or triggering a crash","Running quietly","Using less memory"],"a":0,"e":"Rewards teach it useful strategies."}},"scenario":{"title":"Fuzzing in production","setting":"A tester proposes running an ML fuzzer against the live payment system 'for realism'.","steps":[{"prompt":"Is that wise?","choices":[{"t":"No, fuzz in an isolated sandbox","s":2,"fb":"Right. Fuzzing can crash systems."},{"t":"Yes, realism matters most","s":0,"fb":"Customers would suffer outages."},{"t":"Only at night","s":1,"fb":"Still risks real customers."}]},{"prompt":"The fuzzer reports 400 crashes. What next?","choices":[{"t":"Group them and confirm which are real, distinct flaws","s":2,"fb":"Right. Analyse and confirm before reporting."},{"t":"Send all 400 to developers","s":0,"fb":"That buries the real issues."},{"t":"Ignore them","s":0,"fb":"Some may be serious."}]}]},"lab":{"type":"order","title":"Run the loop","prompt":"Put the ML-guided fuzzing steps in order.","items":["Learn how the app behaves","Generate promising inputs","Execute and record coverage","Group crashes and spot oddities","Confirm the flaw is real","Update the model"],"explain":"Each round makes the next round smarter."}},{"title":"AI-assisted code review and measuring it","minutes":3,"slides":[{"scene":{"type":"graph","title":"AI checks systematically; people decide","nodes":[{"id":"pr","label":"Pull request\nopened","p":[-5.2,0.0,-0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"ai","label":"AI pre-review:\nscan, rank, suggest","p":[-2.6,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"hr","label":"Human reviewer:\ncontext and judgement","p":[0.0,0.0,-0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"fx","label":"Agree\nfixes","p":[2.6,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ap","label":"Human approves\nthe merge","p":[5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["pr","ai",2],["ai","hr",2],["hr","fx",2],["fx","ap",2]],"steps":["all",["pr"],["ai"],["hr"],["fx"],["ap"]]},"say":["A pull request asks to merge changes into the main code.","When it opens, the AI scans the change and produces a ranked list of findings with suggested fixes and similar past examples.","A human reviewer brings business context, spots new kinds of attack and weighs trade-offs.","Author and reviewer agree the fixes.","A human approves the merge. Nothing merges on the AI's say-so alone.","To judge the tool, use a balanced scorecard. Precision is the share of flags that were real problems; recall is the share of real problems found; F1 balances both. The chapter suggests precision above 75 per cent, recall above 70, and adoption above 80 per cent, because a tool developers will not use fails."]}],"keyPoint":"AI scans every change and ranks findings; humans judge context and approve merges. Measure security outcomes, efficiency, developer experience and model performance.","plain":["Precision: of what it flagged, how much was real? Recall: of what was real, how much did it flag?","A quiet tool can have high precision and poor recall.","Developer adoption is the single biggest success factor.","Targets here are starting points, not standards."],"check":{"q":"A tool flags 100 issues and 80 are real. What is its precision?","o":["80 per cent","20 per cent","100 per cent"],"a":0,"e":"Precision = real flags ÷ all flags.","retry":{"q":"Who gives final approval to merge?","o":["A human reviewer","The AI","Nobody"],"a":0,"e":"The AI assists; people decide."}},"scenario":{"title":"The quiet tool","setting":"A vendor boasts 95 per cent precision. You learn it flags only the most obvious issues.","steps":[{"prompt":"What should you check?","choices":[{"t":"Its recall: how many real problems it misses","s":2,"fb":"Right. Look at both measures."},{"t":"Nothing else","s":0,"fb":"Precision alone can mislead."},{"t":"Its logo","s":0,"fb":"No."}]},{"prompt":"Which measure would a developer care about most?","choices":[{"t":"Developer experience: speed and usefulness","s":2,"fb":"Right. Different audiences, different measures."},{"t":"Licence cost","s":1,"fb":"More a finance concern."},{"t":"Number of servers","s":0,"fb":"Not relevant to them."}]}]},"lab":{"type":"sort","title":"AI or human?","prompt":"Who should do each part of the review?","buckets":["AI","Human"],"items":[{"t":"Scan every change for known patterns","b":0},{"t":"Judge whether the business logic is right","b":1},{"t":"Rank findings by severity","b":0},{"t":"Approve the merge","b":1},{"t":"Spot a brand-new kind of attack","b":1},{"t":"Find similar past examples","b":0}],"explain":"Machines are systematic; people bring context and accountability."}},{"title":"DevSecOps, the pipeline and the SBOM","minutes":4,"slides":[{"scene":{"type":"graph","title":"Security at every pipeline stage","nodes":[{"id":"sec","label":"Pre-commit:\nsecret scanning","p":[-5.7,0.0,-0.3],"c":"cyan","shape":"box","size":0.7,"ls":0.62},{"id":"sb","label":"Build and\nSBOM","p":[-3.8,1.5,0.3],"c":"slate","shape":"slab","size":0.7,"ls":0.62},{"id":"sa","label":"Static\nanalysis","p":[-1.9,0.0,-0.3],"c":"violet","shape":"box","size":0.7,"ls":0.62},{"id":"ai","label":"AI model\nchecks","p":[0.0,1.5,0.3],"c":"pink","shape":"ico","size":0.7,"ls":0.62},{"id":"da","label":"Dynamic testing\nand fuzzing","p":[1.9,0.0,-0.3],"c":"amber","shape":"box","size":0.7,"ls":0.62},{"id":"dp","label":"Container scan and\ndeploy policy","p":[3.8,1.5,0.3],"c":"green","shape":"shield","size":0.7,"ls":0.62},{"id":"rt","label":"Runtime\nprotection","p":[5.7,0.0,-0.3],"c":"red","shape":"box","size":0.7,"ls":0.62}],"links":[["sec","sb",2],["sb","sa",2],["sa","ai",2],["ai","da",2],["da","dp",2],["dp","rt",2]],"steps":["all",["sec"],["sb"],["sa"],["ai"],["da"],["dp"],["rt"]]},"say":["DevOps joins development and operations for fast, reliable delivery through CI/CD: every change is automatically built, tested and released. DevSecOps puts security into every stage, and makes it everyone's job.","Before code is committed, a scanner checks nobody included a password or access key.","At build time, software composition analysis checks third-party libraries and produces the SBOM.","Static analysis looks for code weaknesses.","If the project builds a model, extra checks test its robustness.","Dynamic testing probes the running application.","Container images are scanned and a policy engine decides whether deployment is allowed.","Runtime tools watch the live system. Critical findings block the pipeline, high needs review, medium alerts and low is logged. A software bill of materials, or SBOM, is an ingredients list of every component. Log4Shell in December 2021 showed why you must know what is inside your software."]}],"keyPoint":"DevSecOps checks every stage, with severity-based failure policies. An SBOM, in SPDX or CycloneDX format, tells you within minutes whether a newly flawed library affects you.","plain":["An SBOM is like the ingredients label on food: essential when there is an allergy alert.","SAST examines code; DAST attacks the running app; SCA checks libraries.","Not every finding should stop the line.","Culture matters as much as tools."],"check":{"q":"What is an SBOM?","o":["An ingredients list of every software component","A type of malware","A firewall rule"],"a":0,"e":"It lets you find affected applications fast.","retry":{"q":"Under the failure policy, a critical finding…","o":["Blocks the pipeline","Is only logged","Is ignored"],"a":0,"e":"High needs review, medium alerts, low is logged."}},"scenario":{"title":"The library alert","setting":"News breaks of a critical flaw in a popular logging library.","steps":[{"prompt":"Which tool tells you fastest if you are affected?","choices":[{"t":"Your SBOMs","s":2,"fb":"Right. Search the ingredients lists."},{"t":"Asking every developer","s":1,"fb":"Slow and unreliable."},{"t":"Waiting for an attack","s":0,"fb":"Far too late."}]},{"prompt":"A developer's commit includes a cloud access key. Which stage should catch it?","choices":[{"t":"Pre-commit secret scanning","s":2,"fb":"Right. Catch it before it leaves the laptop."},{"t":"Runtime monitoring","s":0,"fb":"Far too late."},{"t":"The SBOM","s":0,"fb":"The SBOM lists components, not secrets."}]}]},"lab":{"type":"order","title":"Follow a change through the pipeline","prompt":"Put the DevSecOps pipeline stages in order.","items":["Pre-commit secret scanning","Build and SBOM","Static analysis","AI model checks","Dynamic testing","Container scan and deploy policy","Runtime protection"],"explain":"Each stage catches a different kind of problem."}},{"title":"Adopting AI security tools well","minutes":3,"slides":[{"scene":{"type":"graph","title":"A phased roll-out builds trust","nodes":[{"id":"p1","label":"Editor plug-ins and\ndependency scans","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"p2","label":"Static analysis and\nAI review","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"p3","label":"ML-guided\nfuzzing","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"p4","label":"Full DevSecOps\npipeline","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["p1","p2",2],["p2","p3",2],["p3","p4",2]],"steps":["all",["p1"],["p2"],["p3"],["p4"],"all"]},"say":["Teams that switch every tool on at once often reduce security: developers face alert overload and start ignoring findings. So start by setting clear objectives for vulnerability rates, fix times and coverage.","Begin with cheap quick wins: editor plug-ins and dependency scans.","Then add static analysis and AI-assisted review.","Then fuzzing.","Then the full pipeline.","Train both ways: developers in security, security staff in development and AI's limits. Retrain models periodically as code changes, because of model drift. Automate routine scanning, keep humans for new threats and approvals, and measure and show value. Developer adoption is the biggest success factor."]}],"keyPoint":"Set objectives, roll out in phases, train both sides, keep feedback loops and retrain for drift. Automate the routine; keep humans for judgement.","plain":["Switching everything on at once is like turning on every alarm in the building.","Model drift is accuracy slowly falling as code and threats change.","Fine-tuning adapts a model to your own code.","Show value with numbers people care about."],"check":{"q":"Why can switching on every tool at once reduce security?","o":["Alert overload makes developers ignore findings","Tools conflict and delete code","It is illegal"],"a":0,"e":"Phasing builds trust and avoids alert fatigue.","retry":{"q":"What is model drift?","o":["Accuracy slowly falling as code and threats change","A model moving servers","A type of attack"],"a":0,"e":"Retrain periodically to keep up."}},"scenario":{"title":"The sceptical team","setting":"A development team is sceptical about a new AI security tool and fears it will slow them down.","steps":[{"prompt":"How do you persuade them?","choices":[{"t":"Start with a quick-win plug-in, measure the benefit and involve them in tuning","s":2,"fb":"Right. Show value and give them a voice."},{"t":"Mandate it immediately with every rule on","s":0,"fb":"That causes alert fatigue and resentment."},{"t":"Skip training","s":0,"fb":"Training builds trust."}]},{"prompt":"How often should the model be retrained?","choices":[{"t":"Periodically, as the code evolves","s":2,"fb":"Right. Not daily, not never."},{"t":"Never","s":0,"fb":"Performance will degrade."},{"t":"Every hour","s":0,"fb":"Too costly for little gain."}]}]},"lab":{"type":"order","title":"Phase the roll-out","prompt":"Put the adoption phases in order.","items":["Editor plug-ins and dependency scans","Static analysis and AI review","ML-guided fuzzing","Full DevSecOps pipeline"],"explain":"Each phase builds trust for the next."}}],"test":[{"q":"Why is alert fatigue a security risk?","o":["Real warnings get ignored","It slows the network","It costs licences"],"a":0,"e":"","lesson":0},{"q":"AI assistants split requests into…","o":["Tokens","Packets","Files"],"a":0,"e":"","lesson":1},{"q":"Pasting user input into a database command risks…","o":["SQL injection","Phishing","Drift"],"a":0,"e":"","lesson":1},{"q":"Treat AI-generated code like…","o":["Code from an unknown contributor","Approved code","Documentation"],"a":0,"e":"","lesson":1},{"q":"Bcrypt is designed to be…","o":["Slow, so stolen hashes are hard to crack","Fast","Reversible"],"a":0,"e":"","lesson":2},{"q":"A parameterised query keeps…","o":["Command and data separate","Passwords visible","Tables merged"],"a":0,"e":"","lesson":2},{"q":"Rule-based tools' main strength is…","o":["Explaining each finding","Never missing anything","Learning automatically"],"a":0,"e":"","lesson":3},{"q":"Developer verdicts on findings…","o":["Retrain the AI model","Are ignored","Delete code"],"a":0,"e":"","lesson":3},{"q":"Coverage measures…","o":["How much code the tests reached","Disk space","Number of users"],"a":0,"e":"","lesson":4},{"q":"Fuzzing should run…","o":["In an isolated sandbox","On live systems","Only on paper"],"a":0,"e":"","lesson":4},{"q":"Recall is…","o":["The share of real problems the tool found","The share of flags that were real","Tool speed"],"a":0,"e":"","lesson":5},{"q":"Who approves a merge?","o":["A human","The AI","The vendor"],"a":0,"e":"","lesson":5},{"q":"SCA checks…","o":["Third-party libraries","Office Wi-Fi","Staff rotas"],"a":0,"e":"","lesson":6},{"q":"Log4Shell showed the value of…","o":["Knowing what is inside your software (SBOM)","Bigger servers","Longer passwords"],"a":0,"e":"","lesson":6},{"q":"A secret scanner at pre-commit catches…","o":["Passwords or keys in code","Slow queries","Spelling errors"],"a":0,"e":"","lesson":6},{"q":"The biggest success factor for AI security tools is…","o":["Developer adoption","Licence price","Logo design"],"a":0,"e":"","lesson":7}]};
