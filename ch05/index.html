/* Chapter 5: Advanced Analytics and Threat Intelligence (Guide to AI for Cybersecurity) */
const CH = {"id":"ch05","num":"5","title":"Advanced Analytics and Threat Intelligence","summary":"How advanced analytics turns a flood of security data into intelligence: the threat landscape and lifecycle, NLP and report automation, early warning, vulnerability prediction, forecasting, graphs, real-time correlation, platforms and what makes projects succeed.","outcomes":["Design a threat intelligence lifecycle with clear requirements and feedback","Explain how NLP pulls indicators and relationships out of security text","Describe an automated pipeline that turns reports into role-specific briefings","Rank vulnerabilities by likelihood of exploitation and business impact","Analyse attacker infrastructure with graph measures and community detection","Compare stream processing and complex event processing, and evaluate platforms and success factors"],"starter":[{"q":"Most security data collected by an organisation is…","o":["Read by an analyst within the hour","Never examined by a person","Deleted immediately"],"a":1,"e":"Data arrives far faster than any team can read it, which is why this chapter turns to analytics."},{"q":"A vulnerability has the highest severity score. Does that mean attackers are exploiting it?","o":["Yes, always","Not necessarily: severity is not likelihood","Only on Fridays"],"a":1,"e":"A severity score says how bad a flaw could be. Only a small minority of flaws are ever exploited, as Lesson 7 shows."},{"q":"Two malware families use the same server. Where would that link be easiest to see?","o":["In a graph of connections","In a long spreadsheet","In a word count"],"a":0,"e":"Drawn as a graph, the shared server stands out at once. Lesson 9 shows how."}],"lessons":[{"title":"From data to intelligence","minutes":3,"slides":[{"scene":{"type":"graph","title":"Far more data than any team can read","nodes":[{"id":"vol","label":"Security data:\nlogs, alerts, reports","p":[-5.2,0.0,-0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"man","label":"Manual review:\na small sample","p":[-1.73,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"ana","label":"Advanced analytics:\nscreens nearly all","p":[1.73,0.0,-0.3],"c":"cyan","shape":"ico","size":0.8,"ls":0.62},{"id":"hum","label":"Analysts:\njudgement and action","p":[5.2,1.5,0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[["vol","man",1,"amber"],["vol","ana",3],["ana","hum",2],["man","hum",1]],"steps":["all",["vol"],["man"],["ana"],["hum"],["ana","hum"]]},"say":["Welcome to Chapter 5, Advanced Analytics and Threat Intelligence, and I'm Sam, your tutor.","Security teams collect logs, alerts, threat reports, forum posts and vulnerability lists far faster than any person can read them.","Analysts can only sample a small share, and manual investigation takes hours or days and mostly finds what is already known.","Advanced analytics screens almost all the data in seconds or minutes, links events across sources, and can forecast and prioritise.","The aim is intelligence: information that is relevant, timely and tells someone what to do.","The chapter's rule is simple: automation handles the volume, and people handle the judgement."]}],"keyPoint":"Data only becomes intelligence when it is relevant, timely and points to an action. Analytics does the first pass at machine speed so people can spend their time on decisions.","plain":["Think of a postroom flooded with letters: nobody can open them all, so a machine sorts them and flags the urgent ones.","Manual work only scales by hiring more people; analytics scales by adding computing power.","Intelligence is not a pile of facts. It is the few facts that tell you what to do next.","Machines screen and link; people decide what matters and what to do."],"check":{"q":"What turns security data into intelligence?","o":["Collecting even more of it","Making it relevant, timely and actionable","Storing it for longer"],"a":1,"e":"Intelligence is data selected and analysed so that someone knows what to do.","retry":{"q":"In the postroom picture, what does the sorting machine do?","o":["Answers every letter","Flags the urgent letters for people to deal with","Throws all the letters away"],"a":1,"e":"The machine does the sorting; people still write the replies."}},"scenario":{"title":"The unread logs","setting":"Your three-person security team reviews about one per cent of the alerts it receives each day. The board asks whether you are missing attacks.","steps":[{"prompt":"What is the most honest answer?","choices":[{"t":"No, we review the important ones","s":0,"fb":"You cannot know which are important if 99 per cent are never looked at."},{"t":"Probably, because most of the data is never examined","s":2,"fb":"Right. That gap is exactly why the chapter argues for analytics."},{"t":"We need to hire thirty more analysts","s":1,"fb":"Hiring helps a little, but data grows faster than any team."}]},{"prompt":"What should you propose first?","choices":[{"t":"Let analytics screen and correlate the data, with analysts reviewing what it flags","s":2,"fb":"Right. Machines take the volume, people take the decisions."},{"t":"Turn off most of the log sources","s":0,"fb":"That hides the problem rather than solving it."},{"t":"Fully automate every response with no human review","s":0,"fb":"The chapter keeps people in charge of judgement."}]}]},"lab":{"type":"sort","title":"Machine or person?","prompt":"Who is best placed to do each task?","buckets":["Analytics (machine)","Analyst (person)"],"items":[{"t":"Remove duplicate alerts from ten tools","b":0},{"t":"Decide whether to take a hospital system offline","b":1},{"t":"Link a login, a file access and an upload across three logs","b":0},{"t":"Judge what a new threat means for this organisation","b":1},{"t":"Screen a million log lines overnight","b":0},{"t":"Explain the risk to the board","b":1}],"explain":"Repetitive screening and correlation suit machines; context, judgement and accountability stay with people."}},{"title":"Six dimensions of the threat landscape","minutes":3,"slides":[{"scene":{"type":"graph","title":"Threats come from six directions","nodes":[{"id":"cy","label":"Cyber","p":[0.0,0.0,-2.42],"c":"red","shape":"ico","size":0.8,"ls":0.6},{"id":"ph","label":"Physical","p":[3.81,0.0,-1.21],"c":"amber","shape":"box","size":0.8,"ls":0.6},{"id":"in","label":"Insider","p":[3.81,0.0,1.21],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"en","label":"Environmental","p":[0.0,0.0,2.42],"c":"green","shape":"cyl","size":0.8,"ls":0.6},{"id":"rg","label":"Regulatory","p":[-3.81,0.0,1.21],"c":"cyan","shape":"shield","size":0.8,"ls":0.6},{"id":"em","label":"Emerging","p":[-3.81,0.0,-1.21],"c":"pink","shape":"torus","size":0.8,"ls":0.6}],"links":[],"steps":["all",["cy"],["ph"],["in"],["en"],["rg"],["em"]],"orbit":0.4},"say":["The chapter widens the idea of a threat beyond malware, into six dimensions.","Cyber threats include malware, ransomware, phishing, advanced persistent threats, which are well-resourced attackers who stay hidden for a long time, and zero-day exploits against weaknesses nobody has patched yet.","Physical threats include tailgating into buildings, stolen laptops and tampered devices.","Insider threats come from careless or malicious staff, compromised accounts and misused privileged access.","Environmental threats include floods, storms, power cuts and cooling failures.","Regulatory threats are breaches of laws such as GDPR, which bring fines, legal action and lost trust.","Emerging threats include AI-powered attacks, deepfakes, future quantum risks to encryption and insecure Internet of Things devices."]},{"scene":{"type":"graph","title":"One incident, several dimensions: the cascade","nodes":[{"id":"pw","label":"Power cut:\nMFA offline","p":[-5.2,0.0,-0.25],"c":"green","shape":"cyl","size":0.8,"ls":0.62},{"id":"phish","label":"Phishing steals\na password","p":[-1.73,1.5,0.25],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"rw","label":"Ransomware\ndeployed","p":[1.73,0.0,-0.25],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"gdpr","label":"Data loss becomes\na GDPR breach","p":[5.2,1.5,0.25],"c":"cyan","shape":"shield","size":0.8,"ls":0.62}],"links":[["pw","phish",2,"red"],["phish","rw",2,"red"],["rw","gdpr",2,"red"]],"steps":["all",["pw"],["phish"],["rw"],["gdpr"]]},"say":["Threats rarely arrive alone, and the chapter calls this a cascade.","Here a power cut takes the multi-factor authentication service offline.","While it is down, a phishing email steals an employee's password.","The attacker uses that access to deploy ransomware.","The lost personal data then becomes a regulatory breach, so one incident has touched several dimensions."]}],"keyPoint":"Threat intelligence must cover cyber, physical, insider, environmental, regulatory and emerging threats, because one incident often cascades across several of them.","plain":["Risk does not only come from hackers; it can come from a flood or a careless click.","An APT is a patient, well-funded intruder who stays inside for months.","A cascade is like dominoes: one failure knocks over the next.","Good intelligence watches every direction, not just the obvious one."],"check":{"q":"A storm cuts power, and attackers exploit the outage. Which two dimensions are involved first?","o":["Environmental and cyber","Regulatory and physical","Emerging and insider"],"a":0,"e":"The storm is environmental; the attack that exploits it is cyber.","retry":{"q":"In the dominoes picture, what is a cascade?","o":["One failure triggering the next","A single isolated event","A type of malware"],"a":0,"e":"One problem knocks over the next, crossing dimensions as it goes."}},"scenario":{"title":"The lost laptop","setting":"A manager's unencrypted laptop is stolen from a car. It holds customer records and a saved VPN password.","steps":[{"prompt":"Which dimensions does this touch?","choices":[{"t":"Physical, cyber and regulatory","s":2,"fb":"Right. Physical theft, possible network access, and a data protection breach."},{"t":"Only physical","s":1,"fb":"It starts as physical, but it does not stop there."},{"t":"Only cyber","s":0,"fb":"The starting point was a physical theft."}]},{"prompt":"What should happen first?","choices":[{"t":"Revoke the VPN credentials and assess whether the breach must be reported","s":2,"fb":"Right. Close the cyber door and handle the regulatory duty."},{"t":"Wait to see if anyone uses the password","s":0,"fb":"Waiting gives an attacker time."},{"t":"Buy a better car lock","s":1,"fb":"Useful later, but it does not deal with the exposure now."}]}]},"lab":{"type":"sort","title":"Name the dimension","prompt":"Place each threat in its dimension.","buckets":["Cyber","Physical","Insider","Environmental","Regulatory","Emerging"],"items":[{"t":"Ransomware encrypts file servers","b":0},{"t":"A visitor follows staff through a secure door","b":1},{"t":"An administrator copies data before leaving","b":2},{"t":"A flood damages the server room","b":3},{"t":"A fine for mishandling personal data","b":4},{"t":"A deepfake video call imitates the finance director","b":5}],"explain":"Sorting threats by dimension helps an intelligence team make sure no direction is ignored."}},{"title":"The threat intelligence lifecycle","minutes":3,"slides":[{"scene":{"type":"graph","title":"Six phases, with feedback flowing back into planning","nodes":[{"id":"pl","label":"Planning and\ndirection","p":[0.0,0.0,-2.42],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"co","label":"Collection","p":[3.81,0.0,-1.21],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"pr","label":"Processing","p":[3.81,0.0,1.21],"c":"slate","shape":"sphere","size":0.8,"ls":0.6},{"id":"an","label":"Analysis","p":[0.0,0.0,2.42],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"di","label":"Dissemination","p":[-3.81,0.0,1.21],"c":"green","shape":"sphere","size":0.8,"ls":0.6},{"id":"fb","label":"Feedback","p":[-3.81,0.0,-1.21],"c":"pink","shape":"sphere","size":0.8,"ls":0.6}],"links":[["pl","co",2],["co","pr",2],["pr","an",2],["an","di",2],["di","fb",2],["fb","pl",2,"pink"]],"steps":["all",["pl"],["co"],["pr"],["an"],["di"],["fb"],"all"],"orbit":0.4},"say":["Intelligence is produced through six connected phases, and this lifecycle organises the rest of the chapter.","Planning and direction agrees what the organisation needs to know, for whom and why.","Collection gathers data from feeds, advisories, open sources and internal logs.","Processing converts it into one format, removes duplicates and adds context.","Analysis finds patterns, links indicators to campaigns and scores the risk.","Dissemination delivers the right product to each audience at the right time.","Feedback measures how useful it was and adjusts the priorities for the next cycle.","Collection and processing are the easiest to automate; planning and analysis need the most human judgement. Two open standards help share the results: STIX, a common language for describing threats, and TAXII, the agreed way to exchange it."]}],"keyPoint":"Planning → collection → processing → analysis → dissemination → feedback, then round again. Automate the collection and processing; keep human judgement in planning and analysis. STIX describes threats and TAXII shares them.","plain":["It is like running a newsroom: decide the story, gather sources, check them, write it, publish it, then learn from readers.","Without planning, you collect everything and understand nothing.","STIX is the shared language; TAXII is the postal service that carries it.","Feedback is what makes next month's intelligence better than this month's."],"check":{"q":"Which phase is usually the easiest to automate?","o":["Planning and direction","Collection and processing","Analysis"],"a":1,"e":"Polling feeds, converting formats and removing duplicates are routine machine tasks.","retry":{"q":"In the newsroom picture, what is feedback?","o":["Learning from readers to improve the next story","Printing the paper","Hiring reporters"],"a":0,"e":"Feedback tells you what was useful so the next cycle improves."}},"scenario":{"title":"The feed nobody reads","setting":"Your team subscribes to twelve threat feeds. Analysts say they are swamped and rarely act on any of it.","steps":[{"prompt":"Which phase has most likely been skipped?","choices":[{"t":"Planning and direction","s":2,"fb":"Right. Nobody agreed what the organisation actually needs to know."},{"t":"Collection","s":0,"fb":"Collection is clearly happening, perhaps too much."},{"t":"Dissemination","s":1,"fb":"Possibly, but the root cause is unclear requirements."}]},{"prompt":"What would you do next month?","choices":[{"t":"Agree the top questions with stakeholders, then keep only the feeds that answer them","s":2,"fb":"Right. Requirements drive collection, and feedback tests the result."},{"t":"Add six more feeds","s":0,"fb":"More data without direction makes the problem worse."},{"t":"Stop collecting altogether","s":0,"fb":"You still need intelligence, just focused intelligence."}]}]},"lab":{"type":"order","title":"Run the lifecycle","prompt":"Put the six phases of the threat intelligence lifecycle in order.","items":["Planning and direction","Collection","Processing","Analysis","Dissemination","Feedback"],"explain":"Each phase feeds the next, and feedback loops back into planning for the next cycle."}},{"title":"Natural language processing for security","minutes":3,"slides":[{"scene":{"type":"graph","title":"Turning written reports into structured facts","nodes":[{"id":"txt","label":"Report text","p":[-5.2,0.0,-0.35],"c":"slate","shape":"slab","size":0.8,"ls":0.62,"ly":1.0},{"id":"pre","label":"Pre-process\n(keep IPs, hashes)","p":[-3.12,1.5,0.35],"c":"cyan","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"ner","label":"Find entities\n(NER)","p":[-1.04,0.0,-0.35],"c":"violet","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"rel","label":"Map\nrelationships","p":[1.04,1.5,0.35],"c":"amber","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"urg","label":"Score\nurgency","p":[3.12,0.0,-0.35],"c":"red","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"cls","label":"Classify\nand route","p":[5.2,1.5,0.35],"c":"green","shape":"box","size":0.8,"ls":0.62,"ly":1.0}],"links":[["txt","pre",2],["pre","ner",2],["ner","rel",2],["rel","urg",2],["urg","cls",2]],"steps":["all",["txt"],["pre"],["ner"],["rel"],["urg"],["cls"],["ner","rel"]]},"say":["Much security knowledge is written as text, and natural language processing, or NLP, lets a computer read it.","The input might be a vendor blog, an advisory or a forum post.","Pre-processing cleans the text, but it must keep IP addresses, file hashes, which are fingerprints of files, and CVE identifiers intact.","Named entity recognition, NER, finds the important names: malware, IP addresses, domains, CVEs, attacker groups and techniques.","Relationship mapping links them, for example, Emotet drops TrickBot.","Urgency scoring looks for wording such as actively exploited.","Classification routes each item by attack type, industry and region.","The chapter stresses that general language models miss security terms, so models trained on labelled security text work much better."]}],"keyPoint":"NLP turns security text into structured facts: pre-process carefully, find entities, map relationships, score urgency and classify. Security-trained models beat general ones.","plain":["NLP is like a very fast reader with a highlighter for names, addresses and threats.","Ordinary text cleaning can break an IP address, so security pipelines are careful.","Precise text patterns catch well-formed indicators; trained models catch names and links.","A general model might think Emotet is a company; a security model knows it is malware."],"check":{"q":"Why can ordinary text cleaning harm security data?","o":["It makes the text too short","It can break IP addresses and file hashes","It removes all the verbs"],"a":1,"e":"Lower-casing or splitting on full stops can corrupt indicators.","retry":{"q":"In the highlighter picture, what does named entity recognition highlight?","o":["Important names such as malware, IPs and CVEs","Spelling mistakes","Every adjective"],"a":0,"e":"NER picks out the names that matter for security."}},"scenario":{"title":"The extractor that missed one","setting":"Your NLP extractor processes a report and lists nine indicators. An analyst later finds a tenth, a command server address, that it missed.","steps":[{"prompt":"What is the likely risk of that miss?","choices":[{"t":"Traffic to that server goes unblocked and undetected","s":2,"fb":"Right. A missed indicator is a gap in your defences."},{"t":"None, nine out of ten is fine","s":0,"fb":"One command server can be enough for an attacker."},{"t":"The report becomes unreadable","s":0,"fb":"The report is fine; the gap is in your blocklists."}]},{"prompt":"How should you improve the extractor?","choices":[{"t":"Add security-labelled training examples and pattern rules for that indicator type","s":2,"fb":"Right. Domain-specific training and precise patterns close the gap."},{"t":"Switch to a general news-trained model","s":0,"fb":"General models are worse at security terms."},{"t":"Stop extracting and read every report by hand","s":1,"fb":"Safe for one report, but it does not scale."}]}]},"lab":{"type":"spot","title":"Spot the indicators","prompt":"An NLP extractor reads this report. Pick out the parts that contain indicators or entities worth extracting.","parts":[{"lbl":"Malware","t":"Emotet was seen dropping TrickBot","bad":true,"why":"Two malware names and a relationship between them."},{"lbl":"Opening","t":"This week was busy for our research team.","bad":false,"why":"Background chatter, nothing to extract."},{"lbl":"Server","t":"It connected to 203.0.113.45 on port 443","bad":true,"why":"An IP address used for command and control."},{"lbl":"Vulnerability","t":"exploiting CVE-2024-3400, which is actively exploited","bad":true,"why":"A CVE identifier plus urgent wording."},{"lbl":"Hash","t":"SHA-256: 9f86d081884c7d65…","bad":true,"why":"A file hash identifies the malicious file."},{"lbl":"Thanks","t":"Thanks to our partners for their help.","bad":false,"why":"No security entity here."},{"lbl":"Domain","t":"payloads hosted on update-check[.]example","bad":true,"why":"A defanged domain: the brackets stop accidental clicks."}],"explain":"Names, addresses, hashes and CVEs are what the extractor must find; the rest is context."}},{"title":"Automated threat report analysis","minutes":3,"slides":[{"scene":{"type":"graph","title":"One report pipeline, three audiences","nodes":[{"id":"in","label":"Reports: PDF,\nWord, web","p":[-5,0,0],"c":"slate","shape":"slab","size":0.8,"ls":0.6},{"id":"ext","label":"Extract IOCs\n(incl. defanged)","p":[-2.2,0,0],"c":"cyan","shape":"box","size":0.8,"ls":0.6},{"id":"sum","label":"Summarise and\nquality-check","p":[0.6,0,0],"c":"violet","shape":"box","size":0.8,"ls":0.6},{"id":"exe","label":"Executive brief:\nCISO and board","p":[4.2,2.2,0],"c":"amber","shape":"sphere","size":0.75,"ls":0.6},{"id":"tec","label":"Technical analysis:\nSOC, ATT&CK","p":[4.4,0,0],"c":"red","shape":"sphere","size":0.75,"ls":0.6},{"id":"ops","label":"Operational guidance:\nIT operations","p":[4.2,-2.2,0],"c":"green","shape":"sphere","size":0.75,"ls":0.6}],"links":[["in","ext",2],["ext","sum",2],["sum","exe",1],["sum","tec",1],["sum","ops",1]],"steps":["all",["in"],["ext"],["sum"],["exe"],["tec"],["ops"]]},"say":["Dozens of threat reports are published every day, and teams skim them and miss things.","An automated pipeline takes in reports as PDFs, Word files and web pages.","It extracts indicators of compromise, or IOCs, the clues such as malicious addresses and file hashes, including defanged ones written as hxxp or with brackets around the dots.","It writes a summary and checks its quality. Extractive summaries reuse real sentences; abstractive ones write new sentences but can state things that were not in the source.","The executive brief for the CISO and board covers business impact and risk in plain language.","The technical analysis for the security operations centre lists indicators, detection rules and techniques mapped to MITRE ATT&CK, a public catalogue of attacker methods.","The operational guidance for IT operations covers affected systems, patches and what to monitor."]}],"keyPoint":"One pipeline reads every report, extracts indicators, summarises safely and produces an executive brief, a technical analysis and operational guidance. Indicators must come from extraction, never from a generated summary.","plain":["It is like one chef cooking the same ingredients three ways for three tables.","Defanging is writing hxxp so nobody clicks a dangerous link by accident.","An extractive summary quotes; an abstractive summary paraphrases and can get things wrong.","Someone should review what reaches the board."],"check":{"q":"Why must indicators come from the extraction step rather than an AI-written summary?","o":["Summaries are too short","Generated summaries can state things that were not in the source","Extraction is always slower"],"a":1,"e":"Abstractive summaries can invent or drop details, which is dangerous for indicators.","retry":{"q":"What does 'hxxp://evil[.]com' show?","o":["A defanged indicator","A typing error","A safe website"],"a":0,"e":"Writers defang links so nobody clicks them by accident; extractors must still recognise them."}},"scenario":{"title":"The board brief","setting":"An automated brief for the board says a new ransomware group 'has already targeted our sector in the UK'. The source report only mentions Europe.","steps":[{"prompt":"What has happened?","choices":[{"t":"An abstractive summary has stated something not in the source","s":2,"fb":"Right. That is the known risk of generated summaries."},{"t":"The source report must be wrong","s":0,"fb":"The source said Europe; the summary changed it."},{"t":"Nothing, the UK is in Europe","s":1,"fb":"Close, but the summary made a more specific claim than the source."}]},{"prompt":"What control would prevent this?","choices":[{"t":"A quality check and human review before briefs reach the board","s":2,"fb":"Right. Review catches unsupported claims."},{"t":"Send the board the raw reports instead","s":0,"fb":"Board members need a clear, short brief."},{"t":"Stop producing briefs","s":0,"fb":"The briefs are valuable; they just need checking."}]}]},"lab":{"type":"sort","title":"Who gets what?","prompt":"Which product should each item go into?","buckets":["Executive brief","Technical analysis","Operational guidance"],"items":[{"t":"Likely business impact and overall risk level","b":0},{"t":"Detection rule for the SIEM","b":1},{"t":"Which servers need the patch this week","b":2},{"t":"Techniques mapped to MITRE ATT&CK","b":1},{"t":"Strategic recommendation on investment","b":0},{"t":"Configuration change to apply","b":2}],"explain":"The same intelligence is tailored to what each audience must decide or do."}},{"title":"Early warning from social media and the dark web","minutes":3,"slides":[{"scene":{"type":"graph","title":"Signals can appear weeks before an intrusion","nodes":[{"id":"w1","label":"Week 1: exploit\nadvertised","p":[-5.2,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"w2","label":"Weeks 2–3:\nkits sold","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"w4","label":"Week 4:\nreconnaissance chatter","p":[0.0,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"w5","label":"Weeks 5–6:\nphishing","p":[2.6,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"w7","label":"Week 7: intrusion\ndetected","p":[5.2,0.0,-0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["w1","w2",2,"red"],["w2","w4",2,"red"],["w4","w5",2,"red"],["w5","w7",2,"red"]],"steps":["all",["w1"],["w2"],["w4"],["w5"],["w7"],["w1","w2","w4"]]},"say":["Unconventional sources can give early warning, and the chapter's illustrative timeline shows why.","In week one, an exploit is advertised on a criminal forum.","In weeks two and three, attack kits change hands.","In week four, attackers discuss targets in a particular sector.","In weeks five and six, phishing emails arrive.","Only in week seven does traditional monitoring detect the intrusion.","Spotting the early signals gives defenders weeks to patch and warn staff. The timeline is an illustration, not a measured case."]},{"scene":{"type":"graph","title":"Lawful, ethical collection comes first","nodes":[{"id":"pub","label":"Public posts:\ngenerally lawful","p":[-4,0,0],"c":"green","shape":"shield","size":0.8,"ls":0.6},{"id":"priv","label":"Private groups:\nneed authority","p":[0,0,0],"c":"amber","shape":"shield","size":0.8,"ls":0.6},{"id":"crime","label":"Taking part in crime:\nillegal everywhere","p":[4,0,0],"c":"red","shape":"shield","size":0.8,"ls":0.6},{"id":"rev","label":"Low-confidence posts\n→ human reviewer","p":[0,2.6,-1],"c":"cyan","shape":"sphere","size":0.7,"ls":0.6}],"links":[],"steps":["all",["pub"],["priv"],["crime"],["rev"]]},"say":["The ethics come before the technology.","Monitoring public posts is generally lawful, although data protection law such as GDPR still applies.","Private groups need proper legal authority and governance.","Taking part in criminal activity is illegal everywhere, whatever the reason.","Posts are classified by the same NLP methods, and low-confidence results go to a human reviewer. In class, use only pre-collected, sanitised samples."]}],"keyPoint":"Underground and social sources can warn of attacks weeks early, but only with legal advice, governance and human review. Never take part in criminal activity.","plain":["The dark web is the part of the internet reached only through special software such as Tor.","Early warning is like hearing thunder before the storm arrives.","Watching public posts is like reading a noticeboard; joining a criminal deal is a crime.","Slang and misspellings make these sources harder for NLP, so humans check uncertain items."],"check":{"q":"What is the main value of social media and dark web intelligence?","o":["Time: warning before the intrusion","Cheap storage","Replacing all other monitoring"],"a":0,"e":"Early signals give defenders weeks to prepare.","retry":{"q":"Which activity is illegal everywhere, whatever the purpose?","o":["Reading public posts","Taking part in criminal activity on a forum","Classifying sanitised samples in class"],"a":1,"e":"Buying, selling or helping with crime is illegal regardless of intent."}},"scenario":{"title":"The forum advert","setting":"An analyst finds a public forum post offering access to 'a UK retail chain's network'. Another user offers to sell a sample of the stolen data.","steps":[{"prompt":"What should the analyst do?","choices":[{"t":"Record the public post, escalate it and follow the agreed legal process","s":2,"fb":"Right. Collect lawfully and escalate through governance."},{"t":"Buy the sample to confirm it is real","s":0,"fb":"Buying stolen data is taking part in crime."},{"t":"Ignore it, it is probably fake","s":0,"fb":"It may be an early warning worth investigating."}]},{"prompt":"The classifier is only 55 per cent confident the post is about your company. Next step?","choices":[{"t":"Send it to a human reviewer","s":2,"fb":"Right. Low-confidence results go to people."},{"t":"Trigger a full incident response immediately","s":1,"fb":"Possibly later, but confirm first."},{"t":"Discard it automatically","s":0,"fb":"A missed early warning could be costly."}]}]},"lab":{"type":"sort","title":"Acceptable or not?","prompt":"Is each activity acceptable for a threat intelligence team?","buckets":["Acceptable with governance","Not acceptable"],"items":[{"t":"Monitoring public posts that mention your brand","b":0},{"t":"Buying stolen data to check it is genuine","b":1},{"t":"Classifying sanitised forum samples in a training lab","b":0},{"t":"Posing as a buyer to get an exploit kit","b":1},{"t":"Escalating a credible public threat to the legal team","b":0}],"explain":"The line is clear: observe lawfully with governance, and never take part in crime."}},{"title":"Predicting which vulnerabilities will be exploited","minutes":4,"slides":[{"scene":{"type":"graph","title":"From prediction to patch order","nodes":[{"id":"cve","label":"CVE: the\nvulnerability's name","p":[-5.2,0.0,-0.35],"c":"slate","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"cvss","label":"CVSS: how bad\nit could be","p":[-3.12,1.5,0.35],"c":"amber","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"mod","label":"Model: how likely\nto be exploited (E)","p":[-1.04,0.0,-0.35],"c":"violet","shape":"ico","size":0.8,"ls":0.62,"ly":1.0},{"id":"biz","label":"Business\nimpact (B)","p":[1.04,1.5,0.35],"c":"cyan","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"cx","label":"Patch\ncomplexity (C)","p":[3.12,0.0,-0.35],"c":"pink","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"p","label":"Priority\nP = 0.5E + 0.3B + 0.2(1 − C)","p":[5.2,1.5,0.35],"c":"green","shape":"sphere","size":0.8,"ls":0.62,"ly":1.0}],"links":[["cve","cvss",1],["cve","mod",2],["mod","p",2],["biz","p",1],["cx","p",1]],"steps":["all",["cve"],["cvss"],["mod"],["biz","cx"],["p"]]},"say":["Thousands of new vulnerabilities are published each year, and teams can patch only a fraction.","A CVE identifier names a publicly known vulnerability.","A CVSS score from zero to ten describes how severe it could be, but severity is not likelihood: only a small minority are ever exploited.","A predictive model learns from history which features tend to be exploited, using threat intelligence, the environment and the assets affected.","Business impact and patch complexity also matter, each scored from zero to one.","The chapter's example formula gives half the weight to exploit likelihood, three tenths to business impact, and two tenths to how easy the patch is."]},{"scene":{"type":"graph","title":"Action bands for the priority score P","nodes":[{"id":"a","label":"Above 0.8:\nwithin 24 hours","p":[-5.2,0.0,-0.2],"c":"red","shape":"shield","size":0.8,"ls":0.62},{"id":"b","label":"0.6 to 0.8:\nwithin 7 days","p":[-1.73,1.5,0.2],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"c","label":"0.4 to 0.6:\nwithin 30 days","p":[1.73,0.0,-0.2],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"d","label":"Below 0.4: next\nmaintenance window","p":[5.2,1.5,0.2],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["a"],["b"],["c","d"],"all"]},"say":["The priority score then maps to action bands.","Above 0.8, patch within 24 hours.","Between 0.6 and 0.8, within seven days.","Between 0.4 and 0.6, within thirty days; below 0.4, at the next maintenance window.","The weights are the chapter's example, not a standard, so the business and security teams should agree them together."]}],"keyPoint":"CVSS says how bad a flaw could be; a predictive model says how likely it is to be exploited. Combine likelihood, business impact and patch complexity into one priority, then act by band.","plain":["CVSS is like the size of a hole in a fence; exploit likelihood is whether anyone is actually climbing through.","Patching by CVSS alone wastes effort on holes nobody uses.","The formula turns a prediction into a to-do list with deadlines.","Public resources such as the CISA Known Exploited Vulnerabilities list and EPSS use similar thinking."],"check":{"q":"A flaw has CVSS 9.8 but sits on an isolated test server and has never been exploited. What does the formula suggest?","o":["Patch within 24 hours","A lower priority, because likelihood and impact are small","Ignore it for ever"],"a":1,"e":"With E = 0.05, B = 0.2 and C = 0.5, P is about 0.19: next maintenance window, not never.","retry":{"q":"In the fence picture, what does exploit likelihood describe?","o":["How big the hole is","Whether anyone is actually climbing through","The colour of the fence"],"a":1,"e":"Likelihood is about real attacker behaviour, not theoretical severity."}},"scenario":{"title":"Fifty patches, a thousand flaws","setting":"You have 1,000 open vulnerabilities and capacity to patch 50 this month.","steps":[{"prompt":"How do you choose the 50?","choices":[{"t":"The 50 highest CVSS scores","s":1,"fb":"Better than random, but severity is not likelihood."},{"t":"Rank by the priority score that combines likelihood, impact and patch effort","s":2,"fb":"Right. That puts effort where real risk is."},{"t":"The oldest 50","s":0,"fb":"Age alone says little about risk."}]},{"prompt":"Who should set the weights in the formula?","choices":[{"t":"The business and security teams together","s":2,"fb":"Right. Impact is a business judgement."},{"t":"The model developer alone","s":0,"fb":"Weights encode business priorities."},{"t":"The software vendor","s":0,"fb":"Vendors do not know your business impact."}]}]},"lab":{"type":"sort","title":"Work out the band","prompt":"Using P = 0.5E + 0.3B + 0.2(1 − C), place each vulnerability in its action band.","buckets":["Within 24 hours","Within 7 days","Within 30 days","Next maintenance window"],"items":[{"t":"E 0.9, B 0.8, C 0.3 (P = 0.83)","b":0},{"t":"E 0.7, B 0.7, C 0.2 (P = 0.72)","b":1},{"t":"E 0.2, B 0.9, C 0.1 (P = 0.55)","b":2},{"t":"E 0.1, B 0.3, C 0.8 (P = 0.18)","b":3},{"t":"E 0.6, B 0.6, C 0.5 (P = 0.58)","b":2}],"explain":"Exploit likelihood carries half the weight, so a business-critical flaw that nobody exploits can still sit lower than you might expect."}},{"title":"Forecasting security activity","minutes":3,"slides":[{"scene":{"type":"graph","title":"Five forecasting methods, from simple to complex","nodes":[{"id":"es","label":"Exponential\nsmoothing","p":[-5.2,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"ar","label":"ARIMA","p":[-2.6,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"pro","label":"Prophet","p":[0.0,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ls","label":"LSTM\nnetwork","p":[2.6,1.5,0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"en","label":"Ensemble","p":[5.2,0.0,-0.3],"c":"pink","shape":"torus","size":0.8,"ls":0.62}],"links":[],"steps":["all",["es"],["ar"],["pro"],["ls"],["en"],"all"]},"say":["Security data has rhythms: busier in working hours, quieter at weekends, with seasonal campaigns and long-term trends. A record over time, such as alerts per hour, is called a time series.","Exponential smoothing is very fast and simple and handles seasons, but struggles with complex patterns.","ARIMA is well understood and cheap, but needs steady data and is weaker on seasons.","Prophet, an open-source tool from Meta, handles holidays, trends and gaps, but needs tuning.","An LSTM, or long short-term memory network, captures complex patterns but needs lots of data and computing power.","An ensemble combines several methods and is usually most accurate, but hardest to build and explain.","Forecasts help teams plan shifts before a peak, add capacity in advance and time awareness campaigns. Compare methods on your own data rather than trusting published error rates."]}],"keyPoint":"Forecasting security activity lets teams plan staff and capacity ahead of peaks. Simple methods are fast and explainable; complex ones need more data. Test on your own data.","plain":["A forecast is like a weather report for your alert queue.","Simple methods are like a ruler; LSTMs are like a supercomputer that needs years of records.","An ensemble asks several forecasters and blends their answers.","A forecast you can explain is often more useful than a slightly better one you cannot."],"check":{"q":"Which method suits a team with little historical data and a need for quick, explainable forecasts?","o":["Exponential smoothing","A large LSTM network","An untested ensemble"],"a":0,"e":"Simple statistical methods are fast, cheap and easy to explain.","retry":{"q":"In the weather picture, what does the forecast help you do?","o":["Plan ahead, such as putting more analysts on shift","Stop all attacks","Delete old logs"],"a":0,"e":"Forecasts are for planning resources before the peak."}},"scenario":{"title":"The January phishing wave","setting":"Every January, phishing reports double around tax deadlines. Your team is always short-staffed that month.","steps":[{"prompt":"How can forecasting help?","choices":[{"t":"Predict the peak and schedule extra staff and awareness training before it","s":2,"fb":"Right. That is the operational value of forecasting."},{"t":"Prevent phishing emails being sent","s":0,"fb":"Forecasts help you prepare; they do not stop attackers."},{"t":"It cannot help with seasonal patterns","s":0,"fb":"Seasonality is exactly what these methods model."}]},{"prompt":"A vendor offers an LSTM claiming 'the lowest error ever published'. What should you do?","choices":[{"t":"Compare it with a simple method on your own data","s":2,"fb":"Right. Error rates depend heavily on the dataset."},{"t":"Buy it, published figures are reliable","s":0,"fb":"Published figures may not match your data."},{"t":"Reject all neural networks","s":1,"fb":"They can help, but test before deciding."}]}]},"lab":{"type":"sort","title":"Pick the method","prompt":"Which forecasting method best fits each situation?","buckets":["Exponential smoothing","Prophet","LSTM network"],"items":[{"t":"Quick daily forecast with a clear weekly rhythm","b":0},{"t":"Data with holidays and gaps in the records","b":1},{"t":"Years of detailed data with complex patterns","b":2},{"t":"You need a result in seconds on a laptop","b":0},{"t":"Seasonal events that move each year, such as holidays","b":1}],"explain":"Match the method to the data you have and how much explanation you need."}},{"title":"Graph analysis of attacker infrastructure","minutes":4,"slides":[{"scene":{"type":"graph","title":"Relationships reveal what tables hide","nodes":[{"id":"apt","label":"Attacker group","p":[0,2.6,-0.5],"c":"red","shape":"ico","size":0.8,"ls":0.6},{"id":"m1","label":"Malware A","p":[-3.6,0.8,0],"c":"violet","shape":"sphere","size":0.65,"ls":0.55},{"id":"m2","label":"Malware B","p":[3.6,0.8,0],"c":"violet","shape":"sphere","size":0.65,"ls":0.55},{"id":"c2","label":"Shared command\nserver","p":[0,0.2,0.6],"c":"amber","shape":"box","size":0.85,"ls":0.6},{"id":"d1","label":"Domain 1","p":[-4.8,-1.8,0],"c":"cyan","shape":"box","size":0.55,"ls":0.5},{"id":"d2","label":"Domain 2","p":[-2,-1.9,0.4],"c":"cyan","shape":"box","size":0.55,"ls":0.5},{"id":"v1","label":"Victim 1","p":[2,-1.9,0.4],"c":"green","shape":"cyl","size":0.55,"ls":0.5},{"id":"v2","label":"Victim 2","p":[4.8,-1.8,0],"c":"green","shape":"cyl","size":0.55,"ls":0.5}],"links":[["apt","m1",1],["apt","m2",1],["m1","c2",2],["m2","c2",2],["c2","d1",1],["c2","d2",1],["c2","v1",1],["c2","v2",1]],"steps":["all",["m1","m2"],["c2"],["c2"],["apt","c2"],["c2","d1","d2"],"all"],"orbit":0.4},"say":["In a spreadsheet, two malware families sit on separate rows. Draw them as a graph, with nodes for things and edges for links, and connections jump out.","Here two malware families look unrelated at first.","But both talk to the same command server, so that shared node stands out.","Degree centrality counts direct connections and finds busy hubs; this server has the most.","Betweenness centrality finds bridges that sit on the paths between others; taking a bridge down can cut the attack chain.","PageRank rates a node as important if it links to other important nodes, and the clustering coefficient shows how tightly its neighbours connect.","Tools such as NetworkX and graph databases such as Neo4j make this practical. Shared infrastructure is a clue for attribution, not proof."]},{"scene":{"type":"clusters","title":"Community detection: linked nodes form separate campaigns","labels":["Campaign 1","Campaign 2","An odd one out"],"steps":[0,0,1,2]},"say":["Community detection, for example the Louvain method, splits a large graph into groups of closely linked nodes.","Each group often corresponds to a separate campaign or actor.","That helps with attribution and with seeing the scale of each operation.","Nodes that fit no group deserve a closer look, but unusual is not the same as malicious."]}],"keyPoint":"Graphs show attackers, malware, servers and victims as connected nodes. Degree finds hubs, betweenness finds bridges, PageRank finds influence and community detection separates campaigns.","plain":["A graph is like a detective's wall of photos joined with string.","A hub has lots of strings; a bridge is the one string that holds two groups together.","Cut the bridge and the chain may break.","Shared servers suggest a link, but attackers also rent the same infrastructure."],"check":{"q":"A node has few connections but sits on almost every path between two groups. Which measure is high?","o":["Degree centrality","Betweenness centrality","Clustering coefficient"],"a":1,"e":"It is a bridge, so betweenness is high even though degree is low.","retry":{"q":"On the detective's wall, what is a bridge?","o":["The string that holds two groups of photos together","The photo with the most strings","A photo with no strings"],"a":0,"e":"A bridge connects groups; removing it separates them."}},"scenario":{"title":"Two campaigns, one server","setting":"Graph analysis shows two separate phishing campaigns using the same command server and the same domain registrar account.","steps":[{"prompt":"What can you reasonably conclude?","choices":[{"t":"They are probably linked, and that is worth investigating further","s":2,"fb":"Right. Shared infrastructure is a strong clue, not proof."},{"t":"They are definitely the same attacker group","s":1,"fb":"Possible, but infrastructure can be shared or rented."},{"t":"Nothing at all","s":0,"fb":"Shared infrastructure is meaningful evidence."}]},{"prompt":"What action has the biggest effect?","choices":[{"t":"Get the shared server taken down or blocked","s":2,"fb":"Right. It is a bridge, so removing it disrupts both campaigns."},{"t":"Block one victim's email","s":0,"fb":"That protects one victim, not the chain."},{"t":"Draw a bigger graph","s":1,"fb":"Useful later, but act on the bridge first."}]}]},"lab":{"type":"sort","title":"Which measure answers it?","prompt":"Match each question to the graph measure that answers it.","buckets":["Degree","Betweenness","PageRank","Community detection"],"items":[{"t":"Which server talks to the most other nodes?","b":0},{"t":"Which node, if removed, would split the network?","b":1},{"t":"Which node is linked to other important nodes?","b":2},{"t":"How many separate campaigns are in this data?","b":3},{"t":"Which domain is the busiest hub?","b":0}],"explain":"Each measure answers a different investigative question, so choose by the question you are asking."}},{"title":"Real-time analysis: streams and complex events","minutes":4,"slides":[{"scene":{"type":"graph","title":"Stream processing analyses each event as it arrives","nodes":[{"id":"src","label":"Event\nsources","p":[-5.2,0.0,-0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"q","label":"Message queue\n(e.g. Kafka)","p":[-2.6,1.5,0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"sp","label":"Stream processor\n(Flink, Spark)","p":[0.0,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"al","label":"Alert\ngeneration","p":[2.6,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62},{"id":"re","label":"Response\nand storage","p":[5.2,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62}],"links":[["src","q",2],["q","sp",2],["sp","al",2],["al","re",2]],"steps":["all",["src"],["q"],["sp"],["al"],["re"],"all"]},"say":["Batch processing analyses data later, perhaps overnight: fine for reports, too slow to stop an attack in progress.","Stream processing starts with event sources such as firewalls, endpoints and cloud services.","A message queue such as Apache Kafka acts like a conveyor belt with a buffer, so a burst of events does not overwhelm the system.","A stream processor such as Apache Flink remembers recent events, watches sliding time windows and matches patterns.","It generates alerts within milliseconds.","Then it triggers responses and stores events for later analysis.","Key terms: latency is the delay from event to alert, throughput is events per second, and exactly-once means no event is lost or counted twice."]},{"scene":{"type":"graph","title":"Complex event processing links events across sources and time","nodes":[{"id":"t","label":"Temporal:\ntiming","p":[-5.2,0.0,-0.25],"c":"cyan","shape":"sphere","size":0.8,"ls":0.62},{"id":"s","label":"Spatial:\nlocation","p":[-1.73,1.5,0.25],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"l","label":"Logical:\nmeaning","p":[1.73,0.0,-0.25],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"m","label":"Multi-dimensional:\nall three","p":[5.2,1.5,0.25],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[["t","m",1],["s","m",1],["l","m",1]],"steps":["all",["t"],["s"],["l"],["m"],"all"]},"say":["A modern attack may unfold over weeks, and each step alone may look harmless. Complex event processing, or CEP, links them.","Temporal correlation looks at timing, such as a login, a file access and a large upload within five minutes.","Spatial correlation looks at location, such as several alerts from one subnet.","Logical correlation looks at meaning, such as a known flaw in a product plus an alert showing that product being exploited.","Multi-dimensional correlation combines all three and is strongest for long campaigns, but costs the most computing power.","Stream processing works in milliseconds on high volume; CEP works over seconds to weeks across many sources. Most organisations use both."]}],"keyPoint":"Batch explains yesterday; streams stop today's attack. CEP links events by time, place and meaning to reveal multi-stage attacks. Most organisations run both.","plain":["Batch is reading yesterday's newspaper; streaming is watching live television.","Kafka is the conveyor belt with a waiting area, so nothing falls off in a rush.","CEP is joining the dots between small events that look harmless alone.","The more dimensions you correlate, the stronger the picture and the higher the cost."],"check":{"q":"A login, a large file access and an upload to an unknown site all happen within five minutes. Which correlation links them?","o":["Temporal","Spatial","None"],"a":0,"e":"The link is timing, so this is temporal correlation.","retry":{"q":"In the television picture, what is stream processing?","o":["Watching live as events happen","Reading yesterday's paper","Recording to watch next week"],"a":0,"e":"Streams analyse each event as it arrives."}},"scenario":{"title":"Ransomware at 2 am","setting":"At 2 am, one server starts renaming thousands of files a minute. Your batch reports run at 6 am.","steps":[{"prompt":"What approach would have caught this in time?","choices":[{"t":"Stream processing with a rule for mass file renames","s":2,"fb":"Right. Ransomware needs a response within seconds."},{"t":"A faster batch report at 5 am","s":0,"fb":"Three hours is far too late."},{"t":"A monthly review","s":0,"fb":"By then the damage is done."}]},{"prompt":"The same attacker phished a user three weeks earlier. What links the two events?","choices":[{"t":"Complex event processing across sources and time","s":2,"fb":"Right. CEP connects multi-stage attacks."},{"t":"Nothing could link them","s":0,"fb":"CEP is designed for exactly this."},{"t":"Stream processing alone","s":1,"fb":"Streams excel at speed; CEP links long timelines."}]}]},"lab":{"type":"sort","title":"Which correlation?","prompt":"Which type of correlation links each set of events?","buckets":["Temporal (timing)","Spatial (location)","Logical (meaning)"],"items":[{"t":"Failed logins followed by a success within two minutes","b":0},{"t":"Five alerts from machines on the same subnet","b":1},{"t":"A known flaw in a web server plus an exploit alert for that server","b":2},{"t":"Login, file access and upload within five minutes","b":0},{"t":"Several sensors in one building raising alarms","b":1}],"explain":"Ask what joins the events: time, place or meaning. Combine all three for the strongest picture."}},{"title":"Threat intelligence platforms","minutes":3,"slides":[{"scene":{"type":"graph","title":"The hub that cleans, enriches and shares intelligence","nodes":[{"id":"ing","label":"Ingest\nfeeds","p":[-5.2,0.0,-0.35],"c":"slate","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"nor","label":"Normalise\n(STIX 2.1)","p":[-3.12,1.5,0.35],"c":"cyan","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"dd","label":"De-duplicate","p":[-1.04,0.0,-0.35],"c":"violet","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"qs","label":"Score\nquality","p":[1.04,1.5,0.35],"c":"amber","shape":"box","size":0.8,"ls":0.62,"ly":1.0},{"id":"enr","label":"Enrich and\nanalyse","p":[3.12,0.0,-0.35],"c":"pink","shape":"ico","size":0.8,"ls":0.62,"ly":1.0},{"id":"dist","label":"Distribute:\nSIEM, firewall, workbench","p":[5.2,1.5,0.35],"c":"green","shape":"sphere","size":0.8,"ls":0.62,"ly":1.0}],"links":[["ing","nor",2],["nor","dd",2],["dd","qs",2],["qs","enr",2],["enr","dist",2]],"steps":["all",["ing"],["nor"],["dd"],["qs"],["enr"],["dist"],"all"]},"say":["Without a central platform, a team juggles dozens of feeds in different formats, each wired separately into every tool. A threat intelligence platform, or TIP, fixes that.","It ingests feeds from many sources.","It normalises them into one standard, STIX 2.1.","It removes duplicates.","It scores the quality and confidence of each item.","It enriches items with context such as location and reputation, and runs analysis such as clustering and graphs. Enrichment is usually the slowest step because it waits on outside lookups.","It distributes results to the SIEM, the security information and event management system, to firewalls and to an analyst workbench.","Open-source options include MISP, which is community-driven, OpenCTI, which uses a knowledge graph, and the lightweight YETI. Choose by requirements, and treat vendor claims about time saved as claims, not facts."]}],"keyPoint":"A TIP ingests, normalises, de-duplicates, scores, enriches and distributes intelligence to every tool. Choose a platform by requirements, not by marketing.","plain":["A TIP is like a central kitchen that prepares ingredients once and sends them to every restaurant.","Normalising means everyone speaks the same language, STIX.","De-duplication stops the same warning arriving twelve times.","Enrichment is slow because it waits for answers from outside."],"check":{"q":"Which TIP step is usually slowest?","o":["De-duplication","Enrichment, because it waits on external lookups","Normalisation"],"a":1,"e":"Looking up reputation and context from outside sources takes time.","retry":{"q":"In the central kitchen picture, what does normalising do?","o":["Puts everything into one standard format","Cooks the food faster","Throws away bad ingredients"],"a":0,"e":"Normalising converts every feed to one standard, such as STIX 2.1."}},"scenario":{"title":"Choosing a platform","setting":"A small charity's security team has one analyst and wants to share intelligence with similar organisations.","steps":[{"prompt":"Which requirement matters most?","choices":[{"t":"A strong sharing community and low cost","s":2,"fb":"Right. That points towards a community platform such as MISP."},{"t":"The most expensive licence available","s":0,"fb":"Cost should follow requirements."},{"t":"The longest feature list","s":1,"fb":"Features help only if they meet a real need."}]},{"prompt":"A vendor says its platform 'saves analysts 80 per cent of their time'. How do you treat that?","choices":[{"t":"As a claim, unless it comes with a named, independent source","s":2,"fb":"Right. Ask for evidence."},{"t":"As a measured fact","s":0,"fb":"Marketing figures are not evidence."},{"t":"Ignore the vendor completely","s":1,"fb":"Too harsh; just ask for evidence."}]}]},"lab":{"type":"order","title":"Build the TIP pipeline","prompt":"Put the TIP steps in order.","items":["Ingest feeds","Normalise to STIX 2.1","De-duplicate","Score quality","Enrich and analyse","Distribute to tools"],"explain":"Clean data first, then add context, then share it with every tool that needs it."}},{"title":"Why analytics projects succeed or fail","minutes":3,"slides":[{"scene":{"type":"graph","title":"A seven-step design framework","nodes":[{"id":"r","label":"1. Requirements\nanalysis","p":[-5.7,0.0,-0.35],"c":"cyan","shape":"box","size":0.7,"ls":0.62,"ly":1.0},{"id":"ds","label":"2. Data source\nassessment","p":[-3.8,1.5,0.35],"c":"slate","shape":"box","size":0.7,"ls":0.62,"ly":1.0},{"id":"ad","label":"3. Architecture\ndesign","p":[-1.9,0.0,-0.35],"c":"violet","shape":"box","size":0.7,"ls":0.62,"ly":1.0},{"id":"ts","label":"4. Technology\nselection","p":[0.0,1.5,0.35],"c":"amber","shape":"box","size":0.7,"ls":0.62,"ly":1.0},{"id":"im","label":"5. Implementation","p":[1.9,0.0,-0.35],"c":"pink","shape":"box","size":0.7,"ls":0.62,"ly":1.0},{"id":"pd","label":"6. Phased\ndeployment","p":[3.8,1.5,0.35],"c":"green","shape":"box","size":0.7,"ls":0.62,"ly":1.0},{"id":"co","label":"7. Continuous\noptimisation","p":[5.7,0.0,-0.35],"c":"red","shape":"torus","size":0.7,"ls":0.62,"ly":1.0}],"links":[["r","ds",2],["ds","ad",2],["ad","ts",2],["ts","im",2],["im","pd",2],["pd","co",2]],"steps":["all",["r"],["ds","ad"],["ts"],["im","pd"],["co"],"all"]},"say":["The chapter closes with why analytics projects succeed or fail. Common pitfalls are trying to do everything at once, buying tools before defining needs, ignoring poor data, neglecting analysts, and treating it as a one-off project.","The fix starts with requirements analysis: one high-value use case first.","Then assess the data sources and design the architecture.","Only then select the technology, so tools follow needs.","Implement it, and deploy in phases, proving value before expanding.","Finally, optimise continuously, because attackers change and models drift.","An executive sponsor, staff training and clean, governed data run through every step. Automation plus human judgement beats either alone."]}],"keyPoint":"Start with one valuable use case, define requirements before tools, invest in data quality, bring analysts with you, deploy in phases and keep improving.","plain":["Trying to do everything at once is called boiling the ocean, and nothing gets hot.","Buying tools first is like buying a car before deciding where you need to go.","A technically perfect system fails if analysts do not trust it.","Models drift as attackers change, so the work never fully ends."],"check":{"q":"Which is a classic pitfall in analytics projects?","o":["Starting with one high-value use case","Buying tools before defining requirements","Training analysts"],"a":1,"e":"Tools should follow requirements, not lead them.","retry":{"q":"What does 'boiling the ocean' mean?","o":["Trying to solve everything at once","Using too little data","Working only at night"],"a":0,"e":"Doing everything at once means nothing works well."}},"scenario":{"title":"The first project","setting":"A small company with one security analyst has budget for one analytics project this year.","steps":[{"prompt":"What is a sensible first use case?","choices":[{"t":"Automatically prioritising the vulnerability backlog","s":2,"fb":"Right. One focused, high-value use case that saves real time."},{"t":"A full AI security operations centre","s":0,"fb":"That is boiling the ocean for a one-person team."},{"t":"Whatever the vendor demo showed","s":0,"fb":"Start from your needs, not the demo."}]},{"prompt":"Six months later the model's accuracy is falling. Why, and what now?","choices":[{"t":"Threats and data have changed, so monitor and retrain","s":2,"fb":"Right. Continuous optimisation is step seven."},{"t":"The model was always bad, so scrap it","s":0,"fb":"Drift is normal and fixable."},{"t":"Ignore it, it was accurate at launch","s":0,"fb":"Attackers change, so models must keep up."}]}]},"lab":{"type":"order","title":"Design the pipeline","prompt":"Put the seven design steps in order.","items":["Requirements analysis","Data source assessment","Architecture design","Technology selection","Implementation","Phased deployment","Continuous optimisation"],"explain":"Requirements come first and tools come fourth, which avoids the most common and expensive mistake."}}],"test":[{"q":"What makes data into intelligence?","o":["Volume","Being relevant, timely and actionable","Being stored in the cloud"],"a":1,"e":"Intelligence tells someone what to do.","lesson":0},{"q":"A power cut disables MFA and a phishing attack follows. This is an example of…","o":["A threat cascade across dimensions","A single cyber threat","A regulatory fine"],"a":0,"e":"One incident touching environmental and cyber dimensions is a cascade.","lesson":1},{"q":"Which dimension covers deepfakes and AI-powered attacks?","o":["Physical","Emerging","Environmental"],"a":1,"e":"The chapter lists these as emerging threats.","lesson":1},{"q":"Which lifecycle phase agrees what the organisation needs to know?","o":["Collection","Planning and direction","Dissemination"],"a":1,"e":"Planning sets the requirements for everything else.","lesson":2},{"q":"What is TAXII?","o":["A way to exchange STIX threat data","A type of malware","A vulnerability score"],"a":0,"e":"STIX describes threats; TAXII carries them between systems.","lesson":2},{"q":"Why do security-trained NLP models beat general ones?","o":["They recognise security terms such as malware names and indicators","They are always smaller","They do not need data"],"a":0,"e":"General models miss or mislabel security entities.","lesson":3},{"q":"'Emotet drops TrickBot' is the output of which NLP step?","o":["Relationship mapping","Pre-processing","Urgency scoring"],"a":0,"e":"Relationship mapping links entities together.","lesson":3},{"q":"Which product goes to the SOC?","o":["Executive brief","Technical analysis with indicators and ATT&CK mapping","Board newsletter"],"a":1,"e":"The SOC needs indicators, rules and techniques.","lesson":4},{"q":"What is the main risk of abstractive summaries?","o":["They can state things not in the source","They are always too long","They cannot be read by people"],"a":0,"e":"So indicators must come from extraction.","lesson":4},{"q":"What is the key benefit of dark web monitoring?","o":["Early warning before an intrusion","Free threat data with no governance","Replacing patching"],"a":0,"e":"Signals can appear weeks before an attack.","lesson":5},{"q":"CVSS measures…","o":["How severe a flaw could be","How likely it is to be exploited","The cost of a patch"],"a":0,"e":"Severity is not likelihood.","lesson":6},{"q":"With P = 0.5E + 0.3B + 0.2(1 − C), which term carries the most weight?","o":["Exploit likelihood, E","Business impact, B","Patch complexity, C"],"a":0,"e":"E carries half the weight.","lesson":6},{"q":"If 95 per cent of CVEs are never exploited, a model that always says 'safe' is…","o":["95 per cent accurate and useless","Excellent","Always wrong"],"a":0,"e":"Accuracy hides class imbalance, so use precision, recall and AUC.","lesson":6},{"q":"Which forecasting method is fastest and simplest?","o":["Exponential smoothing","LSTM network","Ensemble"],"a":0,"e":"It is quick, cheap and handles seasons.","lesson":7},{"q":"Removing which kind of node can cut an attack chain?","o":["A high-betweenness bridge","Any leaf node","The node with the longest name"],"a":0,"e":"Bridges sit on the paths between groups.","lesson":8},{"q":"Which correlation links several alerts from the same subnet?","o":["Spatial","Temporal","Logical"],"a":0,"e":"Location links them, so it is spatial.","lesson":9},{"q":"Which open-source TIP is built around a knowledge graph?","o":["OpenCTI","YETI","Kafka"],"a":0,"e":"OpenCTI uses a knowledge graph with native STIX 2.1.","lesson":10},{"q":"In the seven-step framework, when is technology selected?","o":["After requirements, data assessment and architecture design","First","Never"],"a":0,"e":"Tools follow needs.","lesson":11}]};
