/* Chapter 1: Modern Threat Landscape and AI Opportunities (Guide to AI for Cybersecurity) */
const CH = {"id":"ch01","num":"1","title":"Modern Threat Landscape and AI Opportunities","summary":"Why AI has become essential to cyber security: how threats evolved, where traditional defences break, the DRPP framework, AI-specific risks, the business case, ethics and a roadmap for getting started.","outcomes":["Describe how cyber threats evolved from simple attacks to nation-state and AI-enhanced operations","Explain where perimeter, signature and rule-based defences break down","Classify AI security applications with the DRPP framework","Identify traditional and AI-specific risks in an AI security system","Outline a business case for AI security, including costs, benefits and strategic value","Explain the ethical requirements and the four-phase roadmap for adopting AI in security"],"starter":[{"q":"A brand-new attack nobody has seen before meets a signature-based antivirus. What usually happens?","o":["It is blocked instantly","All files are deleted","It slips past, because there is no known fingerprint"],"a":2,"e":""},{"q":"Which best describes the role of AI in cyber security?","o":["It helps teams handle more data and spot new threats, under human oversight","It replaces security teams entirely","It only works for email"],"a":0,"e":""},{"q":"When should ethics be considered in an AI security project?","o":["After the system is live","From the very start, as a requirement","Only if there is a complaint"],"a":1,"e":""}],"lessons":[{"title":"Why the threat landscape matters","minutes":3,"slides":[{"scene":{"type":"bars","title":"The yearly cost of cybercrime, as reported in the chapter","scale":0.34,"bars":[{"id":"c15","label":"Cost in 2015\n($ trillion)","v":3,"c":"amber","p":[-2.2,0]},{"id":"c25","label":"Projected for 2025\n($ trillion)","v":10.5,"c":"red","p":[2.2,0]}],"steps":["all","all",["c15"],["c25"],"all","all"]},"say":["Welcome to Chapter 1, Modern Threat Landscape and AI Opportunities, and I'm Sam, your tutor.","This chapter explains why artificial intelligence, or AI, has become essential to modern cyber security.","Let's start with money, because the chapter reports that cybercrime cost the world about three trillion dollars a year in 2015.","It also quotes a projection that the yearly cost would reach ten and a half trillion dollars by 2025.","Put another way, the chapter says that if cybercrime were a country, it would be the third largest economy in the world.","These figures are estimates and forecasts, so treat them as a sense of scale rather than exact counts."]},{"scene":{"type":"graph","title":"More attacks, too few people","nodes":[{"id":"att","label":"About 2,200\nattacks a day","p":[-4.4,1.0,0],"c":"red","shape":"ico","size":1.0},{"id":"jobs","label":"3.5 million unfilled\nsecurity jobs","p":[4.4,1.0,0],"c":"amber","shape":"box","size":0.9},{"id":"team","label":"Security\nteam","p":[0,-0.6,1.2],"c":"cyan","shape":"shield","size":1.0},{"id":"ai","label":"AI support","p":[0,2.6,-1.2],"c":"green","shape":"sphere","size":0.9}],"links":[["att","team",2,"red"],["jobs","team"],["ai","team",1,"green"]],"steps":[["att"],["jobs"],["att","jobs","team"],["ai","team"],"all"]},"say":["The chapter also reports around 2,200 cyberattacks every day across the world.","At the same time, it counts about three and a half million unfilled cyber security jobs.","So there are a great many attacks, and not enough skilled people to deal with them.","That gap is where AI can help, by taking on routine work so that people can focus on what matters most.","In this chapter you will trace how threats evolved, see where older defences break, and learn how to use AI with a clear business case, an eye on risk and ethics, and a plan."]}],"keyPoint":"The chapter reports a very large and growing cost of cybercrime, frequent attacks and a shortage of skilled people. That gap is why AI has become essential to cyber security.","plain":["Cybercrime is big business: the chapter compares it to the third largest economy on Earth.","Forecasts give a sense of scale, like a weather forecast, not a precise measurement.","There are more attacks than there are trained people to stop them.","AI is like extra pairs of hands that take on the routine work."],"check":{"q":"According to the chapter, what makes AI essential in cyber security today?","o":["AI is cheaper than any other tool","Attacks have stopped growing","Attacks are frequent and costly, and there are not enough skilled people"],"a":2,"e":"The chapter points to the rising cost of cybercrime, frequent attacks and millions of unfilled security jobs.","retry":{"q":"If there are too many attacks and too few experts, what can AI do?","o":["Take on routine work so people can focus on what matters most","Remove the need for any experts","Stop all attacks by itself"],"a":0,"e":"AI extends what a team can do, but people still lead."}},"scenario":{"title":"The board briefing","setting":"You have five minutes at a board meeting of a medium-sized company to explain why cyber security needs more attention this year.","steps":[{"prompt":"How do you use the chapter's headline figures?","choices":[{"t":"Quote them as exact, current facts","s":0,"fb":"Several are forecasts or estimates, so present them as a sense of scale."},{"t":"Use them to show the scale of the problem, saying where they come from and that some are forecasts","s":2,"fb":"Right. Honest framing builds trust with a board."},{"t":"Leave out numbers altogether","s":1,"fb":"Possible, but a sense of scale helps the board understand the stakes."}]},{"prompt":"A director asks why you can't just hire more analysts. What do you say?","choices":[{"t":"We can, so AI is unnecessary","s":0,"fb":"The chapter reports millions of unfilled security jobs, so hiring alone is hard."},{"t":"Skilled people are scarce, so AI can take routine work and let our analysts focus on what matters","s":2,"fb":"Right. AI extends the team rather than replacing it."},{"t":"Analysts are no longer needed","s":0,"fb":"The chapter keeps people in charge."}]}]}},{"title":"Four generations of cyber threats","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four generations of cyber threats","nodes":[{"id":"g1","label":"1980s to 1990s:\nscript kiddies","p":[-5.25,0,-0.7],"c":"slate","shape":"box","size":1,"ly":1.3},{"id":"g2","label":"1995 to 2005:\norganised crime","p":[-1.75,0,0.7],"c":"amber","shape":"box","size":1,"ly":1.3},{"id":"g3","label":"2005 to 2015:\nnation-state APTs","p":[1.75,0,-0.7],"c":"red","shape":"shield","size":1,"ly":1.3},{"id":"g4","label":"2015 onwards:\nAI-enhanced attacks","p":[5.25,0,0.7],"c":"violet","shape":"ico","size":1,"ly":1.3}],"links":[["g1","g2"],["g2","g3"],["g3","g4"]],"steps":["all",["g1"],["g2"],["g3"],["g3"],["g4"],"all"]},"say":["Cyber threats have changed a great deal, and the chapter describes four generations.","From the 1980s to the 1990s, the first generation was script kiddies, individual hackers spreading simple viruses and worms mainly to make a name for themselves.","From about 1995 to 2005, organised crime moved in, driven by money and using trojans, rootkits and code that keeps changing its shape, all traded in underground markets.","From about 2005 to 2015 came nation-state attacks, known as advanced persistent threats or APTs, which are long, patient campaigns.","The chapter's examples include Stuxnet, Aurora and APT1, and this generation saw attacks that damaged physical infrastructure.","From 2015 to the present, the fourth generation uses AI itself as a weapon.","Each generation is more organised and more capable than the one before."]},{"scene":{"type":"graph","title":"The fourth generation: attackers use AI","nodes":[{"id":"core","label":"AI-enhanced\nattacks","p":[0,-0.2,1.2],"c":"red","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"weap","label":"Weaponised\nAI and ML","p":[-4.55,1.25,-1.98],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"vuln","label":"Automated\nweakness search","p":[-1.8,1.65,-2.24],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"adapt","label":"Adaptive\nmalware","p":[1.8,1.65,-2.24],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"fake","label":"Deepfakes","p":[4.55,1.25,-1.98],"c":"pink","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["core","weap"],["core","vuln"],["core","adapt"],["core","fake"]],"steps":["all",["core","weap"],["vuln"],["adapt"],["fake"],"all"]},"say":["Let's look more closely at the fourth generation.","Attackers now turn AI and machine learning, the branch of AI that learns patterns from data, into weapons.","AI can search software for weaknesses automatically, instead of a person hunting by hand.","Adaptive malware changes its behaviour to suit its surroundings and avoid being caught.","Deepfakes are convincing fake audio, images or video that can be used to trick people.","This is why the chapter argues that defenders urgently need AI of their own."]}],"keyPoint":"Threats have moved from lone hobbyists, to organised crime, to nation-state campaigns, and now to attacks that use AI. Each generation is more organised and capable than the last.","plain":["Script kiddies were like graffiti artists: after attention more than money.","Organised crime turned hacking into a business with its own black markets.","Nation-state attacks are patient and long-running, and can even damage physical systems.","Today attackers use AI, so defenders need AI too."],"check":{"q":"Which generation is defined by automated weakness discovery and adaptive malware?","o":["The fourth generation, AI-enhanced attacks","The first generation, script kiddies","The second generation, organised crime"],"a":0,"e":"The fourth generation, from 2015 to the present, uses AI and machine learning as weapons.","retry":{"q":"Stuxnet and APT1 are examples from which generation?","o":["Organised crime","AI-enhanced attacks","Nation-state advanced persistent threats"],"a":2,"e":"The chapter lists Stuxnet, Aurora and APT1 under the third generation, from about 2005 to 2015."}},"scenario":{"title":"Reading a threat report","setting":"Your team is reviewing three incidents from the past year to decide which generation of threat each one belongs to.","steps":[{"prompt":"One incident was a long, quiet campaign against a power supplier, linked to a foreign government. Which generation fits best?","choices":[{"t":"Script kiddies","s":0,"fb":"Script kiddies used simple tools and sought attention."},{"t":"Organised crime","s":1,"fb":"Possible, but long campaigns against infrastructure linked to a government fit the third generation."},{"t":"Nation-state advanced persistent threats","s":2,"fb":"Right. Persistent campaigns and infrastructure damage mark the third generation."}]},{"prompt":"Another used a convincing fake voice of your finance director to request a payment. Which generation fits?","choices":[{"t":"AI-enhanced attacks, using a deepfake","s":2,"fb":"Right. Deepfakes are part of the fourth generation."},{"t":"Script kiddies","s":0,"fb":"This needed far more than simple tools."},{"t":"It is not a cyber threat","s":0,"fb":"Deepfakes are a recognised AI-enhanced threat."}]},{"prompt":"What does this mix of incidents tell you?","choices":[{"t":"Only the newest threats matter now","s":0,"fb":"Older kinds of attack still happen."},{"t":"Threats keep evolving, so defences must evolve too, including using AI","s":2,"fb":"Right. That is the chapter's central argument."},{"t":"Nothing useful","s":0,"fb":"Seeing how threats evolve helps plan defences."}]}]},"lab":{"type":"order","title":"Put the generations in order","prompt":"Put the four generations of cyber threats in the order they appeared.","items":["Script kiddies: simple viruses and worms","Organised crime: trojans, rootkits and underground markets","Nation-state APTs: long, persistent campaigns","AI-enhanced attacks: adaptive malware and deepfakes"],"explain":"Each generation built on the last, becoming more organised and more capable."}},{"title":"Where traditional security breaks","minutes":3,"slides":[{"scene":{"type":"graph","title":"Where traditional security is breaking","nodes":[{"id":"core","label":"Traditional\nsecurity","p":[0,-0.2,1.2],"c":"slate","shape":"box","size":1.3,"ly":1.75,"spin":true},{"id":"per","label":"Perimeter\ndefence","p":[-4.55,1.25,-1.98],"c":"amber","shape":"shield","size":0.8,"ly":1.15,"ls":0.72},{"id":"sig","label":"Signature-based\ndetection","p":[-1.8,1.65,-2.24],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"rule","label":"Rule-based\nsystems","p":[1.8,1.65,-2.24],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"fp","label":"A quarter of time\non false alarms","p":[4.55,1.25,-1.98],"c":"pink","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72}],"links":[["core","per"],["core","sig"],["core","rule"],["core","fp"]],"steps":["all",["core","per"],["per"],["sig"],["rule"],["rule","fp"],["fp"]]},"say":["Traditional security rests on three ideas, and the chapter shows where each one is breaking.","Perimeter defence means guarding the edge of the office network, like a wall around a castle.","Cloud computing, mobile devices, internet-connected gadgets and remote working have dissolved that edge, so there is no single wall left to guard.","Signature-based detection matches files against fingerprints of known threats, so it cannot spot brand-new attacks, which are called zero-day attacks.","Rule-based systems follow fixed rules written by people, and those rules cannot adapt to new attack methods.","Static rules also raise many false alarms, which are called false positives.","The chapter reports that security analysts spend about a quarter of their time investigating false positives."]}],"keyPoint":"Three traditional defences are under strain: the network edge has dissolved, signatures miss new attacks, and fixed rules cannot adapt and raise many false alarms.","plain":["A perimeter is like a castle wall, but staff now work everywhere, outside the wall.","A signature is like a 'wanted' poster: it only works for criminals already known.","A zero-day attack is one nobody has seen before, so no poster exists yet.","Too many false alarms is like a smoke alarm that goes off every time you make toast."],"check":{"q":"Why has perimeter defence become weaker?","o":["Firewalls have become illegal","Cloud, mobile devices, connected gadgets and remote work have dissolved the network edge","Attackers no longer use networks"],"a":1,"e":"When people and data are everywhere, there is no single edge to guard.","retry":{"q":"A tool can only stop attacks it has a fingerprint for. Which breaking point is this?","o":["Perimeter defence","Rule-based systems","Signature-based detection"],"a":2,"e":"Signature-based detection needs a known fingerprint, so zero-day attacks pass."}},"scenario":{"title":"The overwhelmed analyst","setting":"Priya is the only security analyst at a growing firm. Most staff now work from home using cloud apps, and her alert system raises hundreds of alerts a day from fixed rules.","steps":[{"prompt":"Priya spends much of her day clearing alerts that turn out to be harmless. What is the underlying problem?","choices":[{"t":"She is working too slowly","s":0,"fb":"The problem is the alerts, not her speed."},{"t":"Static rules raise many false positives and cannot adapt","s":2,"fb":"Right. The chapter reports analysts spend about a quarter of their time on false positives."},{"t":"There are too few alerts","s":0,"fb":"There are too many, and most are false."}]},{"prompt":"Her manager suggests a stronger office firewall as the main fix. Is that enough?","choices":[{"t":"Yes, the firewall protects everyone","s":0,"fb":"Staff are working outside the office edge."},{"t":"It may help a little, but with home working and cloud apps the edge has dissolved","s":2,"fb":"Right. Perimeter defence alone no longer fits how people work."},{"t":"Only if it is very expensive","s":1,"fb":"Cost does not fix the underlying problem."}]}]},"lab":{"type":"spot","title":"Spot the breaking points","prompt":"Here is a summary of a company's security set-up. Click the parts that rely on a defence the chapter says is breaking.","parts":[{"lbl":"Network","t":"A firewall at the office edge is our main defence","bad":true,"why":"Perimeter defence: with cloud and remote work there is no single edge to guard."},{"lbl":"Staff","t":"Most staff work from home and use cloud apps","bad":false,"why":"This is normal today; the problem is a defence that assumes everyone is inside the office."},{"lbl":"Malware","t":"Antivirus that only matches known signatures","bad":true,"why":"Signature-only detection cannot spot zero-day attacks."},{"lbl":"Alerts","t":"Fixed rules written five years ago and never updated","bad":true,"why":"Static rules cannot adapt to new attack methods."},{"lbl":"Analysts","t":"The team spends hours each day clearing false alarms","bad":true,"why":"A sign of rule-based systems raising many false positives."},{"lbl":"Training","t":"Staff complete security awareness training each year","bad":false,"why":"Nothing in the chapter marks this as a breaking point."}],"explain":"Each warning sign matches one of the chapter's three breaking points: the perimeter, signatures and fixed rules."}},{"title":"The signature detection crisis","minutes":3,"slides":[{"scene":{"type":"flood","title":"Known threats are stopped; new and disguised ones slip through","wallLabel":"Signature filter","steps":[{"rate":8},{"rate":8},{"rate":8,"novel":true},{"rate":14,"novel":true},{"rate":14,"novel":true},{"rate":8,"novel":true}]},"say":["The chapter describes a crisis in signature detection, because attackers have learned to dodge it.","Known threats with a matching fingerprint are still stopped at the filter, shown here as red blocks.","But new and disguised threats, shown in purple, slip straight through.","The chapter reports that attackers can turn a newly published weakness into a working attack in about 22 minutes.","That leaves a time gap in which no signature exists yet.","It also reports that the chance of a cybercriminal being detected and prosecuted is tiny, around five hundredths of one per cent."]},{"scene":{"type":"graph","title":"Five ways attackers dodge signatures","nodes":[{"id":"core","label":"Evasion\ntechniques","p":[0,-0.2,1.2],"c":"red","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"poly","label":"Polymorphic:\nnew look","p":[-4.55,1.25,-1.98],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"meta","label":"Metamorphic:\nfull rewrite","p":[-2.62,1.58,-2.2],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"fileless","label":"Fileless:\nno file to scan","p":[0.0,1.7,-2.28],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"aigen","label":"AI-generated\nvariants","p":[2.63,1.58,-2.2],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"lotl","label":"Living off\nthe land","p":[4.55,1.25,-1.98],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["core","poly"],["core","meta"],["core","fileless"],["core","aigen"],["core","lotl"]],"steps":["all",["poly"],["meta"],["fileless"],["aigen"],["lotl"],"all",["core"]]},"say":["The chapter names five evasion techniques.","Polymorphic malware changes how its code looks while still doing the same thing.","Metamorphic malware goes further, completely rewriting its code each time it infects a machine.","Fileless attacks use legitimate tools already on the computer, so there is no suspicious file to scan.","With AI, attackers can generate variants of malware and systematically test them against detection systems.","Living off the land means using normal system processes to do harmful things, so the activity blends in.","Each technique defeats the idea of matching a fixed fingerprint.","Even so, signatures still have value as one layer among several, because they stop known threats quickly."]}],"keyPoint":"Attackers change their code, avoid files altogether or hide in normal processes, so fixed fingerprints miss them. Signatures still help as one layer, but they are not enough alone.","plain":["Polymorphic malware is a burglar in a new disguise; metamorphic malware is a completely new burglar each time.","Fileless attacks borrow the house's own tools, so there is nothing new to find.","Living off the land means hiding in everyday activity.","Signatures are still worth keeping, as one lock among several."],"check":{"q":"Which technique uses legitimate tools already on the computer, leaving no suspicious file to scan?","o":["Polymorphic malware","Metamorphic malware","Fileless attacks"],"a":2,"e":"Fileless attacks rely on tools that are already there, so a file scanner has nothing to match.","retry":{"q":"Malware that completely rewrites its code with each infection is called…","o":["Metamorphic","Polymorphic","Fileless"],"a":0,"e":"Metamorphic malware rewrites itself fully; polymorphic malware changes its look but keeps doing the same thing."}},"scenario":{"title":"The clean scan","setting":"After a suspicious night of activity on a server, your antivirus scan comes back completely clean. Logs show built-in system tools were used at 2 am to copy data out.","steps":[{"prompt":"Does the clean scan prove the server is safe?","choices":[{"t":"Yes, the antivirus found nothing","s":0,"fb":"A signature scan cannot see attacks that use legitimate tools."},{"t":"No, this looks like living off the land or a fileless attack, which signatures miss","s":2,"fb":"Right. Normal tools used for harm leave no file fingerprint."},{"t":"Only if the scan is run twice","s":0,"fb":"Running the same check again will not change the result."}]},{"prompt":"Someone suggests removing the antivirus because it 'doesn't work'. What do you say?","choices":[{"t":"Agreed, signatures are obsolete","s":0,"fb":"The instructor notes warn against this misconception."},{"t":"Keep it as one layer, because it still stops known threats, and add behaviour-based detection","s":2,"fb":"Right. Signatures still have value in layered security."},{"t":"Replace it with a stricter firewall","s":1,"fb":"A firewall helps, but does not address this kind of attack."}]}]},"lab":{"type":"sort","title":"Caught or missed?","prompt":"Would a signature-only scanner be likely to catch each of these?","buckets":["Likely caught by a signature","Likely to slip past"],"items":[{"t":"An exact copy of a well-known virus","b":0},{"t":"Malware that changes how its code looks each time","b":1,"why":"polymorphic code has no stable fingerprint"},{"t":"Malware that fully rewrites itself on every infection","b":1},{"t":"An attack run entirely with built-in system tools","b":1,"why":"there is no malicious file to match"},{"t":"A virus whose fingerprint was added to the list last year","b":0},{"t":"An attack using a weakness published 22 minutes ago","b":1,"why":"no signature exists yet"}],"explain":"Signatures catch what is known and unchanged; disguised, fileless and brand-new attacks slip past."}},{"title":"AI as a force multiplier","minutes":3,"slides":[{"scene":{"type":"flood","title":"AI as a force multiplier: catching what signatures miss","wallLabel":"Signature filter","mlLabel":"AI detection","steps":[{"rate":8,"novel":true},{"rate":16,"novel":true,"ml":true},{"rate":16,"novel":true,"ml":true},{"rate":16,"novel":true,"ml":true},{"rate":16,"novel":true,"ml":true},{"rate":20,"novel":true,"ml":true}]},"say":["AI changes the picture, and the chapter calls it a force multiplier, meaning it lets a team achieve far more than its size suggests.","AI can process terabytes of security data every day, far more than people could read.","It can find patterns that are invisible to human analysis, so threats that slip past signatures can be flagged.","It adapts to new attack patterns automatically and can help predict where future attacks may come from.","It automates routine security tasks and keeps hunting for threats around the clock.","In short, it scales analysis beyond what people alone can manage."]},{"scene":{"type":"graph","title":"From traditional to AI-enhanced security","nodes":[{"id":"trad","label":"Traditional:\nreactive, manual","p":[-4.4,1.4,0],"c":"slate","shape":"box","size":1.0},{"id":"ai","label":"AI-enhanced:\nproactive, adaptive","p":[1.6,1.4,0],"c":"cyan","shape":"ico","size":1.1},{"id":"fw","label":"Existing tools\nand frameworks","p":[5.0,-0.4,0.8],"c":"violet","shape":"cyl","size":0.9},{"id":"hum","label":"Human\noversight","p":[-1.4,-0.6,1.4],"c":"green","shape":"shield","size":0.9}],"links":[["trad","ai"],["ai","fw",1,"violet"],["hum","ai",1,"green"]],"steps":["all",["trad"],["ai"],["ai"],["ai","fw"],["hum","ai"]]},"say":["The chapter contrasts two styles of security.","Traditional security is reactive, relying on signatures, manual analysis and static rules, and it struggles to scale.","AI-enhanced security is proactive, looking at behaviour, automating analysis and adapting as threats change.","But AI is not a silver bullet that solves every security problem on its own.","It works best when it is built into existing security tools and frameworks rather than replacing them wholesale.","And people stay in charge, because AI needs human oversight."]}],"keyPoint":"AI multiplies what a security team can do: more data, hidden patterns, constant watch and automation. It works best alongside existing tools and under human oversight, not as a silver bullet.","plain":["A force multiplier is like giving a small team power tools.","Reactive means waiting for the fire; proactive means checking for smoke.","AI adds to the tools you have; it does not throw them away.","People still make the important decisions."],"check":{"q":"What does the chapter mean by calling AI a force multiplier?","o":["It lets a security team achieve far more than its size suggests","It doubles the number of attacks","It replaces the security team"],"a":0,"e":"AI scales analysis, finds hidden patterns and automates routine work, so the team can do more.","retry":{"q":"Which statement matches the chapter's view of AI?","o":["AI solves every security problem on its own","AI works best alongside existing tools, with human oversight","AI should replace all existing security tools"],"a":1,"e":"The chapter recommends integration rather than wholesale replacement, and the instructor notes warn against seeing AI as a silver bullet."}},"scenario":{"title":"The vendor pitch","setting":"A vendor tells your IT director their AI product will 'replace your whole security stack and your analysts, and stop every attack'.","steps":[{"prompt":"How should you respond to the claim that it will stop every attack?","choices":[{"t":"Be sceptical, because AI is not a silver bullet","s":2,"fb":"Right. The instructor notes warn against this misconception."},{"t":"Accept it, since AI is very powerful","s":0,"fb":"No tool stops every attack."},{"t":"Ask for a bigger discount","s":1,"fb":"That may be useful, but it does not test the claim."}]},{"prompt":"What is the better way to bring AI in?","choices":[{"t":"Rip out existing tools on day one","s":0,"fb":"The chapter favours integration over wholesale replacement."},{"t":"Use it only for email","s":0,"fb":"AI has many uses across security."},{"t":"Integrate it with existing tools and frameworks, with analysts overseeing it","s":2,"fb":"Right. Integration plus human oversight."}]}]},"lab":{"type":"sort","title":"Traditional or AI-enhanced?","prompt":"Does each description fit traditional or AI-enhanced security?","buckets":["Traditional","AI-enhanced"],"items":[{"t":"Waits for a threat to be known before reacting","b":0},{"t":"Learns what normal behaviour looks like and flags changes","b":1},{"t":"An analyst reads every log by hand","b":0},{"t":"Hunts for threats around the clock","b":1},{"t":"A fixed rule list updated now and then","b":0,"why":"static rules are a traditional approach"},{"t":"Adapts automatically as attack patterns change","b":1}],"explain":"Traditional security is reactive and manual; AI-enhanced security is proactive, behaviour-based and adaptive."}},{"title":"The DRPP framework","minutes":3,"slides":[{"scene":{"type":"graph","title":"The DRPP framework: four domains of AI security","nodes":[{"id":"core","label":"AI security\napplications","p":[0,0.9,0.6],"c":"white","shape":"ico","size":1.0,"spin":true},{"id":"det","label":"Detection","p":[-4.2,2.4,-0.6],"c":"cyan","shape":"box","size":1.0},{"id":"resp","label":"Response","p":[4.2,2.4,-0.6],"c":"amber","shape":"shield","size":1.0},{"id":"pred","label":"Prediction","p":[-4.2,-0.6,0.8],"c":"violet","shape":"sphere","size":1.0},{"id":"prev","label":"Prevention","p":[4.2,-0.6,0.8],"c":"green","shape":"shield","size":1.0}],"links":[["core","det"],["core","resp"],["core","pred"],["core","prev"]],"steps":["all",["det","resp","pred","prev"],["det"],["det"],["resp"],["pred"],["prev"],"all"]},"say":["To make sense of the many ways AI can help, the chapter introduces the DRPP framework.","DRPP stands for Detection, Response, Prediction and Prevention, four families of AI security applications.","Detection finds threats, through malware detection, spotting unusual activity and analysing behaviour.","It uses supervised learning, which learns from labelled examples, and unsupervised learning, which finds patterns without labels.","Response acts on threats through automated containment, coordinated incident handling and adaptive workflows, often using SOAR platforms, which stands for security orchestration, automation and response.","Prediction looks ahead, analysing threat intelligence, forecasting weaknesses and assessing risk.","Prevention stops attacks before they land, through proactive threat hunting, adaptive access control and automated patching.","Together the four domains give a simple map for classifying any AI security tool."]}],"keyPoint":"DRPP sorts AI security applications into Detection (find threats), Response (act on them), Prediction (look ahead) and Prevention (stop them before they land).","plain":["Detection is the smoke alarm.","Response is the sprinkler system and the fire crew.","Prediction is the weather forecast that warns of a dry, windy week.","Prevention is clearing away the dry brush before a fire can start."],"check":{"q":"A tool forecasts which systems are most likely to be attacked next month. Which DRPP domain is this?","o":["Detection","Prediction","Response"],"a":1,"e":"Forecasting likely security events is the Prediction domain.","retry":{"q":"Automatically isolating an infected laptop belongs to which domain?","o":["Prevention","Prediction","Response"],"a":2,"e":"Automated containment is part of Response."}},"scenario":{"title":"Mapping a hospital's AI plans","setting":"A hospital's IT team has a list of AI security ideas and asks you to classify them with DRPP so they can spot gaps.","steps":[{"prompt":"A tool flags unusual access to patient records. Which domain?","choices":[{"t":"Prevention","s":1,"fb":"It may lead to prevention, but flagging unusual activity is Detection."},{"t":"Detection","s":2,"fb":"Right. Spotting unusual activity is a Detection application."},{"t":"Response","s":0,"fb":"Nothing is being acted on yet."}]},{"prompt":"Another automatically applies security patches overnight. Which domain?","choices":[{"t":"Prevention","s":2,"fb":"Right. Automated patching is listed under Prevention."},{"t":"Prediction","s":0,"fb":"Patching acts before an attack; it does not forecast."},{"t":"Detection","s":0,"fb":"Nothing is being detected."}]},{"prompt":"Their list has many Detection tools but nothing for Response. Why does DRPP help here?","choices":[{"t":"It shows a gap: threats may be found but not acted on quickly","s":2,"fb":"Right. Classifying with DRPP reveals missing domains."},{"t":"It shows they should only buy Detection tools","s":0,"fb":"A balanced plan covers all four domains."},{"t":"It does not help","s":0,"fb":"Spotting gaps is exactly what a framework is for."}]}]},"lab":{"type":"sort","title":"Classify with DRPP","prompt":"Place each AI application in its DRPP domain.","buckets":["Detection","Response","Prediction","Prevention"],"items":[{"t":"Flag a file as malware from its behaviour","b":0},{"t":"Spot unusual logins at 3 am","b":0},{"t":"Isolate an infected laptop automatically","b":1},{"t":"Co-ordinate incident steps through a SOAR platform","b":1},{"t":"Forecast which systems are likely to be targeted","b":2},{"t":"Analyse threat intelligence to assess risk","b":2},{"t":"Patch a weakness automatically before it is exploited","b":3},{"t":"Tighten access when a login looks risky","b":3,"why":"adaptive access control is a Prevention measure"}],"explain":"Detection finds, Response acts, Prediction looks ahead and Prevention stops attacks before they land."}},{"title":"AI-specific risks","minutes":3,"slides":[{"scene":{"type":"graph","title":"Five risks that are specific to AI","nodes":[{"id":"core","label":"AI security\nsystem","p":[0,-0.2,1.2],"c":"cyan","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"bias","label":"Algorithmic\nbias","p":[-4.55,1.25,-1.98],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"adv","label":"Adversarial\nattacks","p":[-2.62,1.58,-2.2],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"box","label":"Black box\ndecisions","p":[0.0,1.7,-2.28],"c":"slate","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"pois","label":"Data\npoisoning","p":[2.63,1.58,-2.2],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"priv","label":"Privacy\ninference","p":[4.55,1.25,-1.98],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["core","bias"],["core","adv"],["core","box"],["core","pois"],["core","priv"]],"steps":[["core"],"all",["bias"],["adv"],["box"],["pois"],["priv"],"all"]},"say":["Using AI in security brings all the usual risks, such as system weaknesses, network breaches, data theft, compliance penalties, downtime and damage to finances or reputation.","But the chapter adds five risks that are specific to AI.","Algorithmic bias means the AI makes unfair or discriminatory security decisions about certain people.","Adversarial attacks feed the AI carefully crafted inputs designed to deceive it.","Model interpretability is the black box problem, where the AI makes decisions without explaining why.","Data poisoning means contaminating the training data, so the model learns the wrong lessons.","Privacy inference is when AI analysis unintentionally reveals personal information.","A full risk assessment covers both the traditional risks and these AI-specific ones."]},{"scene":{"type":"curve","title":"AI gives likelihoods, not certainties","normalLabel":"Scores for normal activity","steps":[2.5,2.5,2.5,1.4,3.2,2.3]},"say":["There is one more difference, because AI security systems are probabilistic, meaning they give a likelihood rather than a firm yes or no.","Picture the scores an AI gives to normal activity, with most events in the middle and a few unusual ones out at the edge.","Someone has to choose the point at which a score becomes an alert.","Set it low and you get more alerts, along with more false alarms.","Set it high and alerts are rare, but real attacks may be missed.","That is why the chapter says AI needs new approaches to risk assessment and to measuring performance."]}],"keyPoint":"AI brings new risks: bias, adversarial attacks, black box decisions, data poisoning and privacy inference. Because AI gives likelihoods, not certainties, risk and performance must be judged in new ways.","plain":["Bias is like a guard who is more suspicious of some people for no good reason.","An adversarial attack is an optical illusion designed for a machine.","Data poisoning is like slipping wrong answers into a student's textbook.","A probability is a weather forecast: 'seventy per cent chance of rain' is not a promise."],"check":{"q":"Carefully crafted inputs designed to deceive an AI system are called…","o":["Data poisoning","Algorithmic bias","Adversarial attacks"],"a":2,"e":"Adversarial attacks trick a trained model with specially crafted inputs. Poisoning corrupts the training data instead.","retry":{"q":"Which risk involves contaminating the data an AI learns from?","o":["Data poisoning","Privacy inference","Black box decisions"],"a":0,"e":"Data poisoning compromises the model's integrity by corrupting its training data."}},"scenario":{"title":"Assessing a new AI tool","setting":"Your organisation is about to adopt an AI tool that scores staff logins for risk. You are asked to write its risk assessment.","steps":[{"prompt":"What should the risk assessment cover?","choices":[{"t":"Only traditional risks such as breaches and downtime","s":1,"fb":"Those matter, but the AI-specific risks would be missing."},{"t":"Only the AI-specific risks","s":0,"fb":"Traditional risks still apply to an AI system."},{"t":"Both traditional risks and AI-specific risks such as bias, poisoning and black box decisions","s":2,"fb":"Right. The chapter's exercise solution expects both."}]},{"prompt":"Testing shows the tool flags staff on one site far more often, with no real difference in behaviour. Which risk is this?","choices":[{"t":"Algorithmic bias","s":2,"fb":"Right. Unfair treatment of a group is algorithmic bias."},{"t":"Adversarial attack","s":0,"fb":"Nobody is feeding it crafted inputs."},{"t":"Privacy inference","s":0,"fb":"This is about unfair decisions, not revealing personal data."}]},{"prompt":"The vendor quotes '98 per cent accurate' and nothing else. What do you ask?","choices":[{"t":"Nothing, that sounds excellent","s":0,"fb":"AI gives likelihoods, so you need to know how alerts are set and what is missed."},{"t":"How the alert threshold is set, how many attacks are missed and how many false alarms it raises","s":2,"fb":"Right. Probabilistic systems need new ways to measure performance."},{"t":"Which colour the dashboard is","s":0,"fb":"That does not tell you about risk."}]}]},"lab":{"type":"threshold","title":"Choose where to raise an alert","attacks":50,"normal":950,"start":25,"prompt":"The AI gives every event a score. Move the alert threshold to find a good balance between catching attacks and avoiding false alarms.","explain":"Because AI gives likelihoods rather than certainties, someone must choose the trade-off, and that choice is part of the risk assessment."}},{"title":"Building the business case","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three parts of a business case","cam":[0,4.4,13],"nodes":[{"id":"direct","label":"Direct costs:\nlicences, hardware","p":[-4.6,2.4,-0.4],"c":"red","shape":"box","size":0.8},{"id":"indirect","label":"Indirect costs:\ntraining, change","p":[-4.6,-0.4,0.6],"c":"amber","shape":"box","size":0.8},{"id":"avoid","label":"Cost avoidance:\nlower breach costs","p":[0,2.4,-0.4],"c":"green","shape":"cyl","size":0.8},{"id":"eff","label":"Efficiency:\nfewer false alarms","p":[0,-0.4,0.6],"c":"green","shape":"cyl","size":0.8},{"id":"comp","label":"Competitive\nadvantage","p":[4.6,2.4,-0.4],"c":"violet","shape":"sphere","size":0.8},{"id":"reg","label":"Regulatory\ncompliance","p":[4.6,-0.4,0.6],"c":"violet","shape":"shield","size":0.8}],"links":[["direct","indirect"],["avoid","eff"],["comp","reg"]],"steps":["all",["direct"],["indirect"],["avoid"],["eff"],["comp","reg"],["avoid","eff","comp","reg"]]},"say":["Security leaders have to persuade boards to pay for AI, and that needs a business case.","Direct costs include software licences, hardware and the services needed to set the system up.","Indirect costs include staff training, managing organisational change and any disruption to the business.","On the benefits side, cost avoidance means lower costs for fixing breaches and responding to incidents.","Efficiency gains come from automated threat detection and fewer false positives.","Strategic value adds a competitive advantage through stronger security and faster responses, and helps meet demanding regulations.","The chapter stresses that the business value of AI security goes well beyond avoiding costs."]},{"scene":{"type":"graph","title":"Estimating the return on investment","nodes":[{"id":"now","label":"Expected yearly\nloss today","p":[-4.6,1.2,0],"c":"red","shape":"cyl","size":1.2},{"id":"with","label":"Expected yearly\nloss with AI","p":[-1.4,1.2,0.6],"c":"green","shape":"cyl","size":0.8},{"id":"cost","label":"Full cost of\nthe AI system","p":[1.8,1.2,0.6],"c":"amber","shape":"box","size":0.9},{"id":"roi","label":"Return on\ninvestment","p":[4.8,1.2,0],"c":"violet","shape":"sphere","size":1.0}],"links":[["now","with"],["with","cost"],["cost","roi"]],"steps":["all",["now"],["with"],["now","with","cost","roi"],"all"]},"say":["For scale, the chapter gives an average data breach cost of about four point nine million dollars in 2024, and global security spending of about 212 billion dollars in 2025.","A common starting point is the annualised loss expectancy, or ALE, which is the expected yearly cost of security incidents without the proposed controls.","You then estimate the expected yearly loss with the AI in place.","The fall in expected loss, set against the full cost of the AI system, is the heart of the return on investment, or ROI.","Be careful, because it is hard to put a number on attacks that never happened or on benefits such as reputation, so ROI figures are always estimates."]}],"keyPoint":"A business case weighs direct and indirect costs against cost avoidance, efficiency and strategic value. ALE estimates the yearly cost of incidents without new controls, but ROI is always an estimate.","plain":["Direct costs are the price tag; indirect costs are the training and upheaval.","Cost avoidance is like insurance: you measure the bills you no longer pay.","Strategic value is harder to count but can matter most, like a good reputation.","Counting attacks that never happened is hard, so be honest about uncertainty."],"check":{"q":"What does the annualised loss expectancy (ALE) estimate?","o":["The expected yearly cost of security incidents without the proposed controls","The price of the AI software licence","The number of analysts needed"],"a":0,"e":"ALE estimates expected yearly losses without the new controls, which is the starting point for ROI.","retry":{"q":"Staff training and organisational change are examples of…","o":["Strategic value","Indirect costs","Cost avoidance"],"a":1,"e":"The chapter lists training, change management and business disruption as indirect costs."}},"scenario":{"title":"Pitching to the finance director","setting":"You are proposing an AI detection system to your finance director, who asks: 'What exactly will this save us?'","steps":[{"prompt":"Which costs should your proposal include?","choices":[{"t":"Only the software licence","s":0,"fb":"That leaves out hardware, services and indirect costs."},{"t":"Direct costs such as licences and hardware, and indirect costs such as training and disruption","s":2,"fb":"Right. The chapter's cost analysis covers both."},{"t":"Only the hardware","s":0,"fb":"Many costs would be missing."}]},{"prompt":"How do you present the savings?","choices":[{"t":"Promise an exact figure","s":0,"fb":"Prevented attacks are hard to count, so exact promises are misleading."},{"t":"Say savings cannot be estimated at all","s":1,"fb":"They can be estimated, for example with ALE, just not exactly."},{"t":"Estimate expected yearly losses with and without the system, and be clear these are estimates","s":2,"fb":"Right. ALE-based estimates with honest uncertainty."}]},{"prompt":"The director says the savings alone look modest. What else belongs in the case?","choices":[{"t":"Strategic value, such as faster threat response and meeting regulations","s":2,"fb":"Right. The chapter says value goes beyond cost avoidance."},{"t":"Nothing, drop the proposal","s":0,"fb":"Strategic value is part of the case."},{"t":"Exaggerate the savings","s":0,"fb":"That would undermine trust."}]}]},"lab":{"type":"sort","title":"Cost, benefit or strategic value?","prompt":"Place each item in the right part of the business case.","buckets":["Cost","Benefit","Strategic value"],"items":[{"t":"Software licences","b":0},{"t":"Staff training","b":0,"why":"training is an indirect cost"},{"t":"Disruption while the system is introduced","b":0},{"t":"Lower breach clean-up costs","b":1},{"t":"Fewer false positives to investigate","b":1},{"t":"Responding to threats faster than competitors","b":2},{"t":"Meeting tougher security regulations","b":2}],"explain":"A strong case sets every cost against both the measurable benefits and the wider strategic value."}},{"title":"Ethics as a requirement","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four pillars of ethical AI security","nodes":[{"id":"core","label":"Responsible\nAI security","p":[0,0.9,0.6],"c":"white","shape":"ico","size":1.0,"spin":true},{"id":"priv","label":"Privacy\nprotection","p":[-4.4,2.4,-0.6],"c":"violet","shape":"sphere","size":0.9},{"id":"trans","label":"Transparency and\nexplainability","p":[4.4,2.4,-0.6],"c":"cyan","shape":"box","size":0.9},{"id":"bias","label":"Bias\nmitigation","p":[-4.4,-0.6,0.8],"c":"amber","shape":"box","size":0.9},{"id":"acc","label":"Accountability\nand oversight","p":[4.4,-0.6,0.8],"c":"green","shape":"shield","size":0.9}],"links":[["core","priv"],["core","trans"],["core","bias"],["core","acc"]],"steps":["all",["priv"],["trans"],["bias"],["acc"],["priv","bias","acc"],"all"]},"say":["The chapter insists that ethics are fundamental requirements, not optional extras added at the end.","Privacy protection means collecting only the data you need, managing consent properly, following data protection law such as the GDPR, and designing privacy in from the start.","Transparency and explainability mean people can understand why the AI made a decision, supported by explainable AI techniques and full audit trails.","Bias mitigation means checking algorithms for unfair bias, assessing fairness, training on diverse data and auditing regularly.","Accountability and oversight mean clear governance, defined responsibilities and meaningful human control over the AI.","Real dilemmas arise, such as privacy against security, unfair bias and decisions made automatically about people.","That is why these four pillars must be designed in from the very beginning."]}],"keyPoint":"Ethics are a requirement, not an add-on: protect privacy, make decisions explainable, check for bias and keep clear human accountability.","plain":["Data minimisation means only collecting what you truly need, like packing light.","An audit trail is a record of who did what and why, like a ship's log.","Diverse training data helps the AI treat different groups fairly.","Meaningful human control means a person can question and overrule the AI."],"check":{"q":"Which of these is part of the chapter's privacy protection pillar?","o":["Collecting as much data as possible","Data minimisation, consent management and privacy by design","Keeping AI decisions secret"],"a":1,"e":"Privacy protection covers data minimisation, consent, GDPR compliance and privacy by design.","retry":{"q":"The chapter says ethics in AI security should be treated as…","o":["An optional extra","Something to add after launch","A fundamental requirement"],"a":2,"e":"The slides say ethics are fundamental requirements, not optional enhancements."}},"scenario":{"title":"The monitoring proposal","setting":"A manager wants an AI tool that monitors all staff activity to catch insider threats, and suspends accounts automatically when risk scores are high.","steps":[{"prompt":"What concerns you most about automatic suspension?","choices":[{"t":"There is no meaningful human control over a decision that affects people","s":2,"fb":"Right. Accountability and oversight need humans in the loop."},{"t":"It might be too slow","s":0,"fb":"Speed is not the ethical issue."},{"t":"Nothing, automation is always better","s":0,"fb":"Automated decisions about people raise serious ethical questions."}]},{"prompt":"How should the data collection be designed?","choices":[{"t":"Collect everything, just in case","s":0,"fb":"That breaks data minimisation."},{"t":"Collect only what is needed, tell staff what is monitored and why, and follow data protection law","s":2,"fb":"Right. That is the privacy protection pillar in practice."},{"t":"Collect everything but keep it secret","s":0,"fb":"Secrecy breaks transparency as well as privacy."}]}]},"lab":{"type":"spot","title":"Spot the ethical warning signs","prompt":"Here is a proposal for an AI staff-monitoring tool. Click the parts that break the chapter's ethical pillars.","parts":[{"lbl":"Purpose","t":"Detect insider threats and compromised accounts","bad":false,"why":"A legitimate security purpose."},{"lbl":"Data collected","t":"All staff emails, chats and web history, just in case","bad":true,"why":"Breaks data minimisation: collect only what is needed."},{"lbl":"Decisions","t":"Accounts are suspended automatically, with no review","bad":true,"why":"No meaningful human control over decisions that affect people."},{"lbl":"Explanations","t":"The vendor says the model cannot explain its scores","bad":true,"why":"Breaks transparency and explainability."},{"lbl":"Staff notice","t":"Staff are told what is monitored and why","bad":false,"why":"Good practice for transparency and consent."},{"lbl":"Training data","t":"Trained on one office only and never checked for bias","bad":true,"why":"Bias mitigation needs diverse data and regular audits."},{"lbl":"Audit","t":"Every alert and action is logged for review","bad":false,"why":"Audit trails support accountability."}],"explain":"Each warning sign maps to one of the four pillars: privacy, transparency, bias mitigation and accountability."}},{"title":"The implementation roadmap","minutes":3,"slides":[{"scene":{"type":"graph","title":"A four-phase roadmap to AI-enhanced security","nodes":[{"id":"p1","label":"Phase 1:\nassess and plan","p":[-5.25,0,-0.7],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"p2","label":"Phase 2:\nfoundations","p":[-1.75,0,0.7],"c":"violet","shape":"box","size":1,"ly":1.3},{"id":"p3","label":"Phase 3:\npilot","p":[1.75,0,-0.7],"c":"amber","shape":"box","size":1,"ly":1.3},{"id":"p4","label":"Phase 4:\nfull deployment","p":[5.25,0,0.7],"c":"green","shape":"shield","size":1,"ly":1.3}],"links":[["p1","p2"],["p2","p3"],["p3","p4"]],"steps":["all",["p1"],["p2"],["p3"],["p4"],["p2"],["p3","p4"]]},"say":["Moving to AI-enhanced security is a journey, and the chapter sets out a four-phase roadmap.","Phase 1, assessment and planning, analyses where you are now, assesses the threats you face, applies the DRPP framework and evaluates the risks in detail.","Phase 2, foundation building, develops the data infrastructure, sets up an ethical framework and a governance structure, and trains the team.","Phase 3, pilot implementation, deploys AI detection, tests automated response, checks that predictions work and tunes performance.","Phase 4, full deployment, rolls out prevention, sets up continuous monitoring and builds feedback loops so the system keeps improving.","Notice that ethics and governance are set up in Phase 2, before any AI goes live.","Notice too that a pilot comes before full deployment, so problems can be found while the stakes are low."]}],"keyPoint":"Assess and plan, build foundations (data, ethics, governance, training), pilot, then deploy fully with continuous monitoring and feedback.","plain":["Phase 1 is surveying the land before you build.","Phase 2 is laying the foundations, including the rules of the house.","Phase 3 is a trial run in one room before doing the whole building.","Phase 4 is moving in, and then keeping up with maintenance."],"check":{"q":"In which phase does the chapter place setting up an ethical framework and governance structure?","o":["Phase 1: assessment and planning","Phase 3: pilot implementation","Phase 2: foundation building"],"a":2,"e":"Foundation building covers data infrastructure, the ethical framework, governance and team training.","retry":{"q":"Where does the DRPP framework get applied in the roadmap?","o":["Phase 1: assessment and planning","Phase 4: full deployment","It is not used"],"a":0,"e":"Phase 1 includes applying the DRPP framework alongside threat and risk assessment."}},"scenario":{"title":"The rushed launch","setting":"A company bought an AI security platform last month. The chief executive wants it switched on for everything next week.","steps":[{"prompt":"Nobody has assessed current threats or applied DRPP. What should come first?","choices":[{"t":"Switch it on and see what happens","s":0,"fb":"That skips assessment and planning."},{"t":"Phase 1: analyse the current state, assess threats, apply DRPP and evaluate risks","s":2,"fb":"Right. The roadmap starts with assessment and planning."},{"t":"Buy a second platform","s":0,"fb":"More tools do not replace planning."}]},{"prompt":"Data feeds are patchy and staff have had no training. Which phase does that point to?","choices":[{"t":"Phase 2: foundation building","s":2,"fb":"Right. Data infrastructure and training are foundations."},{"t":"Phase 4: full deployment","s":0,"fb":"Deploying on weak foundations is risky."},{"t":"None, the AI will cope","s":0,"fb":"AI depends on good data and trained people."}]},{"prompt":"How should the platform go live?","choices":[{"t":"Everywhere at once","s":0,"fb":"A pilot finds problems while the stakes are low."},{"t":"Never, it is too risky","s":0,"fb":"The roadmap leads to full deployment, step by step."},{"t":"Pilot it first, tune it, then roll out with continuous monitoring","s":2,"fb":"Right. Phase 3 before Phase 4."}]}]},"lab":{"type":"order","title":"Follow the roadmap","prompt":"Put these activities in the order the roadmap suggests.","items":["Analyse the current state and the threats you face","Apply the DRPP framework and evaluate the risks","Build data infrastructure, ethics and governance, and train the team","Pilot AI detection and test automated response","Roll out prevention across the organisation","Monitor continuously and feed lessons back"],"explain":"Assess, build foundations, pilot, then deploy fully with continuous monitoring and feedback loops."}},{"title":"Key insights and the road ahead","minutes":3,"slides":[{"scene":{"type":"graph","title":"Six key insights from Chapter 1","cam":[0,4.4,13],"nodes":[{"id":"def","label":"Attackers use AI,\nso defenders must","p":[-4.6,2.5,-0.4],"c":"red","shape":"ico","size":0.8},{"id":"pro","label":"From reactive\nto proactive","p":[0,2.5,-0.4],"c":"cyan","shape":"box","size":0.8},{"id":"int","label":"Integrate,\ndon't replace","p":[4.6,2.5,-0.4],"c":"violet","shape":"box","size":0.8},{"id":"prob","label":"Probabilities need\nnew evaluation","p":[-4.6,-0.4,0.6],"c":"amber","shape":"torus","size":1.0},{"id":"eth","label":"Ethics are\nrequirements","p":[0,-0.4,0.6],"c":"green","shape":"shield","size":0.8},{"id":"val","label":"Value beyond\ncost avoidance","p":[4.6,-0.4,0.6],"c":"pink","shape":"sphere","size":0.8}],"links":[],"steps":["all",["def"],["pro"],["int"],["prob"],["eth"],["val"]],"orbit":0.2},"say":["Let's pull the chapter together into six key insights.","Because attackers use AI to defeat signature-based detection, defenders urgently need AI too.","Organisations must shift from reacting to attacks to anticipating them, using AI's ability to predict.","AI works best when it is integrated with existing cyber security frameworks, not as a wholesale replacement.","AI gives probabilities rather than certainties, so risk assessment and performance measures need new approaches.","Ethics are a fundamental requirement for responsible deployment, never an optional add-on.","And the business value of AI security goes beyond avoiding costs to include strategic advantages."]},{"scene":{"type":"graph","title":"The journey through the book","nodes":[{"id":"b1","label":"Part I:\nFoundations","p":[-5.85,0,-0.7],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"b2","label":"Part II:\nDetection & analysis","p":[-1.95,0,0.7],"c":"violet","shape":"box","size":1,"ly":1.3},{"id":"b3","label":"Part III:\nSecure development","p":[1.95,0,-0.7],"c":"amber","shape":"box","size":1,"ly":1.3},{"id":"b4","label":"Part IV:\nAdvanced applications","p":[5.85,0,0.7],"c":"green","shape":"box","size":1,"ly":1.3}],"links":[["b1","b2"],["b2","b3"],["b3","b4"]],"steps":[["b1"],["b2"],["b3"],["b4"],"all"],"cam":[0,4.2,14]},"say":["This chapter opens Part One of the book, Foundations, which also covers frameworks for bringing in AI and the architecture of AI security.","Part Two, Detection and Analysis, covers machine learning for threat detection, advanced analytics and threat intelligence, and real-world case studies.","Part Three, Secure Development, covers an AI-enhanced secure software development lifecycle, application security with machine learning, and data protection and privacy in AI systems.","Part Four, Advanced Applications, covers automated incident response, AI security and adversarial defences, and future directions and emerging threats.","Each of those chapters builds on the ideas you met here, so well done for completing Chapter 1."]}],"keyPoint":"Defenders need AI because attackers already use it; shift to proactive security, integrate rather than replace, evaluate probabilistic systems carefully, build in ethics, and value AI beyond cost savings.","plain":["The race is on: attackers have AI, so defenders need it too.","Prevention beats cure, and AI helps you look ahead.","Add AI to what you have rather than starting from scratch.","Fairness, privacy and human control are part of the job, not extras."],"check":{"q":"According to the chapter, how should AI be introduced into an organisation's security?","o":["Integrated with existing cyber security frameworks","As a wholesale replacement for all existing tools","Only after every attack has stopped"],"a":0,"e":"The key insight is integration with existing frameworks rather than wholesale replacement.","retry":{"q":"Why do AI security systems need new approaches to performance evaluation?","o":["They are always correct","They give probabilities rather than certainties","They cannot be measured"],"a":1,"e":"Their probabilistic nature means thresholds, misses and false alarms must be weighed carefully."}},"scenario":{"title":"Your first recommendation","setting":"A small charity asks you, after this chapter, for one-page advice on whether and how to start using AI for security.","steps":[{"prompt":"What is your opening message?","choices":[{"t":"Attackers are already using AI, so it is worth planning how AI can strengthen your defences","s":2,"fb":"Right. That is the chapter's first insight."},{"t":"AI will solve all your security problems","s":0,"fb":"AI is not a silver bullet."},{"t":"AI is only for large companies","s":1,"fb":"Scale matters, but the chapter's ideas apply widely."}]},{"prompt":"What do you say about ethics?","choices":[{"t":"Deal with it later, once the system is running","s":0,"fb":"Ethics are a requirement from the start."},{"t":"Build in privacy, fairness, transparency and human oversight from the beginning","s":2,"fb":"Right. Ethics are fundamental requirements."},{"t":"Ethics only matter for medical AI","s":0,"fb":"They matter for any AI that affects people."}]}]},"lab":{"type":"sort","title":"Myth or supported?","prompt":"Is each statement a myth, or supported by the chapter?","buckets":["Myth","Supported by the chapter"],"items":[{"t":"AI solves every cyber security problem on its own","b":0},{"t":"Signature detection is now completely useless","b":0,"why":"it still has value as one layer of defence"},{"t":"Ethics can be added once the system is working","b":0},{"t":"The return on AI security is easy to calculate exactly","b":0,"why":"prevented attacks and intangible benefits are hard to measure"},{"t":"AI should work alongside existing tools, with human oversight","b":1},{"t":"Defenders need AI because attackers already use it","b":1},{"t":"AI security results are likelihoods, not certainties","b":1}],"explain":"These are the misconceptions the instructor notes warn about, set against the chapter's key insights."}}],"test":[{"q":"How should you treat the chapter's headline cost figures, such as the projection for 2025?","o":["As exact, verified counts","As irrelevant","As estimates and forecasts that show the scale of the problem"],"a":2,"e":"The figures are reported estimates and projections, useful for scale rather than precision.","lesson":0},{"q":"Which generation of cyber threats is characterised by AI-enhanced attacks and automated vulnerability discovery?","o":["First generation","Fourth generation","Second generation"],"a":1,"e":"The fourth generation, from 2015 to the present, weaponises AI and machine learning.","lesson":1},{"q":"Organised crime, financial motivation and underground markets mark which generation?","o":["The second generation","The third generation","The first generation"],"a":0,"e":"From about 1995 to 2005, organised crime brought trojans, rootkits and underground economies.","lesson":1},{"q":"What is the main weakness of signature-based detection?","o":["It is too expensive","It cannot detect zero-day attacks","It only works on mobile devices"],"a":1,"e":"Signatures only match known threats, so brand-new attacks have no fingerprint.","lesson":2},{"q":"According to the chapter, roughly how much of analysts' time goes on investigating false positives?","o":["Almost none","Nearly all of it","About a quarter"],"a":2,"e":"The chapter reports about 25 per cent of analyst time is spent on false positive investigations.","lesson":2},{"q":"An attack that uses legitimate system processes for malicious activity is called…","o":["Living off the land","Polymorphic malware","A deepfake"],"a":0,"e":"Living off the land blends in with normal activity, so signatures miss it.","lesson":3},{"q":"What is the chapter's view of signature-based detection today?","o":["It still has value as one layer of defence, but is not enough alone","It should be removed everywhere","It catches every modern threat"],"a":0,"e":"The instructor notes stress that signatures remain useful in layered security.","lesson":3},{"q":"Which describes AI-enhanced security, as opposed to traditional security?","o":["Reactive and manual","Proactive, behaviour-based and adaptive","Static rules updated now and then"],"a":1,"e":"The chapter contrasts reactive, signature-based security with proactive, adaptive AI-enhanced security.","lesson":4},{"q":"Which DRPP domain focuses on forecasting likely security events?","o":["Detection","Response","Prediction"],"a":2,"e":"Prediction covers threat intelligence, vulnerability forecasting and risk assessment.","lesson":5},{"q":"Automated containment through a SOAR platform belongs to which DRPP domain?","o":["Response","Prevention","Detection"],"a":0,"e":"Response covers automated containment and incident orchestration.","lesson":5},{"q":"Carefully crafted inputs designed to deceive an AI system are an example of…","o":["Algorithmic bias","Adversarial attacks","Privacy inference"],"a":1,"e":"Adversarial attacks feed a model inputs crafted to fool it.","lesson":6},{"q":"Why do AI security systems need new approaches to risk assessment?","o":["Because they are probabilistic, giving likelihoods rather than certainties","Because they never make mistakes","Because traditional risks no longer apply"],"a":0,"e":"AI outputs are likelihoods, so thresholds, misses and false alarms must be weighed.","lesson":6},{"q":"Which method calculates the expected annual cost of security incidents without the proposed controls?","o":["Return on equity","Mean time to respond","Annualised loss expectancy (ALE)"],"a":2,"e":"ALE is the starting point for estimating the return on an AI security investment.","lesson":7},{"q":"Which ethical pillar includes meaningful human control and clear responsibilities?","o":["Privacy protection","Accountability and oversight","Bias mitigation"],"a":1,"e":"Accountability and oversight cover governance, defined responsibilities and human control.","lesson":8},{"q":"In the chapter's roadmap, what comes immediately before full deployment?","o":["Pilot implementation","Assessment and planning","Foundation building"],"a":0,"e":"Phase 3, the pilot, tests and tunes the system before Phase 4 rolls it out fully.","lesson":9},{"q":"Which statement is one of the chapter's key insights?","o":["AI security value is limited to cost savings","Ethics are optional add-ons","AI should be integrated with existing frameworks rather than replace them"],"a":2,"e":"The chapter favours integration over wholesale replacement, and sees value beyond cost avoidance.","lesson":10}]};
