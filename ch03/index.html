/* Chapter 3: AI Security Architecture and Infrastructure (Guide to AI for Cybersecurity) */
const CH = {"id":"ch03","num":"3","title":"AI Security Architecture and Infrastructure","summary":"How to design secure infrastructure for AI-powered security: protecting AI itself, the AI-enhanced SOC, data pipelines, ML infrastructure, model lifecycles, integration, deployment choices, scale, monitoring and disaster recovery.","outcomes":["Explain the difference between AI security and AI for cybersecurity","Describe how a traditional SOC becomes an AI-enhanced SOC, in technology and in people","Secure the five-layer data pipeline and the compute, storage and network beneath it","Manage models safely through their lifecycle and connect AI to existing security tools","Compare cloud, on-premises and hybrid deployment, and plan for scale and performance","Plan monitoring, disaster recovery and a phased roadmap with clear measures of success"],"starter":[{"q":"Is protecting an AI model from attack the same as using AI to defend a network?","o":["Yes, they are the same thing","No, they are different, and both matter","Only using AI to defend matters"],"a":1,"e":""},{"q":"A security team receives far more alerts than it can review. What usually happens?","o":["Important alerts get missed","Every alert is still handled well","Attackers give up"],"a":0,"e":""},{"q":"Where can AI security systems be deployed?","o":["Only in the cloud","Only on your own premises","In the cloud, on premises or a mix of both"],"a":2,"e":""}],"lessons":[{"title":"Two sides: AI security and AI for cybersecurity","minutes":3,"slides":[{"scene":{"type":"graph","title":"Two different ideas: protecting the AI, and AI protecting us","nodes":[{"id":"sec","label":"AI security:\nprotect the AI","p":[-4.0,2.3,-0.6],"c":"red","shape":"shield","size":1.0},{"id":"s1","label":"Poisoning &\nadversarial inputs","p":[-5.3,-0.5,0.6],"c":"red","shape":"box","size":0.7,"ls":0.66},{"id":"s2","label":"Training data &\nmodel theft","p":[-2.4,-0.5,1.0],"c":"red","shape":"box","size":0.7,"ls":0.66},{"id":"for","label":"AI for cybersecurity:\nAI protects us","p":[4.0,2.3,-0.6],"c":"cyan","shape":"ico","size":0.9},{"id":"f1","label":"Threat detection &\nbehaviour analytics","p":[2.4,-0.5,1.0],"c":"cyan","shape":"box","size":0.7,"ls":0.66},{"id":"f2","label":"Orchestration &\nautomated response","p":[5.3,-0.5,0.6],"c":"cyan","shape":"box","size":0.7,"ls":0.66},{"id":"arch","label":"Modern\narchitecture","p":[0,0.9,1.4],"c":"green","shape":"sphere","size":0.9}],"links":[["sec","s1",1,"red"],["sec","s2",1,"red"],["for","f1"],["for","f2"],["arch","sec",1,"green"],["arch","for",1,"green"]],"steps":["all",["sec","for"],["sec"],["sec","s1","s2"],["for"],["for","f1","f2"],["arch","sec","for"]]},"say":["Welcome to Chapter 3, AI Security Architecture and Infrastructure, and I'm Sam, your tutor.","Two ideas sound alike but mean different things: AI security and AI for cybersecurity.","AI security means protecting AI systems themselves from attack.","That covers model poisoning, spotting adversarial inputs, protecting training data and preventing model theft.","AI for cybersecurity means using AI to make security operations stronger.","That covers automated threat detection, behaviour analytics, security orchestration and automated incident response.","The chapter's key message is that a modern architecture must address both at once."]},{"scene":{"type":"graph","title":"Threats aimed at AI systems, and the counters","cam":[0,4.4,13],"nodes":[{"id":"trad","label":"Traditional threats\nstill apply","p":[-5.4,1.0,0.4],"c":"slate","shape":"box","size":0.8,"ls":0.66},{"id":"poi","label":"Model\npoisoning","p":[-2.2,2.6,-0.8],"c":"red","shape":"ico","size":0.8},{"id":"adv","label":"Adversarial\nattacks","p":[1.2,2.8,-1.0],"c":"red","shape":"ico","size":0.8},{"id":"theft","label":"Model\ntheft","p":[4.6,2.6,-0.8],"c":"red","shape":"ico","size":0.8},{"id":"c1","label":"Data checks &\nrobust training","p":[-2.2,-0.7,1.0],"c":"green","shape":"shield","size":0.8,"ls":0.66},{"id":"c2","label":"Adversarial training\n& input checks","p":[1.2,-0.7,1.2],"c":"green","shape":"shield","size":0.8,"ls":0.66},{"id":"c3","label":"Rate limits &\nmodel protection","p":[4.6,-0.7,1.0],"c":"green","shape":"shield","size":0.8,"ls":0.66}],"links":[["poi","c1",1,"green"],["adv","c2",1,"green"],["theft","c3",1,"green"]],"steps":[["trad"],["poi","adv","theft"],["poi"],["poi","c1"],["adv","c2"],["theft","c3"]]},"say":["AI systems still face the traditional threats: unauthorised access, data breaches and system compromise.","But they also face threats aimed at the AI itself.","Model poisoning corrupts the training data or inserts a hidden backdoor, so the model learns the wrong lessons.","The counters are to validate the data and to use robust training methods.","Adversarial attacks use carefully crafted inputs to fool a model, and the counters are adversarial training and preprocessing inputs before the model sees them.","Model theft tries to extract the valuable model itself, and rate limiting and model protection help stop it."]}],"keyPoint":"AI security protects the AI system itself (its data, model and inputs). AI for cybersecurity uses AI to defend everything else. A modern architecture must handle both.","plain":["AI security is guarding the guard dog; AI for cybersecurity is using the guard dog.","Poisoning is like slipping wrong answers into a student's textbook before the exam.","An adversarial input is a disguise designed to fool the model's eyes.","Model theft is copying the recipe by tasting the dish thousands of times, which is why rate limits help."],"check":{"q":"A company protects its threat detection model's training data from tampering. Which idea is this?","o":["AI for cybersecurity","AI security","A traditional SOC tier"],"a":1,"e":"Protecting the AI system itself, including its training data, is AI security.","retry":{"q":"In the guard dog picture, which one is AI security?","o":["Guarding the guard dog","Using the guard dog","Neither"],"a":0,"e":"AI security protects the AI itself, just as you would protect the guard dog from being drugged or stolen."}},"scenario":{"title":"The hospital's new AI detector","setting":"A hospital is rolling out an AI tool that detects attacks on its network. The project plan explains how the tool will spot threats, and says nothing else about security.","steps":[{"prompt":"What is missing from the plan?","choices":[{"t":"A review of the hospital's firewall rules","s":1,"fb":"Useful against traditional threats, but it does not cover threats aimed at the AI itself."},{"t":"Protection for the AI system itself: its training data, its model and its inputs","s":2,"fb":"Right. The plan covers AI for cybersecurity but forgets AI security."},{"t":"Nothing, detection is the whole job","s":0,"fb":"The chapter says architectures must address both dimensions."}]},{"prompt":"Logs show someone sending thousands of carefully varied queries to the model's interface. What is the likely aim, and what helps?","choices":[{"t":"Poisoning, countered by deleting the model","s":0,"fb":"Poisoning targets training data, and deleting the model helps nobody."},{"t":"Adversarial probing, countered by adversarial training","s":1,"fb":"Crafted inputs can fool models, but a flood of queries aimed at the model's behaviour points to theft."},{"t":"Model theft, countered by rate limiting and model protection","s":2,"fb":"Right. Limiting how many queries anyone can make is the chapter's counter to model theft."}]}]},"lab":{"type":"sort","title":"Protecting the AI, or AI protecting us?","prompt":"Which idea does each task belong to?","buckets":["AI security (protect the AI)","AI for cybersecurity (AI protects us)"],"items":[{"t":"Stop attackers corrupting a model's training data","b":0},{"t":"Use machine learning to detect threats automatically","b":1},{"t":"Prevent a rival copying your trained model","b":0,"why":"that is model theft, a threat to the AI itself"},{"t":"Spot unusual user behaviour with analytics","b":1},{"t":"Detect inputs crafted to fool a model","b":0},{"t":"Automate parts of incident response","b":1},{"t":"Orchestrate security tools so they work together","b":1}],"explain":"If the AI is the thing being protected, it is AI security; if the AI is doing the protecting, it is AI for cybersecurity."}},{"title":"From a traditional SOC to an AI-enhanced SOC","minutes":3,"slides":[{"scene":{"type":"graph","title":"The traditional security operations centre: three tiers","cam":[0,3.4,12],"look":[0,1.2,0],"nodes":[{"id":"col","label":"Data collection: logs,\nnetwork, endpoints","p":[-1.2,-0.4,0],"c":"slate","shape":"slab","size":1,"ly":0.72,"ls":0.6},{"id":"ana","label":"Analysis: SIEM,\nrules, analysts","p":[-1.2,1.1,0],"c":"cyan","shape":"slab","size":1,"ly":0.72,"ls":0.6},{"id":"res","label":"Response: manual steps,\nplaybooks, teams","p":[-1.2,2.6,0],"c":"amber","shape":"slab","size":1,"ly":0.72,"ls":0.6},{"id":"lim","label":"Limits: overload,\nalert fatigue, delays","p":[3.9,1.0,0.6],"c":"red","shape":"torus","size":1.0,"ls":0.62}],"links":[],"orbit":0.45,"steps":["all",["col"],["ana"],["res"],["lim"],["ana","lim"]]},"say":["Most organisations run a security operations centre, or SOC, a team and toolset that watches for attacks.","The traditional SOC has three tiers, starting with data collection from log gathering systems, network monitoring tools and agents on endpoint devices.","The analysis tier uses a SIEM, short for security information and event management, plus correlation rules and human analysts.","The response tier relies on manual processes, predefined playbooks and incident response teams.","The chapter names three limitations: too much data to handle, alert fatigue and slow response times.","Alert fatigue means analysts face so many alerts that it becomes hard to give each one proper attention."]},{"scene":{"type":"graph","title":"The AI-enhanced security operations centre","nodes":[{"id":"src","label":"Security\ndata","p":[-5.6,0,0],"c":"slate","shape":"cyl","size":0.9},{"id":"plat","label":"Real-time\ndata platform","p":[-2.4,0,0.8],"c":"cyan","shape":"box","size":0.9},{"id":"eng","label":"AI analytics\nengine","p":[0.9,0,0],"c":"violet","shape":"ico","size":1.0},{"id":"auto","label":"Automated\nresponse platform","p":[4.4,0,0.8],"c":"green","shape":"shield","size":0.9},{"id":"ben","label":"Benefits: scale,\nspeed, adaptability","p":[0.9,2.9,-1.4],"c":"amber","shape":"sphere","size":0.8}],"links":[["src","plat",2],["plat","eng",2],["eng","auto",2],["ben","eng",1,"amber"]],"steps":["all",["src","plat"],["eng"],["auto"],["ben"],["ben","eng"]]},"say":["The AI-enhanced SOC rebuilds these tiers around three platforms.","A real-time data platform handles data as it flows in, using stream processing, data lakes and feature engineering, which turns raw data into measurements a model can use.","An AI analytics engine serves machine learning models, detects anomalies and draws on threat intelligence.","An automated response platform handles security orchestration and automatic fixes, known as remediation.","The benefits are processing massive data volumes, detecting threats in real time and adapting the response to what is happening.","It also reduces how much the team depends on slow manual analysis."]}],"keyPoint":"A traditional SOC collects, analyses and responds largely by hand, which leads to overload, alert fatigue and delays. The AI-enhanced SOC adds a real-time data platform, an AI analytics engine and automated response.","plain":["A SOC is the security team's control room.","A SIEM is the big noticeboard where all security logs are gathered and linked.","Alert fatigue is like a car alarm that goes off so often that nobody looks any more.","The AI-enhanced SOC does not remove people; it takes the repetitive load off them."],"check":{"q":"Which of these is a limitation of the traditional SOC named in the chapter?","o":["Too few security tools","Too much automation","Alert fatigue"],"a":2,"e":"The chapter lists volume overload, alert fatigue and delayed response times.","retry":{"q":"A car alarm goes off so often that nobody checks it any more. Which SOC problem does this picture?","o":["Model theft","Alert fatigue","Data residency"],"a":1,"e":"Too many alerts make people stop paying attention, which is alert fatigue."}},"scenario":{"title":"Drowning in alerts","setting":"A small SOC team receives thousands of alerts a day. Many are never looked at, and a real intrusion last month was spotted days late.","steps":[{"prompt":"Which traditional SOC limitations does this show?","choices":[{"t":"Volume overload and alert fatigue, leading to delayed response","s":2,"fb":"Right. Too much data and too many alerts slow everything down."},{"t":"Only delayed response","s":1,"fb":"That is the result, but the root causes are volume and alert fatigue."},{"t":"A shortage of log sources","s":0,"fb":"The team has too much data, not too little."}]},{"prompt":"Which part of an AI-enhanced SOC would help most directly?","choices":[{"t":"Switch off half the log sources","s":0,"fb":"That hides problems rather than solving them."},{"t":"Hire more analysts and change nothing else","s":1,"fb":"It may help a little, but the volume keeps growing."},{"t":"An AI analytics engine with automated response, reducing manual analysis","s":2,"fb":"Right. AI handles the volume and the team focuses on what matters."}]}]},"lab":{"type":"sort","title":"Which tier?","prompt":"Place each part of a traditional SOC in its tier.","buckets":["Data collection","Analysis","Response"],"items":[{"t":"Log aggregation system","b":0},{"t":"Endpoint detection agents","b":0},{"t":"Network monitoring tools","b":0},{"t":"SIEM platform","b":1},{"t":"Correlation rules","b":1},{"t":"Human analysts reviewing alerts","b":1},{"t":"Predefined playbooks","b":2},{"t":"Incident response team","b":2}],"explain":"Collection gathers the data, analysis makes sense of it and response acts on it, and the AI-enhanced SOC upgrades each tier."}},{"title":"Changing technology, skills and people","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three shifts in technology","nodes":[{"id":"b","label":"Batch\nprocessing","p":[-3.6,2.8,-0.8],"c":"slate","shape":"box","size":0.75},{"id":"rt","label":"Real-time\nprocessing","p":[3.6,2.8,-0.8],"c":"cyan","shape":"box","size":0.75},{"id":"rule","label":"Rule-based\nanalytics","p":[-3.6,1.0,0],"c":"slate","shape":"box","size":0.75},{"id":"ml","label":"Machine learning\nanalytics","p":[3.6,1.0,0],"c":"violet","shape":"ico","size":0.75},{"id":"man","label":"Manual\nresponse","p":[-3.6,-0.8,0.8],"c":"slate","shape":"box","size":0.75},{"id":"aut","label":"Automated\nresponse","p":[3.6,-0.8,0.8],"c":"green","shape":"shield","size":0.75}],"links":[["b","rt",2],["rule","ml",2],["man","aut",2]],"steps":["all",["b","rt"],["rule","ml"],["man","aut"],["rt","ml","aut"]]},"say":["Moving to an AI-enhanced SOC changes the organisation, not just the technology.","Processing shifts from batches handled now and then to a continuous real-time flow.","Analytics shift from hand-written rules to machine learning.","Responses shift from manual work to automation.","Each shift brings new demands on the people who run the SOC."]},{"scene":{"type":"graph","title":"Bringing people along: skills and change management","nodes":[{"id":"cm","label":"Change\nmanagement","p":[0,-0.2,1.2],"c":"amber","shape":"torus","size":1.3,"ly":1.75,"spin":true},{"id":"skills","label":"New skills:\ndata science, ML","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"train","label":"Training\nprogrammes","p":[-2.62,1.58,-2.2],"c":"green","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"phase","label":"Phased\nrollout","p":[0.0,1.7,-2.28],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"open","label":"Transparency:\nbe open","p":[2.63,1.58,-2.2],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"aug","label":"AI augments\npeople","p":[4.55,1.25,-1.98],"c":"pink","shape":"sphere","size":0.8,"ly":1.15,"ls":0.72}],"links":[["cm","skills"],["cm","train"],["cm","phase"],["cm","open"],["cm","aug"]],"steps":[["skills"],["skills"],["cm","train"],["cm","phase"],["cm","open"],["aug"]]},"say":["Traditional SOC work centres on manual analysis and writing rules.","AI-enhanced operations also need data science, machine learning engineering and automation expertise.","The chapter says training programmes are essential to close that skills gap.","Change should come in phases rather than all at once.","Resistance is best handled through transparency, meaning being open about what is changing and why.","Above all, show people that AI augments human abilities rather than replacing them."]}],"keyPoint":"The move is batch to real time, rules to machine learning and manual to automated. It needs new skills, training, a phased rollout and honest communication that AI augments people.","plain":["Real-time processing is a live news feed; batch processing is yesterday's newspaper.","New tools need new skills, so training is part of the project, not an afterthought.","A phased rollout is learning to swim in the shallow end first.","People accept change more readily when they are told the truth about it."],"check":{"q":"According to the chapter, how should resistance to AI in the security team be handled?","o":["Through transparency, showing that AI augments people","By keeping the project secret until launch","By replacing the people who resist"],"a":0,"e":"The chapter recommends transparency and demonstrating AI as augmenting human capabilities.","retry":{"q":"Which approach does the chapter recommend for rolling out an AI-enhanced SOC?","o":["Everything on one day","A phased approach","No rollout plan at all"],"a":1,"e":"A phased implementation lets people and systems adjust step by step."}},"scenario":{"title":"Analysts are worried","setting":"Leadership has announced an AI-enhanced SOC. Rumours spread that the AI will replace the analysts, and two experienced staff are thinking of leaving.","steps":[{"prompt":"How should leadership respond?","choices":[{"t":"Send a short note saying the project is confidential","s":0,"fb":"Secrecy feeds rumours and resistance."},{"t":"Explain openly what the AI will do and how it supports the analysts' work","s":2,"fb":"Right. Transparency and showing AI as augmentation address resistance."},{"t":"Hold a one-off demonstration of the tool","s":1,"fb":"A start, but people need ongoing, honest communication."}]},{"prompt":"How should the rollout be planned?","choices":[{"t":"Phased, with training programmes before each stage","s":2,"fb":"Right. Phased change with training is what the chapter recommends."},{"t":"Phased, but with training only after full launch","s":1,"fb":"The phasing helps, but staff need the new skills before they use the tools."},{"t":"All at once, to get it over with","s":0,"fb":"A big-bang change increases risk and resistance."}]}]},"lab":{"type":"spot","title":"Spot the weaknesses in the change plan","prompt":"A manager has drafted this change plan for a new AI-enhanced SOC. Find the weaknesses.","parts":[{"lbl":"Timeline","t":"Switch every team to the new AI tools on the same day next month","bad":true,"why":"The chapter recommends a phased approach, not a single switch-over."},{"lbl":"Pilot","t":"Review the results with the first team before widening","bad":false,"why":"Learning from a first stage is part of a phased approach."},{"lbl":"Training","t":"No training budget: staff will learn on the job","bad":true,"why":"The chapter calls training programmes essential."},{"lbl":"Skills","t":"Build data science and automation skills in the team","bad":false,"why":"These are the skills the chapter says AI-enhanced work needs."},{"lbl":"Communication","t":"Don't tell analysts what the AI does, to avoid worry","bad":true,"why":"Resistance is addressed through transparency, not secrecy."},{"lbl":"Message","t":"The AI will let us cut most analyst posts","bad":true,"why":"The chapter frames AI as augmenting people, not replacing them."},{"lbl":"Sponsor","t":"The head of security sponsors the project","bad":false,"why":"Leadership support is a success factor."}],"explain":"Technology change fails without people: phase it, train for it and be open about it."}},{"title":"The data pipeline and its security controls","minutes":3,"slides":[{"scene":{"type":"graph","title":"Five layers of an AI security data pipeline","cam":[0,3.9,13.4],"look":[0,1.5,0],"nodes":[{"id":"src","label":"Data sources: logs,\nendpoints, threat intel","p":[0,-1.1,0],"c":"slate","shape":"slab","size":1,"ly":0.62,"ls":0.55},{"id":"ing","label":"Ingestion: collect\nand validate","p":[0,0.15,0],"c":"cyan","shape":"slab","size":1,"ly":0.62,"ls":0.55},{"id":"proc","label":"Processing: streams,\nbatches, features","p":[0,1.4,0],"c":"violet","shape":"slab","size":1,"ly":0.62,"ls":0.55},{"id":"sto","label":"Storage: data lakes,\nfeature stores, models","p":[0,2.65,0],"c":"amber","shape":"slab","size":1,"ly":0.62,"ls":0.55},{"id":"srv","label":"Serving: APIs and\nML inference","p":[0,3.9,0],"c":"green","shape":"slab","size":1,"ly":0.62,"ls":0.55}],"links":[],"orbit":0.5,"steps":["all",["src"],["ing"],["proc"],["sto"],["srv"]]},"say":["Every AI security system rests on a data pipeline, and the chapter describes five layers.","Data sources include network logs, endpoint data, application logs and threat intelligence.","The ingestion layer collects that data and validates it on the way in.","The processing layer handles live streams and batches, and engineers the features a model can use.","The storage layer holds data lakes, feature stores of ready-made measurements and repositories of trained models.","The serving layer delivers results through real-time and batch APIs, the interfaces other systems call, and runs machine learning inference, meaning the model making its predictions."]},{"scene":{"type":"graph","title":"Security controls along the pipeline, plus privacy","nodes":[{"id":"val","label":"Validation","p":[-5.2,0,-0.6],"c":"red","shape":"shield","size":0.8,"ly":1.0,"ls":0.66},{"id":"cle","label":"Cleansing","p":[-2.6,0,0.6],"c":"cyan","shape":"box","size":0.75,"ly":1.0,"ls":0.66},{"id":"fe","label":"Feature\nengineering","p":[0,0,-0.6],"c":"cyan","shape":"box","size":0.75,"ly":1.0,"ls":0.66},{"id":"enr","label":"Enrichment","p":[2.6,0,0.6],"c":"cyan","shape":"box","size":0.75,"ly":1.0,"ls":0.66},{"id":"qa","label":"Quality\nassurance","p":[5.2,0,-0.6],"c":"green","shape":"shield","size":0.8,"ly":1.0,"ls":0.66},{"id":"priv","label":"Privacy: anonymise,\nencrypt","p":[0,2.8,-1.6],"c":"violet","shape":"sphere","size":0.8,"ls":0.66}],"links":[["val","cle",2],["cle","fe",2],["fe","enr",2],["enr","qa",2],["priv","fe",1,"violet"]],"steps":["all",["val"],["cle"],["fe"],["enr"],["qa"],["priv"]]},"say":["The chapter treats this data as a supply chain, so each stage needs security controls.","Validation checks the format and looks for malicious content before anything else happens.","Cleansing removes inconsistencies and puts data into standard formats.","Feature engineering must use secure transformation processes.","Enrichment adds context from threat intelligence.","Quality assurance checks that the data is complete and accurate.","Privacy protection uses anonymisation, differential privacy, which adds careful noise so individuals cannot be singled out, and homomorphic encryption, which allows calculations on data that stays encrypted."]}],"keyPoint":"The pipeline runs sources → ingestion → processing → storage → serving. Validate, cleanse, transform securely, enrich and quality-check the data, and protect privacy along the way.","plain":["The pipeline is the supply chain that feeds the AI, and bad ingredients make a bad meal.","Validation is the security check at the door: wrong shape or suspicious content stays out.","A feature store is a pantry of ready-prepared ingredients that several models can share.","Anonymisation removes names; homomorphic encryption lets you do sums on a locked box without opening it."],"check":{"q":"Which pipeline layer holds data lakes, feature stores and model repositories?","o":["Ingestion","Serving","Storage"],"a":2,"e":"Storage keeps the data, features and trained models. Serving delivers results to other systems.","retry":{"q":"In the pantry picture, what is a feature store?","o":["A store of ready-prepared measurements that models can share","A shop that sells models","The final answer the model gives"],"a":0,"e":"A feature store holds prepared features so several models can reuse them."}},"scenario":{"title":"Strange records in the feed","setting":"A threat intelligence feed suddenly delivers records in an unexpected format, and a few of them contain fragments of script code.","steps":[{"prompt":"Which stage should stop these records?","choices":[{"t":"Quality assurance at the end","s":1,"fb":"Quality checks help, but the records should be stopped earlier."},{"t":"The serving layer","s":0,"fb":"By then the bad data has already passed through the pipeline."},{"t":"Validation at ingestion, with format checks and malicious content detection","s":2,"fb":"Right. Validation is the first security control."}]},{"prompt":"Why does this matter especially for AI?","choices":[{"t":"Bad data that reaches training could poison the model","s":2,"fb":"Right. The instructor material links pipeline security to data poisoning."},{"t":"It might cause errors in a monthly report","s":1,"fb":"Possibly, but the bigger risk is corrupting what the model learns."},{"t":"It only affects storage costs","s":0,"fb":"The risk is to the model's behaviour, not just storage."}]}]},"lab":{"type":"order","title":"Build the pipeline","prompt":"Put the five layers of the AI security data pipeline in order, from where data starts to where results are used.","items":["Data sources","Ingestion: collect and validate","Processing: streams, batches, features","Storage: lakes, feature stores, models","Serving: APIs and inference"],"explain":"Data enters, is checked, is processed, is stored and is finally served to the people and systems that use it."}},{"title":"Securing the machine learning infrastructure","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three security domains for machine learning infrastructure","nodes":[{"id":"ml","label":"ML\ninfrastructure","p":[0,-0.2,1.2],"c":"green","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"comp","label":"Compute: GPUs,\ncontainers, isolation","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"stor","label":"Storage: encryption,\naccess, backups","p":[0.0,1.7,-2.28],"c":"amber","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72},{"id":"net","label":"Network: encryption,\nsegments, bandwidth","p":[4.55,1.25,-1.98],"c":"violet","shape":"torus","size":0.8,"ly":1.15,"ls":0.72}],"links":[["ml","comp"],["ml","stor"],["ml","net"]],"steps":["all",["ml","comp"],["ml","stor"],["ml","net"],["comp"]]},"say":["Machine learning infrastructure needs protecting in three domains: compute, storage and network.","Compute security protects the GPUs and TPUs, the specialised processors that run machine learning, secures containers and keeps workloads isolated from each other.","Storage security encrypts data at rest, controls who can access it and protects the backups.","Network security encrypts traffic, divides the network into separate segments and manages bandwidth.","Containers are packaged, self-contained software environments, and the instructor material warns that attackers may try to escape from them."]},{"scene":{"type":"graph","title":"Training and inference need different things","nodes":[{"id":"tr","label":"Training","p":[-3.6,2.7,-0.8],"c":"violet","shape":"ico","size":0.9,"ls":0.5},{"id":"inf","label":"Inference","p":[3.6,2.7,-0.8],"c":"cyan","shape":"ico","size":0.9,"ls":0.5},{"id":"t1","label":"High compute,\nlarge storage","p":[-5.0,0.3,0.4],"c":"violet","shape":"box","size":0.7,"ls":0.66},{"id":"t2","label":"Batch traffic,\nlong runs","p":[-2.2,0.3,0.9],"c":"violet","shape":"box","size":0.7,"ls":0.66},{"id":"i1","label":"Low latency,\nsteady speed","p":[2.2,0.3,0.9],"c":"cyan","shape":"box","size":0.7,"ls":0.66},{"id":"i2","label":"Real-time network,\nalways on","p":[5.0,0.3,0.4],"c":"cyan","shape":"box","size":0.7,"ls":0.66},{"id":"arch","label":"One architecture\nfor both","p":[0,-1.1,1.8],"c":"green","shape":"sphere","size":0.8,"ls":0.66}],"links":[["tr","t1"],["tr","t2"],["inf","i1"],["inf","i2"],["t2","arch",1,"green"],["i1","arch",1,"green"]],"steps":[["tr","inf"],["tr","t1"],["tr","t2"],["inf","i1"],["inf","i2"],["arch"]]},"say":["Machine learning has two phases with very different needs: training and inference.","Training needs high compute power spread across many machines, plus large storage for massive datasets.","It moves data in batches and can run for long periods.","Inference, when the trained model makes live predictions, needs low latency, meaning a fast response, and consistent performance.","It also needs real-time network capability and must run continuously.","The architecture must support both phases efficiently."]}],"keyPoint":"Secure compute (GPUs, containers, isolation), storage (encryption, access control, backups) and network (encryption, segmentation, bandwidth). Training needs power and capacity; inference needs speed and constant availability.","plain":["Isolation keeps one workload from peeking into another, like separate locked offices.","Encryption at rest locks the filing cabinet, not just the post on its way.","Network segmentation is fire doors: trouble in one area does not spread everywhere.","Training is the long study period; inference is answering questions live in the exam."],"check":{"q":"Which phase needs low latency and continuous operation?","o":["Inference","Training","Neither"],"a":0,"e":"Inference answers live requests, so it must be fast and always on. Training needs power and storage over long runs.","retry":{"q":"Which control belongs to network security in the chapter?","o":["Encryption at rest","Network segmentation","Resource isolation for GPUs"],"a":1,"e":"Segmentation divides the network so a problem in one part cannot easily spread."}},"scenario":{"title":"The shared GPU cluster","setting":"The security team's detection models run on GPU servers shared with a research group. Model files sit unencrypted on a shared drive, and traffic between services is not encrypted.","steps":[{"prompt":"What is the first compute concern?","choices":[{"t":"Buy faster GPUs","s":0,"fb":"Speed does not fix a security gap."},{"t":"Isolate the security workloads and secure their containers","s":2,"fb":"Right. Resource isolation and container security are compute controls."},{"t":"Run the security jobs only at night","s":1,"fb":"That reduces overlap but does not isolate the workloads."}]},{"prompt":"What should be done about the files and the traffic?","choices":[{"t":"Encrypt the files but leave the traffic as it is","s":1,"fb":"Half the job: traffic encryption is also a listed control."},{"t":"Rename the files so they are harder to find","s":0,"fb":"Hiding is not protection."},{"t":"Encrypt data at rest, control access and encrypt traffic between services","s":2,"fb":"Right. That covers the storage and network domains."}]},{"prompt":"The new model must answer within moments, all day, every day. Which phase's needs are these?","choices":[{"t":"Inference: low latency and continuous operation","s":2,"fb":"Right. Live predictions are inference."},{"t":"Training: high compute and long runs","s":0,"fb":"Training is the learning phase, not the live answering phase."},{"t":"Both equally","s":1,"fb":"The architecture must support both, but these particular needs are inference needs."}]}]},"lab":{"type":"sort","title":"Compute, storage or network?","prompt":"Which security domain does each control belong to?","buckets":["Compute","Storage","Network"],"items":[{"t":"Protect the GPUs that train models","b":0},{"t":"Secure the containers models run in","b":0},{"t":"Keep workloads isolated from each other","b":0},{"t":"Encrypt data at rest","b":1},{"t":"Control who can read the model files","b":1},{"t":"Protect the backups","b":1},{"t":"Encrypt traffic between services","b":2},{"t":"Split the network into segments","b":2},{"t":"Manage bandwidth","b":2}],"explain":"Compute protects where the work runs, storage protects where data rests and network protects data on the move."}},{"title":"Managing models from birth to retirement","minutes":3,"slides":[{"scene":{"type":"graph","title":"Seven phases in the life of a model","nodes":[{"id":"dev","label":"Development","p":[-5.7,-0.2,0.8],"c":"cyan","shape":"box","size":0.75,"ls":0.44},{"id":"trn","label":"Training","p":[-3.8,2.0,-0.6],"c":"violet","shape":"box","size":0.75,"ls":0.44},{"id":"val","label":"Validation","p":[-1.9,-0.2,0.8],"c":"amber","shape":"box","size":0.75,"ls":0.44},{"id":"dep","label":"Deployment","p":[-0.0,2.0,-0.6],"c":"green","shape":"box","size":0.75,"ls":0.44},{"id":"mon","label":"Monitoring","p":[1.9,-0.2,0.8],"c":"red","shape":"torus","size":0.75,"ls":0.44},{"id":"upd","label":"Updates","p":[3.8,2.0,-0.6],"c":"cyan","shape":"box","size":0.75,"ls":0.44},{"id":"ret","label":"Retirement","p":[5.7,-0.2,0.8],"c":"slate","shape":"box","size":0.75,"ls":0.44}],"links":[["dev","trn"],["trn","val"],["val","dep"],["dep","mon"],["mon","upd"],["upd","ret"]],"steps":["all",["dev"],["trn"],["val"],["dep"],["mon"],["upd"],["ret"]]},"say":["A model needs managing from its first design until it is switched off, and the chapter sets out seven phases.","Development sets the requirements and includes threat modelling, which means thinking through how attackers might target the model.","Training happens in a secure environment with validated data.","Validation tests robustness, meaning how well the model holds up against tricky inputs, and assesses bias.","Deployment hardens the infrastructure and secures the APIs.","Monitoring tracks performance and detects drift, the slow decline in a model as the world around it changes.","Updates go through secure change management.","Retirement means decommissioning the model securely and sanitising, or wiping, its data."]},{"scene":{"type":"graph","title":"Security checkpoints and safe ways to go live","nodes":[{"id":"sv","label":"Security\nvalidation","p":[-5.1,2.4,-0.8],"c":"red","shape":"shield","size":0.8,"ls":0.66},{"id":"pt","label":"Performance\ntesting","p":[-1.7,2.4,-0.8],"c":"amber","shape":"box","size":0.75,"ls":0.66},{"id":"cc","label":"Compliance\nchecks","p":[1.7,2.4,-0.8],"c":"violet","shape":"box","size":0.75,"ls":0.66},{"id":"ms","label":"Monitoring\nsetup","p":[5.1,2.4,-0.8],"c":"cyan","shape":"torus","size":0.8,"ls":0.66},{"id":"bg","label":"Blue-green:\nno downtime","p":[-3.6,-0.6,1.0],"c":"green","shape":"box","size":0.75,"ls":0.66},{"id":"can","label":"Canary:\ngradual rollout","p":[0,-0.6,1.2],"c":"green","shape":"sphere","size":0.75,"ls":0.66},{"id":"ab","label":"A/B testing:\ncompare two","p":[3.6,-0.6,1.0],"c":"green","shape":"box","size":0.75,"ls":0.66}],"links":[["sv","pt"],["pt","cc"],["cc","ms"],["ms","ab",1,"green"],["ms","can",1,"green"],["ms","bg",1,"green"]],"steps":[["sv","pt","cc","ms"],["sv"],["pt"],["cc"],["ms"],["bg","can"],["ab"]]},"say":["Before a model goes live, it passes four security checkpoints.","Security validation assesses vulnerabilities and analyses threats.","Performance testing checks the model under load and confirms it responds quickly enough.","Compliance checks confirm it meets regulatory requirements.","Monitoring setup prepares performance measures and security alerts before launch.","Blue-green deployment allows updates with no downtime, while a canary release rolls out gradually to validate the new model.","A/B testing compares two versions to see which performs better."]}],"keyPoint":"Security belongs in every lifecycle phase: development, training, validation, deployment, monitoring, updates and retirement. New models pass security, performance, compliance and monitoring checkpoints, then go live by blue-green, canary or A/B methods.","plain":["Threat modelling is asking 'how would a burglar get in?' before building the house.","Drift is a map slowly going out of date as new roads are built.","A canary release lets a small group try the new version first.","Retiring a model safely is like shredding old files, not just leaving them in a skip."],"check":{"q":"What does the retirement phase of the model lifecycle involve?","o":["Bias assessment","Secure decommissioning and data sanitisation","Load testing"],"a":1,"e":"At retirement the model is switched off securely and its data is wiped.","retry":{"q":"Which deployment strategy lets a small group try the new version first?","o":["Canary","Blue-green","Compliance check"],"a":0,"e":"A canary release rolls out gradually to validate the new model."}},"scenario":{"title":"Replacing the old model","setting":"Your team has trained a new threat detection model to replace one that has been live for two years.","steps":[{"prompt":"What should happen before the new model serves live traffic?","choices":[{"t":"Only the performance tests, since speed matters most","s":1,"fb":"Performance matters, but security, compliance and monitoring checkpoints matter too."},{"t":"Deploy straight away, because it scored well in training","s":0,"fb":"Training scores do not replace the deployment checkpoints."},{"t":"Security validation, performance testing, compliance checks and monitoring setup","s":2,"fb":"Right. All four checkpoints come before launch."}]},{"prompt":"Which strategy lets you check it on a small share of traffic first?","choices":[{"t":"Canary","s":2,"fb":"Right. A canary rolls out gradually so you can validate it."},{"t":"Blue-green","s":1,"fb":"Blue-green gives zero-downtime updates, but it is the canary that rolls out gradually."},{"t":"Retire both models","s":0,"fb":"That leaves you with no detection at all."}]},{"prompt":"What should happen to the old model?","choices":[{"t":"Leave it running on an old server just in case","s":0,"fb":"Forgotten systems become a security risk."},{"t":"Switch it off but leave its data on the old server","s":1,"fb":"Switching off is a start, but the data must also be sanitised."},{"t":"Decommission it securely and sanitise its data","s":2,"fb":"Right. That is the retirement phase."}]}]},"lab":{"type":"order","title":"The model lifecycle","prompt":"Put the seven phases of the model lifecycle in order.","items":["Development: requirements and threat modelling","Training: secure environment, validated data","Validation: robustness and bias","Deployment: hardening and API security","Monitoring: performance and drift","Updates: secure change management","Retirement: decommission and sanitise"],"explain":"Security is part of every phase, from the first threat model to the final data wipe."}},{"title":"Connecting AI to the tools you already have","minutes":3,"slides":[{"scene":{"type":"graph","title":"Connecting an AI tool to existing security tools","cam":[0,4.4,13],"nodes":[{"id":"ai","label":"AI security\ntool","p":[-5.6,1.0,0],"c":"violet","shape":"ico","size":0.9},{"id":"gw","label":"API gateway:\nsecure access","p":[-2.0,2.9,-1.0],"c":"cyan","shape":"box","size":0.75,"ls":0.66},{"id":"tr","label":"Data\ntranslation","p":[2.0,2.9,-1.0],"c":"cyan","shape":"box","size":0.75,"ls":0.66},{"id":"orc","label":"Workflow\norchestration","p":[0,1.0,0.2],"c":"amber","shape":"sphere","size":0.85,"ls":0.66},{"id":"ctl","label":"Security controls:\naccess, validation","p":[-2.0,-0.9,1.2],"c":"red","shape":"shield","size":0.8,"ls":0.66},{"id":"mon","label":"Integration\nmonitoring","p":[2.0,-0.9,1.2],"c":"green","shape":"torus","size":0.8,"ls":0.66},{"id":"ext","label":"Existing tools:\nSIEM, EDR, scanners","p":[5.6,1.0,0],"c":"slate","shape":"cyl","size":0.9,"ls":0.66}],"links":[["ai","gw"],["ai","ctl"],["gw","orc"],["tr","orc"],["ctl","orc"],["mon","orc"],["orc","ext",2]],"steps":["all",["ai","gw"],["tr"],["orc"],["ctl"],["mon"],["ext"]]},"say":["New AI tools must work alongside the security tools an organisation already has.","An API gateway manages secure access, so only approved systems can call the AI tool.","Data translation converts between formats, so different tools can understand each other.","Workflow orchestration coordinates the steps of each process across the tools.","Security controls manage access and validate what passes through.","Monitoring tracks the health of each integration.","Together they connect the AI to existing SIEM platforms, to endpoint detection and response tools, known as EDR, to network monitors and to vulnerability scanners."]},{"scene":{"type":"graph","title":"The AI-enhanced security workflow","nodes":[{"id":"alert","label":"AI alert","p":[-5.7,-0.2,0.8],"c":"red","shape":"box","size":0.75,"ls":0.44},{"id":"ti","label":"Threat\nintelligence","p":[-3.8,2.0,-0.6],"c":"violet","shape":"box","size":0.75,"ls":0.66},{"id":"cor","label":"Correlation","p":[-1.9,-0.2,0.8],"c":"cyan","shape":"box","size":0.75,"ls":0.44},{"id":"risk","label":"Risk\ncontext","p":[-0.0,2.0,-0.6],"c":"amber","shape":"box","size":0.75,"ls":0.66},{"id":"pri","label":"Prioritise","p":[1.9,-0.2,0.8],"c":"amber","shape":"box","size":0.75,"ls":0.44},{"id":"aut","label":"Automation","p":[3.8,2.0,-0.6],"c":"green","shape":"box","size":0.75,"ls":0.44},{"id":"resp","label":"Response","p":[5.7,-0.2,0.8],"c":"green","shape":"shield","size":0.75,"ls":0.44}],"links":[["alert","ti"],["ti","cor"],["cor","risk"],["risk","pri"],["pri","aut"],["aut","resp"]],"steps":["all",["alert"],["ti"],["cor"],["risk"],["pri"],["aut"],["resp"]]},"say":["AI also changes the everyday security workflow, which the chapter breaks into seven steps.","It begins with an AI alert from automated threat detection.","Threat intelligence enriches the alert with context about known threats.","Correlation compares it with historical data.","Risk context builds a comprehensive assessment of what is at stake.","Prioritisation ranks the alert by risk, so the most serious cases come first.","Automation applies predetermined responses.","The final step is the response itself, and the benefits are faster responses, consistent processing and less human error."]}],"keyPoint":"An integration layer (API gateway, data translation, orchestration, security controls and monitoring) links AI to SIEM, EDR, network monitors and scanners. The workflow runs alert → intelligence → correlation → risk context → priority → automation → response.","plain":["The API gateway is the reception desk: visitors sign in before going further.","Data translation is an interpreter between tools that speak different languages.","Orchestration is the conductor keeping every instrument in time.","Prioritising by risk is like hospital triage: the most serious cases are seen first."],"check":{"q":"The SIEM cannot read the AI tool's output format. Which integration component fixes this?","o":["API gateway","Monitoring","Data translation"],"a":2,"e":"Data translation converts formats so tools can understand each other.","retry":{"q":"Which component is the 'reception desk' that controls who may call the AI tool?","o":["Workflow orchestration","API gateway","Correlation"],"a":1,"e":"The API gateway manages secure access."}},"scenario":{"title":"Plugging the AI into the SIEM","setting":"Your organisation has bought an AI threat detection tool and wants its alerts to appear in the existing SIEM, with automatic responses for simple cases.","steps":[{"prompt":"Who should be allowed to call the AI tool's interface?","choices":[{"t":"Only approved systems, through the API gateway with security controls","s":2,"fb":"Right. Access is managed and requests are validated."},{"t":"Any internal system, with no checks","s":1,"fb":"Better than the whole internet, but access should still be managed and validated."},{"t":"Anyone who knows the address","s":0,"fb":"An open interface invites misuse, including model theft."}]},{"prompt":"An AI alert arrives. What happens before any automated response?","choices":[{"t":"The automation acts immediately on every alert","s":0,"fb":"Skipping enrichment and prioritisation leads to poor decisions."},{"t":"Enrichment with threat intelligence, correlation, risk context and prioritisation","s":2,"fb":"Right. Those steps sit between the alert and the automation."},{"t":"An analyst reads every alert by hand first","s":1,"fb":"Safe, but it brings back the volume problem the AI was meant to ease."}]}]},"lab":{"type":"sort","title":"Which component does this?","prompt":"Match each job to the integration component that does it.","buckets":["API gateway","Data translation","Workflow orchestration","Monitoring"],"items":[{"t":"Only lets approved systems call the AI tool","b":0},{"t":"Converts AI output into the format the SIEM expects","b":1},{"t":"Coordinates the steps from alert to response","b":2},{"t":"Warns when a link between two tools stops working","b":3},{"t":"Manages secure access to the AI service","b":0},{"t":"Makes data from different tools compatible","b":1}],"explain":"Each component has one clear job, and together they let new AI tools work with the tools you already have."}},{"title":"Cloud, on-premises or hybrid?","minutes":3,"slides":[{"scene":{"type":"graph","title":"Cloud, on-premises or hybrid: strengths and drawbacks","nodes":[{"id":"cloud","label":"Cloud: managed,\nelastic, global","p":[-4.4,2.2,-0.6],"c":"cyan","shape":"sphere","size":0.95,"ls":0.68},{"id":"onp","label":"On-premises: control,\ncustom hardware","p":[0,2.4,-0.8],"c":"amber","shape":"box","size":0.85,"ls":0.68},{"id":"hyb","label":"Hybrid: flexible,\nmigration path","p":[4.4,2.2,-0.6],"c":"violet","shape":"ico","size":0.9,"ls":0.68},{"id":"cx","label":"Shared responsibility,\ndata residency","p":[-4.4,-0.6,1.0],"c":"red","shape":"torus","size":0.75,"ls":0.62},{"id":"ox","label":"Up-front cost,\nmaintenance","p":[0,-0.6,1.2],"c":"red","shape":"torus","size":0.75,"ls":0.62},{"id":"hx","label":"More complexity,\nintegration work","p":[4.4,-0.6,1.0],"c":"red","shape":"torus","size":0.75,"ls":0.62}],"links":[["cloud","cx",1,"red"],["onp","ox",1,"red"],["hyb","hx",1,"red"]],"steps":["all",["cloud"],["cloud","cx"],["onp"],["onp","ox"],["hyb"],["hyb","hx"]]},"say":["The chapter compares three places to run AI security systems: the cloud, your own premises or a mix of both.","Cloud deployment offers managed services, elastic scaling that grows and shrinks with demand, and global availability.","Its downsides are shared responsibility, where the provider and the customer each secure different parts, and concerns about which country the data is held in.","On-premises deployment, in your own data centre, gives control of the data, custom hardware and compliance benefits.","It needs capital investment up front and carries ongoing maintenance overhead.","Hybrid deployment mixes the two, offering a flexible architecture, spread risk and a path for moving systems over time.","The price is more complexity and harder integration."]},{"scene":{"type":"graph","title":"Balancing three groups of decision factors","nodes":[{"id":"dec","label":"Deployment\ndecision","p":[0,-0.2,1.2],"c":"green","shape":"sphere","size":1.3,"ly":1.75,"spin":true},{"id":"sec","label":"Security: data,\ncompliance, threats","p":[-4.55,1.25,-1.98],"c":"red","shape":"shield","size":0.8,"ly":1.15,"ls":0.72},{"id":"tech","label":"Technical: speed,\nintegration, scale","p":[0.0,1.7,-2.28],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"bus","label":"Business: cost,\nskills, time","p":[4.55,1.25,-1.98],"c":"amber","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72}],"links":[["dec","sec"],["dec","tech"],["dec","bus"]],"steps":["all",["dec","sec"],["dec","tech"],["dec","bus"],"all"]},"say":["So how do you choose?","Security factors include how sensitive the data is, compliance requirements and the threat model, meaning who might attack and how.","Technical factors include performance requirements, integration needs and how much the system must scale.","Business factors include cost limits, the skills available and pressure to reach the market quickly.","The chapter's decision process balances all of these factors rather than letting any single one decide."]}],"keyPoint":"Cloud gives managed, elastic, global services but shared responsibility and data residency questions. On-premises gives control at a capital and maintenance cost. Hybrid is flexible but complex. Weigh security, technical and business factors together.","plain":["Cloud is renting a fully serviced flat; on-premises is owning and maintaining your own house.","Hybrid is keeping valuables at home while renting extra space when you need it.","Data residency is about which country your data physically lives in.","No option is best for everyone, because it depends on your data, your needs and your budget."],"check":{"q":"Which is a drawback of on-premises deployment, according to the chapter?","o":["Capital investment and maintenance overhead","Data residency concerns","Shared responsibility"],"a":0,"e":"Owning the infrastructure means paying up front and maintaining it. The other two are cloud drawbacks.","retry":{"q":"'Renting a fully serviced flat' best describes which option?","o":["On-premises","Hybrid","Cloud"],"a":2,"e":"In the cloud the provider runs and maintains the infrastructure for you."}},"scenario":{"title":"Choosing a home for the AI SOC","setting":"An organisation holds highly sensitive personal data under strict compliance rules, has a small IT team and wants cloud-style scaling for less sensitive work.","steps":[{"prompt":"'The data is highly sensitive' belongs to which group of decision factors?","choices":[{"t":"Business factors","s":1,"fb":"It affects the business, but the chapter lists data sensitivity under security factors."},{"t":"Security factors","s":2,"fb":"Right. Data sensitivity, compliance and the threat model are security factors."},{"t":"Technical factors","s":0,"fb":"Technical factors are performance, integration and scalability."}]},{"prompt":"Which option fits best?","choices":[{"t":"Cloud only","s":0,"fb":"Scaling is attractive, but data residency and shared responsibility worry them for the sensitive data."},{"t":"On-premises only","s":1,"fb":"Good for control, but it means capital cost and maintenance for a small team, and no elastic scaling."},{"t":"Hybrid: sensitive data kept in-house, scalable work in the cloud","s":2,"fb":"Right, as long as they plan for the extra complexity and integration work."}]}]},"lab":{"type":"sort","title":"Which deployment option?","prompt":"Which option does each strength or drawback belong to?","buckets":["Cloud","On-premises","Hybrid"],"items":[{"t":"Elastic scaling and managed services","b":0},{"t":"Data residency concerns","b":0},{"t":"Shared responsibility with the provider","b":0},{"t":"Full control of the data","b":1},{"t":"Capital investment up front","b":1},{"t":"Custom hardware","b":1},{"t":"A path to migrate gradually","b":2},{"t":"Increased integration challenges","b":2},{"t":"Risk spread across environments","b":2}],"explain":"Every option trades something, which is why the chapter balances security, technical and business factors."}},{"title":"Building for scale and speed","minutes":3,"slides":[{"scene":{"type":"graph","title":"What must scale, and how to scale it","nodes":[{"id":"vol","label":"Data volume:\nterabytes a day","p":[-4.4,2.6,-0.8],"c":"slate","shape":"cyl","size":0.8,"ls":0.66},{"id":"users","label":"Many analysts\nat once","p":[0,2.8,-1.0],"c":"slate","shape":"box","size":0.75,"ls":0.66},{"id":"geo","label":"Global\ndeployment","p":[4.4,2.6,-0.8],"c":"slate","shape":"sphere","size":0.8,"ls":0.66},{"id":"hor","label":"Horizontal:\nadd more nodes","p":[-4.4,-0.6,1.0],"c":"cyan","shape":"box","size":0.8,"ls":0.66},{"id":"ver","label":"Vertical: upgrade\ncomponents","p":[0,-0.6,1.2],"c":"amber","shape":"box","size":0.95,"ls":0.66},{"id":"autos","label":"Auto-scaling:\nadjust live","p":[4.4,-0.6,1.0],"c":"green","shape":"torus","size":0.85,"ls":0.66}],"links":[["vol","hor"],["users","ver"],["geo","autos"],["vol","autos"]],"steps":[["vol","users","geo"],["vol"],["users","geo"],["hor"],["ver"],["autos"]]},"say":["AI security systems must grow as demands grow, and the chapter names three scalability requirements.","They must handle data volumes measured in terabytes every day.","They must also support many analysts working at once and deployment across the globe.","Horizontal scaling adds more processing nodes, like opening more checkout tills in a busy shop.","Vertical scaling upgrades individual components, making each one more powerful.","Auto-scaling adjusts resources automatically as demand rises and falls."]},{"scene":{"type":"graph","title":"A high-performance processing pipeline","nodes":[{"id":"ing","label":"Ingestion +\nload balancer","p":[-5.55,0,-0.7],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"str","label":"Stream processing\n+ auto-scaler","p":[-1.85,0,0.7],"c":"violet","shape":"box","size":1,"ly":1.3},{"id":"inf","label":"ML inference\n+ model cache","p":[1.85,0,-0.7],"c":"amber","shape":"ico","size":1,"ly":1.3},{"id":"resp","label":"Response\n+ queues","p":[5.55,0,0.7],"c":"green","shape":"shield","size":1,"ly":1.3}],"links":[["ing","str"],["str","inf"],["inf","resp"]],"steps":["all",["ing"],["str"],["inf"],["resp"],"all"]},"say":["A high-performance pipeline pairs each stage with a helper that keeps it fast.","At ingestion, load balancers spread incoming data evenly across machines.","In stream processing, auto-scalers add or remove capacity to match demand.","For machine learning inference, caches keep models ready for speed, and caching can also hold features and results.","Response systems use queues to coordinate requests and handle them efficiently.","Resource management allocates capacity dynamically, and the chapter's best practice is to design for scale from the very beginning."]}],"keyPoint":"Plan for huge data volumes, many users and global reach. Scale out (horizontal), scale up (vertical) or automatically (auto-scaling), and keep things fast with caching, load balancing, queues and dynamic resource management.","plain":["Horizontal scaling is opening more tills; vertical scaling is giving one cashier a faster till.","Auto-scaling is calling in extra staff at the busy time and sending them home when it is quiet.","A cache keeps the things you use most within arm's reach.","A queue makes sure requests are handled in an orderly way instead of all crashing in at once."],"check":{"q":"Adding more processing nodes to share the load is called…","o":["Vertical scaling","Horizontal scaling","Caching"],"a":1,"e":"Horizontal scaling adds more machines; vertical scaling makes one machine more powerful.","retry":{"q":"In the shop picture, giving one cashier a faster till is…","o":["Horizontal scaling","Auto-scaling","Vertical scaling"],"a":2,"e":"Upgrading a single component is vertical scaling."}},"scenario":{"title":"The morning rush","setting":"Every weekday morning, log volumes triple as people log in, then fall back by midday. At peak, detection slows down noticeably.","steps":[{"prompt":"Which scaling strategy fits a daily peak best?","choices":[{"t":"Auto-scaling, adding capacity at the peak and releasing it afterwards","s":2,"fb":"Right. Auto-scaling adjusts resources dynamically."},{"t":"Vertical scaling once, sized for the peak","s":1,"fb":"It works, but you pay for peak capacity all day."},{"t":"Do nothing, because it recovers by midday","s":0,"fb":"Slow detection at peak gives attackers a window."}]},{"prompt":"Tracing shows the model is reloaded for every request. What helps most?","choices":[{"t":"A longer queue","s":1,"fb":"Queues smooth demand, but each prediction would still be slow."},{"t":"A model cache, keeping the model ready","s":2,"fb":"Right. The chapter pairs ML inference with model caches for speed."},{"t":"Fewer log sources","s":0,"fb":"That reduces visibility rather than fixing the slow step."}]}]},"lab":{"type":"sort","title":"Which way to scale?","prompt":"Which scaling strategy is each action?","buckets":["Horizontal","Vertical","Auto-scaling"],"items":[{"t":"Add three more servers to share the load","b":0},{"t":"Give a server a faster processor and more memory","b":1},{"t":"Capacity grows during a surge, then shrinks again by itself","b":2},{"t":"Add more processing nodes behind a load balancer","b":0},{"t":"Replace a GPU with a more powerful one","b":1},{"t":"Resources drop automatically overnight when traffic falls","b":2}],"explain":"More machines is horizontal, bigger machines is vertical, and automatic adjustment is auto-scaling."}},{"title":"Watching the system: monitoring and tracing","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three pillars of AI infrastructure monitoring","nodes":[{"id":"ai","label":"AI\ninfrastructure","p":[0,-0.2,1.2],"c":"green","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"mp","label":"Model performance:\naccuracy, drift","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"torus","size":0.8,"ly":1.15,"ls":0.72},{"id":"dq","label":"Data quality:\nschema, completeness","p":[0.0,1.7,-2.28],"c":"amber","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72},{"id":"se","label":"Security events:\naccess, anomalies","p":[4.55,1.25,-1.98],"c":"red","shape":"shield","size":0.8,"ly":1.15,"ls":0.72}],"links":[["ai","mp"],["ai","dq"],["ai","se"]],"steps":["all",["ai","mp"],["ai","dq"],["ai","se"],"all"]},"say":["Monitoring keeps AI infrastructure healthy and safe, and the chapter builds it on three pillars.","Model performance monitoring tracks accuracy, measures latency and runs drift detection.","Data quality monitoring validates the schema, meaning the expected structure of the data, checks completeness and tracks quality scores.","Security event monitoring analyses access patterns, detects anomalies and supports attack prevention.","The instructor material adds that alerts need tuning to avoid alert fatigue, and that monitoring must respect privacy."]},{"scene":{"type":"graph","title":"Distributed tracing: one trace ID follows each request","nodes":[{"id":"id","label":"Trace ID:\nfollows the request","p":[0,3.0,-1.4],"c":"amber","shape":"torus","size":0.9,"ls":0.66},{"id":"in","label":"Data\ninput","p":[-5.1,0,-0.4],"c":"cyan","shape":"box","size":0.85,"ls":0.7},{"id":"fe","label":"Feature\nextraction","p":[-1.7,0,0.8],"c":"cyan","shape":"box","size":0.85,"ls":0.7},{"id":"mi","label":"Model\ninference","p":[1.7,0,-0.4],"c":"violet","shape":"ico","size":0.85,"ls":0.7},{"id":"rg","label":"Response\ngeneration","p":[5.1,0,0.8],"c":"green","shape":"shield","size":0.85,"ls":0.7}],"links":[["in","fe",2],["fe","mi",2],["mi","rg",2],["id","in",1,"amber"],["id","rg",1,"amber"]],"steps":[["id"],["id","in"],["in"],["fe"],["mi"],["rg"],"all"]},"say":["Distributed tracing follows a single request as it travels through the whole pipeline.","Each request gets a unique trace ID, a label that stays with it from start to finish.","The data input stage logs the initial request.","Feature extraction records metrics for the processing stage.","Model inference records how long the prediction took.","Response generation records the delivery of the final output.","This end-to-end view reveals bottlenecks, helps with troubleshooting and guides optimisation."]}],"keyPoint":"Monitor model performance (accuracy, latency, drift), data quality (schema, completeness, quality scores) and security events (access patterns, anomalies). Distributed tracing with a trace ID shows where each request spends its time.","plain":["Monitoring is the dashboard of a car: speed, fuel and warning lights.","A schema is the expected layout of a form, so a missing box is easy to spot.","A trace ID is a parcel tracking number for each request.","A bottleneck is the narrow neck of the bottle that slows everything behind it."],"check":{"q":"A model's accuracy slowly falls over several months. Which monitoring pillar should catch this?","o":["Security event monitoring","Data quality monitoring","Model performance monitoring"],"a":2,"e":"Drift detection is part of model performance monitoring.","retry":{"q":"What is a trace ID most like?","o":["A parcel tracking number","A password","A risk score"],"a":0,"e":"It follows one request through every stage, just as a tracking number follows a parcel."}},"scenario":{"title":"Why are alerts so slow?","setting":"Alerts used to arrive within seconds of an event, but now they take much longer, and nobody can tell which part of the pipeline is slow.","steps":[{"prompt":"What will show where the time goes?","choices":[{"t":"Check the overall CPU usage of the servers","s":1,"fb":"A clue, but it will not show which stage each request is stuck in."},{"t":"Restart everything and hope","s":0,"fb":"That hides the problem without finding it."},{"t":"Distributed tracing with a unique trace ID for each request","s":2,"fb":"Right. Tracing shows the timing of every stage."}]},{"prompt":"Tracing shows feature extraction now takes most of the time. What have you found?","choices":[{"t":"A performance bottleneck in the feature extraction stage","s":2,"fb":"Right. Finding bottlenecks is a key benefit of tracing."},{"t":"A data quality problem","s":1,"fb":"Possibly linked, but tracing measures timing, so this is a performance bottleneck first."},{"t":"Nothing useful","s":0,"fb":"You now know exactly where to focus."}]},{"prompt":"Someone is querying the model's interface at 3 am from an unfamiliar system. Which pillar should notice?","choices":[{"t":"Model performance monitoring","s":1,"fb":"It might see a change in load, but this is a security event."},{"t":"Security event monitoring of access patterns","s":2,"fb":"Right. Unusual access patterns are a security event."},{"t":"No pillar covers this","s":0,"fb":"Access pattern analysis is exactly this pillar's job."}]}]},"lab":{"type":"sort","title":"Which monitoring pillar?","prompt":"Which pillar would track each item?","buckets":["Model performance","Data quality","Security events"],"items":[{"t":"Accuracy of predictions over time","b":0},{"t":"Drift detection","b":0},{"t":"Response latency","b":0},{"t":"Records match the expected schema","b":1},{"t":"No missing fields in incoming data","b":1},{"t":"Quality score for each data source","b":1},{"t":"Unusual access to the model's interface","b":2},{"t":"Anomalies in who connects and when","b":2}],"explain":"Watch the model, the data it eats and the people and systems that touch it."}},{"title":"Disaster recovery and high availability","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three domains of disaster recovery for AI security","nodes":[{"id":"drc","label":"Disaster\nrecovery","p":[0,-0.2,1.2],"c":"amber","shape":"torus","size":1.3,"ly":1.75,"spin":true},{"id":"data","label":"Data: models,\ntraining data, config","p":[-4.55,1.25,-1.98],"c":"violet","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72},{"id":"infra","label":"Infrastructure:\ncompute, storage, links","p":[0.0,1.7,-2.28],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"svc","label":"Services: detection,\nresponse, analytics","p":[4.55,1.25,-1.98],"c":"green","shape":"shield","size":0.8,"ly":1.15,"ls":0.72}],"links":[["drc","data"],["drc","infra"],["drc","svc"]],"steps":["all",["drc","data"],["drc","infra"],["drc","svc"],["data"],"all"]},"say":["Disaster recovery, or DR, is the plan for restoring service after a serious failure, and the chapter organises it into three domains.","Data protection backs up trained models and their parameters, preserves training datasets and keeps copies of configuration settings.","Infrastructure recovery restores GPU and CPU capacity, keeps redundant storage available and provides alternative network paths.","Service restoration brings back threat detection through backup monitoring, emergency incident response procedures and the analytics platform.","The instructor material stresses that AI brings its own recovery challenges, because the models and their training data must be restored too, not just the servers.","Plans should set a recovery time objective, how quickly each capability must return, and a recovery point objective, how much recent data you can afford to lose."]},{"scene":{"type":"graph","title":"High availability: fail over to a secondary site","cam":[0,4.4,13],"nodes":[{"id":"pri","label":"Primary site:\nlive models, data","p":[-5.2,1.0,0],"c":"green","shape":"box","size":0.95,"ls":0.68},{"id":"rep","label":"Continuous\nreplication","p":[0,2.9,-1.2],"c":"cyan","shape":"sphere","size":0.8,"ls":0.66},{"id":"sec","label":"Secondary site:\nbackup models, data","p":[5.2,1.0,0],"c":"slate","shape":"box","size":0.95,"ls":0.68},{"id":"det","label":"Failure\ndetection","p":[-2.2,-0.8,1.2],"c":"red","shape":"torus","size":0.8,"ls":0.66},{"id":"fo","label":"Automated\nfailover","p":[2.2,-0.8,1.2],"c":"amber","shape":"shield","size":0.8,"ls":0.66},{"id":"rec","label":"Service\nrecovery","p":[5.2,-1.0,2.2],"c":"green","shape":"sphere","size":0.7,"ls":0.62}],"links":[["pri","rep",2],["rep","sec",2],["pri","det",1,"red"],["det","fo",1,"red"],["fo","sec",1,"amber"],["sec","rec",1,"green"]],"steps":[["pri","sec"],["pri"],["rep","sec"],["det"],["fo","sec"],["rec"],"all"]},"say":["High availability keeps AI security running even when a whole site fails.","The primary site runs the live AI models and holds the training data.","Replication continuously copies data to a secondary site, which holds backup models and replicated data.","Automated monitoring detects a failure.","Automated failover immediately activates the secondary site.","Service recovery then restores full capability.","The result is continuous availability during disasters, preserved data integrity and less downtime, which keeps the business running."]}],"keyPoint":"Disaster recovery covers data (models, training data, configuration), infrastructure (compute, storage, network) and services (detection, response, analytics). High availability replicates to a secondary site and fails over automatically.","plain":["Backing up a trained model is like keeping a copy of a finished book, not just the notes.","A recovery time objective is how long you can manage without the service.","A recovery point objective is how much recent work you can afford to lose.","Automatic failover is a spare generator that starts by itself when the power cuts out."],"check":{"q":"Which item belongs to the data protection domain of disaster recovery?","o":["Backups of trained models","Alternative network paths","Emergency incident response procedures"],"a":0,"e":"Data protection covers model backups, training data and configuration data.","retry":{"q":"A spare generator that starts by itself when the power fails is most like…","o":["Replication","Automated failover","A recovery point objective"],"a":1,"e":"Failover switches to the backup automatically when the primary fails."}},"scenario":{"title":"The power cut","setting":"A power failure takes the primary data centre offline during a working day. The AI threat detection system runs there.","steps":[{"prompt":"In a high-availability design, what should happen?","choices":[{"t":"Staff meet to decide whether to switch to the secondary site","s":1,"fb":"It may work eventually, but the design calls for automated failover."},{"t":"Failure detection triggers automated failover to the secondary site","s":2,"fb":"Right. Automation cuts downtime."},{"t":"Analysts wait for the power to return","s":0,"fb":"That leaves the organisation unprotected."}]},{"prompt":"The secondary site comes up, but it has last year's model and old data. What was missing?","choices":[{"t":"Extra GPUs at the secondary site","s":0,"fb":"Hardware was there; the up-to-date model and data were not."},{"t":"Backups of configuration settings","s":1,"fb":"Useful, but the main gap is the model and its data."},{"t":"Model backups and continuous replication of models and data","s":2,"fb":"Right. AI-specific DR must restore the models and their data."}]}]},"lab":{"type":"order","title":"Fail over safely","prompt":"Put the high-availability flow in order.","items":["Primary site runs the live AI models","Data is replicated continuously to the secondary site","Monitoring detects a failure","Automated failover activates the secondary site","Full service capability is restored"],"explain":"Replication happens all the time, so when failure is detected the secondary site is ready to take over."}},{"title":"Measuring success and planning the journey","minutes":4,"slides":[{"scene":{"type":"graph","title":"Measuring success: security, performance and business","nodes":[{"id":"secm","label":"Security metrics:\ndetection, MTTD, MTTR","p":[-4.4,2.3,-0.6],"c":"red","shape":"shield","size":0.9,"ls":0.66},{"id":"perf","label":"Performance metrics:\nuptime, speed","p":[0,2.6,-1.0],"c":"cyan","shape":"box","size":0.8,"ls":0.66},{"id":"busm","label":"Business metrics:\ncost, ROI, compliance","p":[4.4,2.3,-0.6],"c":"amber","shape":"cyl","size":0.9,"ls":0.66},{"id":"rev","label":"Best practice:\nsecurity in every layer","p":[0,-0.6,1.4],"c":"green","shape":"torus","size":1.0,"ls":0.68}],"links":[["secm","rev",1,"green"],["perf","rev",1,"green"],["busm","rev",1,"green"]],"steps":[["secm","perf","busm"],["secm"],["secm"],["perf"],["busm"],["rev"]]},"say":["How do you know whether an AI security architecture is working?","The chapter suggests security targets such as threat detection accuracy above 95 per cent and false positive rates below 5 per cent.","It also tracks mean time to detect and mean time to respond, known as MTTD and MTTR, which measure how long attacks take to spot and to deal with.","Performance targets include availability above 99 point 9 per cent, processing in under 5 seconds, throughput in events per second and efficient use of resources.","Business metrics cover total cost of ownership, return on investment, staff productivity and compliance rates.","Best practice is to build security into every layer as defence in depth, review the architecture regularly and keep up with new threats and technologies."]},{"scene":{"type":"graph","title":"A phased roadmap, and what lies ahead","cam":[0,4.4,13],"nodes":[{"id":"p1","label":"Foundation:\nmonths 1 to 3","p":[-5.4,-0.2,-0.2],"c":"cyan","shape":"box","size":0.85,"ls":0.68},{"id":"p2","label":"Pilot:\nmonths 4 to 9","p":[-1.8,-0.2,0.8],"c":"violet","shape":"box","size":0.85,"ls":0.68},{"id":"p3","label":"Scale:\nmonths 10 to 18","p":[1.8,-0.2,-0.2],"c":"amber","shape":"box","size":0.85,"ls":0.68},{"id":"p4","label":"Mature:\nmonth 19 on","p":[5.4,-0.2,0.8],"c":"green","shape":"shield","size":0.85,"ls":0.68},{"id":"fut","label":"Ahead: quantum,\nedge AI, zero trust","p":[0,2.9,-1.4],"c":"pink","shape":"sphere","size":0.8,"ls":0.66}],"links":[["p1","p2",2],["p2","p3",2],["p3","p4",2],["p4","fut",1,"pink"]],"steps":["all",["p1"],["p2"],["p3"],["p4"],["p1","p2","p3","p4"],["p1","p2","p3","p4"],["fut"]]},"say":["The chapter closes with a phased roadmap.","In the foundation phase, months one to three, assess the current architecture, define AI security requirements, draw up a roadmap and start staff training.","In the pilot phase, months four to nine, deploy limited AI capabilities, integrate them with existing systems, validate performance and security and refine procedures.","In the scale and optimise phase, months ten to eighteen, move to full deployment with performance tuning, advanced features and comprehensive monitoring.","Mature operations, from month nineteen, bring continuous improvement, advanced threat hunting and strategic evolution of the architecture.","Success needs leadership support, staff development, structured change management, clear measures and alignment with business goals, as well as good technology.","Common pitfalls include poor scalability planning, weak data quality, too little training, unrealistic timelines, vendor lock-in, ignored compliance and underestimated costs.","Looking ahead, the chapter flags quantum computing, edge AI, federated learning, rules on explainable AI and zero-trust architecture, so the design must keep evolving."]}],"keyPoint":"Measure security, performance and business results. Move in phases: foundation, pilot, scale and optimise, then mature operations. Success balances technical excellence, organisational readiness and strategic alignment.","plain":["MTTD is how long it takes to notice the fire; MTTR is how long it takes to put it out.","Total cost of ownership includes running costs, not just the purchase price.","Vendor lock-in is buying a printer that only takes one shop's expensive ink.","A pilot is a dress rehearsal before opening night."],"check":{"q":"Which of these is a strategic pitfall listed in the chapter?","o":["A phased implementation","Vendor lock-in without evaluation","Regular architecture reviews"],"a":1,"e":"Locking into a vendor without evaluating options is a strategic pitfall; the others are good practice.","retry":{"q":"What does MTTR measure?","o":["How long it takes to respond to an attack","How many alerts are false","How much the system costs"],"a":0,"e":"Mean time to response measures how quickly attacks are dealt with."}},"scenario":{"title":"The board review","setting":"You present your AI-enhanced SOC plan to the board. They want proof it will work and ask for full deployment within two months.","steps":[{"prompt":"How will you show that it works?","choices":[{"t":"Detection accuracy alone","s":1,"fb":"A good start, but it hides false positives, speed and cost."},{"t":"The number of AI tools purchased","s":0,"fb":"Buying tools says nothing about results."},{"t":"Security, performance and business metrics, such as detection accuracy, MTTD, availability and return on investment","s":2,"fb":"Right. The chapter's framework covers all three."}]},{"prompt":"How do you answer the two-month deadline?","choices":[{"t":"Propose a phased roadmap, starting with a foundation phase and a pilot","s":2,"fb":"Right. The chapter warns against unrealistic timelines."},{"t":"Agree, and add staff training afterwards","s":1,"fb":"Training late is better than never, but the timeline itself is the pitfall."},{"t":"Agree, and skip compliance checks to save time","s":0,"fb":"Ignoring compliance is one of the chapter's strategic pitfalls."}]}]},"lab":{"type":"spot","title":"Spot the pitfalls","prompt":"Here is a draft project plan for a new AI-enhanced SOC. Find the pitfalls the chapter warns about.","parts":[{"lbl":"Scope","t":"Start with a pilot in one area, then scale up","bad":false,"why":"That matches the phased roadmap."},{"lbl":"Timeline","t":"Full AI SOC live across the organisation in six weeks","bad":true,"why":"An unrealistic timeline is an organisational pitfall."},{"lbl":"Capacity","t":"Size the servers for today's data volumes only","bad":true,"why":"That is insufficient scalability planning."},{"lbl":"Data","t":"Validate and cleanse all data before it reaches the models","bad":false,"why":"A quality data pipeline is a success factor."},{"lbl":"Vendor","t":"Sign a five-year deal with the first vendor we met","bad":true,"why":"Vendor lock-in without evaluation is a strategic pitfall."},{"lbl":"Training","t":"Staff will pick up the new tools as they go","bad":true,"why":"Insufficient staff training is an organisational pitfall."},{"lbl":"Compliance","t":"Check regulatory requirements after launch","bad":true,"why":"Ignoring compliance requirements is a strategic pitfall."},{"lbl":"Budget","t":"Budget covers licences only, not running costs","bad":true,"why":"That underestimates the total cost of ownership."},{"lbl":"Measures","t":"Track detection accuracy, false positives, MTTD and MTTR","bad":false,"why":"Measuring success is what the chapter asks for."},{"lbl":"Sponsor","t":"Executive sponsor agreed and funding approved","bad":false,"why":"Leadership support is a success factor."}],"explain":"Most failures come from planning, people and strategy, not just technology, which is why the chapter balances all three."}}],"test":[{"q":"Which is an example of AI security, rather than AI for cybersecurity?","o":["Automated threat detection","Behaviour analytics","Preventing model theft"],"a":2,"e":"AI security protects the AI itself, for example from model theft. The other two use AI to defend.","lesson":0},{"q":"Which counter does the chapter pair with model theft?","o":["Rate limiting and model protection","Adversarial training","Data cleansing"],"a":0,"e":"Limiting queries and protecting the model makes extraction harder.","lesson":0},{"q":"Which is a limitation of the traditional SOC named in the chapter?","o":["Too few log sources","Alert fatigue","Too much automation"],"a":1,"e":"The chapter lists volume overload, alert fatigue and delayed response times.","lesson":1},{"q":"Which three platforms make up the AI-enhanced SOC?","o":["Firewall, antivirus and email filter","Data collection, analysis and response teams","Real-time data platform, AI analytics engine and automated response platform"],"a":2,"e":"These three platforms replace the largely manual traditional tiers.","lesson":1},{"q":"According to the chapter, how should resistance to AI be addressed?","o":["By keeping the project secret","Through transparency and showing AI augments people","By replacing resistant staff"],"a":1,"e":"Transparency, training and phased change address resistance.","lesson":2},{"q":"Which pipeline stage checks format and looks for malicious content?","o":["Validation","Enrichment","Quality assurance"],"a":0,"e":"Validation is the first security control on incoming data.","lesson":3},{"q":"Which phase of machine learning needs low latency and continuous operation?","o":["Training","Inference","Both equally"],"a":1,"e":"Inference answers live requests; training needs power and storage over long runs.","lesson":4},{"q":"In the model lifecycle, what happens at retirement?","o":["Secure decommissioning and data sanitisation","Bias assessment","Drift detection"],"a":0,"e":"Retired models are switched off securely and their data wiped.","lesson":5},{"q":"Which deployment strategy rolls out gradually to validate a new model?","o":["Blue-green","A/B testing","Canary"],"a":2,"e":"A canary release sends a small share of traffic to the new model first.","lesson":5},{"q":"What does the API gateway do in the integration architecture?","o":["Converts data formats","Manages secure access","Tracks integration health"],"a":1,"e":"The gateway controls who can call the AI tool.","lesson":6},{"q":"A drawback of on-premises deployment is…","o":["Data residency concerns","Capital investment and maintenance overhead","Shared responsibility"],"a":1,"e":"Data residency and shared responsibility are cloud drawbacks.","lesson":7},{"q":"Adding more processing nodes is called…","o":["Horizontal scaling","Vertical scaling","Caching"],"a":0,"e":"Horizontal scaling adds machines; vertical scaling upgrades them.","lesson":8},{"q":"What does a unique trace ID let you do?","o":["Encrypt the request","Follow one request through the whole pipeline","Rank alerts by risk"],"a":1,"e":"Tracing shows the timing of every stage for each request, revealing bottlenecks.","lesson":9},{"q":"Which belongs to the data protection domain of disaster recovery?","o":["Alternative network paths","Emergency incident response procedures","Backups of trained models"],"a":2,"e":"Data protection covers model backups, training data and configuration.","lesson":10},{"q":"Which is a strategic pitfall listed in the chapter?","o":["Vendor lock-in without evaluation","Phased implementation","Regular architecture reviews"],"a":0,"e":"Locking into one vendor without evaluation is a strategic pitfall.","lesson":11},{"q":"What does the roadmap's foundation phase include?","o":["Advanced threat hunting","Full-scale deployment","Assessing the current architecture and starting staff training"],"a":2,"e":"Foundation, in months one to three, comes before the pilot and full deployment.","lesson":11}]};
