/* Chapter 8: Threat Modelling and Secure Design Best Practices for AI-Enhanced Systems (Guide to AI for Cybersecurity) */
const CH = {"id":"ch08","num":"8","title":"Threat Modelling and Secure Design Best Practices for AI-Enhanced Systems","summary":"How to find and fix AI-specific threats at design time: STRIDE plus AI threat families, a seven-step threat modelling method, secure design principles and architecture, AI agents that assist threat modelling, and sustainable AI design.","outcomes":["Explain why AI adds data, model and supply chain attack surfaces","Apply STRIDE and the six AI-specific threat families","Run a seven-step threat model and rank risk by likelihood and impact","Apply traditional and AI-specific secure design principles","Use a zoned reference architecture and secure design patterns","Evaluate AI agents for threat modelling and design sustainable AI"],"starter":[{"q":"Can a model with no coding bugs still be attacked?","o":["No","Yes, through its data and learned behaviour"],"a":1,"e":"Data and models are attack surfaces in their own right."},{"q":"Risk is commonly scored as…","o":["Likelihood × impact","Cost × time","Users × servers"],"a":0,"e":"Lesson 4 uses this to rank threats."},{"q":"Should training and live prediction run on the same server?","o":["Yes, it is simpler","No, they should be isolated"],"a":1,"e":"Isolation contains compromise in training."}],"lessons":[{"title":"Why traditional security is not enough","minutes":3,"slides":[{"scene":{"type":"graph","title":"AI adds three new attack surfaces","nodes":[{"id":"code","label":"Code and\ninfrastructure","p":[-5.2,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"data","label":"Training\ndata","p":[-1.73,1.5,0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"model","label":"The trained\nmodel","p":[1.73,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"sc","label":"ML supply chain:\nlibraries, datasets,\npre-trained models","p":[5.2,1.5,0.3],"c":"amber","shape":"torus","size":0.8,"ls":0.62}],"links":[],"steps":["all",["code"],["data"],["model"],["sc"],"all"]},"say":["Welcome to Chapter 8, Threat Modelling and Secure Design Best Practices for AI-Enhanced Systems, and I'm Sam, your tutor. The cheapest time to fix a security problem is at design, before any code exists.","Traditional security concentrates on code and infrastructure, because that is where a normal system's behaviour comes from.","In AI, much behaviour is learned from training data, so the data becomes a target.","The trained model, which captures what was learned, can be fooled, copied or made to leak information, even if its code has no bugs.","And the machine learning supply chain, the libraries, datasets and pre-trained models teams reuse, can be compromised before you ever touch it.","Reported figures suggest many organisations have had AI-related incidents, and tricks crafted against one model often transfer to another. Treat the numbers as illustrative; the point is that AI brings new attack routes."]}],"keyPoint":"AI systems can be attacked through their data, their models and their supply chain, not only their code. Design is the cheapest place to deal with this.","plain":["A perfectly coded model can still be fooled.","Transfer means attackers can practise on their own copy.","The supply chain is everything you borrow and build on.","Headline statistics here are reported, not verified."],"check":{"q":"Why can an AI model with bug-free code still be insecure?","o":["Its behaviour is learned from data that can be attacked","Bug-free code is impossible","AI never uses code"],"a":0,"e":"Data and the learned model are attack surfaces in their own right.","retry":{"q":"What does it mean that adversarial examples 'transfer'?","o":["A trick that fools one model often fools another","They move between data centres","They are emailed"],"a":0,"e":"Attackers can rehearse on a copy, then attack the real system."}},"scenario":{"title":"Leave it to testing","setting":"A project manager wants to postpone security until the testing phase to hit a deadline.","steps":[{"prompt":"What is the strongest argument against?","choices":[{"t":"Design-stage fixes are cheapest; data and model risks are baked in later","s":2,"fb":"Right. Late fixes are costly and incomplete."},{"t":"Testers dislike security","s":0,"fb":"Not an argument."},{"t":"There is no argument","s":0,"fb":"The evidence favours early security."}]},{"prompt":"Which new asset must the threat model include?","choices":[{"t":"The training data and the trained model","s":2,"fb":"Right. They are new attack surfaces."},{"t":"Only the web server","s":0,"fb":"That misses the AI-specific risks."},{"t":"The office printer","s":0,"fb":"Not the priority."}]}]},"lab":{"type":"sort","title":"Old surface or new?","prompt":"Is each item a traditional or an AI-specific attack surface?","buckets":["Traditional","AI-specific"],"items":[{"t":"A web server missing patches","b":0},{"t":"Training data from a public collection","b":1},{"t":"A downloaded pre-trained model","b":1},{"t":"A weak administrator password","b":0},{"t":"The model's prediction outputs","b":1}],"explain":"Traditional controls still matter, but AI adds new places to attack."}},{"title":"STRIDE and AI-specific threats","minutes":4,"slides":[{"scene":{"type":"graph","title":"STRIDE: six classic threat types","nodes":[{"id":"s","label":"Spoofing","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"t","label":"Tampering","p":[3.64,1.9,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"r","label":"Repudiation","p":[3.64,-0.7,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"i","label":"Information\ndisclosure","p":[0.0,-2.0,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"d","label":"Denial of\nservice","p":[-3.64,-0.7,0],"c":"red","shape":"sphere","size":0.8,"ls":0.6},{"id":"e","label":"Elevation of\nprivilege","p":[-3.64,1.9,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6}],"links":[],"steps":["all",["s"],["t"],["r"],["i"],["d"],["e"],"all"],"orbit":0.4},"say":["Threat modelling means systematically working out what threats a system faces, how likely and harmful they are, and what to do about them. STRIDE, from Microsoft, is a memory aid.","Spoofing is pretending to be someone else.","Tampering is changing data without permission, such as altering training data.","Repudiation is being able to deny an action because there are no audit logs.","Information disclosure is data leaking, such as a model's learned parameters.","Denial of service is overloading the system, such as the prediction service.","Elevation of privilege is gaining more access than you should.","STRIDE still applies, but it does not naturally prompt designers to think about poisoning or model theft, so AI-specific threat families are added. MITRE ATLAS extends the ATT&CK catalogue to machine learning."]},{"scene":{"type":"graph","title":"Six AI threat families","nodes":[{"id":"po","label":"Data\npoisoning","p":[0.0,3.2,0],"c":"red","shape":"cyl","size":0.8,"ls":0.6},{"id":"ad","label":"Adversarial\ninputs","p":[3.64,1.9,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"ex","label":"Model\nextraction","p":[3.64,-0.7,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"pi","label":"Privacy\ninference","p":[0.0,-2.0,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"bd","label":"Backdoors","p":[-3.64,-0.7,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"sc","label":"Supply\nchain","p":[-3.64,1.9,0],"c":"slate","shape":"torus","size":0.8,"ls":0.6}],"links":[],"steps":["all",["po"],["ad"],["ex"],["pi"],["bd"],["sc"],"all"],"orbit":0.4},"say":["Six families of threat are unique to machine learning.","Data poisoning slips harmful samples or wrong labels into training data.","Adversarial inputs are tiny, often invisible changes that cause a confident wrong answer.","Model extraction copies a model by querying it many times and training a look-alike.","Privacy inference includes membership inference, testing whether a person's record was in the training data.","Backdoors are hidden triggers planted during training that make the model misbehave on cue.","Supply chain attacks come through compromised libraries, datasets or pre-trained models.","They are unique because the system's behaviour is learned rather than written as rules."]}],"keyPoint":"Use STRIDE plus the six AI threat families: poisoning, adversarial inputs, extraction, privacy inference, backdoors and supply chain.","plain":["STRIDE is a checklist so you do not forget a category.","Poisoning fits 'tampering', but that label does not tell you what to do.","Membership inference can reveal that someone is a patient without seeing their record.","ATLAS is the machine learning version of ATT&CK."],"check":{"q":"Copying a model by sending it many queries and training a look-alike is…","o":["Model extraction","Data poisoning","Spoofing"],"a":0,"e":"The attacker only needs ordinary, permitted access.","retry":{"q":"Which STRIDE letter does missing audit logs make possible?","o":["Repudiation","Spoofing","Elevation of privilege"],"a":0,"e":"Without logs, people can deny what they did."}},"scenario":{"title":"The leaky hospital model","setting":"A researcher shows they can tell whether a named person's record was used to train a hospital's model.","steps":[{"prompt":"Which threat is this?","choices":[{"t":"Membership inference","s":2,"fb":"Right. It is a privacy inference attack."},{"t":"Denial of service","s":0,"fb":"Nothing is overloaded."},{"t":"Backdoor","s":0,"fb":"No hidden trigger is involved."}]},{"prompt":"Why does it matter if they never see the data?","choices":[{"t":"Being in a hospital dataset can itself reveal a diagnosis","s":2,"fb":"Right. Membership is sensitive."},{"t":"It does not matter","s":0,"fb":"It is a privacy breach."},{"t":"It only matters for celebrities","s":0,"fb":"It matters for everyone."}]}]},"lab":{"type":"sort","title":"Name the AI threat","prompt":"Match each scenario to its AI threat family.","buckets":["Poisoning","Adversarial input","Extraction","Privacy inference","Backdoor","Supply chain"],"items":[{"t":"Mislabelled images slipped into a public dataset","b":0},{"t":"A sticker makes a sign classifier misread a stop sign","b":1},{"t":"A competitor queries your API 2 million times to copy it","b":2},{"t":"Testing whether a person's record trained the model","b":3},{"t":"A model behaves normally until a secret pattern appears","b":4},{"t":"A popular ML library is published with hidden malware","b":5}],"explain":"Naming the threat points to the right defence."}},{"title":"Deep dive: poisoning and extraction","minutes":4,"slides":[{"scene":{"type":"graph","title":"How a poisoned model passes every normal test","nodes":[{"id":"cl","label":"Clean-looking samples\nwith hidden trigger","p":[-5.2,0.0,-0.3],"c":"amber","shape":"cyl","size":0.8,"ls":0.62},{"id":"tr","label":"Model trains and\nlearns a false link","p":[-1.73,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"va","label":"Passes normal\nvalidation","p":[1.73,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"tg","label":"Misbehaves only\nwhen trigger appears","p":[5.2,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["cl","tr",2],["tr","va",2],["va","tg",2]],"steps":["all",["cl"],["tr"],["va"],["tg"]]},"say":["In a poisoning attack, an attacker contributes clean-looking samples to a dataset many teams use, some carrying a subtle trigger and a wrong label.","The model learns to link the trigger with the wrong answer.","On normal test data it behaves perfectly, so it passes validation. Research known as BadNets showed this.","Only when the trigger appears in real use does it misbehave. Unlike a coding bug, there is nothing to patch: the damage stays until the model is retrained on clean data.","Defences are provenance tracking, recording where every piece of data came from, statistical anomaly checks, expert review, tamper-evident pipelines and retraining from trusted data."]},{"scene":{"type":"graph","title":"Stealing a model without breaking in","nodes":[{"id":"q","label":"Query\nsystematically","p":[-5.2,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"an","label":"Analyse\noutputs","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"su","label":"Train a\nsurrogate copy","p":[1.73,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"re","label":"Replicate:\nuse, sell, rehearse","p":[5.2,1.5,0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62}],"links":[["q","an",2],["an","su",2],["su","re",2]],"steps":["all",["q"],["an"],["su"],["re"],"all"]},"say":["A trained model is valuable intellectual property, and extraction steals it through the front door.","The attacker sends many carefully chosen queries to the public prediction service.","They record and analyse the answers.","They train a substitute, called a surrogate, on those question-and-answer pairs.","The copy can be used for free, sold, or used to rehearse attacks offline.","Defend in three layers. Prevent with rate limits, returning a label rather than exact confidence, and watermarking. Detect by monitoring query patterns. Respond by alerting and blocking."]}],"keyPoint":"Poisoning corrupts what a model learns and passes normal tests; defend with provenance and checks. Extraction copies a model through permitted queries; defend with limits, less detail, watermarks and monitoring.","plain":["Poisoning is like a spy teaching a guard dog to ignore one particular whistle.","Provenance is a pedigree certificate for data.","Extraction is copying a recipe by tasting the dish thousands of times.","Returning less detail slows thieves but may reduce usefulness."],"check":{"q":"Why can a poisoned model pass normal validation?","o":["It only misbehaves when the hidden trigger appears","Validation is always broken","Poisoned models are slower"],"a":0,"e":"Normal test data never contains the trigger.","retry":{"q":"Which control most directly limits model extraction?","o":["Rate limiting queries per user","Stronger office locks","More training data"],"a":0,"e":"Fewer queries means a poorer copy."}},"scenario":{"title":"Two million queries","setting":"Monitoring shows one account sent two million systematically varied queries to your fraud model this week.","steps":[{"prompt":"What is the likely threat?","choices":[{"t":"Model extraction","s":2,"fb":"Right. Systematic probing is the signature."},{"t":"Normal heavy use","s":1,"fb":"Possible, but the pattern is suspicious."},{"t":"Data poisoning","s":0,"fb":"Poisoning targets training data."}]},{"prompt":"What is the best response?","choices":[{"t":"Throttle or block the account and review its pattern","s":2,"fb":"Right. Detect, then respond."},{"t":"Return even more detail","s":0,"fb":"That helps the thief."},{"t":"Retrain the model immediately","s":0,"fb":"Retraining does not stop the copying."}]}]},"lab":{"type":"order","title":"How extraction works","prompt":"Put the steps of a model extraction attack in order.","items":["Send systematic queries","Record and analyse outputs","Train a surrogate model","Use or sell the copy"],"explain":"Every step uses ordinary access, which is why monitoring matters."}},{"title":"A seven-step threat modelling method","minutes":4,"slides":[{"scene":{"type":"graph","title":"A repeatable process","nodes":[{"id":"s1","label":"1. Define scope\nand context","p":[-5.7,0.0,-0.3],"c":"cyan","shape":"box","size":0.7,"ls":0.62},{"id":"s2","label":"2. Draw architecture\nand data flows","p":[-3.8,1.5,0.3],"c":"slate","shape":"box","size":0.7,"ls":0.62},{"id":"s3","label":"3. Identify assets\nand objectives","p":[-1.9,0.0,-0.3],"c":"violet","shape":"box","size":0.7,"ls":0.62},{"id":"s4","label":"4. Enumerate\nthreats","p":[0.0,1.5,0.3],"c":"amber","shape":"box","size":0.7,"ls":0.62},{"id":"s5","label":"5. Assess and\nprioritise risk","p":[1.9,0.0,-0.3],"c":"red","shape":"box","size":0.7,"ls":0.62},{"id":"s6","label":"6. Mitigate and record\nresidual risk","p":[3.8,1.5,0.3],"c":"green","shape":"shield","size":0.7,"ls":0.62},{"id":"s7","label":"7. Validate\nand iterate","p":[5.7,0.0,-0.3],"c":"pink","shape":"torus","size":0.7,"ls":0.62}],"links":[["s1","s2",2],["s2","s3",2],["s3","s4",2],["s4","s5",2],["s5","s6",2],["s6","s7",2]],"steps":["all",["s1"],["s2"],["s3"],["s4"],["s5"],["s6"],["s7"]]},"say":["The chapter gives a seven-step method you can use on any AI system.","Define scope: what is in, what is out, and where the AI components sit.","Draw data flow diagrams with trust boundaries, the lines where data passes between areas trusted to different degrees. Most threats appear there.","List assets and what matters for each: confidentiality, kept secret; integrity, kept correct; availability, kept working.","Enumerate threats with STRIDE plus the AI families.","Rate likelihood and impact from 1 to 5 and multiply. Poisoning a medical model may be less likely than extraction, but far more harmful.","Choose preventive, detective and responsive controls, and record the residual risk, what is left afterwards. Accepted risk is residual risk a named owner has formally agreed to.","Validate with reviews and penetration testing, and keep the model up to date as the system changes."]}],"keyPoint":"Scope, diagram, assets, threats, risk, mitigations, validation. Risk = likelihood × impact. Record residual risk and who accepted it.","plain":["Trust boundaries are like border crossings: that is where you check passports.","A rubric defining 1, 3 and 5 helps teams agree scores.","Controls prevent, detect or respond.","A threat model is a living document."],"check":{"q":"A threat has likelihood 2 and impact 5. What is its risk score?","o":["7","10","3"],"a":1,"e":"Risk = likelihood × impact = 2 × 5 = 10.","retry":{"q":"In the border picture, why focus on trust boundaries?","o":["Most threats appear where data crosses between trust levels","They are the prettiest part of the diagram","They have no data"],"a":0,"e":"Check data where it crosses boundaries."}},"scenario":{"title":"Disagreeing scores","setting":"Two analysts rate the likelihood of the same threat as 1 and 5.","steps":[{"prompt":"What should you do?","choices":[{"t":"Use a shared rubric and discuss evidence to calibrate","s":2,"fb":"Right. Calibrate through discussion."},{"t":"Average them and move on","s":1,"fb":"Better than nothing, but hides the disagreement."},{"t":"Pick the lower score","s":0,"fb":"That may understate risk."}]},{"prompt":"Who may accept a residual risk?","choices":[{"t":"A named owner with the authority to do so","s":2,"fb":"Right. Acceptance must be formal and owned."},{"t":"Any developer","s":0,"fb":"Acceptance needs authority."},{"t":"Nobody, all risk must be zero","s":0,"fb":"Zero risk is impossible."}]}]},"lab":{"type":"order","title":"Run the method","prompt":"Put the seven threat modelling steps in order.","items":["Define scope and context","Draw architecture and data flows","Identify assets and objectives","Enumerate threats","Assess and prioritise risk","Mitigate and record residual risk","Validate and iterate"],"explain":"Repeat the cycle whenever the system, data or attacks change."}},{"title":"Secure design principles for AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"Eight AI principles in four themes","nodes":[{"id":"iso","label":"Contain:\nisolation and\ncontainment","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"prov","label":"Know data and models:\nprovenance and\nlineage","p":[-1.73,1.5,0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62},{"id":"rob","label":"Resist attack:\nrobustness and\nvalidation","p":[1.73,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"ppl","label":"Respect people:\nprivacy and\ntransparency","p":[5.2,1.5,0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[],"steps":["all",["iso"],["prov"],["rob"],["ppl"],"all"]},"say":["Classic principles still apply with AI meanings: least privilege, so the prediction service cannot change model weights; defence in depth; fail-safe defaults; separation of concerns, keeping training and prediction on separate systems; and complete mediation, checking every request every time.","Contain the model: isolate training from live use, and make the model hard to steal with limits.","Know your data and models: record where data came from, and how each model was built, so you can roll back to a trusted version.","Resist attack: build adversarial robustness and validate inputs and outputs with statistics and confidence scores.","Respect people: privacy by design, such as differential privacy and federated learning, and transparency with an audit trail.","Training handles untrusted data and experimental code, while live prediction must stay trustworthy, which is why they are kept apart. Here, transparency serves security rather than secrecy."]}],"keyPoint":"Traditional principles plus eight AI-specific ones: contain the model, know your data and models, resist attack, and respect people.","plain":["Isolation is like keeping the test kitchen apart from the restaurant.","Lineage is a family tree for each model.","Rollback needs versioned models.","Every single prediction should pass checks."],"check":{"q":"Why separate training from prediction systems?","o":["Training handles untrusted data; prediction must stay trustworthy","To save electricity","Because regulators ban it"],"a":0,"e":"A compromise in training then cannot reach live users directly.","retry":{"q":"What does model lineage let you do?","o":["Trace how a model was built and roll back to a trusted version","Make the model faster","Hide the model"],"a":0,"e":"It is a family tree and an undo button."}},"scenario":{"title":"The compromised notebook","setting":"An attacker compromises a data scientist's training notebook.","steps":[{"prompt":"Which design principle limits the damage most?","choices":[{"t":"Isolation of training from the live prediction service","s":2,"fb":"Right. The live system stays protected."},{"t":"Bigger servers","s":0,"fb":"Size does not contain compromise."},{"t":"More colourful dashboards","s":0,"fb":"No."}]},{"prompt":"How do you recover if a bad model reached production?","choices":[{"t":"Roll back to the last signed, trusted version using lineage records","s":2,"fb":"Right. Versioning enables rollback."},{"t":"Delete all models","s":0,"fb":"Too destructive."},{"t":"Wait and see","s":0,"fb":"Act quickly."}]}]},"lab":{"type":"sort","title":"Which theme?","prompt":"Place each practice in its AI design theme.","buckets":["Contain the model","Know data and models","Resist attack","Respect people"],"items":[{"t":"Rate limits on the prediction API","b":0},{"t":"Recording the source of every dataset","b":1},{"t":"Adversarial training","b":2},{"t":"Differential privacy","b":3},{"t":"Version history allowing rollback","b":1},{"t":"Explaining decisions with an audit trail","b":3}],"explain":"Together the themes cover the risks traditional principles miss."}},{"title":"A secure reference architecture","minutes":3,"slides":[{"scene":{"type":"graph","title":"Seven zones, from the outside in","nodes":[{"id":"ext","label":"External:\nusers, sources","p":[-5.2,0.0,-0.3],"c":"slate","shape":"sphere","size":0.8,"ls":0.62},{"id":"dmz","label":"DMZ: API gateway\n(auth, rate limits, TLS)","p":[-3.12,1.5,0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"app","label":"Application\nzone","p":[-1.04,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"inf","label":"ML inference\nzone","p":[1.04,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"dat","label":"Data zone\n(encrypted)","p":[3.12,0.0,-0.3],"c":"green","shape":"cyl","size":0.8,"ls":0.62},{"id":"trn","label":"Isolated\ntraining zone","p":[5.2,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["ext","dmz",2],["dmz","app",2],["app","inf",2],["inf","dat",2],["dat","trn",2]],"steps":["all",["ext"],["dmz"],["app"],["inf"],["dat"],["trn"]]},"say":["Defence in depth becomes concrete in a reference architecture of zones, like the rings of a castle.","Outside are users and data sources, with no direct access to anything inside.","The DMZ, a buffer zone, holds the API gateway, the single front door. It checks identity, limits request rates, validates inputs and encrypts traffic, so it helps against extraction and floods.","The application zone holds business logic and checks permissions.","The inference zone serves predictions from encrypted, integrity-checked models.","The data zone holds encrypted databases and training data.","The training zone is fully isolated, and finished models are signed so the inference zone can verify them. A seventh layer of shared services, identity, logging and a SIEM that analyses security events, spans every zone."]}],"keyPoint":"Seven zones put defence in depth into practice. Four patterns help: secure data pipeline, model serving enclave, prediction validation and secure model update.","plain":["The API gateway is the castle's only gate.","A SIEM collects and analyses security events from every zone.","A design pattern is a tried and tested solution to a recurring problem.","Prediction validation checks input, confidence and output on every request."],"check":{"q":"Which component is the single front door that rate-limits requests?","o":["The API gateway in the DMZ","The training zone","The data zone"],"a":0,"e":"It authenticates, limits, validates and encrypts.","retry":{"q":"Why is the training zone fully isolated?","o":["It handles untrusted data and must not touch live systems","It is the fastest zone","It stores passwords"],"a":0,"e":"Signed models cross from training to inference safely."}},"scenario":{"title":"Where does it go?","setting":"Your team is placing a new prediction validation function that checks every input and flags low-confidence results.","steps":[{"prompt":"Which zone should run it?","choices":[{"t":"The ML inference zone, wrapping every prediction","s":2,"fb":"Right. It mediates each prediction."},{"t":"The external zone","s":0,"fb":"That is outside your control."},{"t":"The training zone","s":0,"fb":"Training is isolated from live requests."}]},{"prompt":"What can the API gateway NOT stop?","choices":[{"t":"A poisoned model trained on bad data","s":2,"fb":"Right. That needs pipeline defences."},{"t":"Excessive request rates","s":0,"fb":"That is exactly what it limits."},{"t":"Unauthenticated users","s":0,"fb":"It checks identity."}]}]},"lab":{"type":"spot","title":"Spot the good practice","prompt":"This prediction service design has several sound controls and some weak points. Pick out the weak points.","parts":[{"lbl":"Inputs","t":"Every request is checked against a schema","bad":false,"why":"This is complete mediation, a good control."},{"lbl":"Confidence","t":"Results below 0.80 confidence go to a person","bad":false,"why":"A fail-safe default, though the threshold needs tuning."},{"lbl":"Outputs","t":"Full confidence scores for every class are returned to all users","bad":true,"why":"This gives extraction attackers far more detail than they need."},{"lbl":"Model file","t":"The model is loaded without checking its signature","bad":true,"why":"Without an integrity check, a tampered model could be loaded."},{"lbl":"Logs","t":"Every decision is logged","bad":false,"why":"An audit trail that also helps spot drift."},{"lbl":"Training","t":"Training runs on the same server as live predictions","bad":true,"why":"Training and inference should be isolated."}],"explain":"Good design combines mediation, fail-safes, logging, containment, integrity checks and isolation."}},{"title":"AI agents for threat modelling","minutes":3,"slides":[{"scene":{"type":"graph","title":"A team of LLM agents, with a human in charge","nodes":[{"id":"tm","label":"Threat\nmodelling agent","p":[0.0,3.2,0],"c":"red","shape":"ico","size":0.8,"ls":0.6},{"id":"re","label":"Requirements\nagent","p":[3.99,1.4,0],"c":"cyan","shape":"ico","size":0.8,"ls":0.6},{"id":"mi","label":"Mitigation\nagent","p":[2.47,-1.51,0],"c":"green","shape":"ico","size":0.8,"ls":0.6},{"id":"do","label":"Documentation\nagent","p":[-2.47,-1.51,0],"c":"amber","shape":"ico","size":0.8,"ls":0.6},{"id":"co","label":"Coordinator\nagent","p":[-3.99,1.4,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6}],"links":[["co","tm",1],["co","re",1],["co","mi",1],["co","do",1]],"steps":["all",["tm"],["re"],["mi"],["do"],["co"],"all"],"orbit":0.4},"say":["An AI agent is a program built on a large language model, or LLM, given a specific job, tools and information. In agentic AI, several agents cooperate.","The threat modelling agent lists threats using STRIDE and the AI families.","The requirements agent turns each threat into a testable security requirement.","The mitigation agent proposes controls and design patterns.","The documentation agent writes up the model and a traceability matrix linking every threat to its requirement and control.","The coordinator hands work between them and checks nothing is dropped.","Agents are systematic and fast, but LLMs can be confidently wrong, lack context about your organisation, and cannot be held accountable. So a qualified person validates every output. Use approved tools only, and never paste confidential or personal data into them."]}],"keyPoint":"Specialised agents can enumerate threats, write requirements, propose controls and document them consistently, but a human expert validates everything and stays accountable.","plain":["Design with AI, not 'let the AI design security'.","Hallucination means plausible but wrong output.","Specialised agents are like a team of specialists rather than one generalist.","Never paste confidential data into an unapproved tool."],"check":{"q":"Why must a person validate agent output even if it looks complete?","o":["LLMs can be confidently wrong and cannot be accountable","Agents are always slow","It is only a formality"],"a":0,"e":"Accountability cannot be delegated to a tool.","retry":{"q":"What does the coordinator agent do?","o":["Hands work between agents and checks nothing is dropped","Writes all the code","Approves the budget"],"a":0,"e":"It orchestrates the team."}},"scenario":{"title":"The suggested control","setting":"The mitigation agent recommends a control that would add a two-minute delay to every emergency clinical decision.","steps":[{"prompt":"What should happen?","choices":[{"t":"The human reviewer rejects or adapts it to fit clinical workflows","s":2,"fb":"Right. Context is what humans add."},{"t":"Implement it, the agent knows best","s":0,"fb":"Agents lack organisational context."},{"t":"Delete the agent system","s":1,"fb":"Too drastic; review is the point."}]},{"prompt":"A colleague pastes real patient records into a public AI tool to get better threat suggestions. Is that acceptable?","choices":[{"t":"No, never paste confidential or personal data into unapproved tools","s":2,"fb":"Right. That is itself a breach."},{"t":"Yes, if it helps","s":0,"fb":"It breaches privacy law."},{"t":"Only on weekends","s":0,"fb":"No."}]}]},"lab":{"type":"sort","title":"Which agent?","prompt":"Match each task to the agent that does it.","buckets":["Threat modelling","Requirements","Mitigation","Documentation","Coordinator"],"items":[{"t":"List threats using STRIDE","b":0},{"t":"Turn a threat into a testable requirement","b":1},{"t":"Propose a rate-limiting control","b":2},{"t":"Produce the traceability matrix","b":3},{"t":"Check nothing has been dropped between agents","b":4}],"explain":"Specialists working together, checked by a person."}},{"title":"Sustainable AI design","minutes":3,"slides":[{"scene":{"type":"graph","title":"Efficient, reusable and maintainable AI","nodes":[{"id":"ce","label":"Computational\nefficiency","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"en","label":"Energy","p":[3.28,2.22,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6},{"id":"de","label":"Data\nefficiency","p":[4.09,0.02,0],"c":"violet","shape":"cyl","size":0.8,"ls":0.6},{"id":"ru","label":"Reusability","p":[1.82,-1.75,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"os","label":"Operational\nsustainability","p":[-1.82,-1.75,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"mb","label":"Maintenance\nburden","p":[-4.09,0.02,0],"c":"slate","shape":"sphere","size":0.8,"ls":0.6},{"id":"lm","label":"Lifecycle\nmanagement","p":[-3.28,2.22,0],"c":"red","shape":"torus","size":0.8,"ls":0.6}],"links":[],"steps":["all",["ce"],["en"],["de"],["ru"],["os"],["mb"],["lm"]],"orbit":0.4},"say":["Good design also means AI that is efficient and maintainable over its whole life. The chapter lists seven sustainability dimensions.","Computational efficiency: quantisation stores a model's numbers at lower precision, making it smaller and faster.","Energy: estimate it as power draw times training hours times the grid's carbon intensity. Training where electricity is cleaner cuts emissions.","Data efficiency: transfer learning starts from a pre-trained model, so far fewer new examples are needed.","Reusability: share well-governed models instead of building new ones each time.","Operational sustainability: incremental learning updates a model rather than retraining from scratch.","Maintenance burden: modular designs are easier to keep up.","Lifecycle management: plan how to retire models. There is a security bonus: fewer, well-governed models mean fewer things to patch and protect, as long as each reused model is verified."]}],"keyPoint":"Sustainable AI saves energy and money and shrinks the attack surface. Verify every reused model, because transfer learning brings supply chain risk.","plain":["Quantisation is like saving a photo at a smaller size.","Transfer learning is learning a new language faster because you already know a related one.","Every model in production is something to patch.","Example savings are illustrative; real gains vary."],"check":{"q":"How does sustainable design also help security?","o":["Fewer, governed models mean fewer things to patch and protect","It removes all threats","It makes models secret"],"a":0,"e":"A smaller estate is easier to defend.","retry":{"q":"What new risk does transfer learning introduce?","o":["Supply chain risk from the pre-trained model","Higher energy use","More labelling work"],"a":0,"e":"Verify each pre-trained model before reuse."}},"scenario":{"title":"Ten models, one job","setting":"Five teams each trained their own similar fraud model, and all five are in production.","steps":[{"prompt":"What would you recommend?","choices":[{"t":"Consolidate to one well-governed, verified shared model","s":2,"fb":"Right. Less to secure and maintain."},{"t":"Train five more","s":0,"fb":"That multiplies the burden."},{"t":"Leave it, more is safer","s":0,"fb":"More models mean more attack surface."}]},{"prompt":"How would you estimate the carbon cost of retraining?","choices":[{"t":"Power draw × training hours × grid carbon intensity","s":2,"fb":"Right. That is the chapter's rough method."},{"t":"Count the lines of code","s":0,"fb":"Not related."},{"t":"Ask the vendor to guess","s":0,"fb":"Measure instead."}]}]},"lab":{"type":"sort","title":"Which dimension?","prompt":"Match each technique to its sustainability dimension.","buckets":["Computational efficiency","Data efficiency","Operational sustainability","Lifecycle management"],"items":[{"t":"Quantising a model to lower precision","b":0},{"t":"Transfer learning from a pre-trained model","b":1},{"t":"Incremental updates instead of full retraining","b":2},{"t":"A plan for retiring old models","b":3}],"explain":"Each technique saves cost, energy or effort in a different way."}}],"test":[{"q":"Which is a new AI attack surface?","o":["Training data","The office door","The email signature"],"a":0,"e":"","lesson":0},{"q":"What does the R in STRIDE stand for?","o":["Repudiation","Ransomware","Routing"],"a":0,"e":"","lesson":1},{"q":"Hidden triggers planted during training are…","o":["Backdoors","Spoofing","Rate limits"],"a":0,"e":"","lesson":1},{"q":"Membership inference reveals…","o":["Whether a person's record was in the training data","The model's code","The server's location"],"a":0,"e":"","lesson":1},{"q":"A poisoned model usually…","o":["Passes normal tests and misbehaves on a trigger","Fails every test","Crashes immediately"],"a":0,"e":"","lesson":2},{"q":"A surrogate model is…","o":["A copy trained on a stolen model's outputs","A backup server","A human expert"],"a":0,"e":"","lesson":2},{"q":"Returning a label instead of exact confidence scores helps against…","o":["Model extraction","Power cuts","Phishing"],"a":0,"e":"","lesson":2},{"q":"Trust boundaries are…","o":["Where data crosses between areas trusted differently","Firewall colours","Staff contracts"],"a":0,"e":"","lesson":3},{"q":"Residual risk is…","o":["Risk left after controls","Risk before analysis","Zero risk"],"a":0,"e":"","lesson":3},{"q":"Separation of concerns for AI means…","o":["Training and inference on separate systems","One big server","No logging"],"a":0,"e":"","lesson":4},{"q":"Model lineage enables…","o":["Rollback to a trusted version","Faster typing","Cheaper licences"],"a":0,"e":"","lesson":4},{"q":"The API gateway sits in…","o":["The DMZ","The training zone","The data zone"],"a":0,"e":"","lesson":5},{"q":"Which pattern checks input, confidence and output on every request?","o":["Prediction validation","Secure data pipeline","Model update"],"a":0,"e":"","lesson":5},{"q":"Agent outputs must be…","o":["Validated by a qualified person","Trusted automatically","Deleted"],"a":0,"e":"","lesson":6},{"q":"Quantisation makes a model…","o":["Smaller and faster","More accurate always","Larger"],"a":0,"e":"","lesson":7},{"q":"Rough training carbon estimate:","o":["Power × hours × grid carbon intensity","Lines of code × users","Price × tax"],"a":0,"e":"","lesson":7}]};
