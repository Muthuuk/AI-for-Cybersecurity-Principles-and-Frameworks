/* Chapter 2: Cybersecurity Frameworks in the AI Era (Guide to AI for Cybersecurity) */
const CH = {"id":"ch02","num":"2","title":"Cybersecurity Frameworks in the AI Era","summary":"How established security frameworks such as NIST CSF, ISO 27001 and NCSC guidance can be adapted for AI: from mapping and gap analysis, through governance and compliance automation, to metrics and a phased roadmap.","outcomes":["Explain why traditional security frameworks need adapting for AI systems","Describe how NIST CSF, NCSC guidance and ISO 27001 can be extended for AI","Recognise the UK regulatory requirements that apply to AI, including GDPR and algorithmic accountability","Map several frameworks together and use a gap analysis to set priorities","Design AI security governance with clear roles, supported by compliance automation","Choose a framework, define metrics and plan a phased implementation"],"starter":[{"q":"Your organisation already follows a security framework and starts using AI. What is the best first thought?","o":["Throw the framework away and start again","The framework will need adapting, because AI systems learn and change","Nothing changes, since AI is just software"],"a":1,"e":""},{"q":"What is the main problem with checking compliance by hand once a year?","o":["It cannot keep up with real-time changes and several frameworks at once","It is too accurate","Auditors do not allow it"],"a":0,"e":""},{"q":"When an AI tool raises a compliance alert, who should decide what to do?","o":["The AI tool, automatically","Whoever sees it first","An accountable person, with clear roles"],"a":2,"e":""}],"lessons":[{"title":"Why frameworks must adapt for AI","minutes":3,"slides":[{"scene":{"type":"flood","title":"Traditional controls meet new kinds of threat","wallLabel":"Traditional framework","mlLabel":"AI adaptation","steps":[{"rate":6},{"rate":6},{"rate":6},{"rate":8},{"rate":8,"novel":true},{"rate":8,"novel":true},{"rate":8,"novel":true,"ml":true}]},"say":["Welcome to Chapter 2, Cybersecurity Frameworks in the AI Era, and I'm Sam, your tutor.","Chapter 1 showed that AI plays a dual role in cybersecurity, and this chapter asks how our security frameworks must change to keep up.","A framework is a structured set of practices and controls that an organisation follows to manage security.","Traditional frameworks were built for static applications with predictable behaviour and known weaknesses, shown here as red threats stopped at the wall.","AI systems are different, because they learn, adapt and change over time.","They also face new kinds of attack, shown in purple, which older controls were never designed to stop.","The chapter's answer is to adapt existing frameworks with an AI layer, not to throw them away."]},{"scene":{"type":"graph","title":"Four AI traits that frameworks must cover","nodes":[{"id":"ai","label":"AI system","p":[0,-0.2,1.2],"c":"cyan","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"adv","label":"Adversarial\nattacks","p":[-4.55,1.25,-1.98],"c":"red","shape":"ico","size":0.8,"ly":1.15,"ls":0.72},{"id":"data","label":"Training data &\nsupply chain","p":[-1.8,1.65,-2.24],"c":"amber","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72},{"id":"interp","label":"Hard to\ninterpret","p":[1.8,1.65,-2.24],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"drift","label":"Keeps learning\n& drifts","p":[4.55,1.25,-1.98],"c":"cyan","shape":"torus","size":0.8,"ly":1.15,"ls":0.72}],"links":[["ai","adv"],["ai","data"],["ai","interp"],["ai","drift"]],"steps":["all",["ai","adv"],["ai","data"],["ai","interp"],["ai","drift"],"all"]},"say":["The chapter highlights four characteristics of AI that traditional frameworks must be adapted to cover.","First, models are vulnerable to adversarial attacks, meaning inputs deliberately crafted to trick them.","Second, AI depends on its training data, which brings supply chain risks from wherever that data comes from.","Third, AI decisions can be hard to interpret, which makes incident response harder when something goes wrong.","Fourth, models keep learning and can drift, so their behaviour changes after they are deployed.","In short, security must move from occasional manual monitoring to keeping pace with systems that are always changing."]}],"keyPoint":"Traditional frameworks assume static, predictable systems. AI systems learn and change, face new kinds of attack, depend on training data and can be hard to explain, so frameworks must be adapted, not discarded.","plain":["A framework is like a building code: a shared checklist for doing security properly.","Old building codes never imagined buildings that rearrange their own rooms, and AI systems change themselves in a similar way.","An adversarial attack is like a forged ticket designed to fool one particular ticket machine.","Adapting means adding to the code you already follow, not tearing it up."],"check":{"q":"Which of these is a key reason traditional frameworks need adapting for AI?","o":["AI systems never change once installed","AI systems are cheaper than ordinary software","AI systems keep learning, so their behaviour can drift"],"a":2,"e":"Traditional frameworks assume predictable, static systems. AI systems learn and change after deployment, which older controls do not cover.","retry":{"q":"What does 'model drift' mean?","o":["A model's behaviour changes over time as it keeps learning","A model is moved to another server","A model is deleted by mistake"],"a":0,"e":"Drift is the change in a model's behaviour after it is deployed, which is why continuous monitoring matters."}},"scenario":{"title":"The self-updating claims model","setting":"Your organisation already follows an established security framework. The data team has just deployed an AI model that learns from customer claims and updates itself every week.","steps":[{"prompt":"A manager says the existing framework already covers the new model, so nothing needs to change. How do you respond?","choices":[{"t":"Agree, because a framework is a framework","s":0,"fb":"Traditional frameworks were designed for static, predictable systems, not models that keep learning."},{"t":"Suggest replacing the whole framework with a new AI one","s":1,"fb":"It takes the risk seriously, but the chapter recommends building on existing frameworks rather than replacing them."},{"t":"Explain that the model learns and changes, so AI-specific controls must be added to the existing framework","s":2,"fb":"Right. Adapt the framework you have with an AI layer."}]},{"prompt":"Which new risk should you raise first with the data team?","choices":[{"t":"Whether the server has enough disk space","s":1,"fb":"A normal IT concern, but not one of the AI-specific risks the chapter highlights."},{"t":"Where the training data comes from and whether it can be trusted","s":2,"fb":"Right. Training data dependencies and supply chain risks are a key AI characteristic."},{"t":"The colour scheme of the dashboard","s":0,"fb":"That has nothing to do with security."}]}]},"lab":{"type":"sort","title":"Traditional system or AI system?","prompt":"Which kind of system does each description fit?","buckets":["Traditional IT system","AI system"],"items":[{"t":"Static application","b":0},{"t":"Dynamic system that learns","b":1},{"t":"Predictable behaviour","b":0},{"t":"Adaptive algorithms","b":1},{"t":"Known weaknesses","b":0},{"t":"New kinds of attack","b":1},{"t":"Checked by manual monitoring","b":0,"why":"the chapter contrasts manual monitoring with systems that keep evolving"},{"t":"Keeps changing after it is deployed","b":1}],"explain":"Each pair shows a shift the chapter describes, from traditional IT security to AI system security."}},{"title":"The compliance challenge and the AI layer","minutes":3,"slides":[{"scene":{"type":"graph","title":"Many rulebooks at once: the compliance challenge","nodes":[{"id":"org","label":"UK\norganisation","p":[0,-0.2,1.2],"c":"slate","shape":"box","size":1.3,"ly":1.75,"spin":true},{"id":"ncsc","label":"NCSC\nguidance","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"ce","label":"Cyber Essentials\ncertification","p":[-2.62,1.58,-2.2],"c":"green","shape":"shield","size":0.8,"ly":1.15,"ls":0.72},{"id":"gdpr","label":"GDPR\n(data protection)","p":[0.0,1.7,-2.28],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"fca","label":"FCA\n(financial rules)","p":[2.63,1.58,-2.2],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"aig","label":"AI\ngovernance","p":[4.55,1.25,-1.98],"c":"pink","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["org","ncsc"],["org","ce"],["org","gdpr"],["org","fca"],["org","aig"]],"steps":["all",["org","ncsc"],["org","ce"],["org","gdpr","fca","aig"],"all",["org"],"all"]},"say":["Modern organisations must follow many security rules and standards at the same time, which the chapter calls the compliance challenge.","In the UK this includes guidance from the National Cyber Security Centre, or NCSC, which the chapter notes can be complex.","It includes Cyber Essentials, a UK certification scheme with its own requirements.","Many organisations must also coordinate data protection law, known as GDPR, the rules of the Financial Conduct Authority, or FCA, and new AI governance expectations.","Governance, risk and compliance work, often shortened to GRC, struggles when it is done by hand.","Manual monitoring cannot keep up, audit preparation eats up resources, frameworks are hard to interpret and organisations need compliance checked in real time.","The chapter's proposed solution is AI-powered compliance automation, which we will meet in lesson 9."]},{"scene":{"type":"graph","title":"Layered integration: add an AI layer on top","cam":[0,4.6,13],"look":[0,0.9,0],"nodes":[{"id":"found","label":"Traditional framework\nfoundation","p":[0,-1.3,0],"c":"slate","shape":"slab","size":1.3,"ly":0.62,"ls":0.62},{"id":"adapt","label":"AI security\nadaptation layer","p":[0,0.5,0],"c":"cyan","shape":"slab","size":1.15,"ly":0.62,"ls":0.62},{"id":"ctrl","label":"AI-specific\ncontrols","p":[-3.8,2.4,0],"c":"red","shape":"box","size":0.8},{"id":"mon","label":"Enhanced\nmonitoring","p":[0,2.5,-0.4],"c":"amber","shape":"torus","size":1.0},{"id":"gov","label":"Specialised\ngovernance","p":[3.8,2.4,0],"c":"violet","shape":"box","size":0.8}],"links":[["found","adapt"],["adapt","ctrl"],["adapt","mon"],["adapt","gov"]],"steps":["all",["found"],["adapt"],["ctrl","mon","gov"],["ctrl","mon","gov"],"all"]},"say":["So how do you add AI security without starting again from scratch?","The chapter's answer is a layered approach, with the traditional framework as the foundation.","On top of it sits an AI security adaptation layer.","This layer adds three things: AI-specific controls, enhanced monitoring and specialised governance.","In practice these cover model security, protection of data, monitoring of the machine learning pipeline and an AI ethics committee.","Three principles guide the integration: preserve what you have already invested in, add AI capabilities systematically and keep operations working as one coherent whole."]}],"keyPoint":"Organisations juggle many overlapping rulebooks, and manual compliance cannot keep up. Keep the existing framework as the foundation and add an AI security layer of controls, monitoring and governance.","plain":["Compliance means showing that you follow the rules that apply to you.","Juggling several rulebooks by hand is like keeping five separate diaries for the same week.","The layered approach is like building an extension rather than knocking the house down.","GRC stands for governance, risk and compliance: who decides, what could go wrong and which rules apply."],"check":{"q":"In the layered approach, what happens to the traditional framework?","o":["It is replaced by a new AI framework","It stays as the foundation, with an AI layer added on top","It is kept only for paperwork"],"a":1,"e":"The chapter's first integration principle is to preserve existing framework investments and build on them.","retry":{"q":"Which is NOT part of the AI security adaptation layer?","o":["Specialised governance","Enhanced monitoring","Removing all existing controls"],"a":2,"e":"The layer adds AI-specific controls, enhanced monitoring and specialised governance. It does not remove what is already there."}},"scenario":{"title":"Audit season","setting":"You manage compliance for a UK organisation that holds Cyber Essentials, must meet GDPR and is starting to use AI. Before every audit, staff spend weeks gathering evidence by hand from different systems.","steps":[{"prompt":"What is the core problem?","choices":[{"t":"There are too many systems, so some should be switched off","s":1,"fb":"Reducing complexity can help, but the chapter points to manual compliance monitoring as the real problem."},{"t":"Cyber Essentials is not needed","s":0,"fb":"The certification is a requirement, not the problem."},{"t":"Manual compliance work cannot keep up with several frameworks at once","s":2,"fb":"Right. The chapter lists manual monitoring and resource-intensive audit preparation as GRC problems."}]},{"prompt":"The board now wants to add AI security. What approach do you propose?","choices":[{"t":"Build an AI security layer on top of the existing framework","s":2,"fb":"Right. That preserves what you have and adds AI capabilities systematically."},{"t":"Start a brand-new framework just for AI","s":1,"fb":"It addresses AI, but it throws away existing investment and splits operations in two."},{"t":"Wait until a regulator insists","s":0,"fb":"Waiting leaves AI risks unmanaged."}]}]},"lab":{"type":"spot","title":"Spot the compliance problems","prompt":"Here is how one organisation runs compliance today. Find the problems the chapter warns about.","parts":[{"lbl":"Monitoring","t":"Compliance is checked by hand once a year","bad":true,"why":"Manual, occasional checks cannot keep up; the chapter calls for real-time compliance validation."},{"lbl":"Certification","t":"Holds Cyber Essentials certification","bad":false,"why":"Holding the certification is a good thing."},{"lbl":"Audit preparation","t":"Three staff spend six weeks gathering evidence before each audit","bad":true,"why":"Resource-intensive audit preparation is one of the GRC problems the chapter lists."},{"lbl":"Guidance","t":"Each team reads the NCSC guidance its own way","bad":true,"why":"Framework interpretation difficulties lead to inconsistent controls."},{"lbl":"Frameworks","t":"GDPR, FCA and AI rules are tracked in separate spreadsheets with no link between them","bad":true,"why":"Multi-framework coordination is part of the challenge, and separate tracking duplicates effort."},{"lbl":"Reporting","t":"The board receives a compliance summary every quarter","bad":false,"why":"Regular reporting to the board is sensible."},{"lbl":"Status","t":"Nobody can tell whether a control is working between audits","bad":true,"why":"The chapter stresses the need for real-time compliance validation."}],"explain":"Each problem is one the chapter lists for manual GRC work, and together they explain why it proposes AI-powered compliance automation."}},{"title":"NIST CSF: five functions extended for AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"NIST CSF: five functions and their traditional focus","nodes":[{"id":"id","label":"Identify\nasset inventory","p":[-6.2,0,-0.25],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"pr","label":"Protect\naccess controls","p":[-3.1,0,0.25],"c":"green","shape":"shield","size":1,"ly":1.3},{"id":"de","label":"Detect\nanomalies","p":[0.0,0,-0.25],"c":"amber","shape":"box","size":1,"ly":1.3},{"id":"rs","label":"Respond\nincidents","p":[3.1,0,0.25],"c":"red","shape":"box","size":1,"ly":1.3},{"id":"rc","label":"Recover\nrestore systems","p":[6.2,0,-0.25],"c":"violet","shape":"box","size":1,"ly":1.3}],"links":[["id","pr"],["pr","de"],["de","rs"],["rs","rc"]],"steps":["all","all",["id"],["pr"],["de"],["rs","rc"],"all"]},"say":["One of the best-known frameworks is the Cybersecurity Framework from the US National Institute of Standards and Technology, known as the NIST CSF.","It organises security into five functions: identify, protect, detect, respond and recover.","Traditionally, identify focuses on an inventory of assets, meaning a list of what you have.","Protect focuses on access controls, which decide who can use what.","Detect focuses on spotting anomalies, which are unusual events.","Respond is about handling incidents, and recover is about restoring systems afterwards.","The chapter describes the framework as technology-agnostic, meaning it does not depend on any particular technology, which is why it can be adapted for AI."]},{"scene":{"type":"graph","title":"NIST CSF for AI: each function gains an AI enhancement","nodes":[{"id":"id2","label":"Identify\nmodel registry","p":[-6.2,0,-0.25],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"pr2","label":"Protect\nmodels & data","p":[-3.1,0,0.25],"c":"green","shape":"shield","size":1,"ly":1.3},{"id":"de2","label":"Detect\nbehaviour & drift","p":[0.0,0,-0.25],"c":"amber","shape":"box","size":1,"ly":1.3},{"id":"rs2","label":"Respond\nAI forensics","p":[3.1,0,0.25],"c":"red","shape":"box","size":1,"ly":1.3},{"id":"rc2","label":"Recover\nmodel rollback","p":[6.2,0,-0.25],"c":"violet","shape":"box","size":1,"ly":1.3}],"links":[["id2","pr2"],["pr2","de2"],["de2","rs2"],["rs2","rc2"]],"steps":["all",["id2"],["pr2"],["de2"],["rs2"],["rc2"],"all"]},"say":["Now watch how each function gains an AI enhancement.","Identify adds an AI model registry, a list of every model and what it depends on.","Protect extends access control to the models themselves and secures the training data.","Detect adds monitoring of how the AI behaves and detection of drift.","Respond adds AI-specific forensics, meaning careful investigation of what happened to a model, plus model recovery.","Recover adds the ability to roll a model back to an earlier version and to recover its data.","The key idea is that the familiar structure and governance stay the same, while the content is adapted for AI."]}],"keyPoint":"The NIST CSF keeps its five functions: identify, protect, detect, respond and recover. Each gains an AI enhancement, such as a model registry, drift detection and model rollback.","plain":["The five functions are like a fire-safety plan: know your building, prevent fires, spot smoke, fight the fire, then repair.","A model registry is a list of every AI model you run, like an asset register for AI.","Rolling a model back is like restoring yesterday's saved copy of a document.","Drift detection notices when a model starts behaving differently from before."],"check":{"q":"Which NIST CSF function gains 'model rollback' as its AI enhancement?","o":["Identify","Detect","Recover"],"a":2,"e":"Recover moves from system restoration to model rollback and data recovery.","retry":{"q":"In the fire-safety picture, which function is 'repair the building afterwards'?","o":["Protect","Recover","Identify"],"a":1,"e":"Repairing after the event is recovery."}},"scenario":{"title":"Adding the chatbot to the programme","setting":"Your company runs a customer-service chatbot built on an AI model. You are asked to extend your NIST CSF programme to cover it.","steps":[{"prompt":"Under 'identify', what should you add first?","choices":[{"t":"A list of the office laptops","s":1,"fb":"That is traditional asset inventory, which is still useful, but it does not capture the model."},{"t":"A registry entry for the model and everything it depends on","s":2,"fb":"Right. The AI enhancement for identify is a model registry with dependencies."},{"t":"Nothing, because identify only covers hardware","s":0,"fb":"Identify covers all assets, and the AI enhancement adds models."}]},{"prompt":"After an update, the chatbot starts giving odd answers. Which enhanced functions help most?","choices":[{"t":"Protect, by changing every password","s":0,"fb":"The problem is the model's behaviour, not access."},{"t":"Respond, by simply restarting the server","s":1,"fb":"A restart may help briefly, but the AI-specific response is forensics and model recovery."},{"t":"Detect the drift, then recover by rolling the model back","s":2,"fb":"Right. Drift detection and model rollback are the AI enhancements for detect and recover."}]}]},"lab":{"type":"sort","title":"Which NIST function?","prompt":"Match each AI enhancement to the NIST CSF function the chapter gives it.","buckets":["Identify","Protect","Detect","Respond","Recover"],"items":[{"t":"AI model registry and dependencies","b":0},{"t":"Securing the training data","b":1},{"t":"Controlling access to models","b":1},{"t":"Monitoring AI behaviour","b":2},{"t":"Detecting model drift","b":2},{"t":"AI-specific forensics","b":3},{"t":"Rolling a model back to an earlier version","b":4}],"explain":"The five functions stay the same; each one simply gains AI-specific content."}},{"title":"NCSC: four principles in practice","minutes":3,"slides":[{"scene":{"type":"graph","title":"NCSC: four foundational principles for AI","nodes":[{"id":"ai","label":"AI system","p":[0,-0.2,1.2],"c":"cyan","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"p1","label":"1. Secure by\ndesign & default","p":[-4.55,1.25,-1.98],"c":"green","shape":"shield","size":0.8,"ly":1.15,"ls":0.72},{"id":"p2","label":"2. Supply chain\nsecurity","p":[-1.8,1.65,-2.24],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"p3","label":"3. Continuous\nmonitoring","p":[1.8,1.65,-2.24],"c":"violet","shape":"torus","size":0.8,"ly":1.15,"ls":0.72},{"id":"p4","label":"4. AI incident\nresponse","p":[4.55,1.25,-1.98],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["ai","p1"],["ai","p2"],["ai","p3"],["ai","p4"]],"steps":["all",["ai","p1"],["ai","p2"],["ai","p3"],["ai","p4"],"all"]},"say":["The UK's National Cyber Security Centre offers practical guidance, and the chapter draws out four foundational principles.","The first is secure AI system design by default, building security into machine learning from the start and protecting it throughout its life.","The second is securing the AI supply chain, meaning everything you bring in from outside.","The third is continuous monitoring, watching for unusual behaviour, drift in performance and threats in real time.","The fourth is AI-specific incident response, with specialised investigation skills, ways to contain a model and procedures to recover AI systems.","Together they cover the whole life of an AI system, from design to recovery."]},{"scene":{"type":"graph","title":"Securing the AI supply chain","nodes":[{"id":"ext","label":"External\ndata sources","p":[-5.2,2.5,-0.4],"c":"slate","shape":"cyl","size":0.85},{"id":"pre","label":"Pre-trained\nmodels","p":[-5.2,0.7,0.2],"c":"violet","shape":"ico","size":0.75},{"id":"lib","label":"Third-party\nML libraries","p":[-5.2,-1.1,0.8],"c":"amber","shape":"box","size":0.75},{"id":"chk","label":"Checks:\nvalidate & assess","p":[-0.6,0.8,0.6],"c":"green","shape":"shield","size":1.0},{"id":"ai","label":"Your AI\nsystem","p":[4.0,0.8,0],"c":"cyan","shape":"ico","size":1.1}],"links":[["ext","chk"],["pre","chk"],["lib","chk"],["chk","ai"]],"steps":["all",["ext","chk"],["pre","chk"],["lib","chk"],["chk","ai"],"all"]},"say":["Let's look more closely at the supply chain, because AI systems are built from parts that come from elsewhere.","External data sources must be validated before they are used.","Pre-trained models, which someone else has already trained, need a security assessment before you rely on them.","Third-party machine learning libraries, the ready-made software tools that models are built with, must be managed and kept under control.","Only after these checks should anything reach your AI system.","Think of it as knowing where every ingredient in a recipe came from."]}],"keyPoint":"The NCSC principles: secure by design and default, secure the AI supply chain, monitor continuously, and prepare AI-specific incident response. Check external data, pre-trained models and libraries before you trust them.","plain":["Secure by default means the safe setting is the one you get without asking.","A pre-trained model is like a shop-bought cake: you still need to know what went into it.","Third-party libraries are building blocks written by other people.","An AI incident plan needs a way to contain a misbehaving model, not just a broken server."],"check":{"q":"Your team downloads a pre-trained model from the internet. Which NCSC principle applies most directly?","o":["AI supply chain security","Continuous monitoring","AI-specific incident response"],"a":0,"e":"Pre-trained model security assessment is part of comprehensive AI supply chain security.","retry":{"q":"What is the shop-bought cake picture about?","o":["Baking faster","Knowing what went into something you did not make yourself","Keeping an eye on the oven"],"a":1,"e":"Like a cake you did not bake, a pre-trained model or outside dataset must be checked before you trust it."}},"scenario":{"title":"The document-sorting tool","setting":"A small team is building an AI tool that sorts scanned documents. To save time they plan to use a free pre-trained model, a public dataset and several open-source libraries, and to add security at the end.","steps":[{"prompt":"What is the first concern under the NCSC principles?","choices":[{"t":"Security is being left to the end instead of designed in from the start","s":2,"fb":"Right. The first principle is secure AI system design by default."},{"t":"The dataset might be too small","s":1,"fb":"Data quality matters, but the bigger issue here is that security is not designed in."},{"t":"The project is too small to need security","s":0,"fb":"Every AI system needs security from the start."}]},{"prompt":"What should happen before the public dataset and pre-trained model are used?","choices":[{"t":"Nothing, because popular downloads are safe","s":0,"fb":"Popularity is not a security assessment."},{"t":"Scan them with ordinary antivirus only","s":1,"fb":"A start, but data and model risks need validation and assessment."},{"t":"Validate the data source and assess the model's security","s":2,"fb":"Right. That is AI supply chain security."}]},{"prompt":"After launch, the tool's accuracy slowly falls. Which principle should catch this?","choices":[{"t":"Supply chain security","s":1,"fb":"Supply chain problems can cause it, but spotting the fall is the job of monitoring."},{"t":"Continuous monitoring of performance drift","s":2,"fb":"Right. Performance drift monitoring is part of continuous AI system monitoring."},{"t":"None, because falling accuracy is harmless","s":0,"fb":"Unexplained changes in behaviour need investigating."}]}]},"lab":{"type":"spot","title":"Find the gaps in the AI security plan","prompt":"Here is a team's security plan for a new AI system. Find the parts that fall short of the NCSC principles.","parts":[{"lbl":"Design","t":"Security will be reviewed once the model is finished","bad":true,"why":"Security should be designed in by default and protected throughout the AI lifecycle."},{"lbl":"Training data","t":"Downloaded from public websites without checks","bad":true,"why":"External data sources must be validated."},{"lbl":"Pre-trained model","t":"Used exactly as supplied, with no assessment","bad":true,"why":"Pre-trained models need a security assessment."},{"lbl":"Libraries","t":"Third-party ML libraries are listed and kept under managed control","bad":false,"why":"Managing third-party ML libraries is what the supply chain principle asks for."},{"lbl":"Monitoring","t":"Behaviour and performance drift are watched continuously","bad":false,"why":"This matches the continuous monitoring principle."},{"lbl":"Incidents","t":"Uses the general IT incident plan, with no way to contain a model","bad":true,"why":"AI-specific incident response needs model containment strategies."},{"lbl":"Recovery","t":"Written procedures for restoring the AI system","bad":false,"why":"Recovery procedures for AI systems are part of the fourth principle."}],"explain":"The four principles run from design to recovery, so a gap at any stage leaves the AI system exposed."}},{"title":"UK rules: GDPR and algorithmic accountability","minutes":3,"slides":[{"scene":{"type":"graph","title":"GDPR: what data protection law means for AI","nodes":[{"id":"gdpr","label":"GDPR\nand AI","p":[0,-0.2,1.2],"c":"violet","shape":"shield","size":1.3,"ly":1.75,"spin":true},{"id":"lb","label":"Lawful basis\nfor processing","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"rights","label":"Data subject\nrights","p":[0.0,1.7,-2.28],"c":"amber","shape":"sphere","size":0.8,"ly":1.15,"ls":0.72},{"id":"pbd","label":"Privacy by\ndesign","p":[4.55,1.25,-1.98],"c":"green","shape":"shield","size":0.8,"ly":1.15,"ls":0.72}],"links":[["gdpr","lb"],["gdpr","rights"],["gdpr","pbd"]],"steps":["all",["gdpr","lb"],["gdpr","rights"],["gdpr","pbd"],"all"]},"say":["AI often processes personal data, so data protection law, known as GDPR, applies.","First, there must be a lawful basis, meaning a valid legal reason, for using personal data in an AI system.","Second, people keep their rights over their own data, called data subject rights, even when decisions are automated.","Third, privacy must be built in from the start, which is called privacy by design.","These requirements have to be coordinated with your security frameworks, which is part of the compliance challenge."]},{"scene":{"type":"graph","title":"Algorithmic accountability: four domains","nodes":[{"id":"acc","label":"Algorithmic\naccountability","p":[0,-1.0,1.0],"c":"slate","shape":"slab","size":1.0,"ly":0.62,"ls":0.62},{"id":"tr","label":"Transparency:\naudit trails","p":[-5.1,1.5,0],"c":"cyan","shape":"box","size":0.8,"ls":0.7},{"id":"ex","label":"Explainability:\ninterpretable AI","p":[-1.75,2.2,-0.6],"c":"violet","shape":"box","size":0.8,"ls":0.7},{"id":"ho","label":"Human oversight:\nhuman in the loop","p":[1.75,2.2,-0.6],"c":"green","shape":"sphere","size":0.8,"ls":0.7},{"id":"bm","label":"Bias monitoring:\nautomatic checks","p":[5.1,1.5,0],"c":"amber","shape":"box","size":0.8,"ls":0.7}],"links":[["acc","tr"],["acc","ex"],["acc","ho"],["acc","bm"]],"steps":["all",["tr","acc"],["ex","acc"],["ho","acc"],["bm","acc"],"all"]},"say":["The chapter also sets out an algorithmic accountability framework with four domains.","Transparency means giving people meaningful information about decisions, supported by audit trails and logging.","Explainability means people can understand an outcome, supported by interpretable AI techniques.","Human oversight means meaningful human control, delivered through human-in-the-loop systems where a person can step in.","Bias monitoring aims to prevent discrimination, using automated bias detection.","Each domain pairs a requirement with a practical way to meet it."]}],"keyPoint":"GDPR requires a lawful basis, respect for data subject rights and privacy by design. Algorithmic accountability adds transparency, explainability, human oversight and bias monitoring, each with a practical way to deliver it.","plain":["A lawful basis is the legal reason you are allowed to use someone's data.","An audit trail is like a receipt for every decision the system makes.","Human in the loop means a person can check, change or stop the AI's decision.","Bias monitoring checks that the system does not treat some groups unfairly."],"check":{"q":"A bank wants a person to approve any loan refusal suggested by its AI. Which accountability domain is this?","o":["Transparency","Bias monitoring","Human oversight"],"a":2,"e":"Human-in-the-loop review gives meaningful human control, which is the human oversight domain.","retry":{"q":"Which domain is supported by audit trails and logging?","o":["Explainability","Transparency","Human oversight"],"a":1,"e":"Audit trails and logging provide meaningful information about decisions, which is transparency."}},"scenario":{"title":"The automated shortlisting tool","setting":"An HR team uses an AI tool to shortlist job applicants from their CVs. Rejected applicants get no explanation, nobody reviews the shortlist and nobody has checked whether the tool favours some groups.","steps":[{"prompt":"A rejected applicant asks why. What does the team need in order to answer?","choices":[{"t":"A general statement that AI was used","s":1,"fb":"Better than nothing, but transparency and explainability need meaningful information about the decision."},{"t":"The tool's licence number","s":0,"fb":"That tells the applicant nothing about the decision."},{"t":"Audit trails and an understandable explanation of the outcome","s":2,"fb":"Right. That covers transparency and explainability."}]},{"prompt":"What should change before the tool is used again?","choices":[{"t":"Add human review of shortlists and automated bias detection","s":2,"fb":"Right. That adds human oversight and bias monitoring."},{"t":"Retrain the tool on more CVs and carry on","s":1,"fb":"More data may help, but it adds neither oversight nor bias checks."},{"t":"Stop telling applicants that AI is used","s":0,"fb":"That reduces transparency."}]},{"prompt":"Under GDPR, what must the organisation confirm about the applicants' data?","choices":[{"t":"Only that the data is encrypted","s":1,"fb":"Encryption helps security, but GDPR also needs a lawful basis and respect for people's rights."},{"t":"That it has a lawful basis for processing it and respects the applicants' rights","s":2,"fb":"Right. Lawful basis and data subject rights apply to automated systems too."},{"t":"That it is stored on a fast server","s":0,"fb":"Speed is not a data protection requirement."}]}]},"lab":{"type":"sort","title":"Which accountability domain?","prompt":"Place each item in the algorithmic accountability domain it belongs to.","buckets":["Transparency","Explainability","Human oversight","Bias monitoring"],"items":[{"t":"Audit trails and logging","b":0},{"t":"Meaningful information about decisions","b":0},{"t":"Interpretable AI techniques","b":1},{"t":"People can understand the outcome","b":1},{"t":"Human-in-the-loop systems","b":2},{"t":"Meaningful human control","b":2},{"t":"Automated bias detection","b":3},{"t":"Preventing discrimination","b":3}],"explain":"Each domain has a requirement and a practical way to meet it, as in the chapter's table."}},{"title":"ISO 27001 and 27002: new controls for AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"Proposed control category A.18: AI model security","nodes":[{"id":"a18","label":"A.18 AI model\nsecurity","p":[0,-0.2,1.2],"c":"cyan","shape":"box","size":1.3,"ly":1.75,"spin":true},{"id":"life","label":"Model lifecycle\nmanagement","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"val","label":"Validation\n& testing","p":[0.0,1.7,-2.28],"c":"green","shape":"shield","size":0.8,"ly":1.15,"ls":0.72},{"id":"mon","label":"Continuous\nmonitoring","p":[4.55,1.25,-1.98],"c":"amber","shape":"torus","size":0.8,"ly":1.15,"ls":0.72}],"links":[["a18","life"],["a18","val"],["a18","mon"]],"steps":["all",["a18"],["a18","life"],["a18","val"],["a18","mon"]]},"say":["ISO 27001 and its companion standard 27002 are international standards for managing information security through a set of controls.","The chapter proposes adding new control categories for AI, starting with one for AI model security.","Model lifecycle management covers how a model is built, released, updated and retired.","Model validation and testing checks that a model works as intended before it is trusted.","Continuous model monitoring keeps watching the model once it is in use."]},{"scene":{"type":"graph","title":"A.19 AI data governance, plus stronger existing controls","nodes":[{"id":"a19","label":"A.19 AI data\ngovernance","p":[-2.2,-0.2,0.8],"c":"violet","shape":"box","size":1.1},{"id":"tds","label":"Training data\nsecurity","p":[-5.4,2.2,-0.6],"c":"cyan","shape":"cyl","size":0.8},{"id":"pois","label":"Data poisoning\nprevention","p":[-2.2,2.7,-1.0],"c":"red","shape":"ico","size":0.75},{"id":"ppa","label":"Privacy-\npreserving AI","p":[1.0,2.2,-0.6],"c":"green","shape":"shield","size":0.8},{"id":"enh","label":"Existing controls\nextended for AI","p":[4.6,0.4,0.6],"c":"amber","shape":"slab","size":0.8,"ly":0.75,"ls":0.66}],"links":[["a19","tds"],["a19","pois"],["a19","ppa"]],"steps":[["a19"],["a19","tds"],["a19","pois"],["a19","ppa"],["enh"],"all"]},"say":["The second proposed category covers AI data governance, meaning how the data used for AI is managed and protected.","Training data security protects the data a model learns from.","Data poisoning prevention stops attackers slipping bad data into training so that the model learns the wrong lessons.","Privacy-preserving AI aims to use data for AI while protecting people's personal information.","Existing controls are also strengthened: access control extends to AI systems, data protection covers training datasets and risk assessment includes AI-specific threats.","As with NIST, the approach builds on the standard you already follow."]}],"keyPoint":"The chapter proposes two new ISO control categories, AI model security and AI data governance, and extends existing controls for access, data protection and risk assessment to cover AI.","plain":["A control is a specific safeguard, like a lock, a check or a rule.","Data poisoning is like slipping wrong answers into a student's revision notes.","Model validation is like a driving test before a new driver goes on the road.","Extending existing controls means you do not start from scratch."],"check":{"q":"Which proposed control category would include data poisoning prevention?","o":["A.18 AI model security","A.19 AI data governance","Neither, it is a NIST function"],"a":1,"e":"Data poisoning prevention sits with training data security and privacy-preserving AI under AI data governance.","retry":{"q":"In the revision-notes picture, what is data poisoning?","o":["Losing the notes","Testing the student","Slipping wrong answers into the notes the student learns from"],"a":2,"e":"Poisoning corrupts what a model learns from, just as wrong notes mislead a student."}},"scenario":{"title":"Extending the ISO programme","setting":"Your organisation is certified to ISO 27001. It is about to train its own AI model on customer records to predict which accounts are at risk of fraud.","steps":[{"prompt":"Which existing control most needs extending first?","choices":[{"t":"Physical security of the server room","s":1,"fb":"Still relevant, but the new risk sits in the training data."},{"t":"Data protection, so that it covers the training dataset","s":2,"fb":"Right. The chapter lists data protection for training datasets as an enhanced control."},{"t":"The clear-desk policy","s":0,"fb":"That does not address AI risks."}]},{"prompt":"The data team wants to retrain weekly on data uploaded by partners. Which risk must the controls address?","choices":[{"t":"Data poisoning through the partner uploads","s":2,"fb":"Right. Data poisoning prevention is part of AI data governance."},{"t":"The model becoming too large to store","s":1,"fb":"A practical issue, but poisoning is the security risk."},{"t":"Staff taking too much holiday","s":0,"fb":"That is not an AI security risk."}]},{"prompt":"Before the model goes live, what does the AI model security category call for?","choices":[{"t":"Go live and fix problems later","s":0,"fb":"That skips validation altogether."},{"t":"A one-off review by the supplier","s":1,"fb":"Helpful, but the category calls for validation and testing, then continuous monitoring."},{"t":"Model validation and testing, then continuous monitoring","s":2,"fb":"Right. Those are two of the three proposed A.18 controls."}]}]},"lab":{"type":"sort","title":"Which kind of control?","prompt":"Place each control in the category the chapter gives it.","buckets":["A.18 AI model security","A.19 AI data governance","Existing control, extended"],"items":[{"t":"Model lifecycle management","b":0},{"t":"Model validation and testing","b":0},{"t":"Continuous model monitoring","b":0},{"t":"Training data security","b":1},{"t":"Data poisoning prevention","b":1},{"t":"Privacy-preserving AI","b":1},{"t":"Access control extended to AI systems","b":2},{"t":"Risk assessment for AI-specific threats","b":2}],"explain":"Model controls protect the model, data governance protects what it learns from, and extended controls stretch what you already have."}},{"title":"Mapping frameworks and finding gaps","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four steps to map several frameworks together","nodes":[{"id":"inv","label":"Framework\ninventory","p":[-5.1,0,-0.7],"c":"slate","shape":"cyl","size":1,"ly":1.3},{"id":"ext","label":"Requirement\nextraction","p":[-1.7,0,0.7],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"map","label":"Cross-framework\nmapping","p":[1.7,0,-0.7],"c":"violet","shape":"box","size":1,"ly":1.3},{"id":"road","label":"Implementation\nroadmap","p":[5.1,0,0.7],"c":"green","shape":"shield","size":1,"ly":1.3}],"links":[["inv","ext"],["ext","map"],["map","road"]],"steps":["all",["inv"],["ext"],["map"],["road"],"all"]},"say":["Most organisations follow several frameworks at once, so the chapter offers a systematic mapping process.","Step one is a framework inventory, listing which frameworks apply, such as NIST CSF, ISO 27001, NCSC guidance and GDPR.","Step two extracts the requirements, including AI-specific controls and regulatory requirements.","Step three maps the requirements across frameworks to find where they overlap and where there are gaps.","Step four produces an implementation roadmap, a coordinated plan for putting everything in place.","The benefits are less duplicated effort, better use of resources and more complete security coverage."]},{"scene":{"type":"graph","title":"Gap analysis: red is a critical gap, amber a significant one","nodes":[{"id":"ml","label":"Model lifecycle\n(NIST CSF)","p":[-4.6,2.0,-0.4],"c":"amber","shape":"box","size":0.85},{"id":"adv","label":"Adversarial detection\n(NIST CSF)","p":[-4.6,-0.7,0.6],"c":"red","shape":"ico","size":0.75},{"id":"risk","label":"AI risk assessment\n(ISO 27001)","p":[0,2.0,-0.4],"c":"amber","shape":"box","size":0.85},{"id":"ms","label":"Model security\n(ISO 27001)","p":[0,-0.7,0.6],"c":"red","shape":"ico","size":0.75},{"id":"bias","label":"Bias monitoring\n(regulatory)","p":[4.6,0.7,0],"c":"red","shape":"ico","size":0.75}],"links":[],"steps":["all",["ml"],["adv"],["risk","ms"],["bias"],"all"]},"say":["Mapping reveals gaps, and the chapter's gap analysis matrix compares the current state with what is needed.","Under NIST CSF, model lifecycle management has only basic version control, which is a significant gap.","Detection of adversarial attacks does not exist at all, which is a critical gap.","Under ISO 27001, AI risk assessment relies on a generic process, a significant gap, and model security is missing, a critical gap.","On the regulatory side, bias monitoring is missing, another critical gap.","All five gaps are rated high priority, so fixing them must be planned according to risk levels and regulatory requirements."]}],"keyPoint":"Inventory the frameworks, extract their requirements, map them against each other, then build one roadmap. A gap analysis shows where you fall short and helps you plan fixes by risk and regulation.","plain":["Mapping is like laying several maps of the same city on top of each other to see where the roads match.","A gap is the difference between what you have and what you need.","One piece of work that satisfies three frameworks saves doing it three times.","In the chapter's matrix, a critical gap is where nothing exists yet."],"check":{"q":"What is a main benefit of cross-framework mapping?","o":["It reduces duplicated effort across frameworks","It removes the need for any controls","It makes GDPR optional"],"a":0,"e":"Mapping finds overlaps, so one piece of work can satisfy several frameworks.","retry":{"q":"In the chapter's gap analysis, what makes a gap 'critical' rather than 'significant'?","o":["The capability is partly in place","The gap is cheap to fix","The capability does not exist at all"],"a":2,"e":"Critical gaps are the rows where the current state is 'none'."}},"scenario":{"title":"Three audits, one team","setting":"A small security team must satisfy ISO 27001, NCSC guidance and GDPR, and has just started using AI. Each audit is prepared separately, and the same evidence is gathered three times.","steps":[{"prompt":"Where should the team start?","choices":[{"t":"Start fixing whatever the last auditor mentioned","s":1,"fb":"Quick wins help, but without an inventory and mapping the effort stays duplicated."},{"t":"Buy a new security product","s":0,"fb":"A product does not tell you what the frameworks require."},{"t":"A framework inventory, listing every framework that applies","s":2,"fb":"Right. That is step one of the mapping process."}]},{"prompt":"The mapping shows nobody detects adversarial attacks and nothing checks for bias. How should these be ranked?","choices":[{"t":"As critical gaps with high priority, because the capability does not exist","s":2,"fb":"Right. That matches the chapter's gap analysis matrix."},{"t":"As significant gaps, to be fixed next year","s":1,"fb":"They are worse than significant: nothing exists at all."},{"t":"As minor, because no incident has happened yet","s":0,"fb":"A missing capability is a gap whether or not it has been exploited."}]}]},"lab":{"type":"order","title":"Map the frameworks","prompt":"Put the four steps of the framework mapping process in order.","items":["Framework inventory","Requirement extraction","Cross-framework mapping","Implementation roadmap"],"explain":"You cannot map what you have not listed, and you cannot plan until you know the overlaps and gaps."}},{"title":"Who is responsible? Governance and RACI","minutes":3,"slides":[{"scene":{"type":"graph","title":"An organisational structure for AI security","cam":[0,4.4,13],"nodes":[{"id":"board","label":"Board of\ndirectors","p":[-5.0,2.8,-0.6],"c":"slate","shape":"sphere","size":0.8},{"id":"ciso","label":"CISO","p":[-1.8,2.1,-0.2],"c":"cyan","shape":"box","size":0.75},{"id":"steer","label":"AI security\nsteering committee","p":[1.8,1.3,0.2],"c":"violet","shape":"box","size":0.85},{"id":"risk","label":"AI risk\nmanagement office","p":[-3.8,-0.9,1.0],"c":"amber","shape":"box","size":0.7},{"id":"soc","label":"AI security\noperations centre","p":[0.6,-1.1,1.4],"c":"green","shape":"shield","size":0.8},{"id":"eth","label":"AI ethics &\ncompliance board","p":[5.0,-0.7,1.0],"c":"pink","shape":"box","size":0.7}],"links":[["board","ciso"],["ciso","steer"],["steer","risk"],["steer","soc"],["steer","eth"]],"steps":["all",["board"],["ciso"],["steer"],["risk","soc","eth"],"all"]},"say":["Frameworks only work if someone is responsible, so the chapter proposes a governance structure for AI security.","At the top sits the board of directors.","Below it is the chief information security officer, or CISO, the senior leader for security.","The CISO works through an AI security steering committee.","Under the committee sit three bodies: an AI risk management office, an AI security operations centre and an AI ethics and compliance board.","The structure also reaches across the organisation, bringing in legal, data protection, IT operations and the AI development teams."]},{"scene":{"type":"graph","title":"RACI: who does what for each AI security activity","nodes":[{"id":"act","label":"AI security\nactivity","p":[0,-0.2,1.2],"c":"white","shape":"box","size":1.3,"ly":1.75,"spin":true},{"id":"ciso","label":"CISO","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"mgr","label":"AI security\nmanager","p":[-2.62,1.58,-2.2],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"dpo","label":"Data protection\nofficer","p":[0.0,1.7,-2.28],"c":"green","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"team","label":"AI\nteam","p":[2.63,1.58,-2.2],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"legal","label":"Legal","p":[4.55,1.25,-1.98],"c":"pink","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["act","ciso"],["act","mgr"],["act","dpo"],["act","team"],["act","legal"]],"steps":["all","all",["act","ciso","mgr"],["act","mgr","team"],["act","mgr","dpo","legal"],"all"]},"say":["A RACI matrix spells out who is responsible, accountable, consulted and informed for each activity.","Responsible means doing the work, accountable means owning the outcome, consulted means giving input and informed means being kept up to date.","For AI security strategy and AI risk assessment, the CISO is accountable and the AI security manager is responsible.","For a model security review, the AI security manager is accountable and the AI team does the work.","For AI compliance, the AI security manager is accountable, while the data protection officer and the legal team are responsible.","The chapter's key insight is that a shared responsibility model is essential for AI security governance."]}],"keyPoint":"AI security needs a clear structure, from the board and CISO through a steering committee to risk, operations and ethics bodies, and a RACI matrix that says who is responsible, accountable, consulted and informed.","plain":["Responsible is the person holding the spanner; accountable is the person who answers for the result.","In the chapter's table, each activity has exactly one accountable role.","Consulted people are asked before; informed people are told afterwards.","A steering committee keeps everyone pulling in the same direction."],"check":{"q":"In the chapter's RACI matrix, who is accountable for AI compliance?","o":["The CISO","The AI team","The AI security manager"],"a":2,"e":"For AI compliance the AI security manager is accountable, with the data protection officer and legal responsible.","retry":{"q":"What does 'consulted' mean in a RACI matrix?","o":["Is told afterwards","Gives input","Does the work"],"a":1,"e":"Consulted roles give their input; informed roles are kept up to date."}},"scenario":{"title":"The model nobody owned","setting":"A retailer's AI pricing model was changed without a security review. Afterwards, the AI team, the security team and legal each say they thought someone else was in charge.","steps":[{"prompt":"What was missing?","choices":[{"t":"Clear roles and responsibilities, such as a RACI matrix","s":2,"fb":"Right. Nobody knew who was responsible or accountable."},{"t":"More meetings","s":1,"fb":"Talking helps, but without clear roles meetings do not settle who owns what."},{"t":"A faster model","s":0,"fb":"Speed was not the problem."}]},{"prompt":"Using the chapter's RACI matrix, who should carry out a model security review?","choices":[{"t":"The CISO alone","s":1,"fb":"The CISO is kept informed, but the review is done by the AI team."},{"t":"Legal, with nobody accountable","s":0,"fb":"Every activity needs an accountable owner."},{"t":"The AI team, with the AI security manager accountable","s":2,"fb":"Right. That matches the chapter's matrix."}]},{"prompt":"Where should difficult ethics questions about the pricing model go?","choices":[{"t":"The IT help desk","s":0,"fb":"The help desk is not part of AI governance."},{"t":"The AI ethics and compliance board","s":2,"fb":"Right. That body sits under the steering committee for exactly this."},{"t":"The AI security operations centre","s":1,"fb":"It handles security operations; ethics and compliance has its own board."}]}]},"lab":{"type":"sort","title":"Fill in the RACI row","prompt":"For a model security review, which RACI letter does each role have in the chapter's matrix?","buckets":["Accountable (A)","Responsible (R)","Consulted (C)","Informed (I)"],"items":[{"t":"CISO","b":3},{"t":"AI security manager","b":0},{"t":"Data protection officer","b":2},{"t":"AI team","b":1},{"t":"Legal","b":3}],"explain":"The AI team does the review, the AI security manager owns it, the data protection officer gives input, and the CISO and legal are kept informed."}},{"title":"Automating compliance with AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"An AI-powered compliance monitoring system","nodes":[{"id":"src1","label":"System logs &\nsecurity events","p":[-5.2,2.1,-0.2],"c":"slate","shape":"cyl","size":0.8},{"id":"src2","label":"Audit results &\nperformance metrics","p":[-5.2,-0.5,0.6],"c":"slate","shape":"cyl","size":0.8},{"id":"eng","label":"AI processing\nengine","p":[-0.2,0.8,0.6],"c":"violet","shape":"ico","size":1.2},{"id":"out1","label":"Compliance\ndashboards","p":[4.8,2.5,-0.6],"c":"cyan","shape":"box","size":0.75},{"id":"out2","label":"Alert\ngeneration","p":[5.3,0.6,0.2],"c":"amber","shape":"box","size":0.75},{"id":"out3","label":"Risk\nprediction","p":[4.8,-1.2,1.0],"c":"red","shape":"torus","size":0.9}],"links":[["src1","eng"],["src2","eng"],["eng","out1"],["eng","out2"],["eng","out3"]],"steps":["all",["src1","src2"],["eng"],["out1"],["out2"],["out3"],"all"]},"say":["Compliance automation uses AI to watch compliance continuously instead of checking it by hand.","Data flows in from system logs, security events, audit results and performance metrics.","An AI processing engine recognises patterns, detects anomalies and uses predictive analytics, meaning it estimates what is likely to happen next.","Out come compliance dashboards that show the current position.","It also generates alerts when something needs attention.","And it predicts risks, so problems can be spotted early.","The chapter lists the benefits as real-time monitoring, predictive compliance, automatic evidence collection and less manual work."]},{"scene":{"type":"graph","title":"Automation as enhancement: people stay in charge","nodes":[{"id":"ai","label":"AI\nmonitoring","p":[-5.1,0,-0.7],"c":"violet","shape":"ico","size":1,"ly":1.3},{"id":"alert","label":"Alert or\nprediction","p":[-1.7,0,0.7],"c":"amber","shape":"box","size":1,"ly":1.3},{"id":"human","label":"Human\nreview","p":[1.7,0,-0.7],"c":"cyan","shape":"sphere","size":1,"ly":1.3},{"id":"dec","label":"Accountable\ndecision","p":[5.1,0,0.7],"c":"green","shape":"shield","size":1,"ly":1.3}],"links":[["ai","alert"],["alert","human"],["human","dec"]],"steps":["all",["ai","alert"],["human"],["dec"],"all"]},"say":["The chapter is clear that automation should enhance human oversight, not replace it.","The AI monitors continuously and raises alerts or predictions.","People then review what it finds.","Accountability structures stay in place, so a named person still owns each decision.","One of the chapter's discussion questions asks what challenges arise when fitting this automation alongside existing security tools, so plan for that from the start."]}],"keyPoint":"AI-powered compliance automation turns logs, events, audit results and metrics into dashboards, alerts and risk predictions in real time. It enhances human oversight and accountability; it does not replace them.","plain":["Automated compliance is like a smoke alarm that is always on, instead of a yearly inspection.","Evidence collection means gathering the proof that auditors ask for.","Predictive compliance warns you before something drifts out of line.","The machine raises the flag, but a person decides what to do."],"check":{"q":"Which of these is a benefit of compliance automation listed in the chapter?","o":["Removing the need for human oversight","Automatic evidence collection","Ending all audits"],"a":1,"e":"The chapter lists real-time monitoring, predictive compliance, automated evidence collection and reduced manual overhead.","retry":{"q":"In 'automation as enhancement', who owns the final decision?","o":["The AI engine","Nobody","An accountable person"],"a":2,"e":"Automation augments human oversight, and accountability structures stay in place."}},"scenario":{"title":"The vendor's promise","setting":"A vendor offers a compliance platform that reads your logs and audit results, and promises that you can 'switch off the compliance team'.","steps":[{"prompt":"Which part of the offer fits the chapter's approach?","choices":[{"t":"Producing a yearly report automatically","s":1,"fb":"Helpful, but the real value is continuous, real-time monitoring."},{"t":"Switching off the compliance team","s":0,"fb":"The chapter says automation should augment, not replace, human oversight."},{"t":"Continuous monitoring with dashboards, alerts and automatic evidence collection","s":2,"fb":"Right. Those are the outputs and benefits the chapter describes."}]},{"prompt":"The platform predicts a likely compliance failure next month. What should happen?","choices":[{"t":"An accountable person reviews the prediction and decides what to do","s":2,"fb":"Right. The AI raises the flag and a person owns the decision."},{"t":"Forward it to everyone and wait","s":1,"fb":"Now everyone knows, but nobody owns the decision."},{"t":"Let the platform change controls on its own with no review","s":0,"fb":"That removes accountability."}]}]},"lab":{"type":"order","title":"Follow the compliance data","prompt":"Put the stages of AI-powered compliance monitoring in order.","items":["Collect logs, security events, audit results and metrics","AI engine finds patterns, anomalies and likely risks","Dashboards, alerts and risk predictions are produced","An accountable person reviews and decides"],"explain":"Data sources feed the AI engine, the engine produces outputs, and people stay accountable for the decisions."}},{"title":"Measuring AI security","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three levels of security metrics","nodes":[{"id":"trad","label":"Traditional\nmetrics","p":[-4.2,0,-0.7],"c":"slate","shape":"box","size":1,"ly":1.3},{"id":"enh","label":"AI-enhanced\nmetrics","p":[0.0,0,0.7],"c":"cyan","shape":"sphere","size":1,"ly":1.3},{"id":"spec","label":"AI-specific\nmetrics","p":[4.2,0,-0.7],"c":"violet","shape":"ico","size":1,"ly":1.3}],"links":[["trad","enh"],["enh","spec"]],"steps":["all",["trad"],["enh"],["spec"],"all"]},"say":["The chapter stresses that measurement enables improvement, so it proposes a multi-dimensional metrics framework.","Traditional metrics measure classic security work, such as detection rate, cost per incident and false positives, which are false alarms.","AI-enhanced metrics measure how AI improves that work, such as AI-assisted accuracy and savings from automation.","AI-specific metrics measure the AI itself, such as model drift detection, model accuracy and AI governance.","The chapter describes an evolution from traditional, to AI-enhanced, to AI-specific metrics to give a full picture of the programme."]},{"scene":{"type":"graph","title":"Four categories, with the chapter's example targets","nodes":[{"id":"m","label":"Metrics\nframework","p":[0,-0.2,1.2],"c":"cyan","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"eff","label":"Effectiveness","p":[-4.55,1.25,-1.98],"c":"green","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"effi","label":"Efficiency","p":[-1.8,1.65,-2.24],"c":"amber","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72},{"id":"qual","label":"Quality","p":[1.8,1.65,-2.24],"c":"violet","shape":"sphere","size":0.8,"ly":1.15,"ls":0.72},{"id":"comp","label":"Compliance","p":[4.55,1.25,-1.98],"c":"cyan","shape":"shield","size":0.8,"ly":1.15,"ls":0.72}],"links":[["m","eff"],["m","effi"],["m","qual"],["m","comp"]],"steps":["all",["m","eff"],["m","effi"],["m","qual"],["m","comp"],"all"]},"say":["Each level is measured across four categories: effectiveness, efficiency, quality and compliance.","For effectiveness, the chapter's example targets are a detection rate of 95 per cent or more, AI-assisted accuracy of 98 per cent or more and model drift detection of 99 per cent or more.","For efficiency, it tracks cost per incident, looks for automation savings of 30 per cent or more and keeps model maintenance below 10 per cent.","For quality, it targets false positives below 5 per cent, AI-reduced false positives below 2 per cent and model accuracy of 95 per cent or more.","For compliance, it targets full regulatory compliance, real-time monitoring of 99 per cent or more and full AI governance.","Treat these as example targets, and check that each metric reflects real security rather than just activity."]}],"keyPoint":"Measure at three levels (traditional, AI-enhanced and AI-specific) across four categories: effectiveness, efficiency, quality and compliance. Make sure metrics reflect real security, not just activity.","plain":["A metric is a number you track to see whether things are getting better.","Traditional metrics measure security work; AI-specific ones measure the AI itself.","A false positive is a false alarm.","Counting activity, such as reports written, is not the same as measuring safety."],"check":{"q":"Which level of metric is 'model drift detection'?","o":["AI-specific","Traditional","AI-enhanced"],"a":0,"e":"It measures the AI model itself, so it is an AI-specific metric.","retry":{"q":"Which is a traditional metric in the chapter's framework?","o":["Model accuracy","Cost per incident","AI governance"],"a":1,"e":"Cost per incident is the traditional efficiency metric."}},"scenario":{"title":"The monthly board report","setting":"Your monthly report to the board shows the number of security scans run and policies written, both rising. The board asks whether the AI security programme is actually working.","steps":[{"prompt":"What is wrong with the current report?","choices":[{"t":"It has too few charts","s":1,"fb":"Presentation matters, but the real issue is what is being measured."},{"t":"It measures activity rather than security effectiveness","s":2,"fb":"Right. This is the chapter's measurement validation question."},{"t":"The numbers are too high","s":0,"fb":"High activity numbers are not the problem."}]},{"prompt":"Which metric would best show whether your AI models are still healthy?","choices":[{"t":"Cost per incident","s":1,"fb":"Useful, but it is a traditional metric that says little about the models themselves."},{"t":"Number of meetings held","s":0,"fb":"That measures activity, not security."},{"t":"Model drift detection","s":2,"fb":"Right. It is an AI-specific metric about the models themselves."}]}]},"lab":{"type":"sort","title":"Which level of metric?","prompt":"Place each metric at the level the chapter gives it.","buckets":["Traditional","AI-enhanced","AI-specific"],"items":[{"t":"Detection rate","b":0},{"t":"Cost per incident","b":0},{"t":"False positives","b":0},{"t":"AI-assisted accuracy","b":1},{"t":"Automation savings","b":1},{"t":"Real-time monitoring","b":1},{"t":"Model drift detection","b":2},{"t":"Model accuracy","b":2},{"t":"AI governance","b":2}],"explain":"Traditional metrics measure classic security work, AI-enhanced ones measure AI's help with it, and AI-specific ones measure the AI itself."}},{"title":"Choosing the right framework","minutes":3,"slides":[{"scene":{"type":"graph","title":"Comparing frameworks: strengths, limits and best fit","nodes":[{"id":"org","label":"Your\norganisation","p":[0,-0.2,1.2],"c":"slate","shape":"box","size":1.3,"ly":1.75,"spin":true},{"id":"nist","label":"NIST CSF","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"ncsc","label":"NCSC","p":[-1.8,1.65,-2.24],"c":"green","shape":"shield","size":0.8,"ly":1.15,"ls":0.72},{"id":"iso","label":"ISO 27001","p":[1.8,1.65,-2.24],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"multi","label":"Multi-\nframework","p":[4.55,1.25,-1.98],"c":"amber","shape":"torus","size":0.8,"ly":1.15,"ls":0.72}],"links":[["org","nist"],["org","ncsc"],["org","iso"],["org","multi"]],"steps":["all",["org","nist"],["org","ncsc"],["org","iso"],["org","multi"],"all"]},"say":["No single framework suits everyone, so the chapter compares four options.","The NIST CSF is technology-agnostic and flexible but gives limited AI guidance, has medium complexity and suits large organisations.","NCSC guidance is practical and AI-specific but focused on the UK, has low to medium complexity and suits AI-focused organisations.","ISO 27001 is comprehensive and systematic but resource intensive, has high complexity and suits global organisations.","A multi-framework approach gives holistic coverage, meaning it covers the whole picture, but brings high complexity and suits complex environments.","Each option has strengths and limitations, so the right one depends on the organisation."]},{"scene":{"type":"graph","title":"Four selection criteria","nodes":[{"id":"choice","label":"Framework\nchoice","p":[0,-0.2,1.2],"c":"green","shape":"shield","size":1.3,"ly":1.75,"spin":true},{"id":"mat","label":"Organisational\nmaturity","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"reg","label":"Regulatory\nrequirements","p":[-1.8,1.65,-2.24],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"res","label":"Resource\navailability","p":[1.8,1.65,-2.24],"c":"amber","shape":"cyl","size":0.8,"ly":1.15,"ls":0.72},{"id":"tech","label":"Technical\nconstraints","p":[4.55,1.25,-1.98],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["choice","mat"],["choice","reg"],["choice","res"],["choice","tech"]],"steps":["all",["choice","mat"],["choice","reg"],["choice","res"],["choice","tech"],"all"]},"say":["The chapter gives four criteria for making the choice.","Organisational maturity asks how developed your security practice already is.","Regulatory requirements ask which rules you must meet.","Resource availability asks what people, time and budget you have.","Technical constraints ask what your systems can realistically support.","You should be able to justify the choice in plain terms to leaders who may know little about AI."]}],"keyPoint":"NIST CSF is flexible, NCSC is practical and AI-specific, ISO 27001 is comprehensive but demanding, and a multi-framework approach is holistic but complex. Choose using maturity, regulation, resources and technical constraints.","plain":["Choosing a framework is like choosing a vehicle: a lorry carries more but costs more to run.","Technology-agnostic means it works whatever technology you use.","UK-centric guidance fits UK organisations best.","Combining frameworks covers more ground but takes more effort to manage."],"check":{"q":"A small UK company that mainly builds AI products wants practical, AI-specific guidance with manageable complexity. Which option fits best in the chapter's matrix?","o":["ISO 27001","Multi-framework","NCSC"],"a":2,"e":"NCSC guidance is practical and AI-specific, has low to medium complexity and suits AI-focused organisations.","retry":{"q":"Which framework does the chapter describe as resource intensive?","o":["NCSC","ISO 27001","NIST CSF"],"a":1,"e":"ISO 27001 is comprehensive and systematic but resource intensive."}},"scenario":{"title":"Advising a global retailer","setting":"A large global retailer with operations in many countries, several regulators and a big security team asks which framework approach to use for its growing number of AI systems.","steps":[{"prompt":"What should you examine first?","choices":[{"t":"Its maturity, regulatory requirements, resources and technical constraints","s":2,"fb":"Right. Those are the chapter's selection criteria."},{"t":"Whatever a competitor uses","s":1,"fb":"Useful context, but it does not reflect this retailer's own needs."},{"t":"Which framework has the shortest document","s":0,"fb":"Length is not a selection criterion."}]},{"prompt":"Its environment is complex and spans many countries and regulations. Which approach fits?","choices":[{"t":"NCSC guidance alone","s":1,"fb":"Practical and AI-specific, but its UK-centric focus may not cover every country."},{"t":"A multi-framework approach, accepting high complexity for holistic coverage","s":2,"fb":"Right. The chapter matches multi-framework approaches to complex environments."},{"t":"No framework at all","s":0,"fb":"That leaves AI risks unmanaged."}]},{"prompt":"How do you explain the choice to executives with limited AI knowledge?","choices":[{"t":"Tell them it is too technical to explain","s":0,"fb":"Leaders must understand decisions they are accountable for."},{"t":"Show them the full technical mapping spreadsheet","s":1,"fb":"Thorough, but it will not help non-specialists decide."},{"t":"Link it in plain language to the business's risks, regulators and resources","s":2,"fb":"Right. Justify the choice using the selection criteria they care about."}]}]},"lab":{"type":"sort","title":"Match the framework","prompt":"Which option does the chapter describe in each way?","buckets":["NIST CSF","NCSC","ISO 27001","Multi-framework"],"items":[{"t":"Technology-agnostic and flexible","b":0},{"t":"Limited AI guidance","b":0},{"t":"Practical and AI-specific","b":1},{"t":"UK-centric focus","b":1},{"t":"Comprehensive and systematic","b":2},{"t":"Resource intensive","b":2},{"t":"Holistic coverage","b":3},{"t":"Best for complex environments","b":3}],"explain":"Every option has a strength and a limitation, which is why the selection criteria matter."}},{"title":"The roadmap and keys to success","minutes":4,"slides":[{"scene":{"type":"graph","title":"A phased roadmap","nodes":[{"id":"p1","label":"Phase 1: Foundation\n0 to 6 months","p":[-4.4,0,-0.7],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"p2","label":"Phase 2: Enhancement\n6 to 12 months","p":[0.0,0,0.7],"c":"violet","shape":"sphere","size":1,"ly":1.3},{"id":"p3","label":"Phase 3: Optimisation\n12 to 24 months","p":[4.4,0,-0.7],"c":"green","shape":"shield","size":1,"ly":1.3}],"links":[["p1","p2"],["p2","p3"]],"steps":["all",["p1"],["p2"],["p3"],"all","all"]},"say":["The chapter recommends rolling out an AI security framework in three phases.","Phase one, foundation, covers the first six months, with a full gap analysis, a governance structure, the most critical controls and a basic inventory of AI systems.","Phase two, enhancement, runs from six to twelve months, adding automated compliance monitoring, further controls, full metrics and AI incident response.","Phase three, optimisation, runs from twelve to twenty-four months, refining processes from experience, expanding automation, adopting advanced AI security technologies and assessing the whole programme.","Success depends on building capability step by step, engaging stakeholders and learning and adapting as you go.","The chapter stresses that adapting frameworks is an ongoing capability, not a one-time project."]},{"scene":{"type":"graph","title":"Five critical success factors","nodes":[{"id":"s","label":"Success","p":[0,-0.2,1.2],"c":"green","shape":"shield","size":1.3,"ly":1.75,"spin":true},{"id":"int","label":"Integrate,\nnot replace","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"risk","label":"Risk-based\npriorities","p":[-2.62,1.58,-2.2],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"auto","label":"Automation\nhelps people","p":[0.0,1.7,-2.28],"c":"violet","shape":"ico","size":0.8,"ly":1.15,"ls":0.72},{"id":"stake","label":"Stakeholder\nalignment","p":[2.63,1.58,-2.2],"c":"amber","shape":"sphere","size":0.8,"ly":1.15,"ls":0.72},{"id":"meas","label":"Measure and\nimprove","p":[4.55,1.25,-1.98],"c":"pink","shape":"torus","size":0.8,"ly":1.15,"ls":0.72}],"links":[["s","int"],["s","risk"],["s","auto"],["s","stake"],["s","meas"]],"steps":["all",["s","int"],["s","risk"],["s","auto"],["s","stake"],["s","meas"],"all"]},"say":["The chapter closes with five critical success factors.","Integrate rather than replace, building on the frameworks you already have.","Prioritise by risk, focusing on your actual exposure and on what your organisation is able to do.","Use automation to enhance human oversight, not to replace it, and keep accountability in place.","Align stakeholders, coordinating across the organisation with clear communication and responsibilities.","Measure and improve, using data and continuous feedback loops.","Above all, success depends on bringing technical, legal and business perspectives together."]}],"keyPoint":"Roll out in three phases (foundation, enhancement, optimisation) over about two years. Integrate rather than replace, prioritise by risk, let automation support people, align stakeholders and measure to improve.","plain":["Phase one lays the foundations; you do not fit the roof before the walls.","Building capability step by step is less risky than one big switch-over.","Stakeholders are everyone affected: security, legal, data protection, IT and the AI teams.","Framework adaptation never really finishes, because AI and the rules keep changing."],"check":{"q":"In which phase does the chapter place the basic AI system inventory and the governance structure?","o":["Phase 2: Enhancement","Phase 1: Foundation","Phase 3: Optimisation"],"a":1,"e":"Foundation covers gap analysis, governance, critical controls and a basic AI system inventory.","retry":{"q":"What does 'integration over replacement' mean?","o":["Replace old frameworks with new ones","Avoid frameworks altogether","Build on the frameworks you already have"],"a":2,"e":"The first success factor is to build on existing framework investments."}},"scenario":{"title":"AI fraud detection at a financial firm","setting":"A mid-size financial services firm is introducing AI for fraud detection. It already has ISO 27001 in place, must meet FCA requirements and GDPR, and has limited AI expertise.","steps":[{"prompt":"What should the first six months focus on?","choices":[{"t":"Automated compliance monitoring straight away","s":1,"fb":"Valuable, but the chapter places it in phase two, after the foundation."},{"t":"Gap analysis, a governance structure, critical controls and an AI system inventory","s":2,"fb":"Right. That is phase one, foundation."},{"t":"Advanced AI security technologies","s":0,"fb":"These belong in phase three, once the basics are in place."}]},{"prompt":"Given limited AI expertise and an existing ISO 27001 programme, what approach fits?","choices":[{"t":"Drop ISO 27001 and start again with an AI framework","s":0,"fb":"That throws away existing investment."},{"t":"Build on the existing ISO 27001 programme and prioritise by actual risk","s":2,"fb":"Right. Integration over replacement, and risk-based prioritisation."},{"t":"Hire consultants to do everything and keep staff out of it","s":1,"fb":"Outside help can fill gaps, but stakeholder alignment and in-house learning matter for success."}]},{"prompt":"How should the firm show that the programme is working?","choices":[{"t":"Define success metrics across effectiveness, efficiency, quality and compliance","s":2,"fb":"Right. That uses the chapter's metrics framework."},{"t":"Wait for the next external audit","s":1,"fb":"An audit helps, but continuous measurement drives improvement."},{"t":"Count the number of policies written","s":0,"fb":"That measures activity, not security."}]}]},"lab":{"type":"sort","title":"Which phase?","prompt":"Place each activity in the roadmap phase the chapter gives it.","buckets":["Phase 1: Foundation","Phase 2: Enhancement","Phase 3: Optimisation"],"items":[{"t":"Comprehensive gap analysis","b":0},{"t":"Set up the governance structure","b":0},{"t":"Basic AI system inventory","b":0},{"t":"Automated compliance monitoring","b":1},{"t":"Full metrics in place","b":1},{"t":"AI incident response capabilities","b":1},{"t":"Expand automation","b":2},{"t":"Adopt advanced AI security technologies","b":2},{"t":"Assess the whole programme","b":2}],"explain":"Foundations first, then enhancement, then optimisation based on what you have learned."}}],"test":[{"q":"Why do traditional frameworks need adapting for AI?","o":["AI systems are always cheaper","AI systems learn and change, and face new kinds of attack","Traditional frameworks are illegal"],"a":1,"e":"Traditional frameworks assume static, predictable systems; AI systems are dynamic and face new attacks.","lesson":0},{"q":"In the layered integration approach, what forms the foundation?","o":["The existing traditional framework","An AI ethics committee","A new AI-only framework"],"a":0,"e":"The AI security adaptation layer sits on top of the traditional framework foundation.","lesson":1},{"q":"Which is a GRC problem that the chapter lists?","o":["Too few regulations","Real-time dashboards","Resource-intensive audit preparation"],"a":2,"e":"Manual monitoring, audit preparation, interpretation difficulty and the need for real-time validation are all listed.","lesson":1},{"q":"Which NIST CSF function gains an AI model registry?","o":["Identify","Protect","Recover"],"a":0,"e":"Identify moves from asset inventory to an AI model registry with dependencies.","lesson":2},{"q":"Under the NIST CSF, what is detect's AI enhancement?","o":["Model rollback","AI behaviour monitoring and drift detection","Training data security"],"a":1,"e":"Detect moves from anomaly detection to AI behaviour monitoring and drift detection.","lesson":2},{"q":"Checking a pre-trained model before you use it is part of which NCSC principle?","o":["Continuous monitoring","AI-specific incident response","AI supply chain security"],"a":2,"e":"Supply chain security covers external data, pre-trained models and third-party ML libraries.","lesson":3},{"q":"Which accountability domain is delivered through human-in-the-loop systems?","o":["Human oversight","Transparency","Bias monitoring"],"a":0,"e":"Human oversight means meaningful control, delivered through human-in-the-loop systems.","lesson":4},{"q":"Under GDPR, what must an organisation have before using personal data in AI?","o":["A fast server","A lawful basis for processing","A NIST CSF certificate"],"a":1,"e":"A lawful basis for AI data processing is the first GDPR implication the chapter lists.","lesson":4},{"q":"In the chapter's proposed ISO controls, data poisoning prevention belongs to…","o":["AI model security","Physical security","AI data governance"],"a":2,"e":"AI data governance covers training data security, data poisoning prevention and privacy-preserving AI.","lesson":5},{"q":"What is the correct order of the framework mapping process?","o":["Inventory, extraction, mapping, roadmap","Roadmap, inventory, mapping, extraction","Mapping, inventory, roadmap, extraction"],"a":0,"e":"List the frameworks, extract requirements, map across them, then plan the roadmap.","lesson":6},{"q":"In the chapter's RACI matrix, who does the work in a model security review?","o":["The CISO","The AI team","Legal"],"a":1,"e":"The AI team is responsible and the AI security manager accountable.","lesson":7},{"q":"Which body sits under the AI security steering committee?","o":["The board of directors","The CISO","The AI ethics and compliance board"],"a":2,"e":"The committee oversees the AI risk management office, the AI security operations centre and the AI ethics and compliance board.","lesson":7},{"q":"According to the chapter, compliance automation should…","o":["Enhance human oversight and keep accountability","Replace the compliance team","Only run once a year"],"a":0,"e":"Automation is an enhancement: it augments rather than replaces human oversight.","lesson":8},{"q":"'AI-assisted accuracy' is which level of metric?","o":["Traditional","AI-enhanced","AI-specific"],"a":1,"e":"It measures how AI improves security work, so it is AI-enhanced.","lesson":9},{"q":"Which framework does the chapter describe as practical and AI-specific but UK-centric?","o":["ISO 27001","NIST CSF","NCSC"],"a":2,"e":"NCSC guidance is practical and AI-specific, with a UK-centric focus.","lesson":10},{"q":"Automated compliance monitoring belongs in which phase of the roadmap?","o":["Phase 2: Enhancement","Phase 1: Foundation","Phase 3: Optimisation"],"a":0,"e":"Enhancement, from six to twelve months, adds automated compliance monitoring.","lesson":11}]};
</script>
