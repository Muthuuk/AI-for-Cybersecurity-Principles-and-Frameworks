/* Chapter 10: Security Testing, Validation and Deployment Automation (Guide to AI for Cybersecurity) */
const CH = {"id":"ch10","num":"10","title":"Security Testing, Validation and Deployment Automation","summary":"How to test, validate and safely deploy AI-enhanced systems: the economics of testing, AI-generated tests, predicting where flaws hide, pipeline and production automation, model robustness, privacy and fairness gates, secure deployment, canary releases and recovery.","outcomes":["Explain why testing early pays and name the four testing domains","Describe how AI generates and prioritises security tests","Place security checks across a CI/CD pipeline and production monitoring","Validate models for robustness, privacy, integrity and fairness","Design a layered deployment with canary releases and rollback","Set encryption and recovery targets that match the risk"],"starter":[{"q":"When is a security flaw cheapest to fix?","o":["During development","In production","After a breach"],"a":0,"e":"Costs rise sharply the later a flaw is found."},{"q":"Can an AI model be fooled by a change a person cannot see?","o":["No","Yes"],"a":1,"e":"Adversarial examples do exactly this."},{"q":"Sending a new model to a small share of users first is called…","o":["A canary release","A big bang","A rollback"],"a":0,"e":"Lesson 7 covers canary releases."}],"lessons":[{"title":"Why security testing pays","minutes":4,"slides":[{"scene":{"type":"graph","title":"Fixing a flaw costs more the later you find it","nodes":[{"id":"dev","label":"Development:\nabout $80","p":[-5.2,0.0,-0.3],"c":"green","shape":"cyl","size":0.8,"ls":0.62},{"id":"tst","label":"Testing:\nabout $240","p":[0.0,1.5,0.3],"c":"amber","shape":"cyl","size":0.8,"ls":0.62},{"id":"prd","label":"Production:\nabout $7,600","p":[5.2,0.0,-0.3],"c":"red","shape":"cyl","size":0.8,"ls":0.62}],"links":[["dev","tst",2],["tst","prd",2]],"steps":["all",["dev"],["tst"],["prd"]]},"say":["Welcome to Chapter 10, Security Testing, Validation and Deployment Automation, and I'm Sam, your tutor. The later a flaw is found, the more code, data and people it has touched.","The chapter reports that a flaw costing about 80 dollars to fix in development…","…costs about 240 at testing…","…and about 7,600 in production, roughly 95 times more. Treat these multipliers as indicative. IBM's 2024 report put the average data breach at 4.88 million dollars."]},{"scene":{"type":"graph","title":"Four complementary testing domains","nodes":[{"id":"st","label":"Static analysis:\ncode not running","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"dy","label":"Dynamic analysis:\nrunning system","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"pt","label":"Penetration testing:\nauthorised attack","p":[1.73,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"ai","label":"AI model testing:\nfooled, leaky, unfair?","p":[5.2,1.5,0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[],"steps":["all",["st"],["dy"],["pt"],["ai"],"all"]},"say":["Security testing has four domains, and no single one is enough.","Static analysis examines code without running it.","Dynamic analysis tests the running system, for example with fuzzing.","Penetration testing is an authorised, simulated attack by experts; a red team does this over longer periods and tests people and processes too.","AI model testing is the newer fourth domain. Models learn behaviour from data, give probabilistic answers and face a practically infinite range of inputs, so they can be fooled by adversarial examples, leak training data, treat people unfairly or drift as the world changes.","Combining the domains is defence in depth."]}],"keyPoint":"Testing early saves money. Combine static, dynamic, penetration and AI model testing, because AI adds failure modes ordinary tests never look for.","plain":["Fixing a flaw in production is like fixing a crack after the building is occupied.","An adversarial example looks unchanged to a person but fools the model.","A red team plays the attacker for real, with permission.","Drift is the model slowly going out of date."],"check":{"q":"Why are AI systems harder to test than traditional software?","o":["They learn behaviour from data and give probabilistic outputs","They never change","They have no inputs"],"a":0,"e":"Same input, same output no longer holds.","retry":{"q":"In the building picture, when is a crack cheapest to fix?","o":["Before anyone moves in","After the tenants arrive","Never"],"a":0,"e":"Find flaws early."}},"scenario":{"title":"The low-budget launch","setting":"A startup wants to release a low-risk AI product with minimal security testing.","steps":[{"prompt":"What is a sensible position?","choices":[{"t":"Scale testing to the risk, but never skip AI-specific checks entirely","s":2,"fb":"Right. Proportionate, not absent."},{"t":"No testing is fine for low risk","s":0,"fb":"Even low-risk products can leak data."},{"t":"Test everything to bank-grade","s":1,"fb":"Possibly overkill for the risk."}]},{"prompt":"Which domain checks whether the model can be fooled?","choices":[{"t":"AI model testing","s":2,"fb":"Right. The fourth domain."},{"t":"Static analysis","s":0,"fb":"That reads code."},{"t":"Dynamic analysis","s":1,"fb":"Close, but model testing is specific."}]}]},"lab":{"type":"sort","title":"Which domain?","prompt":"Match each activity to its testing domain.","buckets":["Static analysis","Dynamic analysis","Penetration testing","AI model testing"],"items":[{"t":"Reviewing code with a SAST tool","b":0},{"t":"Fuzzing a running API","b":1},{"t":"Experts simulate an attack with permission","b":2},{"t":"Checking accuracy under adversarial attack","b":3},{"t":"Checking dependencies for known flaws","b":0},{"t":"Testing for membership inference","b":3}],"explain":"Each domain catches what the others miss."}},{"title":"AI-powered test generation","minutes":3,"slides":[{"scene":{"type":"graph","title":"A test generator that improves every round","nodes":[{"id":"ga","label":"Gather data:\npast flaws, patterns","p":[0.0,3.2,0],"c":"slate","shape":"cyl","size":0.8,"ls":0.6},{"id":"tr","label":"Train the\ngenerator","p":[3.64,1.9,0],"c":"violet","shape":"ico","size":0.8,"ls":0.6},{"id":"gn","label":"Generate\ntests","p":[3.64,-0.7,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"ex","label":"Execute in\nisolation","p":[0.0,-2.0,0],"c":"cyan","shape":"shield","size":0.8,"ls":0.6},{"id":"an","label":"Analyse\nresults","p":[-3.64,-0.7,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"rf","label":"Refine\nthe model","p":[-3.64,1.9,0],"c":"green","shape":"torus","size":0.8,"ls":0.6}],"links":[["ga","tr",2],["tr","gn",2],["gn","ex",2],["ex","an",2],["an","rf",2],["rf","ga",2]],"steps":["all",["ga"],["tr"],["gn"],["ex"],["an"],["rf"],"all"],"orbit":0.4},"say":["Writing tests by hand is slow, covers only what testers think of, and rarely finds new problems. AI test generation is a feedback loop.","Gather past vulnerabilities, attack patterns and an analysis of the code.","Train the generator.","Generate new test inputs.","Run them in an isolated test environment, never against live systems.","Group and check the results.","Feed the outcome back so the next round targets weak spots better.","Techniques include GANs, where a forger and a detective improve each other; reinforcement learning, rewarded for reaching new code, good for APIs where order matters; evolutionary algorithms that mutate inputs and keep the fittest; and graph neural networks that read code structure. The chapter reports more flaws found in less time, as indicative figures."]}],"keyPoint":"AI generates, runs and refines security tests in a loop. Choose the technique for the context, run tests in isolation, and keep exploring so the generator does not get stuck.","plain":["A GAN is a forger and a detective, each making the other better.","Reinforcement learning learns by trial and reward.","Evolutionary algorithms copy natural selection.","Never point a test generator at live systems."],"check":{"q":"Which technique suits testing an API where the order of calls matters?","o":["Reinforcement learning","Spell checking","Random guessing"],"a":0,"e":"RL handles stateful sequences.","retry":{"q":"In a GAN, what does the detective do?","o":["Tries to tell generated inputs from real ones","Writes the code","Pays the bills"],"a":0,"e":"The forger improves until the detective is fooled."}},"scenario":{"title":"The self-taught generator","setting":"A test generator learns only from its own results and keeps testing the same login page.","steps":[{"prompt":"What has gone wrong?","choices":[{"t":"It is exploiting one area and not exploring","s":2,"fb":"Right. Good systems deliberately keep exploring."},{"t":"Nothing","s":0,"fb":"It is missing the rest of the app."},{"t":"The login page is broken","s":0,"fb":"The generator is stuck."}]},{"prompt":"How do you stop false alarms wasting developers' time?","choices":[{"t":"Confirm and group findings before reporting them","s":2,"fb":"Right. Analyse before you alert."},{"t":"Send everything","s":0,"fb":"That buries real issues."},{"t":"Turn off the generator","s":0,"fb":"You lose its value."}]}]},"lab":{"type":"sort","title":"Pick the technique","prompt":"Which test generation technique fits each description?","buckets":["GAN","Reinforcement learning","Evolutionary algorithm","Graph neural network"],"items":[{"t":"A forger and a detective compete","b":0},{"t":"Rewarded for reaching new code paths in an API","b":1},{"t":"Mutate inputs and keep those that reach new code","b":2},{"t":"Reads code as a network of connected parts","b":3}],"explain":"Different techniques suit different targets."}},{"title":"Predicting where the vulnerabilities are","minutes":3,"slides":[{"scene":{"type":"graph","title":"Send limited effort to the riskiest code","nodes":[{"id":"cx","label":"Complexity\n(paths through code)","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ch","label":"Change frequency\nand contributors","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"hist","label":"Past flaws and\nbug density","p":[0.0,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"tm","label":"Team experience\nand review quality","p":[2.6,1.5,0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"ens","label":"Ensemble model\nranks modules by risk","p":[5.2,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[["cx","ens",1],["ch","ens",1],["hist","ens",1],["tm","ens",1]],"steps":["all",["cx"],["ch"],["hist"],["tm"],["ens"]]},"say":["Budgets never allow every module to be tested deeply, so machine learning helps prioritise.","Complexity: cyclomatic complexity counts independent paths through code, and more paths mean more places for mistakes.","Code that changes often, or is touched by many people, breaks more often.","Where there were bugs before, there are often more.","Team experience and review quality matter too.","An ensemble, several models combined, ranks modules by risk. The chapter reports finding 78 per cent of vulnerabilities by testing the riskiest 35 per cent of code. Adaptive testing then adjusts as it learns: Q-learning for sequences of steps, and multi-armed bandits that balance using strategies that have paid off with trying new ones. Treat predictions as a way to order work, not proof that low-ranked code is safe."]}],"keyPoint":"Predict risk from complexity, churn, history and team factors, test the riskiest code first, and let adaptive strategies learn. Low risk is not no risk.","plain":["A multi-armed bandit is like choosing between slot machines: keep the one that pays, but try others too.","An ensemble is a panel of experts whose votes are combined.","A feature is a measurable fact about code.","Predictions order the work; they do not prove safety."],"check":{"q":"Which feature most suggests a module is risky?","o":["It has had many past flaws and changes often","It has a short name","It was written on a Monday"],"a":0,"e":"History and churn are strong predictors.","retry":{"q":"In the slot machine picture, why keep trying other machines?","o":["One might pay better: that is exploration","To waste money","Because the rules say so"],"a":0,"e":"Bandits balance exploitation and exploration."}},"scenario":{"title":"The untested modules","setting":"Your risk model ranks 40 modules as low risk. A manager suggests never testing them.","steps":[{"prompt":"Is that wise?","choices":[{"t":"No, give them lighter testing; low risk is not no risk","s":2,"fb":"Right. Predictions order work."},{"t":"Yes, the model is always right","s":0,"fb":"Models can be wrong or outdated."},{"t":"Test only those 40","s":0,"fb":"That ignores the riskiest code."}]},{"prompt":"What if developers learn which features the model uses?","choices":[{"t":"They might game them, so monitor and update the model","s":2,"fb":"Right. Features can be manipulated."},{"t":"Nothing changes","s":0,"fb":"Incentives change behaviour."},{"t":"Delete the model","s":1,"fb":"Too drastic."}]}]},"lab":{"type":"sort","title":"Risk feature or not?","prompt":"Is each fact a useful vulnerability risk feature?","buckets":["Useful risk feature","Not useful"],"items":[{"t":"Number of independent paths through the code","b":0},{"t":"How often the file changes","b":0},{"t":"The colour scheme of the editor","b":1},{"t":"Past bug density","b":0},{"t":"The day of the week it was written","b":1}],"explain":"Good features are measurable and linked to how flaws arise."}},{"title":"Automation in the pipeline and in production","minutes":4,"slides":[{"scene":{"type":"graph","title":"Fast checks early, deeper checks later","nodes":[{"id":"cm","label":"Commit:\nunder 30 s","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"bd","label":"Build: static\nanalysis, 2–5 min","p":[-3.12,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"in","label":"Integration:\nfuzzing, APIs","p":[-1.04,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"sg","label":"Staging:\npenetration test","p":[1.04,1.5,0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"cn","label":"Canary:\nreal time","p":[3.12,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"pd","label":"Production:\n24\n7","p":[5.2,1.5,0.3],"c":"red","shape":"torus","size":0.8,"ls":0.62}],"links":[["cm","bd",2],["bd","in",2],["in","sg",2],["sg","cn",2],["cn","pd",2]],"steps":["all",["cm"],["bd"],["in"],["sg"],["cn"],["pd"]]},"say":["Security tests are spread across the delivery pipeline, with fast checks where developers wait and deeper checks later.","At commit, a quick predictive scan in under 30 seconds.","At build, static analysis; only high-severity, high-confidence findings block the build.","At integration, fuzzing and API tests.","In staging, a copy of the live environment, a full penetration test.","At canary, the new version faces a small share of real traffic.","And production is watched around the clock. Clear blocking rules stop the pipeline becoming either a rubber stamp or a roadblock."]},{"scene":{"type":"graph","title":"Watching the live system for anomalies","nodes":[{"id":"tr","label":"Production\ntraffic","p":[-5.2,0.0,-0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"fe","label":"Feature\nextraction","p":[-2.6,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"dm","label":"Detection\nmodels","p":[0.0,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"sv","label":"Severity\nassessment","p":[2.6,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"rs","label":"Log, alert\nor respond","p":[5.2,0.0,-0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62}],"links":[["tr","fe",2],["fe","dm",2],["dm","sv",2],["sv","rs",2]],"steps":["all",["tr"],["fe"],["dm"],["sv"],["rs"]]},"say":["Pre-release testing cannot catch new attack methods or zero-day flaws, unknown until exploited, so the live system learns a baseline of normal behaviour.","Traffic flows in.","Features such as request rates, input sizes and response times are extracted.","Models look for statistical outliers, behavioural anomalies like one account making thousands of requests, and unusual sequences of events.","Each anomaly gets a severity score.","Low scores are logged; high scores alert people or trigger automatic action such as rate limiting. A detector is useless if its alerts are ignored."]}],"keyPoint":"Put quick checks early and deep checks later, with clear blocking rules. In production, learn normal behaviour and respond to anomalies by severity.","plain":["Developers need feedback in seconds at commit.","Staging is a dress rehearsal of the live system.","A zero-day is a flaw nobody knew about until it was used.","Tiered responses: log, alert, or act automatically."],"check":{"q":"Why does only a quick scan run at commit?","o":["Developers need feedback within seconds","Commit is unimportant","Deep scans are illegal"],"a":0,"e":"Deeper checks run later in the pipeline.","retry":{"q":"What is a behavioural anomaly?","o":["An unusual pattern, such as one account suddenly making thousands of requests","A single typo","A planned update"],"a":0,"e":"It differs from the learned baseline."}},"scenario":{"title":"The slow pipeline","setting":"Developers complain that security checks make every commit take 20 minutes.","steps":[{"prompt":"What would you change first?","choices":[{"t":"Move deep checks to later stages and keep commit checks under 30 seconds","s":2,"fb":"Right. Fast early, deep later."},{"t":"Remove security checks","s":0,"fb":"That removes protection."},{"t":"Ask developers to wait","s":0,"fb":"They will find workarounds."}]},{"prompt":"A new attack technique appears after release. What catches it?","choices":[{"t":"Production anomaly detection","s":2,"fb":"Right. Pre-release tests cannot foresee it."},{"t":"The commit scan","s":0,"fb":"That ran long ago."},{"t":"Nothing can","s":0,"fb":"Monitoring is designed for this."}]}]},"lab":{"type":"order","title":"Order the pipeline","prompt":"Put the pipeline security stages in order.","items":["Commit scan","Build static analysis","Integration fuzzing","Staging penetration test","Canary release","Production monitoring"],"explain":"Each stage is deeper and slower than the one before."}},{"title":"Validating models: robustness, privacy and integrity","minutes":3,"slides":[{"scene":{"type":"graph","title":"Six model properties that need their own tests","nodes":[{"id":"rb","label":"Adversarial\nrobustness","p":[0.0,3.2,0],"c":"red","shape":"ico","size":0.8,"ls":0.6},{"id":"dv","label":"Data\nvalidation","p":[3.64,1.9,0],"c":"cyan","shape":"cyl","size":0.8,"ls":0.6},{"id":"bh","label":"Model\nbehaviour","p":[3.64,-0.7,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"fa","label":"Fairness","p":[0.0,-2.0,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6},{"id":"pv","label":"Privacy","p":[-3.64,-0.7,0],"c":"amber","shape":"shield","size":0.8,"ls":0.6},{"id":"ig","label":"Integrity","p":[-3.64,1.9,0],"c":"pink","shape":"shield","size":0.8,"ls":0.6}],"links":[],"steps":["all",["rb"],["dv"],["bh"],["fa"],["pv"],["ig"]],"orbit":0.4},"say":["A model needs tests for six properties, each with an acceptance threshold.","Robustness: keep over 85 per cent accuracy under attack. White-box tests use the model's internals: FGSM takes one quick step, PGD many small steps, and Carlini and Wagner uses optimisation. Black-box tests see only inputs and outputs; aim for under 20 per cent attack success within 10,000 queries.","Data validation checks for poisoning, bad examples slipped into training data.","Behaviour checks the model does what it should across normal and edge cases.","Fairness checks similar results across groups, covered next.","Privacy: membership inference attacks should be under 55 per cent accurate, barely better than a coin toss.","Integrity: verify the model's signature and check for hidden backdoors. These tests run as automatic gates whenever a model is retrained, and a model that fails is not deployed."]}],"keyPoint":"Test robustness, data, behaviour, fairness, privacy and integrity, with clear thresholds, as automatic gates on every retrain.","plain":["A gradient shows how the output changes when the input changes.","Membership inference near 50 per cent means the attacker is just guessing.","A backdoor is a hidden trigger planted in a model.","Tools include the Adversarial Robustness Toolbox and Neural Cleanse."],"check":{"q":"A membership inference attack is 52 per cent accurate. Is that acceptable under the chapter's target?","o":["Yes, it is under 55 per cent","No, it must be 0","It is irrelevant"],"a":0,"e":"Near 50 means little better than guessing.","retry":{"q":"What is the difference between white-box and black-box testing?","o":["White-box sees the model's internals; black-box sees only inputs and outputs","White-box is cheaper","There is no difference"],"a":0,"e":"Black-box is closer to a real outside attacker."}},"scenario":{"title":"The narrow miss","setting":"A retrained model scores 83 per cent accuracy under attack against an 85 per cent target.","steps":[{"prompt":"What should happen?","choices":[{"t":"Block deployment and improve robustness, or have a named owner formally decide","s":2,"fb":"Right. Gates exist for this."},{"t":"Deploy anyway, it is close","s":0,"fb":"Thresholds lose meaning."},{"t":"Lower the target quietly","s":0,"fb":"That hides risk."}]},{"prompt":"Privacy testing shows membership inference at 68 per cent. One option is…","choices":[{"t":"Retrain with differential privacy, accepting some accuracy loss","s":2,"fb":"Right. Each option has a cost."},{"t":"Ignore it","s":0,"fb":"Patients' privacy is at risk."},{"t":"Publish the training data","s":0,"fb":"That makes it worse."}]}]},"lab":{"type":"sort","title":"Which property?","prompt":"Match each test to the model property it checks.","buckets":["Robustness","Data validation","Privacy","Integrity","Fairness"],"items":[{"t":"PGD attack on test images","b":0},{"t":"Scan training data for poisoned samples","b":1},{"t":"Membership inference test","b":2},{"t":"Verify the model file's signature","b":3},{"t":"Compare approval rates across groups","b":4},{"t":"Search for hidden backdoor triggers","b":3}],"explain":"Each property needs its own test and threshold."}},{"title":"Fairness testing and production monitoring","minutes":3,"slides":[{"scene":{"type":"graph","title":"Two ways to measure fairness","nodes":[{"id":"dp","label":"Demographic parity:\nsimilar approval rates\n(block if gap > 5%)","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"sphere","size":0.8,"ls":0.62},{"id":"eo","label":"Equalised odds:\nsimilar error rates\n(block if gap > 10%)","p":[0.0,1.5,0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"pr","label":"Measure per group →\ncompare → block →\nmitigate → retest","p":[5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["dp"],["eo"],["pr"]]},"say":["Fairness has more than one definition.","Demographic parity: the chance of a yes should be about the same for every group. Block deployment if the gap is over 5 per cent.","Equalised odds is stricter about quality: among people who should be approved, groups are approved at similar rates, and among those who should not, they are wrongly approved at similar rates. Block if the gap is over 10 per cent.","Measure per group, compare with thresholds, block if exceeded, fix and retest. The two measures can conflict, and fairness can cost some accuracy, so justify the choice for the context. In production, also watch input drift with KL divergence, a number measuring how different today's data is from the training data, alerting above 0.3, and verify model checksums. Set alert thresholds from historical data, not guesswork, to avoid both alert fatigue and missed attacks."]}],"keyPoint":"Choose and justify a fairness measure, block deployment when gaps exceed thresholds, and monitor drift, data quality, privacy and integrity in production with evidence-based thresholds.","plain":["Demographic parity asks: does everyone get a yes at similar rates?","Equalised odds asks: are mistakes shared fairly?","A checksum is a fingerprint of a file.","Thresholds that are too tight flood staff; too loose miss attacks."],"check":{"q":"Equalised odds compares…","o":["Error rates across groups","File sizes","Server speeds"],"a":0,"e":"True and false positive rates should be similar.","retry":{"q":"What does a KL divergence above 0.3 suggest in the chapter's framework?","o":["Today's inputs differ notably from the training data","The model is perfect","The server is full"],"a":0,"e":"It is a drift signal."}},"scenario":{"title":"The drift alert","setting":"A drift alert fires, but accuracy has not yet fallen.","steps":[{"prompt":"Act now or wait?","choices":[{"t":"Investigate now and prepare to retrain; accuracy often falls next","s":2,"fb":"Right. Drift is an early warning."},{"t":"Ignore it until accuracy drops","s":0,"fb":"By then harm is done."},{"t":"Delete the model","s":0,"fb":"Too drastic."}]},{"prompt":"For a loan model, which fairness measure fits best?","choices":[{"t":"It depends on context; justify the choice and record it","s":2,"fb":"Right. Both have merits."},{"t":"Neither matters","s":0,"fb":"Unfair loans harm people and break law."},{"t":"Only overall accuracy","s":0,"fb":"Accuracy can hide unfairness."}]}]},"lab":{"type":"sort","title":"Fairness or monitoring?","prompt":"Is each item a fairness check or a production monitoring signal?","buckets":["Fairness check","Production monitoring"],"items":[{"t":"Approval rate gap between groups","b":0},{"t":"Input distribution drift","b":1},{"t":"False positive rate gap between groups","b":0},{"t":"Model checksum mismatch","b":1},{"t":"Sudden spike in adversarial scores","b":1}],"explain":"Both run continuously, before and after deployment."}},{"title":"Secure deployment and model updates","minutes":4,"slides":[{"scene":{"type":"graph","title":"Layers that protect a deployed model","nodes":[{"id":"cl","label":"Client access:\nTLS 1.3, gateway, WAF","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"id","label":"Identity:\nOAuth 2.0, MFA,\nleast privilege","p":[-3.12,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"rq","label":"Request controls:\nrate limits","p":[-1.04,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"ms","label":"Isolated model\nserving, signed models","p":[1.04,1.5,0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"stg","label":"Encrypted\nstorage","p":[3.12,0.0,-0.3],"c":"green","shape":"cyl","size":0.8,"ls":0.62},{"id":"au","label":"Audit and\nmonitoring","p":[5.2,1.5,0.3],"c":"slate","shape":"torus","size":0.8,"ls":0.62}],"links":[["cl","id",2],["id","rq",2],["rq","ms",2],["ms","stg",2],["stg","au",2]],"steps":["all",["cl"],["id"],["rq"],["ms"],["stg"],["au"]]},"say":["A deployed model sits behind several layers.","Client access: encrypted connections with TLS 1.3, an API gateway as the single front door, and a web application firewall filtering malicious requests.","Identity: OAuth 2.0 tokens that can be limited and revoked, multi-factor authentication and least privilege.","Request controls such as rate limiting, which also makes model extraction much harder.","Isolated model serving: verify the model's signature before loading, and sanitise outputs so they leak nothing extra.","Encrypted storage.","And audit logging and monitoring. Never build your own authentication scheme; use proven standards."]},{"scene":{"type":"graph","title":"A canary release with automatic rollback","nodes":[{"id":"gt","label":"Pass robustness, fairness\nand privacy gates","p":[-5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"c5","label":"Send 5–10% of\ntraffic to new version","p":[-2.6,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"cmp","label":"Compare errors, speed\nand security signals","p":[0.0,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"gr","label":"Roll out\ngradually","p":[2.6,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"rb","label":"Automatic rollback\nif gates fail","p":[5.2,0.0,-0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["gt","c5",2],["c5","cmp",2],["cmp","gr",2],["gr","rb",2]],"steps":["all",["gt"],["c5"],["cmp"],["gr"],["rb"]]},"say":["Updates follow a canary release, named after the canaries miners used to warn of bad air.","The new model must first pass the automated gates and its signature must match the approved version.","Only 5 to 10 per cent of live traffic reaches it at first.","Its error rate, speed and security signals are compared with the old version.","The share grows step by step only if all is well.","If gates fail or errors rise significantly, it rolls back automatically. Never deploy without a tested way back."]}],"keyPoint":"Protect deployed models in layers, verify signatures, and update with canary releases and automatic rollback.","plain":["The API gateway is the single front door.","A canary release lets a few users meet the new version first.","Rollback is the undo button for deployments.","Home-made authentication is a classic mistake."],"check":{"q":"Why use a canary release rather than switching everyone at once?","o":["Problems affect only a few users and can be rolled back","It is faster","It saves licences"],"a":0,"e":"Gradual exposure limits harm.","retry":{"q":"Which control also makes model extraction harder?","o":["Rate limiting","Bigger screens","Longer log files"],"a":0,"e":"Fewer queries means a poorer copy."}},"scenario":{"title":"The switch-over","setting":"A team wants to test a new model thoroughly offline, then switch all users over at midnight.","steps":[{"prompt":"What is the risk?","choices":[{"t":"Problems that only appear with real traffic hit everyone at once","s":2,"fb":"Right. Use a canary."},{"t":"None, offline tests are enough","s":0,"fb":"Real traffic reveals new problems."},{"t":"Midnight is too late","s":0,"fb":"Timing is not the issue."}]},{"prompt":"The new model's signature does not match the approved version. What happens?","choices":[{"t":"It must not be loaded","s":2,"fb":"Right. It may have been tampered with."},{"t":"Load it and monitor","s":0,"fb":"Too risky."},{"t":"Ask the developer","s":1,"fb":"Investigate, but do not load it."}]}]},"lab":{"type":"order","title":"Release safely","prompt":"Put the secure model update steps in order.","items":["Pass the automated gates and verify the signature","Send 5–10 per cent of traffic to the new version","Compare with the old version","Roll out gradually","Roll back automatically if anything fails"],"explain":"Never deploy without a tested way back."}},{"title":"Encryption, recovery and continuous improvement","minutes":3,"slides":[{"scene":{"type":"graph","title":"Protect data everywhere and plan for the worst day","nodes":[{"id":"tr","label":"In transit:\nTLS 1.3, forward secrecy,\nmutual TLS","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"rs","label":"At rest:\nAES-256, keys in\nKMS or HSM","p":[-2.6,1.5,0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62},{"id":"rto","label":"RTO: how fast\nback online","p":[0.0,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"rpo","label":"RPO: how much\ndata you can lose","p":[2.6,1.5,0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"fo","label":"Multi-region\nfailover","p":[5.2,0.0,-0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[],"steps":["all",["tr"],["rs"],["rto"],["rpo"],["fo"]]},"say":["The final layer protects data everywhere and plans for failure.","In transit: TLS 1.3 at minimum, with forward secrecy, so stolen keys cannot decrypt past conversations, and mutual TLS, where both sides prove who they are, for internal links.","At rest: AES-256 encryption for models, training data, logs and credentials, with keys held in a key management system or a tamper-resistant hardware security module and rotated every 90 days.","The recovery time objective, RTO, is how quickly the service must be back. The chapter's high-availability example is under five minutes.","The recovery point objective, RPO, is how much recent data you can afford to lose, here under 30 seconds.","Tight targets need a standby copy in a second region with automatic failover, which costs money, so smaller organisations may accept longer targets. Incidents and near misses feed back into new tests, thresholds and retrained models: security is continuous."]}],"keyPoint":"Encrypt in transit and at rest, manage keys properly, set RTO and RPO to match the service's importance, and feed incidents back into testing.","plain":["Forward secrecy means a stolen key cannot unlock old recorded conversations.","RTO: how long can we be down? RPO: how much data can we lose?","An HSM is a tamper-resistant box for keys.","Targets should match cost and importance."],"check":{"q":"What does RPO measure?","o":["How much recent data the organisation can afford to lose","How fast the service returns","Encryption strength"],"a":0,"e":"RTO is the time to recover.","retry":{"q":"What does forward secrecy protect?","o":["Past conversations if a key is stolen later","Future passwords","Printer settings"],"a":0,"e":"Old recorded traffic stays safe."}},"scenario":{"title":"Two systems, two targets","setting":"You are setting recovery targets for a small charity's donation website and a hospital triage model.","steps":[{"prompt":"Which needs tighter targets?","choices":[{"t":"The hospital triage model","s":2,"fb":"Right. Patient safety demands it."},{"t":"The charity website","s":0,"fb":"Important, but downtime is less harmful."},{"t":"They need identical targets","s":0,"fb":"Targets should match importance and cost."}]},{"prompt":"A monitoring alert reveals a new attack pattern. What should follow?","choices":[{"t":"Add a test for it and review the thresholds","s":2,"fb":"Right. Monitoring feeds testing."},{"t":"Close the alert","s":0,"fb":"The lesson is lost."},{"t":"Restart the server","s":1,"fb":"May help now, but learn from it."}]}]},"lab":{"type":"sort","title":"Transit, rest or recovery?","prompt":"Place each control in its category.","buckets":["Data in transit","Data at rest","Recovery"],"items":[{"t":"TLS 1.3 with forward secrecy","b":0},{"t":"AES-256 on model files","b":1},{"t":"Standby cluster in a second region","b":2},{"t":"Mutual TLS between services","b":0},{"t":"Keys stored in an HSM","b":1},{"t":"Recovery time under five minutes","b":2}],"explain":"Encryption protects data; recovery planning protects service."}}],"test":[{"q":"Roughly how much more does a production fix cost than a development fix, per the chapter?","o":["About 95 times","Twice","The same"],"a":0,"e":"","lesson":0},{"q":"Penetration testing is…","o":["An authorised simulated attack","A type of encryption","A coding style"],"a":0,"e":"","lesson":0},{"q":"Test generators should run…","o":["In isolated environments","Against live systems","Only on paper"],"a":0,"e":"","lesson":1},{"q":"Reinforcement learning test generation is rewarded for…","o":["Reaching new code or errors","Running slowly","Using less memory"],"a":0,"e":"","lesson":1},{"q":"Cyclomatic complexity counts…","o":["Independent paths through code","Lines of comments","Users"],"a":0,"e":"","lesson":2},{"q":"A multi-armed bandit balances…","o":["Exploiting what works and exploring alternatives","Cost and tax","Speed and colour"],"a":0,"e":"","lesson":2},{"q":"At commit, security checks should take…","o":["Seconds","Hours","Days"],"a":0,"e":"","lesson":3},{"q":"A zero-day is…","o":["A flaw unknown until exploited","A holiday","A patch"],"a":0,"e":"","lesson":3},{"q":"FGSM is…","o":["A one-step white-box adversarial attack","A firewall","A database"],"a":0,"e":"","lesson":4},{"q":"Membership inference near 50 per cent accuracy means…","o":["The attacker is barely better than guessing","The model leaks everything","The test failed"],"a":0,"e":"","lesson":4},{"q":"Demographic parity compares…","o":["Approval rates across groups","Server speeds","Model sizes"],"a":0,"e":"","lesson":5},{"q":"KL divergence measures…","o":["How different two data distributions are","Encryption strength","Network speed"],"a":0,"e":"","lesson":5},{"q":"A canary release first sends…","o":["5–10 per cent of traffic to the new version","All traffic","No traffic"],"a":0,"e":"","lesson":6},{"q":"Before loading a model, verify its…","o":["Signature","Font","Price"],"a":0,"e":"","lesson":6},{"q":"RTO is…","o":["How quickly service must be restored","How much data can be lost","A cipher"],"a":0,"e":"","lesson":7},{"q":"Encryption keys are best kept in…","o":["A KMS or HSM","A text file","An email"],"a":0,"e":"","lesson":7}]};
