/* Chapter 4: Machine Learning for Threat Detection (Guide to AI for Cybersecurity) */
const CH = {"id":"ch04","num":"4","title":"Machine Learning for Threat Detection","summary":"How machine learning spots threats that signatures miss: from raw data and features, through malware, phishing, anomaly and behaviour detection, to running detectors safely and responsibly.","outcomes":["Explain why signatures and fixed rules miss new threats, and how machine learning helps","Follow the six-stage pipeline from raw data to a security response","Tell supervised from unsupervised learning, and choose the right one","Judge a detector using precision, recall and the cost of each mistake","Describe how malware, phishing, anomaly and behaviour detection work","Plan a safe, responsible move from a model to a working production system"],"starter":[{"q":"A signature-based antivirus meets brand-new malware. What usually happens?","o":["It blocks it","It misses it, because there is no known fingerprint","It deletes every file"],"a":1,"e":""},{"q":"A detector is 99 per cent accurate, but attacks are only 1 per cent of events. What should you think?","o":["It must be excellent","It might be catching nothing at all, so check recall","Accuracy is the only measure that matters"],"a":1,"e":""},{"q":"Machine learning in security should…","o":["Replace analysts","Help analysts handle the volume and spot new threats","Only be used for email"],"a":1,"e":""}],"lessons":[{"title":"Why signatures are not enough","minutes":3,"slides":[{"scene":{"type":"flood","title":"A flood of events meets a signature filter","wallLabel":"Signature filter","steps":[{"rate":4},{"rate":8},{"rate":16},{"rate":8},{"rate":8},{"rate":8,"novel":true},{"rate":8,"novel":true}]},"say":["Welcome to Chapter 4, Machine Learning for Threat Detection, and I'm Sam, your tutor.","Every day, organisations face a flood of security events: logins, emails, files and network traffic.","The chapter notes that large organisations can collect more than a hundred terabytes of security logs a day, far too much for people to read.","The traditional defence is a signature, a fingerprint of a threat that has been seen before.","Signatures stop known threats well, so watch the red ones stop at the wall.","But a new threat has no fingerprint yet, so the purple ones slip straight through.","The chapter reports that signature-based systems can miss thirty to forty per cent of new malware variants."]},{"scene":{"type":"flood","title":"Machine learning catches what the signatures miss","mlLabel":"ML detector","steps":[{"rate":8,"novel":true,"ml":true},{"rate":8,"novel":true,"ml":true},{"rate":8,"novel":true,"ml":true},{"rate":8,"novel":true,"ml":true},{"rate":8,"novel":true,"ml":true}]},"say":["Machine learning takes a different approach, because it learns patterns from data instead of following fixed rules.","That lets it adapt as threats change, spot subtle patterns across huge datasets and analyse events in real time.","Most importantly, it can flag threats that have never been seen before, including zero-day attacks.","The chapter calls machine learning a force multiplier, because it helps a small team cover far more ground.","It does not replace analysts, it gives them better leads, faster."]}],"keyPoint":"Signatures only catch threats that have been seen before. Machine learning learns patterns from data, so it can also flag new threats and help analysts cope with the volume.","plain":["A signature is like a 'wanted' poster: it only works for criminals who are already known.","Security data arrives in volumes no team can read by hand.","Machine learning learns what normal and malicious look like, and can spot new patterns.","It is a force multiplier for analysts, not a replacement for them."],"check":{"q":"Why do signature-based tools struggle with brand-new malware?","o":["They are too slow to run","A new threat has no known fingerprint to match","They only work on email"],"a":1,"e":"A signature is a fingerprint of a known threat. New malware has none yet, so it passes.","retry":{"q":"In the 'wanted poster' picture, who gets past the guard?","o":["Someone whose poster is on the wall","Someone who has no poster yet","Nobody"],"a":1,"e":"The guard only recognises faces on posters. A newcomer walks straight past, just as new malware passes a signature filter."}},"scenario":{"title":"Monday morning in the security team","setting":"You lead security at a mid-sized company. Your antivirus raised no alerts last week, but a partner company reports that your mail server has been sending them strange files.","steps":[{"prompt":"What is the most likely explanation?","choices":[{"t":"The antivirus is broken","s":0,"fb":"Possible, but even a working signature tool misses threats it has never seen."},{"t":"A new threat with no signature got through","s":2,"fb":"Right. No alert does not mean no attack, because signatures only catch known threats."},{"t":"The partner is mistaken, since there were no alerts","s":0,"fb":"A lack of alerts is not proof of safety when your tools only recognise known threats."}]},{"prompt":"Your board asks whether machine learning would let you cut the analyst team. What do you say?","choices":[{"t":"Yes, machine learning replaces analysts","s":0,"fb":"The chapter is clear: augment analysts, don't replace them."},{"t":"No. It helps the team cover more data and find new threats, but people still investigate and decide","s":2,"fb":"Right. Machine learning is a force multiplier for the team."},{"t":"Machine learning is too new to be useful","s":0,"fb":"The chapter shows machine learning already improves detection when combined with analysts."}]}]},"lab":{"type":"sort","title":"Signature or machine learning?","prompt":"Which approach fits each task?","buckets":["Signature or fixed rule","Machine learning"],"items":[{"t":"Block a file whose fingerprint matches a known virus","b":0},{"t":"Flag a login pattern that has never been seen before","b":1,"why":"new patterns need learning, not a list"},{"t":"Block traffic to an address on a known-bad list","b":0},{"t":"Learn what normal traffic looks like and flag big changes","b":1},{"t":"Spot a new malware variant from its behaviour","b":1},{"t":"Alert when more than five logins fail in a minute","b":0,"why":"that is a fixed, hand-written rule"}],"explain":"Signatures and rules handle what is already known; machine learning helps with what is new or too subtle to write a rule for."}},{"title":"From raw data to action: the pipeline","minutes":3,"slides":[{"scene":{"type":"graph","title":"The six-stage machine learning pipeline for security","nodes":[{"id":"raw","label":"Raw\nsecurity data","p":[-6.25,0,-0.7],"c":"slate","shape":"cyl","size":1,"ly":1.3},{"id":"prep","label":"Pre-\nprocessing","p":[-3.75,0,0.7],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"feat","label":"Feature\nextraction","p":[-1.25,0,-0.7],"c":"cyan","shape":"box","size":1,"ly":1.3},{"id":"ml","label":"ML\nalgorithm","p":[1.25,0,0.7],"c":"violet","shape":"ico","size":1,"ly":1.3},{"id":"cls","label":"Threat\nclassification","p":[3.75,0,-0.7],"c":"amber","shape":"box","size":1,"ly":1.3},{"id":"resp","label":"Security\nresponse","p":[6.25,0,0.7],"c":"green","shape":"shield","size":1,"ly":1.3}],"links":[["raw","prep"],["prep","feat"],["feat","ml"],["ml","cls"],["cls","resp"]],"steps":["all",["raw"],["prep"],["feat"],["ml"],["cls"],["resp"]]},"say":["Every machine learning detector follows the same six-stage pipeline.","It starts with raw security data: network logs, system events and user activity.","Preprocessing cleans the data, puts it in a standard form and filters out what is irrelevant.","Feature extraction turns each event into numbers that a model can work with.","The machine learning algorithm looks for patterns and makes a prediction.","Threat classification decides what kind of threat it is and how risky it is.","Finally comes the security response: block it automatically, raise an alert or open an investigation."]},{"scene":{"type":"graph","title":"Turning network traffic into features","nodes":[{"id":"net","label":"Network\ntraffic","p":[0,-0.2,1.2],"c":"cyan","shape":"cyl","size":1.3,"ly":1.75,"spin":true},{"id":"flow","label":"Flow features","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"stat","label":"Statistical\nfeatures","p":[-1.8,1.65,-2.24],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"cont","label":"Content\nfeatures","p":[1.8,1.65,-2.24],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"exp","label":"Security\nknow-how","p":[4.55,1.25,-1.98],"c":"green","shape":"sphere","size":0.8,"ly":1.15,"ls":0.72}],"links":[["net","flow"],["net","stat"],["net","cont"],["net","exp"]],"steps":["all",["net","flow"],["net","stat"],["net","cont"],["exp"]]},"say":["The feature stage deserves special attention, because the chapter says it decides success.","Flow features summarise a connection: how long it lasted, how many packets and bytes it carried and which protocol it used.","Statistical features describe patterns, such as the spread of packet sizes, the time between packets, bandwidth and error rates.","Content features look inside, at how random the data is, which application protocol it uses and whether commands appear.","Good features need security knowledge, must be quick to compute in real time and should stay stable over time."]}],"keyPoint":"Raw data → preprocessing → features → algorithm → classification → response. The quality of the features, built with security knowledge, matters more than the choice of algorithm.","plain":["A pipeline is like a factory line: each stage prepares the work for the next.","Features are the measurements the model sees, such as connection length or packet size.","A model can never be better than the data and features it is given.","Security experts decide which measurements are worth taking."],"check":{"q":"Which stage turns a log entry into numbers the model can use?","o":["Preprocessing","Feature extraction","Security response"],"a":1,"e":"Feature extraction converts each event into numerical measurements. Preprocessing cleans and standardises the data before that.","retry":{"q":"A connection lasts 2 seconds and sends 400 bytes. What are '2 seconds' and '400 bytes'?","o":["Features","Labels","Responses"],"a":0,"e":"They are measurements describing the event, which is exactly what features are."}},"scenario":{"title":"The detector that went quiet","setting":"Your new machine learning detector has raised no alerts for a week. Your engineer finds that a firewall update changed the log format, and the preprocessing stage now throws away most records.","steps":[{"prompt":"Why did the detector go quiet?","choices":[{"t":"The model forgot what it had learned","s":0,"fb":"The model is unchanged. It is simply being fed almost nothing."},{"t":"A broken early stage starved every later stage of data","s":2,"fb":"Right. Each stage depends on the one before it."},{"t":"There were simply no attacks","s":0,"fb":"Maybe, but here the data never even reached the model."}]},{"prompt":"What lesson does this teach about building detectors?","choices":[{"t":"Put all the effort into the algorithm","s":0,"fb":"The chapter warns against overrating the algorithm compared with data quality."},{"t":"Check data quality at every stage, not just the model","s":2,"fb":"Right. The chapter's first principle is data quality first."},{"t":"Use a bigger model","s":0,"fb":"A bigger model that is fed no data still finds nothing."}]}]},"lab":{"type":"order","title":"Build the pipeline","prompt":"Put the six stages of the security ML pipeline in order.","items":["Raw security data","Data preprocessing","Feature extraction","ML algorithm","Threat classification","Security response"],"explain":"Data flows from raw logs to a decision and an action, and every stage depends on the one before."}},{"title":"Learning from labelled examples","minutes":3,"slides":[{"scene":{"type":"train","title":"Supervised learning: train on labelled examples, then predict","inLabel":"Labelled examples","modelLabel":"Model","outLabel":"Predictions on new events","steps":[0,0,0,1,1,2,2]},"say":["Supervised learning means learning from labelled examples.","Each past event comes with a known answer, such as malware or benign, and that answer is the label.","Each event is described by a feature vector, which is simply a list of numbers about it.","During training, the algorithm studies thousands of these examples and builds a model.","Common algorithms include decision trees, random forests, support vector machines, logistic regression and neural networks.","In the prediction phase, new events without labels go into the trained model.","The model gives each one a predicted label, green for benign and red for malicious."]},{"scene":{"type":"graph","title":"Two kinds of supervised task","nodes":[{"id":"cls","label":"Classification\n(a category)","p":[-3.2,1.6,0],"c":"cyan","shape":"box","size":1.1},{"id":"reg","label":"Regression\n(a number)","p":[3.6,1.6,0],"c":"amber","shape":"box","size":1.1},{"id":"bin","label":"Binary:\nnormal or malicious","p":[-5.6,-0.7,0.8],"c":"cyan","shape":"box","size":0.75},{"id":"multi","label":"Multi-class:\nthreat type","p":[-3.2,-0.7,1.2],"c":"cyan","shape":"box","size":0.75},{"id":"hier","label":"Hierarchical:\nfamily & subfamily","p":[-0.8,-0.7,0.8],"c":"cyan","shape":"box","size":0.75},{"id":"score","label":"Risk score\n0 to 100","p":[3.6,-0.7,1.0],"c":"amber","shape":"cyl","size":0.85}],"links":[["cls","bin"],["cls","multi"],["cls","hier"],["reg","score"]],"steps":["all",["cls","bin"],["cls","multi","hier"],["reg","score"],"all"]},"say":["Supervised tasks come in two kinds.","Classification gives a category, and binary classification simply answers normal or malicious.","Multi-class classification names the specific threat type, and hierarchical classification goes further, to a malware family and subfamily.","Regression gives a number instead, such as a risk score.","Four things make it work: good training data, a balanced mix of examples, meaningful features and testing on data the model has never seen."]}],"keyPoint":"Supervised learning needs labelled examples. Classification picks a category; regression predicts a number. Always test the model on data it has not seen.","plain":["It is like training a new analyst with a pile of past cases where the answer is already known.","Classification asks 'which box does this go in?'; regression asks 'how much?'","If nearly all the examples are one kind, the model learns to say that kind every time.","Testing on the training data is like marking an exam the student has already seen."],"check":{"q":"A model gives each login a risk score from 0 to 100. What kind of task is this?","o":["Binary classification","Regression","Clustering"],"a":1,"e":"A continuous score is a number, not a category, so it is regression.","retry":{"q":"Which kind of task answers 'how much?' rather than 'which box?'","o":["Regression","Classification","Labelling"],"a":0,"e":"Regression predicts a number; classification picks a category."}},"scenario":{"title":"The perfect score","setting":"A vendor shows you a malware classifier with 99.9 per cent accuracy. You learn it was tested on the same files it was trained on, and 98 per cent of those files were benign.","steps":[{"prompt":"What is the first problem?","choices":[{"t":"There isn't one, the score is excellent","s":0,"fb":"A score on training data says little about how the model handles new files."},{"t":"It was not tested on unseen data, so we do not know if it works on new files","s":2,"fb":"Right. Validation needs data the model has never seen."},{"t":"The algorithm is too old","s":0,"fb":"The algorithm is not the issue here."}]},{"prompt":"What is the second problem?","choices":[{"t":"The data is unbalanced: a model that always says 'benign' would score 98 per cent","s":2,"fb":"Right. Balanced datasets matter, and a high accuracy can hide this."},{"t":"There are too many malware files","s":0,"fb":"The opposite: there are too few."},{"t":"The files are too large","s":0,"fb":"File size is not the issue."}]}]},"lab":{"type":"sort","title":"Category or number?","prompt":"Is each task classification or regression?","buckets":["Classification (a category)","Regression (a number)"],"items":[{"t":"Is this email phishing or genuine?","b":0},{"t":"Which malware family is this sample from?","b":0},{"t":"How risky is this login, from 0 to 100?","b":1},{"t":"Is this network flow normal or malicious?","b":0},{"t":"Give this server a risk score for today","b":1}],"explain":"Categories are classification; scores and amounts are regression."}},{"title":"How good is a detector?","minutes":4,"slides":[{"scene":{"type":"bars","title":"A confusion matrix for 1,000 events (50 real attacks; bar heights compressed to fit)","sq":0.13,"bars":[{"id":"tp","label":"Caught attacks (TP)","v":45,"c":"green","p":[-2,-1.2]},{"id":"fn","label":"Missed attacks (FN)","v":5,"c":"red","p":[2,-1.2]},{"id":"fp","label":"False alarms (FP)","v":30,"c":"amber","p":[-2,1.6]},{"id":"tn","label":"Normal, left alone (TN)","v":920,"c":"slate","p":[2,1.6]}],"axes":[{"t":"Alert raised","p":[-2,-1.2,3.2]},{"t":"No alert","p":[2,-1.2,3.2]}],"steps":["all","all",["tp"],["fn"],["fp"],["tn"],"all"]},"say":["How do you know whether a detector is any good, and where do you start?","Imagine 1,000 events, of which 50 are real attacks.","True positives are attacks that were correctly flagged, and here there are 45.","False negatives are attacks that were missed, here 5, and these are the dangerous ones.","False positives are false alarms, here 30 normal events wrongly flagged.","True negatives are normal events correctly left alone, here 920.","Notice that accuracy is over 96 per cent, yet 5 attacks still got through."]},{"scene":{"type":"bars","title":"Precision, recall and the cost of each mistake","sq":0.13,"bars":[{"id":"tp","label":"Caught attacks (TP)","v":45,"c":"green","p":[-2,-1.2]},{"id":"fn","label":"Missed attacks (FN)","v":5,"c":"red","p":[2,-1.2]},{"id":"fp","label":"False alarms (FP)","v":30,"c":"amber","p":[-2,1.6]},{"id":"tn","label":"Normal, left alone (TN)","v":920,"c":"slate","p":[2,1.6]}],"axes":[{"t":"Alert raised","p":[-2,-1.2,3.2]},{"t":"No alert","p":[2,-1.2,3.2]}],"steps":[["tp","fp"],["tp","fn"],"all",["fn","fp"],"all","all"]},"say":["Precision asks how many of the alerts were real, and here it is 45 out of 75, which is 60 per cent.","Recall asks how many of the real attacks we caught, and here it is 45 out of 50, which is 90 per cent.","The F1 score balances the two, and the ROC-AUC measure shows performance across every possible threshold.","In security the costs are lopsided, because a false alarm wastes analyst time while a missed attack can mean a breach, fines and damage to reputation.","Attacks are rare, so the data is imbalanced, and models should be tested on later data than they were trained on.","The chapter's framework runs from the confusion matrix, to precision and recall, to cost analysis and finally to business impact."]}],"keyPoint":"Accuracy can look high while attacks slip through. Use precision (are the alerts real?), recall (are the attacks caught?) and the real cost of each kind of mistake.","plain":["Precision: when the alarm rings, how often is it a real fire?","Recall: of all the fires, how many set off the alarm?","A missed attack usually costs far more than a false alarm.","Because attacks are rare, a detector that never alerts can still look 'accurate'."],"check":{"q":"A detector catches 90 of 100 attacks but also raises 900 false alarms. Which measure is poor?","o":["Recall","Precision","Neither"],"a":1,"e":"Recall is 90 per cent, but only 90 of its 990 alerts are real, so precision is about 9 per cent.","retry":{"q":"'When the alarm rings, how often is it a real fire?' Which measure is that?","o":["Precision","Recall","Accuracy"],"a":0,"e":"Precision measures how many alerts are genuine."}},"scenario":{"title":"Setting the phishing filter","setting":"Your phishing filter can be set to strict or relaxed. Strict catches almost every phishing email but floods the help desk with false alarms. Relaxed is quiet but misses more.","steps":[{"prompt":"Which information should guide your choice?","choices":[{"t":"Whichever setting gives the highest accuracy","s":0,"fb":"Accuracy hides the imbalance, because almost all email is genuine."},{"t":"The cost of a missed phishing email compared with the cost of a false alarm","s":2,"fb":"Right. Cost-sensitive evaluation compares the business impact of each mistake."},{"t":"Whatever the vendor's default is","s":0,"fb":"Defaults are not tuned to your organisation's costs."}]},{"prompt":"After launch, what should you keep watching?","choices":[{"t":"Only the F1 score","s":1,"fb":"Useful, but the chapter also lists operational measures."},{"t":"Detection speed, analyst time per alert and the false alarm burden","s":2,"fb":"Right. Operational metrics show the real effect on the team."},{"t":"Nothing, once it is tuned it stays tuned","s":0,"fb":"Threats change, so performance must be monitored."}]}]},"lab":{"type":"threshold","title":"Find the cheapest threshold","costFP":40,"costFN":4000,"attacks":50,"normal":950,"start":50,"prompt":"Move the alert threshold to find the setting with the lowest total cost.","explain":"You weighed a cheap mistake (a false alarm) against an expensive one (a missed attack). That is the chapter's cost-sensitive evaluation in action."}},{"title":"Catching malware: static and dynamic analysis","minutes":3,"slides":[{"scene":{"type":"graph","title":"Static analysis: inspecting a file without running it","cam":[0,3.4,11.5],"look":[0,1.2,0],"nodes":[{"id":"hdr","label":"PE header: imports, sections,\ncompile time, signature","p":[0,3.3,0],"c":"cyan","shape":"slab","size":1,"ly":0.72,"ls":0.6},{"id":"str","label":"Strings: URLs, IP addresses,\nfile paths, function names","p":[0,2.0,0],"c":"violet","shape":"slab","size":1,"ly":0.72,"ls":0.6},{"id":"code","label":"Bytecode: instructions,\npacking, obfuscation","p":[0,0.7,0],"c":"amber","shape":"slab","size":1,"ly":0.72,"ls":0.6},{"id":"ent","label":"Entropy: randomness,\nencryption, compression","p":[0,-0.6,0],"c":"red","shape":"slab","size":1,"ly":0.72,"ls":0.6}],"links":[],"steps":["all",["hdr"],["str"],["code"],["ent"]],"orbit":0.5},"say":["To detect malware you first need features that describe a file, and static analysis gets them without running it.","The PE header is the file's label, showing what it imports, how its sections are laid out, when it was compiled and whether it is digitally signed.","String extraction pulls out readable text such as web addresses, IP addresses, file paths and the names of system functions it calls.","Bytecode analysis studies the instructions themselves and looks for packing and obfuscation that hide what the code does.","Entropy measures randomness, and very random content often means the file is encrypted or compressed to hide something."]},{"scene":{"type":"graph","title":"Dynamic analysis: watching what the sample does","nodes":[{"id":"core","label":"Sample running\nin a sandbox","p":[0,-0.2,1.2],"c":"red","shape":"ico","size":1.3,"ly":1.75,"spin":true},{"id":"api","label":"API call\nsequence","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"net","label":"Network:\ncommand & control","p":[-2.62,1.58,-2.2],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"file","label":"File\noperations","p":[0.0,1.7,-2.28],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"reg","label":"Registry\nchanges","p":[2.63,1.58,-2.2],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"proc","label":"Process\nparent-child","p":[4.55,1.25,-1.98],"c":"green","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["core","api"],["core","net"],["core","file"],["core","reg"],["core","proc"]],"steps":[["core"],["api","net","file","reg","proc","core"],"all",["core"]]},"say":["Dynamic analysis takes the opposite approach, running the sample safely in a sandbox and watching what it does.","It records the sequence of system calls, traffic to a command-and-control server, files created or deleted, registry changes for persistence and which processes start which.","Because it watches behaviour, it sees through code that has been disguised.","But it needs a safe environment, takes time and is harder to scale, and some malware even detects the sandbox and behaves itself."]}],"keyPoint":"Static analysis inspects a file without running it; dynamic analysis runs it safely and watches its behaviour. Each catches what the other can miss.","plain":["Static analysis is like X-raying a parcel; dynamic analysis is like opening it in a blast-proof room.","High entropy (randomness) can be a sign of hidden, packed code.","Behaviour is hard to disguise, but watching it takes time.","Clever malware may stay quiet if it senses it is being watched."],"check":{"q":"Which approach is best at seeing through heavily disguised (obfuscated) code?","o":["Static analysis of strings","Dynamic analysis of behaviour","Checking the compile date"],"a":1,"e":"Obfuscation hides what the code looks like, not what it does. Watching behaviour defeats it.","retry":{"q":"X-ray or blast-proof room: which shows what the parcel actually does?","o":["The blast-proof room","The X-ray","Neither"],"a":0,"e":"Opening it safely and watching is dynamic analysis."}},"scenario":{"title":"The unexpected invoice","setting":"A finance clerk forwards an unexpected 'invoice' program. Static analysis shows very high entropy and almost no readable strings.","steps":[{"prompt":"What do the static findings suggest?","choices":[{"t":"The file is probably packed or encrypted to hide its contents","s":2,"fb":"Right. High entropy and few strings often mean packing or obfuscation."},{"t":"The file is safe because it has few strings","s":0,"fb":"Few readable strings is a warning sign, not a reassurance."},{"t":"Nothing useful at all","s":0,"fb":"Entropy is one of the static features the chapter highlights."}]},{"prompt":"What should you do next?","choices":[{"t":"Run it on the clerk's laptop to see what happens","s":0,"fb":"Never run suspicious code on a live machine."},{"t":"Run it in an isolated sandbox and record its behaviour","s":2,"fb":"Right. Dynamic analysis needs a safe execution environment."},{"t":"Delete it and forget about it","s":1,"fb":"Safe, but you lose the chance to learn from it and protect others."}]},{"prompt":"In the sandbox it does nothing for ten minutes. Is it clean?","choices":[{"t":"Yes, no behaviour means no threat","s":0,"fb":"Some malware uses anti-analysis tricks and simply waits."},{"t":"Not necessarily, it may be using anti-analysis techniques","s":2,"fb":"Right. That is one of the challenges the chapter lists."},{"t":"Yes, as long as the static scan was clean","s":0,"fb":"The static scan was not clean."}]}]},"lab":{"type":"sort","title":"Static or dynamic?","prompt":"Is each feature found by static or dynamic analysis?","buckets":["Static (file not run)","Dynamic (run in a sandbox)"],"items":[{"t":"Import table in the PE header","b":0},{"t":"Sequence of system (API) calls","b":1},{"t":"Entropy of the file contents","b":0},{"t":"Connections to a command-and-control server","b":1},{"t":"Web addresses found in the file's text","b":0},{"t":"Registry changes made at start-up","b":1},{"t":"Digital signature","b":0},{"t":"Files created or deleted","b":1}],"explain":"If you can read it from the file, it is static; if you must run the file to see it, it is dynamic."}},{"title":"Deep learning: pictures and sequences","minutes":3,"slides":[{"scene":{"type":"pixels","title":"A file as a picture (CNN) and its actions as a sequence (RNN)","sequence":["Open file","Change registry","Connect out","Encrypt files"],"steps":[0,0,1,2,2,3,3]},"say":["Deep learning can learn features by itself, instead of relying on people to design them.","One clever trick is to read a file's bytes as a long row of numbers.","Fold that row into a square and each byte becomes a grey pixel, so the file becomes a picture.","A convolutional neural network, or CNN, then uses computer vision to recognise the visual patterns of malware families.","It learns these features automatically.","Recurrent neural networks, or RNNs, read sequences instead, such as the order of system calls a program makes.","A version called long short-term memory, or LSTM, remembers what happened earlier in the sequence."]},{"scene":{"type":"graph","title":"Three deep learning architectures, and combining them","nodes":[{"id":"cnn","label":"CNN\nimages","p":[-4.2,1.0,0],"c":"cyan","shape":"box","size":1.1},{"id":"rnn","label":"RNN / LSTM\nsequences","p":[0,1.0,-0.6],"c":"amber","shape":"torus","size":1.3},{"id":"tr","label":"Transformer\nattention","p":[4.2,1.0,0],"c":"violet","shape":"ico","size":1.0},{"id":"ens","label":"Ensemble:\nmodels check each other","p":[-2.1,-1.0,1.4],"c":"green","shape":"sphere","size":0.9}],"links":[["cnn","ens"],["rnn","ens"]],"steps":["all",["cnn"],["rnn"],["tr"],["cnn","rnn","ens"]]},"say":["The chapter compares three architectures.","CNNs suit data shaped like images, such as malware visualisations.","RNNs suit sequences of events, such as log entries in time order.","Transformers use an attention mechanism to focus on the most relevant events and process them in parallel, which suits linking complex events together.","Combining models in an ensemble can improve accuracy and reduce false positives, because each model checks the others."]}],"keyPoint":"Match the model to the shape of the data: images to CNNs, sequences to RNNs, complex event links to Transformers. Combining models can make results more reliable.","plain":["A CNN looks at a file the way you look at a photo: by its textures and shapes.","An RNN reads events like a story, remembering what came before.","Attention means the model gives more weight to some events than others.","Two different models agreeing gives more confidence than one model alone."],"check":{"q":"You want to analyse the order in which a program makes system calls. Which architecture fits best?","o":["CNN","RNN with LSTM","None, the order does not matter"],"a":1,"e":"Order is a sequence, and RNNs with LSTM are built to remember what came earlier in a sequence.","retry":{"q":"Which model 'reads like a story, remembering what came before'?","o":["RNN","CNN","A decision tree"],"a":0,"e":"RNNs process events in order and carry memory forward."}},"scenario":{"title":"Choosing models for the security team","setting":"Your team has three datasets: pictures made from executable files, long sequences of server log events, and alerts from many different tools that need linking together.","steps":[{"prompt":"Which model suits the pictures made from executable files?","choices":[{"t":"A CNN","s":2,"fb":"Right. CNNs learn visual patterns."},{"t":"An RNN","s":0,"fb":"RNNs suit sequences, not images."},{"t":"A Transformer","s":1,"fb":"Possible, but the chapter pairs malware images with CNNs."}]},{"prompt":"Which suits linking many alerts from different tools?","choices":[{"t":"A Transformer, using attention to focus on the relevant events","s":2,"fb":"Right. The chapter lists complex event correlation as the Transformer's application."},{"t":"A CNN","s":0,"fb":"CNNs suit image-shaped data."},{"t":"None, linking must always be done by hand","s":0,"fb":"The chapter shows deep learning can help with correlation."}]}]},"lab":{"type":"sort","title":"Which architecture?","prompt":"Match each job to the deep learning architecture the chapter pairs with it.","buckets":["CNN","RNN / LSTM","Transformer"],"items":[{"t":"A malware file shown as a greyscale picture","b":0},{"t":"System calls in the order they happen","b":1},{"t":"Server log entries in time order","b":1},{"t":"Linking alerts from many tools into one picture","b":2},{"t":"Focusing on the few events that matter among thousands","b":2}],"explain":"Images go to CNNs, sequences to RNNs, and complex correlation with attention to Transformers."}},{"title":"Spotting phishing emails and fake websites","minutes":3,"slides":[{"scene":{"type":"graph","title":"Multi-modal phishing detection: four angles at once","nodes":[{"id":"mail","label":"Incoming\nemail","p":[0,-0.2,1.2],"c":"slate","shape":"box","size":1.3,"ly":1.75,"spin":true},{"id":"hdr","label":"Header:\nSPF, DKIM, DMARC","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"cnt","label":"Content:\nurgency, pressure","p":[-1.8,1.65,-2.24],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"att","label":"Attachment:\nmacros, file type","p":[1.8,1.65,-2.24],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"url","label":"Links:\nreputation, redirects","p":[4.55,1.25,-1.98],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["mail","hdr"],["mail","cnt"],["mail","att"],["mail","url"]],"steps":["all",["mail","hdr"],["mail","cnt"],["mail","att"],["mail","url"]]},"say":["Phishing detection works best when it checks an email from several angles at once, which the chapter calls multi-modal analysis.","Header analysis checks the sender's authentication records, known as SPF, DKIM and DMARC, plus the route the email took and the sender's reputation.","Content analysis uses natural language processing to spot urgency, pressure tactics and poor grammar.","Attachment scanning checks file types, macros and known malware signatures.","Link analysis checks each domain's reputation, follows redirects, compares the page's look with the real brand and checks its certificate."]},{"scene":{"type":"graph","title":"Checking a website: look, domain, certificate and content","nodes":[{"id":"site","label":"Suspicious\nwebsite","p":[0,-0.2,1.2],"c":"slate","shape":"box","size":1.3,"ly":1.75,"spin":true},{"id":"vis","label":"Visual:\nlogo, layout","p":[-4.55,1.25,-1.98],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"dom","label":"Domain:\nage, look-alike","p":[-1.8,1.65,-2.24],"c":"red","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"cert","label":"Certificate:\nissuer, match","p":[1.8,1.65,-2.24],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"con","label":"Content:\ncontacts, policy","p":[4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72}],"links":[["site","vis"],["site","dom"],["site","cert"],["site","con"]],"steps":["all",["site","vis"],["site","dom"],["site","cert"],["site","con"],["cert"]]},"say":["Fake websites get the same treatment.","Visual analysis compares logos, layout, colours and fonts with the genuine site.","Domain analysis checks when the domain was registered, who owns it, where it is hosted and whether it is a look-alike name with one letter changed, which is called typosquatting.","Certificate checks confirm who issued it, that it matches the domain and that it has not expired.","Content checks look for missing functions, wrong information, fake contact details or no privacy policy.","Remember that a padlock only means the connection is encrypted, and it does not prove the site is genuine."]}],"keyPoint":"No single check is enough. Combine evidence from the header, the words, the attachments and the links, and treat a padlock as proof of encryption, not of honesty.","plain":["SPF, DKIM and DMARC are ways for a domain to vouch for email sent in its name.","Urgent or threatening wording is a classic social engineering trick.","Typosquatting means registering a look-alike name, such as examp1e.com instead of example.com.","A brand-new domain pretending to be a long-established company is a strong warning sign."],"check":{"q":"A link goes to a site with a valid padlock, registered three days ago, on a name one letter different from your bank's. Is it safe?","o":["Yes, the padlock proves it","No, a new look-alike domain is a strong warning sign","Only if the logo matches"],"a":1,"e":"A padlock shows the connection is encrypted. A three-day-old look-alike domain is a classic phishing sign.","retry":{"q":"What does a padlock in the browser prove?","o":["Only that the connection is encrypted","That the site is genuine","That the site has no malware"],"a":0,"e":"Anyone can get a certificate for a look-alike domain, so the padlock proves encryption only."}},"scenario":{"title":"The urgent payment request","setting":"An email to your finance team, apparently from the chief executive, asks for an urgent payment before 5 pm today. It passes SPF, but its DMARC check fails and the reply-to address is a free webmail account.","steps":[{"prompt":"Which signals matter most here?","choices":[{"t":"The urgency, the failed DMARC check and the mismatched reply-to address","s":2,"fb":"Right. Several angles agree: content, header and routing."},{"t":"Only that SPF passed, so it is fine","s":0,"fb":"One passing check does not outweigh several warning signs."},{"t":"The time of day it arrived","s":1,"fb":"Urgency is a cue, but the header evidence is stronger."}]},{"prompt":"What should the detection system do?","choices":[{"t":"Deliver it normally","s":0,"fb":"The combined evidence points strongly to phishing."},{"t":"Quarantine it and warn the finance team","s":2,"fb":"Right. Combined evidence justifies holding it and alerting people."},{"t":"Delete it silently","s":1,"fb":"Safer than delivering it, but the team should know about the attempt."}]}]},"lab":{"type":"spot","title":"Spot the warning signs","prompt":"This email reached the finance team. Find the parts that are warning signs.","parts":[{"lbl":"From","t":"Chief Executive <ceo@examp1e-corp.com>","bad":true,"why":"Look-alike domain: the digit 1 replaces the letter l."},{"lbl":"Reply-To","t":"ceo.private.office@freemail.example","bad":true,"why":"Replies go to a free webmail account, not the company."},{"lbl":"Checks","t":"SPF: pass · DKIM: none · DMARC: fail","bad":true,"why":"DMARC fails, so the real domain does not vouch for this message."},{"lbl":"Sent","t":"Tuesday, 10:42","bad":false,"why":"Nothing unusual about the time."},{"lbl":"Subject","t":"URGENT: payment needed before 5 pm today","bad":true,"why":"Urgency and a deadline are pressure tactics."},{"lbl":"Greeting","t":"Hi team,","bad":false,"why":"An ordinary greeting."},{"lbl":"Body","t":"The supplier details are attached. Please process this now and keep it confidential.","bad":true,"why":"Pressure plus secrecy is a classic social engineering pattern."},{"lbl":"Attachment","t":"supplier_details.docm","bad":true,"why":".docm files can contain macros, which attachment scanning checks."},{"lbl":"Sign-off","t":"Sent from my phone","bad":false,"why":"Common, and not suspicious on its own."}],"explain":"Each sign on its own might be explained away. Together they point clearly to phishing, which is why the chapter recommends multi-modal analysis."}},{"title":"Finding the unknown: clustering","minutes":3,"slides":[{"scene":{"type":"clusters","title":"Unsupervised learning: events gather into groups, outliers stand out","labels":["Normal activity","Known attack","New pattern"],"steps":[0,0,1,1,2,2]},"say":["Supervised learning needs labelled examples, but what about threats nobody has labelled yet?","Unsupervised learning works without labels, finding structure in the data on its own.","Clustering groups similar activity together, and most events fall into normal clusters of routine business.","Some clusters match known attacks, while others reveal new attack patterns.","Points that fit no cluster at all are outliers, unusual activity that deserves a closer look.","Unusual is not the same as malicious, so an analyst still investigates."]},{"scene":{"type":"graph","title":"Four clustering methods and what they are used for","nodes":[{"id":"km","label":"K-means:\nchoose the number\nof groups first","p":[-5,1.2,0],"c":"cyan","shape":"box","size":0.9},{"id":"hier","label":"Hierarchical:\ngroups within groups","p":[-1.7,1.2,-0.6],"c":"violet","shape":"box","size":0.9},{"id":"db","label":"DBSCAN:\ngroups by density","p":[1.7,1.2,-0.6],"c":"amber","shape":"sphere","size":0.9},{"id":"spec","label":"Spectral:\ncomplex shapes","p":[5,1.2,0],"c":"green","shape":"torus","size":1.0},{"id":"use","label":"Zero-days, insider threats,\nreconnaissance, APT hunting","p":[0,-1.0,1.4],"c":"red","shape":"slab","size":1}],"links":[["km","use"],["hier","use"],["db","use"],["spec","use"]],"steps":["all",["km"],["hier"],["db"],["spec"],["use"]]},"say":["The chapter lists four clustering methods.","K-means needs you to choose the number of clusters in advance.","Hierarchical clustering finds groups within groups.","DBSCAN groups points by how densely packed they are, and naturally leaves isolated points as outliers.","Spectral clustering can find groups with complex shapes.","These techniques help with zero-day attacks, insider threats, network reconnaissance and hunting advanced persistent threats."]}],"keyPoint":"Unsupervised learning finds structure without labels. Clustering groups similar events; outliers and new clusters point analysts towards unknown threats.","plain":["It is like sorting a pile of mixed post into piles without being told the categories.","A new pile that appears overnight may be a new kind of attack.","An odd item that fits no pile is worth a look, but it may be harmless.","K-means needs to know how many piles to make; DBSCAN does not."],"check":{"q":"Which clustering method needs the number of clusters chosen in advance?","o":["DBSCAN","K-means","Hierarchical"],"a":1,"e":"K-means starts from a predefined number of clusters. DBSCAN finds groups from density instead.","retry":{"q":"In the sorting-the-post picture, which method needs to know how many piles to make before starting?","o":["K-means","DBSCAN","Neither"],"a":0,"e":"K-means is told the number of piles in advance."}},"scenario":{"title":"The 2 am cluster","setting":"Clustering last month's network activity reveals a small new cluster: a handful of internal machines briefly connecting to many other internal machines between 2 and 3 am.","steps":[{"prompt":"What might this new cluster show?","choices":[{"t":"Network reconnaissance: someone mapping your network","s":2,"fb":"Right. The chapter lists reconnaissance discovery as an application."},{"t":"Normal backups","s":1,"fb":"Possible, which is why it needs checking, but the pattern fits scanning."},{"t":"Nothing, small clusters are just noise","s":0,"fb":"New small clusters are exactly what analysts should investigate."}]},{"prompt":"What should happen next?","choices":[{"t":"Block all the machines immediately","s":1,"fb":"Perhaps later, but first confirm what is happening."},{"t":"An analyst investigates and labels it, so future detection improves","s":2,"fb":"Right. Human investigation turns a pattern into knowledge."},{"t":"Ignore it unless it grows","s":0,"fb":"Waiting gives an attacker more time."}]}]},"lab":{"type":"sort","title":"Supervised or unsupervised?","prompt":"Does each task need labelled examples?","buckets":["Supervised (needs labels)","Unsupervised (no labels)"],"items":[{"t":"Train on 10,000 emails marked phishing or genuine","b":0},{"t":"Group a month of logins to see what patterns emerge","b":1},{"t":"Find a new pattern nobody has named yet","b":1},{"t":"Sort malware into known families","b":0},{"t":"Spot machines behaving unlike any others","b":1},{"t":"Learn from past incidents that analysts have labelled","b":0}],"explain":"Known answers mean supervised learning; discovering unknown structure means unsupervised learning."}},{"title":"Anomalies and network traffic","minutes":3,"slides":[{"scene":{"type":"curve","title":"Anomaly detection: what is normal, and where to set the alarm","steps":[2.5,2.5,2.5,1.4,3.2,2.3,2.3]},"say":["Anomaly detection learns what normal looks like, then flags whatever falls outside it.","Statistical methods model normal behaviour, for example as a bell-shaped curve.","A Z-score measures how many standard deviations an event is from the average, so an event far out in the tail is unusual.","The alert threshold is a choice, and set low it catches more but gives more false alarms.","Set high, alerts are rare, but real attacks may be missed.","Thresholds can also adapt over time, and they must work in real time without slowing the system down.","Machine learning methods do the same job more flexibly, including one-class SVMs, isolation forests, autoencoders and local outlier factor."]},{"scene":{"type":"graph","title":"Four layers of network anomaly detection","nodes":[{"id":"net","label":"Network\ntraffic","p":[0,-0.2,1.2],"c":"cyan","shape":"cyl","size":1.3,"ly":1.75,"spin":true},{"id":"flow","label":"Flow:\nduration, bandwidth","p":[-4.55,1.25,-1.98],"c":"cyan","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"pkt","label":"Packets:\nsizes, gaps","p":[-1.8,1.65,-2.24],"c":"violet","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"cnt","label":"Content:\nrandomness, protocol","p":[1.8,1.65,-2.24],"c":"amber","shape":"box","size":0.8,"ly":1.15,"ls":0.72},{"id":"time","label":"Time:\nbursts, repeats","p":[4.55,1.25,-1.98],"c":"red","shape":"torus","size":0.8,"ly":1.15,"ls":0.72}],"links":[["net","flow"],["net","pkt"],["net","cnt"],["net","time"]],"steps":["all",["net","flow"],["net","pkt"],["net","cnt"],["net","time"]]},"say":["On a network, anomalies can show up in four layers.","Flow analysis looks at connection length, bandwidth, the mix of protocols and where traffic goes geographically.","Packet analysis looks at packet sizes, the gaps between packets, odd header fields and fragmentation.","Content analysis measures how random the payload is, checks that protocols behave properly and identifies encrypted traffic.","Time analysis spots bursts, regular repeating patterns, trends and seasonal changes."]}],"keyPoint":"Anomaly detection flags what is far from normal. Where you set the threshold trades missed attacks against false alarms. On networks, look at flows, packets, content and timing.","plain":["A Z-score answers 'how unusual is this, compared with usual?'","A low threshold is a nervous guard dog: it barks at everything.","A high threshold is a sleepy guard dog: quiet, but it may miss a burglar.","Perfectly regular connections at odd hours deserve a closer look."],"check":{"q":"You lower the anomaly threshold. What usually happens?","o":["Fewer alerts and fewer false alarms","More alerts, catching more attacks but with more false alarms","Nothing changes"],"a":1,"e":"A lower threshold flags more events as unusual, so more attacks are caught along with more false alarms.","retry":{"q":"Is a low threshold a nervous guard dog or a sleepy one?","o":["Nervous: it barks at everything","Sleepy: it rarely barks"],"a":0,"e":"A low threshold reacts to small differences, so it alerts often."}},"scenario":{"title":"The 3 am heartbeat","setting":"Network monitoring shows one office PC sending a small, identical packet to the same overseas address every 60 seconds, all night, with nobody logged in.","steps":[{"prompt":"Which analysis layer revealed this?","choices":[{"t":"Time analysis: a regular, repeating pattern","s":2,"fb":"Right. Spotting periodic patterns is part of temporal analysis."},{"t":"Visual analysis","s":0,"fb":"Visual analysis belongs to checking websites."},{"t":"None, this is normal","s":0,"fb":"Regular traffic overnight with nobody logged in is unusual."}]},{"prompt":"The anomaly system raises 400 alerts a day and analysts are overwhelmed. What should you adjust first?","choices":[{"t":"Raise the threshold a little and check that real attacks are still caught","s":2,"fb":"Right. Tune the threshold and measure the trade-off."},{"t":"Switch the system off","s":0,"fb":"That removes protection altogether."},{"t":"Hire more analysts and change nothing","s":1,"fb":"It may help, but the chapter stresses managing false positives."}]}]},"lab":{"type":"threshold","title":"Balance the alarm","attacks":50,"normal":950,"start":30,"prompt":"Move the threshold to find a good balance between catching attacks and avoiding false alarms (the best F1 score).","explain":"You found the balance point where precision and recall are both reasonable."}},{"title":"Behaviour analytics (UEBA)","minutes":3,"slides":[{"scene":{"type":"people","title":"User and entity behaviour analytics: baselines, peers and risk","names":["Sales: Ana","Sales: Ben","Sales: Cara","Finance: Dev","Finance: Eli","IT: Fay"],"who":1,"steps":[0,0,1,2,2,3,3]},"say":["User and entity behaviour analytics, or UEBA, learns how people and devices normally behave.","For users it profiles login times, applications, data access and network activity, and for entities such as servers and devices it profiles how they communicate and use resources.","When someone's behaviour changes sharply, for example downloading far more data than usual, UEBA notices.","It also compares people with their peer group, meaning others in the same department or role.","Behaviour that is unusual for the person and unusual for their peers is more significant.","Everything feeds a risk score that adjusts with context, so analysts see the most important alerts first.","A high score is a reason to look, not proof of wrongdoing."]}],"keyPoint":"UEBA compares behaviour with each person's own history and with their peers, and turns the differences into a risk score that puts the most important alerts first.","plain":["A baseline is what normal looks like for one person or device.","Peer groups prevent false alarms when a whole team changes how it works.","Risk scores rank alerts; they do not prove anyone did anything wrong.","UEBA watches people, so privacy rules apply (see lesson 12)."],"check":{"q":"An accountant downloads ten times their usual amount of data, but so does everyone in finance at year end. What should UEBA do?","o":["Raise a top-priority alert","Treat it as less significant, because the peer group shows the same change","Lock the account"],"a":1,"e":"Peer group analysis shows the change is shared by the whole team, which lowers its significance.","retry":{"q":"Why compare a person with their peers?","o":["To tell an individual change from one shared by the whole team","To rank staff by productivity","To replace the personal baseline"],"a":0,"e":"Peer comparison adds context to the personal baseline."}},"scenario":{"title":"Leaving with the data?","setting":"A sales manager who has just resigned starts logging in at 11 pm and downloading the customer database. Nobody else in sales has done this.","steps":[{"prompt":"How should UEBA treat this?","choices":[{"t":"Unusual for the person and for the peer group, so a high risk score","s":2,"fb":"Right. Both comparisons point the same way."},{"t":"Normal, because sales staff use the database","s":0,"fb":"Not in bulk at 11 pm, and not compared with their peers."},{"t":"Ignore it unless a malware signature matches","s":0,"fb":"Insider threats rarely match signatures."}]},{"prompt":"What happens next?","choices":[{"t":"An analyst reviews the case, following HR and privacy procedures","s":2,"fb":"Right. The score sets priorities; people decide, within the rules."},{"t":"The system automatically dismisses the employee","s":0,"fb":"Automated decisions like this would be unfair and unlawful."},{"t":"Share the alert with the whole company","s":0,"fb":"That would breach the person's privacy."}]}]}},{"title":"Running machine learning in production","minutes":4,"slides":[{"scene":{"type":"graph","title":"A production architecture for security machine learning","cam":[0,5,13.5],"nodes":[{"id":"ingest","label":"Live event\nstream","p":[-6.2,0,0],"c":"slate","shape":"cyl","size":0.9},{"id":"pipe","label":"Data pipeline:\nquality checks","p":[-3.8,0,0.8],"c":"cyan","shape":"box","size":0.9},{"id":"lb","label":"Load\nbalancer","p":[-1.4,0,0],"c":"amber","shape":"sphere","size":0.8},{"id":"m1","label":"Model","p":[1.0,1.6,-0.6],"c":"violet","shape":"ico","size":0.7},{"id":"m2","label":"Model","p":[1.0,0,0.4],"c":"violet","shape":"ico","size":0.7},{"id":"m3","label":"Model","p":[1.0,-1.4,1.2],"c":"violet","shape":"ico","size":0.7},{"id":"agg","label":"Combine\nresults","p":[3.3,0,0],"c":"cyan","shape":"box","size":0.8},{"id":"siem","label":"SIEM &\nresponse playbooks","p":[5.8,0.4,0.6],"c":"green","shape":"shield","size":1.0},{"id":"mon","label":"Monitoring:\ndrift, errors","p":[0.6,3.4,-1.6],"c":"red","shape":"torus","size":0.9}],"links":[["ingest","pipe"],["pipe","lb"],["lb","m1"],["lb","m2"],["lb","m3"],["m1","agg"],["m2","agg"],["m3","agg"],["agg","siem"],["mon","m1"],["mon","pipe"]],"steps":["all",["ingest","pipe"],["lb","m1","m2","m3","agg"],["siem"],["ingest","pipe","lb"],"all"]},"say":["A model that works in a notebook is not yet a working security system, and the chapter calls this the gap between research and operations.","A data pipeline handles live streams and batches, checks data quality and records where each piece of data came from.","Model serving spreads requests across several copies of the model with a load balancer, then combines the results.","Integration connects the results to the SIEM, to automated response playbooks, to threat intelligence and to firewalls and DNS filters.","Real-time detection needs millisecond responses and millions of events per second, using stream processing, in-memory computing, GPUs and edge computing.","Every choice trades accuracy against speed, completeness against delay and cost against performance."]},{"scene":{"type":"graph","title":"Canary release: 90 per cent to the current model, 10 per cent to the new one","speed":0.45,"nodes":[{"id":"router","label":"Traffic\nrouter","p":[-5,0,0],"c":"amber","shape":"sphere","size":1.0},{"id":"v1","label":"Current model\n(90%)","p":[-1,1.4,-0.4],"c":"cyan","shape":"ico","size":1.1},{"id":"v2","label":"New model\n(10%)","p":[-1,-1.2,0.8],"c":"violet","shape":"ico","size":0.8},{"id":"mon","label":"Performance\nmonitor","p":[2.6,0,0],"c":"red","shape":"torus","size":1.0},{"id":"dec","label":"Decide: expand\nor roll back","p":[5.6,0,0.4],"c":"green","shape":"shield","size":1.0}],"links":[["router","v1",3],["router","v2",0.4,"violet"],["v1","mon"],["v2","mon",1,"violet"],["mon","dec"]],"steps":["all",["router","v1","v2"],["mon","dec"],"all","all",["mon"]]},"say":["Updating a live model is risky, so the chapter describes three safe ways to do it.","In a canary deployment most traffic, say 90 per cent, stays on the current model while 10 per cent tries the new one.","A monitor compares the two, and if the new model misbehaves you roll back quickly.","Blue-green deployment runs two identical environments and switches between them instantly, with no downtime.","A/B testing compares two versions statistically to decide which one is better.","Once live, keep monitoring performance, accuracy, operations and business value, because models drift as threats and normal behaviour change."]}],"keyPoint":"A production detector needs data pipelines, model serving, integration and monitoring. Release new models gradually, and keep watching for drift.","plain":["Canary: let a few customers try the new recipe before changing the whole menu.","Blue-green: two identical kitchens, and you switch which one serves.","Drift: the world changes, so yesterday's model slowly gets worse.","An alert only helps if it reaches the tools and people who act on it."],"check":{"q":"Which strategy sends a small share of traffic to a new model first?","o":["Blue-green","Canary","Neither"],"a":1,"e":"A canary release routes a small share, such as 10 per cent, to the new model while the rest stays on the current one.","retry":{"q":"'A few customers try the new recipe first.' Which strategy is that?","o":["Canary","Blue-green","A full switch-over"],"a":0,"e":"Trying it on a small share first is a canary release."}},"scenario":{"title":"Version two goes live","setting":"Your team has a new malware model that scored better in testing. Leadership wants it live for all traffic tonight.","steps":[{"prompt":"What do you recommend?","choices":[{"t":"Switch all traffic tonight, since the test scores were good","s":0,"fb":"Lab results do not guarantee live performance."},{"t":"A canary release: send a small share to the new model, monitor, then expand or roll back","s":2,"fb":"Right. A gradual rollout with a quick way back."},{"t":"Never update models","s":0,"fb":"Models must be updated as threats change."}]},{"prompt":"Three months later, false alarms are slowly rising although nothing was changed. What is the likely cause?","choices":[{"t":"Model drift: threats and normal behaviour have changed","s":2,"fb":"Right. That is why accuracy monitoring includes drift detection."},{"t":"A hardware fault","s":1,"fb":"Possible, but monitoring of system health would show that separately."},{"t":"The analysts are getting careless","s":0,"fb":"The data shows the model's performance is changing."}]}]},"lab":{"type":"order","title":"Release safely","prompt":"Put the steps of a canary release in order.","items":["Train and validate the new model","Send 10 per cent of traffic to the new model","Compare its results with the current model","Expand to all traffic, or roll back"],"explain":"A small, monitored first step makes it safe to change a live security system."}},{"title":"Adversaries, ethics and getting started","minutes":4,"slides":[{"scene":{"type":"graph","title":"Attacks on the model itself, and the defences","cam":[0,4.6,13],"nodes":[{"id":"att","label":"Attacker","p":[-5.4,0.6,0],"c":"red","shape":"ico","size":1.1},{"id":"data","label":"Training\ndata","p":[-1.2,2.2,-0.8],"c":"slate","shape":"cyl","size":0.9},{"id":"model","label":"Model","p":[1.4,0.4,0],"c":"cyan","shape":"ico","size":1.2},{"id":"inp","label":"Inputs\nat run time","p":[-1.2,-1.2,1.0],"c":"slate","shape":"box","size":0.8},{"id":"def1","label":"Adversarial\ntraining","p":[4.6,2.4,-0.6],"c":"green","shape":"shield","size":0.8},{"id":"def2","label":"Ensembles &\ninput checks","p":[5.2,0.2,0.4],"c":"green","shape":"shield","size":0.8},{"id":"def3","label":"Red teams &\nregular updates","p":[4.4,-1.8,1.0],"c":"green","shape":"shield","size":0.8}],"links":[["att","data",1,"red"],["att","inp",1,"red"],["att","model",1,"red"],["data","model"],["inp","model"],["def1","model",1,"green"],["def2","model",1,"green"],["def3","model",1,"green"]],"steps":["all",["att","inp","model"],["att","data","model"],["att","model"],["def1","def2","def3","model"]]},"say":["In security the opponent fights back, and can even attack the model itself.","Evasion attacks tweak malware so that the model misses it.","Poisoning attacks corrupt the training data so the model learns the wrong lessons.","Model extraction steals how the model works, and privacy attacks try to pull sensitive information out of it.","Defences include training on attack examples, using several models together, validating inputs and regular updates, all tested by red teams and stress tests."]},{"scene":{"type":"graph","title":"Responsible use and the four-phase plan","cam":[0,4.4,13],"nodes":[{"id":"priv","label":"Privacy","p":[-3.4,2.6,-1],"c":"violet","shape":"sphere","size":0.8},{"id":"bias","label":"Fairness\n(bias checks)","p":[0,2.9,-1.2],"c":"violet","shape":"sphere","size":0.8},{"id":"trans","label":"Transparency\n& audit trails","p":[3.4,2.6,-1],"c":"violet","shape":"sphere","size":0.8},{"id":"p1","label":"1. Foundation","p":[-5.1,-0.6,0.6],"c":"cyan","shape":"box","size":0.95},{"id":"p2","label":"2. Development","p":[-1.7,-0.6,1.0],"c":"cyan","shape":"box","size":0.95},{"id":"p3","label":"3. Deployment","p":[1.7,-0.6,1.0],"c":"cyan","shape":"box","size":0.95},{"id":"p4","label":"4. Operations","p":[5.1,-0.6,0.6],"c":"cyan","shape":"box","size":0.95}],"links":[["p1","p2"],["p2","p3"],["p3","p4"],["priv","p1"],["bias","p2"],["trans","p4"]],"steps":[["priv","bias","trans"],["priv","bias","trans"],["p1","p2","p3","p4"],["p1"],["p2","p3"],["p4"],"all","all"]},"say":["Security machine learning also watches people, so it must be used responsibly.","That means respecting privacy in what is collected and kept, checking for bias in data and outcomes, and keeping decisions explainable with audit trails.","The chapter ends with a four-phase plan.","Foundation means assessing readiness, defining use cases, checking the data and setting up governance.","Development builds the pipelines, features and models, and deployment adds the architecture, monitoring and integration.","Operations means monitoring, collecting feedback, updating models and measuring the business impact.","Looking ahead, the chapter points to federated learning, edge AI, explainable AI and continuous learning.","Above all, put data quality first, use security-specific measures, keep humans and AI working together and build in ethics."]}],"keyPoint":"Expect attackers to target the model, protect people's privacy and fair treatment, and follow the four phases: foundation, development, deployment and operations.","plain":["Evasion fools a trained model; poisoning corrupts what it learns.","A red team plays the attacker to test your defences.","Monitoring staff needs clear rules on what is collected, how long it is kept and who can see it.","Start with readiness and data, not with choosing an algorithm."],"check":{"q":"An attacker slips mislabelled samples into the data your model learns from. What is this?","o":["Evasion","Poisoning","Model extraction"],"a":1,"e":"Corrupting training data is a poisoning attack. Evasion fools a model that is already trained.","retry":{"q":"Which attack corrupts what the model learns, rather than fooling it later?","o":["Poisoning","Evasion","Neither"],"a":0,"e":"Poisoning targets the training data."}},"scenario":{"title":"The board's machine learning plan","setting":"A board wants a machine learning threat detection system live within a month. Nobody has checked what data is available, and staff have not been told about behaviour monitoring.","steps":[{"prompt":"What is the first priority?","choices":[{"t":"Choose the most advanced algorithm","s":0,"fb":"The chapter warns against overrating the algorithm."},{"t":"Phase 1: assess readiness, define use cases, check the data and set up governance","s":2,"fb":"Right. Foundation comes first."},{"t":"Buy more powerful hardware","s":0,"fb":"Hardware does not help if the data and use cases are unclear."}]},{"prompt":"What must be settled before monitoring staff behaviour?","choices":[{"t":"Nothing, security always overrides privacy","s":0,"fb":"The chapter treats privacy as a requirement, not an optional extra."},{"t":"Privacy rules: what is collected, how long it is kept, who can see it and how decisions are explained","s":2,"fb":"Right. These are the chapter's privacy and transparency requirements."},{"t":"Only the cost","s":0,"fb":"Cost matters, but not more than people's rights."}]},{"prompt":"How should the organisation test the system's resilience?","choices":[{"t":"Red team exercises and robustness testing against evasion and poisoning","s":2,"fb":"Right. Those are the evaluation methods the chapter lists."},{"t":"Trust the vendor's brochure","s":0,"fb":"Claims must be tested."},{"t":"Wait for a real attack","s":0,"fb":"That is the most expensive way to find a weakness."}]}]},"lab":{"type":"sort","title":"Attack or defence?","prompt":"Is each item an attack on the model, or a defence?","buckets":["Attack on the model","Defence"],"items":[{"t":"Evasion: altering malware to avoid detection","b":0},{"t":"Adversarial training: learning from attack examples","b":1},{"t":"Poisoning: corrupting the training data","b":0},{"t":"Input validation: spotting manipulated inputs","b":1},{"t":"Model extraction: copying how the model behaves","b":0},{"t":"Ensembles: several models must agree","b":1}],"explain":"Knowing the attacks tells you which defences to put in place."}}],"test":[{"q":"What is the main weakness of signature-based detection?","o":["It only catches threats that have been seen before","It is too expensive","It needs an internet connection"],"a":0,"e":"Signatures are fingerprints of known threats, so new threats pass.","lesson":0},{"q":"Which order is correct?","o":["Raw data → features → preprocessing → algorithm","Raw data → preprocessing → features → algorithm","Features → raw data → algorithm → preprocessing"],"a":1,"e":"Data is cleaned before features are extracted and fed to the algorithm.","lesson":1},{"q":"According to the chapter, success depends most on…","o":["The newest algorithm","Data quality and feature engineering","The fastest hardware"],"a":1,"e":"The chapter's first principle is data quality first.","lesson":1},{"q":"Why must a model be tested on data it has not seen?","o":["To check it works on new events","To make training faster","Because labels are expensive"],"a":0,"e":"Testing on unseen data checks that the model generalises.","lesson":2},{"q":"100 real attacks: the detector catches 80 and also raises 120 false alarms. What is its precision?","o":["40 per cent","80 per cent","60 per cent"],"a":0,"e":"80 real attacks out of 200 alerts is 40 per cent. Its recall is 80 per cent.","lesson":3},{"q":"Why can accuracy mislead in security?","o":["Attacks are rare, so always saying 'normal' still scores highly","Accuracy is always too low","It ignores normal events"],"a":0,"e":"With imbalanced data, a useless detector can still look accurate.","lesson":3},{"q":"Which of these is a dynamic analysis feature?","o":["File entropy","Registry changes made while the sample runs","The import table"],"a":1,"e":"You only see behaviour such as registry changes by running the sample.","lesson":4},{"q":"High entropy in a file often suggests…","o":["Packed or encrypted content","A digitally signed file","A plain text file"],"a":0,"e":"High randomness is a sign of encryption or compression used to hide code.","lesson":4},{"q":"A CNN used for malware detection first turns the file into…","o":["A greyscale image","An email","A risk score"],"a":0,"e":"Bytes become pixels so computer vision can be applied.","lesson":5},{"q":"A padlock on a website proves…","o":["The site is genuine","Only that the connection is encrypted","The site has no malware"],"a":1,"e":"A look-alike phishing site can have a valid certificate too.","lesson":6},{"q":"In clustering, what is an outlier?","o":["A point that fits no cluster and deserves a look","Always an attack","A labelled example"],"a":0,"e":"Outliers are unusual, which is not the same as malicious.","lesson":7},{"q":"Raising an anomaly threshold usually…","o":["Reduces false alarms but may miss more attacks","Catches more attacks","Has no effect"],"a":0,"e":"A higher threshold alerts less often, in both directions.","lesson":8},{"q":"In UEBA, why use peer groups?","o":["To see whether a change is shared by colleagues in the same role","To rank staff pay","To replace personal baselines"],"a":0,"e":"Peer comparison separates individual changes from team-wide ones.","lesson":9},{"q":"What is model drift?","o":["Performance slowly worsening as threats and normal behaviour change","Moving a model to new servers","A type of canary release"],"a":0,"e":"Drift is why deployed models need ongoing monitoring.","lesson":10},{"q":"Corrupting a model's training data is called…","o":["Poisoning","Evasion","Extraction"],"a":0,"e":"Poisoning attacks target the data the model learns from.","lesson":11},{"q":"Phase 1 of the chapter's implementation plan is…","o":["Foundation: readiness, use cases, data and governance","Buying hardware","Measuring business impact"],"a":0,"e":"Foundation comes before development, deployment and operations.","lesson":11}]};
