/* Chapter 11: Secure Software Development Frameworks and Standards (Guide to AI for Cybersecurity) */
const CH = {"id":"ch11","num":"11","title":"Secure Software Development Frameworks and Standards","summary":"How secure development frameworks grew from real incidents, and how to compare and choose between NCSC guidance, NIST SSDF, CISA attestation and CyBOK, implement them, measure them and adapt them for AI and cloud-native systems.","outcomes":["Explain why secure development needs a framework and how incidents shaped them","Make the economic and regulatory case for secure development","Describe the shared core and NIST SSDF's four practice groups","Contrast CISA attestation with CyBOK's theoretical grounding","Choose and justify a framework using a decision matrix","Plan implementation and measurement with leading and lagging indicators"],"starter":[{"q":"Have security frameworks usually appeared before or after major incidents?","o":["Before","After"],"a":1,"e":"Guidance has mostly followed incidents."},{"q":"Most modern software is…","o":["Written entirely in-house","Largely other people's code and libraries"],"a":1,"e":"That is why supply chain security matters."},{"q":"Does one framework fit every organisation?","o":["Yes","No, the choice depends on context"],"a":1,"e":"Lesson 6 gives a decision matrix."}],"lessons":[{"title":"Why secure development needs a framework","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four frameworks studied in this chapter","nodes":[{"id":"ncsc","label":"NCSC guidance\n(UK)","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"ssdf","label":"NIST SSDF\n(US)","p":[-1.73,1.5,0.3],"c":"violet","shape":"shield","size":0.8,"ls":0.62},{"id":"cisa","label":"CISA attestation\n(US government suppliers)","p":[1.73,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"cybok","label":"CyBOK\n(academic)","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ncsc"],["ssdf"],["cisa"],["cybok"],"all"]},"say":["Welcome to Chapter 11, Secure Software Development Frameworks and Standards, and I'm Sam, your tutor. More than 20,000 new publicly listed vulnerabilities, called CVEs, have been published each year recently, far too many to manage by hand.","The NCSC, the UK's lead cyber security authority, writes practical guidance for people who build software.","NIST, the US standards body, publishes the Secure Software Development Framework, or SSDF.","CISA, the US cyber agency, sets out what suppliers of software to US federal agencies must formally confirm.","CyBOK, the Cyber Security Body of Knowledge, is an academic project led from the UK that sets out what is known about cyber security.","Security guidance has mostly arrived after major incidents, so the aim is to learn lessons before your own breach. No single framework fits everyone, and hybrids are common."]}],"keyPoint":"Frameworks give secure development a system. NCSC, NIST SSDF, CISA and CyBOK overlap heavily but differ in audience, emphasis and legal force.","plain":["A CVE is a public ID for a known software weakness.","Frameworks are like recipes; you still have to cook.","Guidance has usually arrived one to three years after major incidents.","AI adds risks older frameworks were not written for."],"check":{"q":"Which framework is the academic body of knowledge?","o":["CyBOK","CISA","NIST SSDF"],"a":0,"e":"CyBOK explains the why behind the practical rules.","retry":{"q":"What is a CVE?","o":["A public ID for a known software weakness","A type of firewall","A UK law"],"a":0,"e":"Everyone can refer to the same flaw by its ID."}},"scenario":{"title":"Framework resistance","setting":"A company says frameworks are 'just paperwork' and refuses to adopt one.","steps":[{"prompt":"What is the strongest argument for adopting one?","choices":[{"t":"It turns lessons from past incidents into a repeatable system","s":2,"fb":"Right. Learn before your own breach."},{"t":"Auditors like colour charts","s":0,"fb":"Not the point."},{"t":"All competitors use the same one","s":1,"fb":"Possibly, but the reason is risk reduction."}]},{"prompt":"Must they pick exactly one framework?","choices":[{"t":"No, hybrids are common","s":2,"fb":"Right. Combine to fit context."},{"t":"Yes, mixing is forbidden","s":0,"fb":"Many organisations combine frameworks."},{"t":"They need all four in full","s":0,"fb":"Choose by context."}]}]},"lab":{"type":"sort","title":"Who publishes it?","prompt":"Match each framework to its origin.","buckets":["UK government","US standards body","US cyber agency","Academic project"],"items":[{"t":"NCSC guidance","b":0},{"t":"NIST SSDF","b":1},{"t":"CISA attestation form","b":2},{"t":"CyBOK","b":3}],"explain":"Different origins explain different emphases."}},{"title":"Frameworks follow incidents","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four eras of incidents and responses","nodes":[{"id":"e1","label":"1985–1990:\nOrange Book,\nMorris Worm","p":[-5.2,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"e2","label":"2000–2010:\nSQL Slammer, Conficker;\nMicrosoft SDL, OWASP","p":[-1.73,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"e3","label":"2010–2020:\nStuxnet, Heartbleed,\nWannaCry; NIST, NCSC","p":[1.73,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"e4","label":"2020–today:\nSolarWinds, Log4Shell;\nUS Executive Order","p":[5.2,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["e1","e2",2],["e2","e3",2],["e3","e4",2]],"steps":["all",["e1"],["e2"],["e3"],["e4"]]},"say":["Today's frameworks grew out of real attacks.","In the foundation era, the US Defense Department's Orange Book set the first formal requirements, and the 1988 Morris Worm reached about a tenth of the computers then online.","As the internet expanded, SQL Slammer reportedly hit about 75,000 servers in ten minutes. Microsoft's Security Development Lifecycle and the OWASP Top 10 responded.","In the era of advanced persistent threats, Stuxnet physically damaged centrifuges, Heartbleed exposed a widely shared open-source library, and WannaCry spread because patches had not been applied.","Now, supply chain attacks dominate. SolarWinds reached about 18,000 organisations through a poisoned update, and Log4Shell scored the maximum severity of 10 because the library is used almost everywhere. The pattern: guidance follows incidents, so use threat intelligence to look ahead."]}],"keyPoint":"Frameworks have followed incidents for four decades. Proactive organisations learn from others' breaches and ask 'what could go wrong?' before adopting new technology.","plain":["CVSS rates severity from 0 to 10.","WannaCry spread mainly through unpatched systems.","Many organisations did not know they used Log4j at all.","Threat intelligence is organised information about what attackers are doing now."],"check":{"q":"Why did Log4Shell score the maximum CVSS of 10?","o":["Easy to exploit and the library is used almost everywhere","It was the first virus","It only affected one company"],"a":0,"e":"Ubiquity plus ease of exploitation.","retry":{"q":"What mainly let WannaCry spread?","o":["Available patches had not been applied","Strong passwords","Encryption"],"a":0,"e":"Patching would have stopped much of it."}},"scenario":{"title":"The next big incident","setting":"Your board asks which new technology could produce the next major incident.","steps":[{"prompt":"Which answer shows proactive thinking?","choices":[{"t":"AI agents and AI-generated code, so assess their risks now","s":2,"fb":"Right. Ask what could go wrong before adopting."},{"t":"Nothing new, we are safe","s":0,"fb":"History says otherwise."},{"t":"Fax machines","s":0,"fb":"Unlikely to be the next frontier."}]},{"prompt":"How can an organisation stay ahead of guidance?","choices":[{"t":"Use threat intelligence and learn from others' breaches","s":2,"fb":"Right. Do not wait for the framework update."},{"t":"Wait for regulators","s":0,"fb":"That is the reactive pattern."},{"t":"Ignore incidents elsewhere","s":0,"fb":"Others' breaches are free lessons."}]}]},"lab":{"type":"order","title":"Order the incidents","prompt":"Put these incidents in time order.","items":["Morris Worm","SQL Slammer","Stuxnet","WannaCry","SolarWinds","Log4Shell"],"explain":"Each incident pushed new guidance into existence."}},{"title":"The business case, regulation and supply chains","minutes":3,"slides":[{"scene":{"type":"graph","title":"Relative cost to fix a defect","nodes":[{"id":"rq","label":"Requirements\n$1","p":[-5.2,0.0,-0.3],"c":"green","shape":"cyl","size":0.8,"ls":0.62},{"id":"ds","label":"Design\n$5","p":[-2.6,1.5,0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"cd","label":"Coding\n$10","p":[0.0,0.0,-0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62},{"id":"ts","label":"Testing\n$50","p":[2.6,1.5,0.3],"c":"amber","shape":"cyl","size":0.8,"ls":0.62},{"id":"pr","label":"Production\n$500+","p":[5.2,0.0,-0.3],"c":"red","shape":"cyl","size":0.8,"ls":0.62}],"links":[["rq","ds",2],["ds","cd",2],["cd","ts",2],["ts","pr",2]],"steps":["all",["rq"],["ds"],["cd"],["ts"],["pr"],"all"]},"say":["The economics are clear: fix flaws early.","At requirements, a flaw is a change to a document.","At design, still cheap.","During coding, a little more.","In testing, more again.","In production, it may mean emergency patches, breach handling and fines. The exact ratios are indicative, but the direction is not in doubt.","Regulation is turning good practice into law: in the EU, NIS2 and the Cyber Resilience Act; in the US, Executive Order 14028 with supplier attestation and SBOMs; in the UK, the NIS Regulations 2018 and UK GDPR. Modern software is mostly other people's code, including libraries your libraries depend on, and even the build tools, as SolarWinds showed. An SBOM lists every ingredient."]}],"keyPoint":"Early fixes are far cheaper, regulation increasingly demands secure development, and most software is other people's code, so know your supply chain with an SBOM.","plain":["Transitive dependencies are the libraries your libraries use.","Attestation is a formal signed statement of practice.","NIS2 does not apply directly in the UK; the UK has its own NIS Regulations.","An SBOM is the ingredients label for software."],"check":{"q":"What are transitive dependencies?","o":["Libraries used by the libraries you chose","Your own code","Your build server"],"a":0,"e":"Deep trees of components nobody chose directly.","retry":{"q":"Why might a UK firm selling into the EU and to the US government need more than one framework?","o":["Different jurisdictions impose different obligations","Frameworks are free","It is fashionable"],"a":0,"e":"Regulation often decides the mix."}},"scenario":{"title":"The poisoned update","setting":"An attacker breaks into a supplier's build system and slips malicious code into a legitimate update.","steps":[{"prompt":"What is this an example of?","choices":[{"t":"A software supply chain attack","s":2,"fb":"Right. Like SolarWinds."},{"t":"Phishing","s":0,"fb":"No email trickery here."},{"t":"A denial of service","s":0,"fb":"Nothing is overloaded."}]},{"prompt":"Which practice helps you respond quickly when a component is found to be flawed?","choices":[{"t":"Keeping SBOMs for your software","s":2,"fb":"Right. Search the ingredients lists."},{"t":"Longer passwords","s":0,"fb":"Useful elsewhere."},{"t":"Printing the code","s":0,"fb":"No."}]}]},"lab":{"type":"sort","title":"Which jurisdiction?","prompt":"Match each rule to where it comes from.","buckets":["EU","US","UK"],"items":[{"t":"NIS2 Directive","b":0},{"t":"Cyber Resilience Act","b":0},{"t":"Executive Order 14028","b":1},{"t":"CISA supplier attestation","b":1},{"t":"NIS Regulations 2018","b":2},{"t":"UK GDPR","b":2}],"explain":"Where you are and who you sell to decides which rules apply."}},{"title":"The common core and NIST SSDF","minutes":4,"slides":[{"scene":{"type":"graph","title":"Six knowledge areas all four frameworks share","nodes":[{"id":"sc","label":"Secure\ncoding","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"tm","label":"Threat\nmodelling","p":[3.64,1.9,0],"c":"red","shape":"ico","size":0.8,"ls":0.6},{"id":"st","label":"Security\ntesting","p":[3.64,-0.7,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"vm","label":"Vulnerability\nmanagement","p":[0.0,-2.0,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"tp","label":"Third-party\ncomponents","p":[-3.64,-0.7,0],"c":"pink","shape":"torus","size":0.8,"ls":0.6},{"id":"tr","label":"Security\ntraining","p":[-3.64,1.9,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6}],"links":[],"steps":["all",["sc"],["tm"],["st"],["vm"],["tp"],["tr"]],"orbit":0.4},"say":["All four frameworks share a common core of six knowledge areas.","Secure coding.","Threat modelling, for example with STRIDE: spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege.","Security testing, both static, reading code, and dynamic, probing the running application.","Vulnerability management.","Managing third-party components.","And security training. Frameworks differ in emphasis and audience, not in these fundamentals."]},{"scene":{"type":"graph","title":"NIST SSDF: four practice groups","nodes":[{"id":"po","label":"PO: Prepare the\nOrganisation","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"ps","label":"PS: Protect\nthe Software","p":[4.2,0.6,0],"c":"violet","shape":"shield","size":0.8,"ls":0.6},{"id":"pw","label":"PW: Produce Well-Secured\nSoftware (largest)","p":[0.0,-2.0,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"rv","label":"RV: Respond to\nVulnerabilities","p":[-4.2,0.6,0],"c":"red","shape":"sphere","size":0.8,"ls":0.6}],"links":[["po","ps",2],["ps","pw",2],["pw","rv",2],["rv","po",2]],"steps":["all",["po"],["ps"],["pw"],["rv"]],"orbit":0.4},"say":["NIST SSDF, Special Publication 800-218, groups practices into four functions.","Prepare the Organisation: requirements, roles, training, toolchains and secure environments.","Protect the Software: guard code from tampering, let customers verify releases are genuine, and archive each release.","Produce Well-Secured Software, the largest group: secure design, safe reuse, secure coding, code review, testing and secure defaults.","Respond to Vulnerabilities: find, assess and fix them, then fix their root causes, feeding lessons back into preparation. The SSDF is comprehensive and internationally recognised, but complex for small organisations; NCSC guidance is the practical, low-cost UK entry point."]}],"keyPoint":"All frameworks share six core areas. NIST SSDF organises practice into PO, PS, PW and RV, with RV feeding back into PO.","plain":["STRIDE is a checklist of six threat types.","PW is where most day-to-day developer practice lives.","Root-cause fixing stops the same flaw recurring.","NCSC suits UK organisations and SMEs."],"check":{"q":"Which SSDF group covers secure coding, review and testing?","o":["PW: Produce Well-Secured Software","PO: Prepare the Organisation","RV: Respond to Vulnerabilities"],"a":0,"e":"PW is the largest function.","retry":{"q":"If all four frameworks share the same core, why have four?","o":["They differ in audience, emphasis and legal force","They contradict each other","Only one is real"],"a":0,"e":"Same fundamentals, different contexts."}},"scenario":{"title":"The ten-person start-up","setting":"A ten-person start-up wants to begin with the SSDF.","steps":[{"prompt":"Which function would you start with?","choices":[{"t":"PO, to set roles, requirements and training first","s":2,"fb":"Right. Preparation underpins everything."},{"t":"RV only","s":1,"fb":"Important, but preparation comes first."},{"t":"None, start-ups are too small","s":0,"fb":"Even small teams benefit."}]},{"prompt":"What risk does the SSDF pose for them?","choices":[{"t":"Complexity; NCSC guidance may be an easier first step","s":2,"fb":"Right. Match framework to maturity."},{"t":"It is illegal in the UK","s":0,"fb":"It is not."},{"t":"It has no testing guidance","s":0,"fb":"It has plenty."}]}]},"lab":{"type":"sort","title":"Which SSDF group?","prompt":"Place each practice in its SSDF function.","buckets":["PO Prepare","PS Protect","PW Produce","RV Respond"],"items":[{"t":"Define security roles and training","b":0},{"t":"Let customers verify a release is genuine","b":1},{"t":"Code review and static analysis","b":2},{"t":"Fix the root cause of a reported flaw","b":3},{"t":"Archive each released version","b":1},{"t":"Secure default settings","b":2}],"explain":"Four functions, one continuous cycle."}},{"title":"CISA attestation and CyBOK","minutes":3,"slides":[{"scene":{"type":"graph","title":"What to prove versus why it works","nodes":[{"id":"cisa","label":"CISA: suppliers sign\nan attestation form","p":[-5.2,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"ev","label":"Evidence on request,\nsuch as an SBOM","p":[-1.73,1.5,0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"cy","label":"CyBOK: theory, vulnerability\nclasses, lifecycle","p":[1.73,0.0,-0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62},{"id":"map","label":"Map a CyBOK concept\nto SSDF practices","p":[5.2,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62}],"links":[["cisa","ev",1],["cy","map",1]],"steps":["all",["cisa"],["ev"],["cy"],["map"]]},"say":["CISA and CyBOK sit at opposite ends of the spectrum.","Under CISA, software producers selling to US federal agencies sign a common form confirming they follow defined secure development practices, based on the SSDF.","Agencies can ask for evidence, such as an SBOM. Organisations that already follow the SSDF are well placed to attest.","CyBOK is organised into knowledge areas. Its Software Security area explains classes of vulnerability, such as injection, memory safety and race conditions, why they happen, and how to prevent or detect them.","The two complement each other. For example, map the CyBOK concept of injection to the SSDF practices that address it: secure coding, code review and testing. A signed attestation is only meaningful if practice backs it up, otherwise it becomes box-ticking."]}],"keyPoint":"CISA tells suppliers what to prove; CyBOK explains why it works. Use theory to understand the rules and attestation to evidence them.","plain":["Attestation is a signature backed by practice, not a substitute for it.","CyBOK suits universities and research teams.","Mapping theory to practice deepens understanding.","An SBOM can be requested as evidence."],"check":{"q":"What does the CISA attestation form confirm?","o":["The supplier follows defined secure development practices","The software is bug-free","The supplier is UK-based"],"a":0,"e":"It is based on SSDF practices.","retry":{"q":"Which SSDF practices address CyBOK's injection vulnerabilities?","o":["Secure coding, code review and testing","Archiving releases only","Training only"],"a":0,"e":"PW.5, PW.7 and PW.8."}},"scenario":{"title":"The box-ticking risk","setting":"A supplier signs the CISA form but has no evidence of code review or testing.","steps":[{"prompt":"What is the problem?","choices":[{"t":"The attestation is not backed by practice, so it is box-ticking","s":2,"fb":"Right. Evidence must back the signature."},{"t":"No problem, the form is signed","s":0,"fb":"Signatures without practice mislead."},{"t":"The form is optional anyway","s":1,"fb":"It is required for federal suppliers."}]},{"prompt":"How should a development team use CyBOK alongside the SSDF?","choices":[{"t":"Use CyBOK to understand why each practice works","s":2,"fb":"Right. Theory strengthens practice."},{"t":"Replace the SSDF with CyBOK","s":0,"fb":"CyBOK is less prescriptive."},{"t":"Ignore theory","s":0,"fb":"Understanding helps judgement."}]}]},"lab":{"type":"sort","title":"CISA or CyBOK?","prompt":"Does each description fit CISA or CyBOK?","buckets":["CISA","CyBOK"],"items":[{"t":"Formal attestation by suppliers","b":0},{"t":"Theoretical foundations of software security","b":1},{"t":"Evidence such as an SBOM on request","b":0},{"t":"Classes of vulnerability and why they occur","b":1},{"t":"Linked to US Executive Order 14028","b":0}],"explain":"Compliance and understanding work best together."}},{"title":"Choosing a framework","minutes":3,"slides":[{"scene":{"type":"graph","title":"A decision matrix gives a starting point","nodes":[{"id":"uk","label":"UK or small\nbusiness → NCSC","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"sphere","size":0.8,"ls":0.62},{"id":"usg","label":"US government\nsupplier → CISA","p":[-2.6,1.5,0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"ent","label":"Large enterprise\n→ NIST SSDF","p":[0.0,0.0,-0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"res","label":"Research group\n→ CyBOK","p":[2.6,1.5,0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62},{"id":"int","label":"International →\nSSDF + CyBOK","p":[5.2,0.0,-0.3],"c":"pink","shape":"sphere","size":0.8,"ls":0.62}],"links":[],"steps":["all",["uk"],["usg"],["ent"],["res"],["int"]]},"say":["The chapter's decision matrix links a situation to a starting recommendation.","A UK organisation or small business: start with NCSC guidance, the most accessible.","A US government supplier: CISA, with its formal attestation.","A large, mature enterprise: NIST SSDF, the most comprehensive.","A university or research group: CyBOK, with the strongest theoretical grounding.","An international organisation: SSDF plus CyBOK. Then weigh sector rules, maturity, skills, budget and tool integration. The difficulty ratings are the authors' assessment, and there is little evidence comparing how well frameworks actually work, which is a good research topic."]}],"keyPoint":"Start from where the organisation is and who its customers are, use the decision matrix for a defensible first choice, then adjust for sector, maturity, skills and budget.","plain":["A decision matrix is a starting point, not the answer.","Regulation usually decides a lot.","Hybrids are normal: SSDF plus CISA, or NCSC growing into SSDF.","Evidence comparing frameworks is thin."],"check":{"q":"A US defence supplier should start with…","o":["CISA attestation","CyBOK only","No framework"],"a":0,"e":"Federal suppliers must attest.","retry":{"q":"Why is the decision matrix only a starting point?","o":["Sector rules, maturity, skills and budget also matter","It is always wrong","Regulators forbid it"],"a":0,"e":"Context refines the choice."}},"scenario":{"title":"The Leeds start-up","setting":"A ten-person software start-up in Leeds asks which framework to adopt.","steps":[{"prompt":"What is a sensible starting point?","choices":[{"t":"NCSC guidance, growing into the SSDF as it matures","s":2,"fb":"Right. Accessible first, comprehensive later."},{"t":"Full SSDF immediately","s":1,"fb":"Possible but heavy for ten people."},{"t":"CISA attestation","s":0,"fb":"Only relevant if selling to US agencies."}]},{"prompt":"What evidence would show one framework works better?","choices":[{"t":"Comparative data on vulnerabilities and incidents over time","s":2,"fb":"Right. Outcomes, not opinions."},{"t":"Which one has the nicest website","s":0,"fb":"No."},{"t":"Which is newest","s":0,"fb":"Age is not effectiveness."}]}]},"lab":{"type":"sort","title":"Recommend a framework","prompt":"Which framework is the best starting point for each organisation?","buckets":["NCSC","CISA","NIST SSDF","CyBOK"],"items":[{"t":"A 15-person UK charity's software team","b":0},{"t":"A firm selling software to US federal agencies","b":1},{"t":"A 20,000-person multinational bank","b":2},{"t":"A university cyber security research group","b":3}],"explain":"Match the framework to location, customers and maturity."}},{"title":"Making frameworks stick and measuring them","minutes":3,"slides":[{"scene":{"type":"graph","title":"Leading and lagging indicators","nodes":[{"id":"tr","label":"Leading: training\ncompletion","p":[-5.2,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"ad","label":"Leading: tool\nadoption","p":[-2.6,1.5,0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"pre","label":"Leading: flaws found\nbefore release","p":[0.0,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"prod","label":"Lagging: flaws in\nproduction","p":[2.6,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62},{"id":"inc","label":"Lagging: incidents\nand audit results","p":[5.2,0.0,-0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["tr"],["ad"],["pre"],["prod"],["inc"]]},"say":["Most obstacles are organisational: security seen as a blocker, tension between teams, scarce skills and budget, and legacy systems. What works is visible executive support, phased roll-out, training with security champions, automation inside the existing pipeline, and metrics agreed from the start.","Leading indicators are early signs you can act on now, such as training completion.","Tool adoption.","And vulnerabilities found before release.","Lagging indicators show outcomes after the fact, such as vulnerabilities reaching production.","And incidents and audit results. A balanced scorecard combines both, each with a target, an owner and a data source. Beware single measures: few incidents may mean good security, or poor detection."]}],"keyPoint":"Frameworks stick with leadership, phasing, champions and automation. Measure with a balanced scorecard of leading and lagging indicators, each tied to a decision.","plain":["A security champion is a developer in each team who links to the security team.","Leading indicators are like a fuel gauge; lagging ones are the trip report.","Low incident counts can hide poor detection.","Every metric should lead to a decision."],"check":{"q":"Which is a leading indicator?","o":["Training completion rate","Number of breaches last year","Audit fine paid"],"a":0,"e":"It shows behaviour you can influence now.","retry":{"q":"Why is 'number of incidents' alone a poor measure?","o":["Few incidents may mean poor detection","It is too easy to count","It is illegal to measure"],"a":0,"e":"Pair it with detection and leading measures."}},"scenario":{"title":"The workaround","setting":"Developers bypass a mandatory security check because it adds a day to every release.","steps":[{"prompt":"What would make the rule stick?","choices":[{"t":"Automate the check inside the pipeline so it adds minutes, not a day","s":2,"fb":"Right. Remove friction, keep protection."},{"t":"Punish developers","s":0,"fb":"Workarounds go underground."},{"t":"Drop the check","s":0,"fb":"That removes protection."}]},{"prompt":"Who should be accountable for insecure code?","choices":[{"t":"Shared: developers own their code, supported by security and leadership","s":2,"fb":"Right. Security is everyone's job."},{"t":"Only the security team","s":0,"fb":"They cannot write all the code."},{"t":"Nobody","s":0,"fb":"Accountability matters."}]}]},"lab":{"type":"sort","title":"Leading or lagging?","prompt":"Classify each metric.","buckets":["Leading indicator","Lagging indicator"],"items":[{"t":"Percentage of developers trained this quarter","b":0},{"t":"Vulnerabilities found in production","b":1},{"t":"Share of repositories using the scanner","b":0},{"t":"Cost of incidents this year","b":1},{"t":"Flaws found before release","b":0},{"t":"External audit result","b":1}],"explain":"Use both: one guides action, the other confirms results."}},{"title":"Future directions: AI and cloud-native","minutes":3,"slides":[{"scene":{"type":"graph","title":"Where today's frameworks fall short","nodes":[{"id":"ai","label":"AI and ML:\npoisoning, adversarial\ninputs, model theft","p":[-5.2,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"gen","label":"AI-generated code:\nstill needs review","p":[-1.73,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"cn","label":"Cloud-native: containers,\nserverless, infrastructure as code","p":[1.73,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"reg","label":"Regulation: producer\nliability, certification","p":[5.2,1.5,0.3],"c":"violet","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ai"],["gen"],["cn"],["reg"],"all"]},"say":["Current frameworks were written for traditional software, and new technology stretches them.","AI and machine learning bring data poisoning, adversarial inputs, model theft, bias and the need to explain decisions. NIST SP 800-218A extends the SSDF for generative AI.","AI-generated code still needs review and testing, and licensing and ownership questions remain.","Cloud-native systems use containers, serverless functions that run only when called, and infrastructure as code, where servers are defined in configuration files that can contain mistakes just like code.","Regulation is moving towards producer liability and certification for critical systems.","Expect consolidation, better interoperability, more automated compliance and technology-specific guidance. Frameworks are not static: NIST's Cybersecurity Framework moved to version 2.0 in February 2024. They reduce risk but cannot remove it; success depends mostly on culture and measurement."]}],"keyPoint":"Frameworks are evolving for AI, AI-generated code and cloud-native systems. Choose by context, build the culture, and measure.","plain":["Serverless code runs on infrastructure you never see.","Infrastructure as code can carry security bugs too.","SP 800-218A adds AI-specific guidance to the SSDF.","Frameworks reduce risk; they never remove it."],"check":{"q":"What does NIST SP 800-218A add?","o":["SSDF guidance for generative AI and foundation models","A new encryption cipher","UK privacy law"],"a":0,"e":"It is technology-specific guidance.","retry":{"q":"Why can infrastructure as code contain security flaws?","o":["Configuration files can have mistakes just like code","It runs only on paper","It is always encrypted"],"a":0,"e":"Review and test it like code."}},"scenario":{"title":"AI-written code standards","setting":"Your team debates whether AI-generated code should face a higher standard than human code.","steps":[{"prompt":"What is a defensible position?","choices":[{"t":"At least the same standard: review and test it like any outside code","s":2,"fb":"Right. No free pass for AI."},{"t":"Lower, because AI is smarter","s":0,"fb":"AI reproduces common flaws."},{"t":"No review needed","s":0,"fb":"That invites known flaws."}]},{"prompt":"Should software producers be legally liable for insecure products?","choices":[{"t":"It is a live debate; regulation is moving towards producer liability","s":2,"fb":"Right. The trend is clear even if details vary."},{"t":"Never","s":1,"fb":"Many regulators disagree."},{"t":"Only for games","s":0,"fb":"No."}]}]},"lab":{"type":"sort","title":"Which challenge?","prompt":"Match each issue to the emerging challenge it belongs to.","buckets":["AI and ML","AI-generated code","Cloud-native","Regulation"],"items":[{"t":"A model copied by repeated querying","b":0},{"t":"An assistant reproducing an injection flaw","b":1},{"t":"A misconfigured serverless function","b":2},{"t":"Mandatory certification for critical software","b":3},{"t":"Poisoned training data","b":0}],"explain":"Frameworks must adapt to each of these."}}],"test":[{"q":"NCSC is…","o":["The UK's lead cyber security authority","A US standards body","An academic project"],"a":0,"e":"","lesson":0},{"q":"More than how many CVEs per year have been published recently?","o":["20,000","200","2 million"],"a":0,"e":"","lesson":0},{"q":"SolarWinds was…","o":["A supply chain attack via a poisoned update","A phishing campaign","A power cut"],"a":0,"e":"","lesson":1},{"q":"Log4Shell's CVSS score was…","o":["10.0","5.0","1.0"],"a":0,"e":"","lesson":1},{"q":"Fixing a flaw in production costs roughly how much more than at requirements, per the chapter?","o":["500 times or more","Twice","The same"],"a":0,"e":"","lesson":2},{"q":"NIS2 applies directly in…","o":["The EU","The UK only","The US"],"a":0,"e":"","lesson":2},{"q":"An SBOM lists…","o":["Every software component and version","Staff names","Firewall rules"],"a":0,"e":"","lesson":2},{"q":"Which SSDF function is largest?","o":["PW Produce Well-Secured Software","PO","PS"],"a":0,"e":"","lesson":3},{"q":"STRIDE's E stands for…","o":["Elevation of privilege","Encryption","Email"],"a":0,"e":"","lesson":3},{"q":"CISA's attestation form is based on…","o":["NIST SSDF practices","CyBOK theory","OWASP only"],"a":0,"e":"","lesson":4},{"q":"CyBOK is best suited to…","o":["Universities and research teams","Only US contractors","Hardware vendors"],"a":0,"e":"","lesson":4},{"q":"A UK small business should usually start with…","o":["NCSC guidance","Full CISA attestation","Nothing"],"a":0,"e":"","lesson":5},{"q":"A leading indicator is…","o":["An early sign you can act on now","A past outcome","A fine"],"a":0,"e":"","lesson":6},{"q":"A security champion is…","o":["A developer linking their team to security","An external auditor","A firewall"],"a":0,"e":"","lesson":6},{"q":"NIST CSF 2.0 was published in…","o":["February 2024","1985","2003"],"a":0,"e":"","lesson":7},{"q":"Infrastructure as code means…","o":["Servers defined in configuration files","Hand-built servers","Paper diagrams"],"a":0,"e":"","lesson":7}]};
