/* Chapter 7: AI-Enhanced Secure SDLC and Secure Requirements Engineering (Guide to AI for Cybersecurity) */
const CH = {"id":"ch07","num":"7","title":"AI-Enhanced Secure SDLC and Secure Requirements Engineering","summary":"How to build security into every phase of developing AI systems, and how to write precise, testable requirements for data, models, security, explainability, fairness and law, through an eye-screening case study.","outcomes":["Explain how the secure SDLC changes when AI is involved","Apply security-by-design principles to data and models","Write the seven kinds of requirement an AI system needs","Turn vague goals into measurable, testable requirements","Build a traceability matrix linking requirements to evidence","Manage trade-offs and document them clearly"],"starter":[{"q":"Adding security after an AI system is built is usually…","o":["Cheap and easy","Expensive and incomplete","Required by law"],"a":1,"e":"Shift left: build it in from the first conversation."},{"q":"'The system shall be secure' is a good requirement.","o":["True","False: it has no number or test"],"a":1,"e":"Every requirement needs measurable acceptance criteria."},{"q":"Can an AI model be unfair even if its code has no bugs?","o":["No","Yes, if its training data under-represents some groups"],"a":1,"e":"Data drives fairness."}],"lessons":[{"title":"Why requirements matter for AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"Every system passes through the lifecycle","nodes":[{"id":"pl","label":"Planning","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"de","label":"Design","p":[3.64,1.9,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"bu","label":"Build","p":[3.64,-0.7,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"te","label":"Test","p":[0.0,-2.0,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"dp","label":"Deploy","p":[-3.64,-0.7,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6},{"id":"op","label":"Operate","p":[-3.64,1.9,0],"c":"slate","shape":"torus","size":0.8,"ls":0.6}],"links":[["pl","de",2],["de","bu",2],["bu","te",2],["te","dp",2],["dp","op",2],["op","pl",2]],"steps":["all",["pl"],["de"],["bu"],["te"],["dp"],["op"],"all"],"orbit":0.4},"say":["Welcome to Chapter 7, AI-Enhanced Secure SDLC and Secure Requirements Engineering, and I'm Sam, your tutor. Many AI failures in the news trace back to what nobody thought to ask for at the start.","The software development lifecycle, or SDLC, starts with planning: what the system must do.","Design decides how it will work.","Build writes the code and, for AI, trains the model.","Test checks it does what was required.","Deploy puts it into use.","Operate keeps it running and watches it, feeding lessons back into planning.","A requirement is a clear statement of something a system must do or a quality it must have. For AI, questions like whose data trained it and how accurate it is for different groups must be written as requirements, or they will never be answered."]}],"keyPoint":"AI security has two sides: AI helps secure software, and the AI itself must be secured. Both start with requirements, because security added late is expensive and incomplete.","plain":["Adding security late is like adding foundations to a house that is already standing.","Much of an AI system's behaviour comes from its data, not its code.","Vague or missing requirements mean testers cannot tell if it works.","Requirements engineering means finding, writing, checking and updating what people need."],"check":{"q":"Why are requirements especially important for AI systems?","o":["AI has no code","Behaviour comes partly from data, so questions about data and fairness must be asked up front","AI never changes"],"a":1,"e":"If data and fairness questions are not requirements, nobody answers them.","retry":{"q":"In the house picture, adding security after the model is built is like…","o":["Adding foundations to a standing house","Painting the front door","Choosing curtains"],"a":0,"e":"Possible sometimes, but far more costly and never as sound."}},"scenario":{"title":"The surprising chatbot","setting":"A company's AI chatbot gives unfair answers to some customer groups. Engineers say the code is fine.","steps":[{"prompt":"Where is the failure most likely?","choices":[{"t":"In the data and the requirements nobody wrote about fairness","s":2,"fb":"Right. Nobody asked for fairness, so nobody tested it."},{"t":"In the server hardware","s":0,"fb":"Hardware does not create unfairness."},{"t":"Nowhere, chatbots are unpredictable","s":0,"fb":"Requirements could have caught it."}]},{"prompt":"What should the next project do differently?","choices":[{"t":"Write fairness and data requirements at the start","s":2,"fb":"Right. Requirements drive what gets tested."},{"t":"Skip requirements to move faster","s":0,"fb":"That repeats the failure."},{"t":"Only test after launch","s":0,"fb":"Too late and too costly."}]}]},"lab":{"type":"order","title":"Order the lifecycle","prompt":"Put the SDLC stages in order.","items":["Planning","Design","Build","Test","Deploy","Operate"],"explain":"Operation feeds lessons back into the next round of planning."}},{"title":"Shift left: the AI-enhanced secure SDLC","minutes":3,"slides":[{"scene":{"type":"graph","title":"Each phase gains AI-specific controls","nodes":[{"id":"pl","label":"Plan: AI security\nrequirements, data rules","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"de","label":"Design: threat model\nthe model and data","p":[-3.12,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"bu","label":"Build: adversarial\ntraining, safe model files","p":[-1.04,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"te","label":"Test: robustness,\npoisoning checks","p":[1.04,1.5,0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"dp","label":"Deploy: model\nsigning","p":[3.12,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"op","label":"Operate: attack and\ndrift monitoring","p":[5.2,1.5,0.3],"c":"slate","shape":"torus","size":0.8,"ls":0.62}],"links":[["pl","de",2],["de","bu",2],["bu","te",2],["te","dp",2],["dp","op",2]],"steps":["all",["pl"],["de"],["bu"],["te"],["dp"],["op"]]},"say":["Secure development used to test security at the end. Shift left means bringing security into the earliest stages, where problems are cheapest to fix.","In planning, teams add AI security requirements, data governance rules and a model risk assessment.","In design, threat modelling covers the model and its data as well as the code. Federated learning trains a model across sites without moving the raw data.","In build, adversarial training deliberately uses tricky, altered examples so the model is harder to fool, and saved model files must not carry hidden code.","In testing, teams check robustness and look for poisoned data, meaning training data an attacker has tampered with.","At deployment, model signing works like a digital seal proving the file has not changed since approval.","In operation, teams watch for attacks and for drift, when the world changes and accuracy slowly falls. AI systems still need passwords, encryption and patching: the new controls add to the old ones."]}],"keyPoint":"Shift left: build security into every phase. Each phase keeps traditional controls and gains AI-specific ones, because new threats target data and models.","plain":["Fixing a flaw in planning costs pennies; fixing it in production costs pounds.","Model signing is a wax seal on a letter.","Drift is like a map going out of date as roads change.","AI code scanners help reviewers but miss things and raise false alarms."],"check":{"q":"What does 'shift left' mean?","o":["Moving security into the earliest stages","Moving servers to the left of the rack","Testing only at the end"],"a":0,"e":"Earlier is cheaper and more complete.","retry":{"q":"In the wax-seal picture, what does model signing prove?","o":["The model file has not been tampered with since approval","The model is accurate","The model is fair"],"a":0,"e":"Signing proves integrity, not quality."}},"scenario":{"title":"Testing a fraud model","setting":"Your team tests a new fraud detection model the same way it tests the payment system: functional tests only.","steps":[{"prompt":"What is missing?","choices":[{"t":"Robustness and poisoned-data tests","s":2,"fb":"Right. AI needs AI-specific testing."},{"t":"Nothing, functional tests are enough","s":0,"fb":"They miss model-specific threats."},{"t":"More user interface tests","s":1,"fb":"Useful, but not the main gap."}]},{"prompt":"Can AI code scanning replace the manual security review?","choices":[{"t":"No, it assists reviewers but misses things","s":2,"fb":"Right. Keep the human review."},{"t":"Yes, completely","s":0,"fb":"Scanners raise false alarms and miss issues."},{"t":"Only on Fridays","s":0,"fb":"No."}]}]},"lab":{"type":"sort","title":"Which phase?","prompt":"Place each control in the SDLC phase where it belongs.","buckets":["Plan","Design","Build","Test","Deploy","Operate"],"items":[{"t":"Data governance rules","b":0},{"t":"Threat model covering the training data","b":1},{"t":"Adversarial training","b":2},{"t":"Checks for poisoned data","b":3},{"t":"Signing the approved model file","b":4},{"t":"Watching for drift","b":5}],"explain":"Every phase has its own AI-specific control."}},{"title":"Security by design for AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"A loop that turns principles into practice","nodes":[{"id":"ta","label":"Threat\nanalysis","p":[0.0,3.2,0],"c":"red","shape":"ico","size":0.8,"ls":0.6},{"id":"sr","label":"Security\nrequirements","p":[4.2,0.6,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"ad","label":"Architecture\ndesign","p":[0.0,-2.0,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"bt","label":"Build, test\nand monitor","p":[-4.2,0.6,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6}],"links":[["ta","sr",2],["sr","ad",2],["ad","bt",2],["bt","ta",2]],"steps":["all",["ta"],["sr"],["ad"],["bt"],"all"],"orbit":0.4},"say":["Security by design means building protection in from the start. Classic principles still apply: least privilege, so nothing gets more access than it needs; defence in depth, several layers so one failure is not fatal; and fail-safe defaults, doing the safe thing when unsure, like a car slowing when it cannot see clearly.","The framework starts with threat analysis: what could go wrong, and who might attack?","Each threat becomes a measurable security requirement.","The architecture is designed to meet those requirements, layer by layer.","Then the system is built, tested and monitored, and what monitoring reveals feeds back into threat analysis.","Three principles matter especially for AI: data minimisation, not collecting data just in case; explainability by design; and privacy by design, using techniques such as differential privacy, which adds measured random noise so no individual can be identified."]}],"keyPoint":"Least privilege, defence in depth and fail-safe defaults, plus data minimisation, explainability and privacy by design. Threat analysis → requirements → architecture → build, test, monitor, and round again.","plain":["Defence in depth is like a castle with a moat, walls and guards.","Fail-safe means slowing down when unsure.","Data you never collect can never be stolen.","Federated learning moves the training, not the data."],"check":{"q":"A self-driving car's camera and radar disagree. Which principle says it should slow down safely?","o":["Fail-safe defaults","Data minimisation","Least privilege"],"a":0,"e":"When unsure, fall back to safe behaviour.","retry":{"q":"In the castle picture, why have several layers?","o":["So one failure is not fatal","To look impressive","To slow down visitors"],"a":0,"e":"Defence in depth catches what one layer misses."}},"scenario":{"title":"Just in case","setting":"A product team wants to collect users' location, contacts and browsing history 'just in case it helps the model later'.","steps":[{"prompt":"Which principle does this break?","choices":[{"t":"Data minimisation","s":2,"fb":"Right. Collect only what you need."},{"t":"Defence in depth","s":0,"fb":"That is about layers of protection."},{"t":"None","s":0,"fb":"It increases privacy risk and what could be stolen."}]},{"prompt":"What would you recommend?","choices":[{"t":"Collect only the data the stated purpose needs","s":2,"fb":"Right. Less data, less risk."},{"t":"Collect everything but encrypt it","s":1,"fb":"Encryption helps, but minimisation is better."},{"t":"Ask users to trust you","s":0,"fb":"Trust needs design, not promises."}]}]},"lab":{"type":"sort","title":"Name the principle","prompt":"Match each design choice to its principle.","buckets":["Least privilege","Defence in depth","Fail-safe default","Data minimisation","Privacy by design"],"items":[{"t":"The model can read only the one database it needs","b":0},{"t":"Input checks, output checks and model monitoring together","b":1},{"t":"Low-confidence results go to a person","b":2},{"t":"Not collecting date of birth when age band is enough","b":3},{"t":"Adding differential privacy to training","b":4}],"explain":"Each principle reduces a different kind of risk."}},{"title":"Seven kinds of requirement for AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"AI adds requirement types traditional software never had","nodes":[{"id":"fu","label":"Functional","p":[0.0,3.2,0],"c":"slate","shape":"sphere","size":0.8,"ls":0.6},{"id":"da","label":"Data","p":[3.28,2.22,0],"c":"cyan","shape":"cyl","size":0.8,"ls":0.6},{"id":"mo","label":"Model","p":[4.09,0.02,0],"c":"violet","shape":"ico","size":0.8,"ls":0.6},{"id":"se","label":"Security","p":[1.82,-1.75,0],"c":"red","shape":"shield","size":0.8,"ls":0.6},{"id":"ex","label":"Explainability","p":[-1.82,-1.75,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"fa","label":"Fairness","p":[-4.09,0.02,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6},{"id":"rg","label":"Regulatory","p":[-3.28,2.22,0],"c":"pink","shape":"slab","size":0.8,"ls":0.6}],"links":[["da","mo",2],["da","fa",2],["mo","ex",1],["mo","se",1],["rg","fa",1]],"steps":["all",["fu"],["da"],["mo"],["se"],["ex"],["fa"],["rg"]],"orbit":0.4},"say":["Traditional software has functional requirements, what it does, and non-functional ones such as speed and security. AI needs seven categories.","Functional: what the system does.","Data: how much training data, of what quality, covering which people.","Model: measurable targets. Sensitivity is the share of real cases the model catches; specificity is the share of healthy people it correctly clears.","Security: protection for the system, the data and the model.","Explainability: how decisions are shown to users.","Fairness: similar performance across groups such as age, sex and ethnicity.","Regulatory: what the law requires. They are linked: a fairness target cannot be met unless the data requirement includes diverse people. And because you cannot know if a target is achievable until a model is trained, expect to revise them."]}],"keyPoint":"Functional, data, model, security, explainability, fairness and regulatory. Every requirement needs a number and a test method, and AI requirements are refined as evidence arrives.","plain":["'The system shall be secure' is useless; a tester cannot prove it.","Sensitivity catches the sick; specificity clears the healthy.","Fairness depends on data: you cannot be fair to people you never trained on.","Each requirement needs an ID, acceptance criteria, a test method, a priority and a source."],"check":{"q":"Why can't a fairness target be met without the right data requirement?","o":["Fairness depends on the model being trained on diverse people","Fairness is only about code","Data has nothing to do with fairness"],"a":0,"e":"The categories depend on each other.","retry":{"q":"What does sensitivity measure?","o":["The share of real cases the model correctly catches","How fast the model runs","The model's file size"],"a":0,"e":"Specificity measures correctly cleared healthy cases."}},"scenario":{"title":"Rewrite the requirement","setting":"A draft specification says: 'The system shall be secure and accurate.'","steps":[{"prompt":"What is wrong with it?","choices":[{"t":"It has no numbers or test method, so nobody can prove it","s":2,"fb":"Right. Vague requirements cannot be tested."},{"t":"It is too long","s":0,"fb":"Length is not the problem."},{"t":"Nothing","s":0,"fb":"A tester could not pass or fail it."}]},{"prompt":"Which rewrite is best?","choices":[{"t":"Sensitivity of at least 90 per cent on a held-out test set, varying no more than 5 points across groups","s":2,"fb":"Right. Number, method and fairness."},{"t":"The system shall be very secure","s":0,"fb":"Still vague."},{"t":"The system shall use AI","s":0,"fb":"Not a measurable requirement."}]}]},"lab":{"type":"sort","title":"Which category?","prompt":"Place each requirement in its category.","buckets":["Data","Model","Security","Explainability","Fairness","Regulatory"],"items":[{"t":"At least 100,000 expert-labelled images","b":0},{"t":"Specificity of at least 85 per cent","b":1},{"t":"Multi-factor authentication for all users","b":2},{"t":"Every prediction shows a heat map","b":3},{"t":"Error rates within 3 points across groups","b":4},{"t":"Medical device clearance before use","b":5}],"explain":"Each category covers a different question the system must answer."}},{"title":"Case study: stakeholders and data","minutes":3,"slides":[{"scene":{"type":"graph","title":"Eye screening for 500,000 diabetic patients","nodes":[{"id":"gp","label":"GPs: speed and\nresponsibility","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"sphere","size":0.8,"ls":0.62},{"id":"oph","label":"Eye specialists:\naccuracy, fewer\nneedless referrals","p":[-2.6,1.5,0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"pat","label":"Patients: privacy\nand clear answers","p":[0.0,0.0,-0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62},{"id":"adm","label":"Administrators and payers:\ncost and value","p":[2.6,1.5,0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"cmp","label":"Compliance and IT\nsecurity: law and\nprotection","p":[5.2,0.0,-0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["gp"],["oph"],["pat"],["adm"],["cmp"],"all"]},"say":["The chapter's centrepiece is diabetic retinopathy screening. Diabetes can damage the back of the eye, and caught early it can usually be treated, but there are too few eye specialists. So a nurse or GP photographs the retina, the AI reads it, and patients with signs of disease are referred.","GPs care whether it slows a busy clinic and who is responsible if it is wrong.","Eye specialists, ophthalmologists, want accuracy without being flooded with needless referrals.","Patients care about privacy and clear communication.","Administrators and payers focus on cost and value.","Compliance and IT security need regulator approval, privacy law and strong protection. Conflicts between groups are normal and must be settled on purpose.","The data requirements are numbered so they can be traced: at least 100,000 expert-labelled images, minimum shares of older patients and minorities, and two specialists labelling each image, with their agreement measured by Cohen's kappa of at least 0.75. Early models trained on less diverse data were 12 per cent less sensitive for African American and Hispanic patients."]}],"keyPoint":"Eight stakeholder groups shape the requirements, and they often conflict. Precise, numbered data requirements drive fairness: under-represented groups get worse results.","plain":["A stakeholder is anyone affected by, or able to affect, the system.","Cohen's kappa measures how much two experts agree beyond chance: 1 is perfect, 0 is chance.","Even experts disagree, so labels need checking.","Missing groups in the data become missed disease in real patients."],"check":{"q":"Why did early models miss more disease in some groups?","o":["Those groups were under-represented in the training data","Their eyes are different","The camera was broken"],"a":0,"e":"The data requirement now sets minimum shares for these groups.","retry":{"q":"What does a Cohen's kappa of 1 mean?","o":["Perfect agreement between two labellers","No agreement","The model is perfect"],"a":0,"e":"0 means no better than chance."}},"scenario":{"title":"The 12 per cent gap","setting":"During development you find the model is 12 per cent less sensitive for two ethnic groups.","steps":[{"prompt":"What should you do?","choices":[{"t":"Pause, gather more diverse data and retest before release","s":2,"fb":"Right. Fairness is a core requirement."},{"t":"Release and fix later","s":0,"fb":"Missed disease harms real patients."},{"t":"Hide the result","s":0,"fb":"That is unethical and unlawful."}]},{"prompt":"The specialist wants maximum accuracy; the administrator wants low cost. Who wins?","choices":[{"t":"Settle it on purpose, with tiered targets and recorded reasons","s":2,"fb":"Right. Conflicts need explicit decisions."},{"t":"Whoever shouts loudest","s":0,"fb":"Not a method."},{"t":"Always the administrator","s":0,"fb":"Patient safety matters too."}]}]},"lab":{"type":"sort","title":"Whose concern?","prompt":"Match each concern to the stakeholder group.","buckets":["GPs","Eye specialists","Patients","Administrators and payers","Compliance and IT security"],"items":[{"t":"Will this slow my clinic down?","b":0},{"t":"Too many needless referrals","b":1},{"t":"Who sees my eye photos?","b":2},{"t":"Cost per screening","b":3},{"t":"Regulator approval and encryption","b":4}],"explain":"Every group sees the same system through different priorities."}},{"title":"Case study: model, security and fairness requirements","minutes":3,"slides":[{"scene":{"type":"graph","title":"Turning goals into testable requirements","nodes":[{"id":"mr1","label":"MR-1: sensitivity ≥ 90%,\nspecificity ≥ 85%","p":[-5.2,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"mr2","label":"MR-2: calibrated\nconfidence","p":[-2.6,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"mr6","label":"MR-6: heat maps\nshow why","p":[0.0,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"sr","label":"SR-1 to 4: MFA,\nencryption, logging,\nadversarial robustness","p":[2.6,1.5,0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62},{"id":"far","label":"FAR-1, 2, 5: equal\nperformance and\nquarterly audits","p":[5.2,0.0,-0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[],"steps":["all",["mr1"],["mr2"],["mr6"],["sr"],["far"]]},"say":["Part two of the case turns goals into specific, testable requirements.","MR-1 sets at least 90 per cent sensitivity and 85 per cent specificity, varying by no more than 5 per cent across groups.","MR-2 requires calibration: a model that says it is 95 per cent confident should be right about that often, so it is never confidently wrong.","MR-6 requires heat maps, coloured overlays showing which parts of the image drove the result. Grad-CAM is a common technique.","Security combines classic controls, multi-factor authentication, strong encryption and logging every access, with one AI-specific control: robustness against adversarial images, altered in ways a person cannot see but which change the answer.","Fairness requires equal performance across groups, error rates within three points so no group bears more mistakes, and quarterly bias audits. In the UK and EU, the MHRA, UK GDPR and the EU AI Act apply."]}],"keyPoint":"Every requirement gets a number and a validation method: performance, calibration, explanations, classic and AI-specific security, and ongoing fairness monitoring.","plain":["Calibration means the model's confidence is honest.","A heat map is like a highlighter showing where the AI looked.","An adversarial image is a tiny change invisible to people that fools the model.","Fairness is ongoing, not a one-off test."],"check":{"q":"A model scores 100 cases at 95 per cent confidence, but only 70 are correct. What is wrong?","o":["It is poorly calibrated","It is too fair","It is well calibrated"],"a":0,"e":"Calibration means confidence matches reality.","retry":{"q":"In the highlighter picture, what does a heat map show?","o":["Which parts of the image influenced the decision","The model's temperature","The patient's name"],"a":0,"e":"It lets clinicians spot when the AI looked in the wrong place."}},"scenario":{"title":"The invisible attack","setting":"A researcher shows that changing a few pixels, invisible to a person, flips the model from 'refer' to 'healthy'.","steps":[{"prompt":"Which requirement covers this?","choices":[{"t":"SR-4, adversarial robustness","s":2,"fb":"Right. It must be tested and measured."},{"t":"MR-6, heat maps","s":1,"fb":"Heat maps help spot it, but SR-4 is the requirement."},{"t":"None","s":0,"fb":"The chapter includes it explicitly."}]},{"prompt":"What real harm could this cause?","choices":[{"t":"Patients with disease sent home untreated","s":2,"fb":"Right. Missed referrals cost sight."},{"t":"Slower printing","s":0,"fb":"No."},{"t":"None, it is only a test","s":0,"fb":"Real attacks could do the same."}]}]},"lab":{"type":"sort","title":"Which requirement?","prompt":"Match each statement to its requirement code.","buckets":["MR-1","MR-2","MR-6","SR-4","FAR-5"],"items":[{"t":"At least 90 per cent sensitivity","b":0},{"t":"Confidence matches real accuracy","b":1},{"t":"A heat map with every result","b":2},{"t":"Resists altered images","b":3},{"t":"Quarterly bias audits","b":4}],"explain":"Numbered requirements can be traced from source to test."}},{"title":"Validation and traceability","minutes":3,"slides":[{"scene":{"type":"graph","title":"A traceability matrix follows each requirement end to end","nodes":[{"id":"src","label":"Source:\nstakeholder","p":[-5.2,0.0,-0.3],"c":"slate","shape":"sphere","size":0.8,"ls":0.62},{"id":"req","label":"Requirement\nID","p":[-3.12,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"dsg","label":"Design\nelement","p":[-1.04,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"code","label":"Code\nfile","p":[1.04,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"tst","label":"Test\ncase","p":[3.12,0.0,-0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"ev","label":"Evidence:\ntest report","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["src","req",2],["req","dsg",2],["dsg","code",2],["code","tst",2],["tst","ev",2]],"steps":["all",["src"],["req"],["dsg"],["code"],["tst"],["ev"]]},"say":["Writing requirements is only half the job. Measurable requirements give testers a clear pass or fail, give stakeholders something to agree on, and give regulators evidence.","A requirements traceability matrix, or RTM, starts with where each requirement came from.","Then the requirement itself, with its ID.","Then the design element that meets it.","The code that implements it.","The test that proves it, with a unique ID per test.","And the evidence, such as a test report. Any empty cell shows something not yet built or tested, and any change shows instantly what else is affected. Workshops, prototypes and consistency checks validated the case, with 98 per cent approval and only 3 per cent of requirements changed later."]}],"keyPoint":"Validate with workshops, prototypes, an RTM and consistency analysis. The RTM proves completeness, shows the impact of change and supports audits.","plain":["Vague 'secure' becomes a robustness target with a number.","An RTM is like a parcel tracking number for each requirement.","Empty cells are gaps you can see.","A low late-change rate shows the requirements work was done well."],"check":{"q":"What does an empty cell in a traceability matrix tell you?","o":["Something is not yet built or tested","The project is finished","Nothing"],"a":0,"e":"Gaps become visible instantly.","retry":{"q":"In the parcel picture, what does the RTM track?","o":["Each requirement from source to evidence","Delivery vans","Staff holidays"],"a":0,"e":"It follows each requirement through the project."}},"scenario":{"title":"99.9 per cent or 92?","setting":"A radiologist demands 99.9 per cent accuracy; the data scientist says 92 per cent is achievable with the data available.","steps":[{"prompt":"How do you resolve it?","choices":[{"t":"Agree tiered targets, minimum, target and stretch, and record the reason","s":2,"fb":"Right. Balance the ideal and the practical."},{"t":"Promise 99.9 per cent anyway","s":0,"fb":"An untestable promise."},{"t":"Drop the requirement","s":0,"fb":"Accuracy still matters."}]},{"prompt":"The same test ID is listed against two different requirements. Why is that a problem?","choices":[{"t":"Auditors cannot tell which evidence proves which requirement","s":2,"fb":"Right. Test IDs should be unique."},{"t":"It saves time","s":0,"fb":"It undermines traceability."},{"t":"No problem","s":0,"fb":"It confuses audits."}]}]},"lab":{"type":"order","title":"Read across the matrix","prompt":"Put the traceability chain in order, from left to right.","items":["Stakeholder source","Requirement ID","Design element","Code file","Test case","Evidence"],"explain":"Reading across a row shows the requirement's whole journey."}},{"title":"Trade-offs, documentation and lessons","minutes":3,"slides":[{"scene":{"type":"graph","title":"No perfect systems, only well-managed trade-offs","nodes":[{"id":"ea","label":"Explainability\nvs accuracy:\nadd heat maps","p":[-5.2,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"pa","label":"Privacy vs accuracy:\ntune epsilon","p":[-1.73,1.5,0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"ls","label":"Logging vs speed:\naccept ~2%","p":[1.73,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"rt","label":"Robustness vs\ntraining time:\ndecide by risk","p":[5.2,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ea"],["pa"],["ls"],["rt"],"all"]},"say":["Requirements pull against each other, so the chapter shows how to manage the trade-offs.","Explainability against accuracy: keep the accurate model and add explanations afterwards with heat maps.","Privacy against accuracy: differential privacy is controlled by epsilon, the privacy budget. Smaller means stronger privacy and possibly lower accuracy, so test different values.","Logging against speed: the case accepted about 2 per cent slower responses as the price of security.","Robustness against training time: decide by the risk. Record every trade-off and the reason.","Documentation includes the requirements specification, model cards, a short nutrition label for each model, user stories, and version control. The pilot cut unusable photos from 23 to 8 per cent with instant feedback. The lessons: involve stakeholders early, use tiered targets, engage regulators, treat fairness as core and validate in real-world pilots."]}],"keyPoint":"Manage trade-offs explicitly and write down why. Document with specifications, model cards, user stories and version control, and validate in real-world pilots.","plain":["A model card is like a nutrition label for AI.","User stories read: as a role, I want a feature, so that a benefit.","More security is not always better; match it to the risk.","Pilots reveal problems research settings never show."],"check":{"q":"What is a model card?","o":["A short standard summary of a model's use, performance and limits","A payment card","A graphics card"],"a":0,"e":"It works like a nutrition label for AI.","retry":{"q":"In differential privacy, a smaller epsilon means…","o":["Stronger privacy, possibly lower accuracy","Weaker privacy","No change"],"a":0,"e":"Teams test values to find the right balance."}},"scenario":{"title":"Quick and dirty","setting":"A competitor offers a 'quick and dirty' screening AI in three months. Your careful approach takes eighteen.","steps":[{"prompt":"How do you justify the slower approach?","choices":[{"t":"It protects patients, meets regulation and avoids costly failures","s":2,"fb":"Right. Evidence from the case shows why."},{"t":"Slower is always better","s":0,"fb":"Not a reason by itself."},{"t":"You cannot justify it","s":0,"fb":"Patient safety and law justify it."}]},{"prompt":"The pilot rejects 23 per cent of photos as unusable. What helped?","choices":[{"t":"Instant quality feedback to the person taking the photo","s":2,"fb":"Right. It cut rejections to 8 per cent."},{"t":"Accepting blurry photos","s":0,"fb":"That harms accuracy."},{"t":"Buying more servers","s":0,"fb":"The problem was photo quality."}]}]},"lab":{"type":"sort","title":"Which document?","prompt":"Match each item to the document it belongs in.","buckets":["Requirements specification","Model card","User story","Version control"],"items":[{"t":"All requirements grouped by category","b":0},{"t":"Performance by patient group and known limits","b":1},{"t":"As a GP, I want results in two minutes, so that clinics run on time","b":2},{"t":"A recorded history of every requirement change","b":3}],"explain":"Each document serves a different audience and purpose."}}],"test":[{"q":"What is a requirement?","o":["A clear statement of what a system must do or be","A line of code","A test report"],"a":0,"e":"","lesson":0},{"q":"Shift left means…","o":["Bringing security into the earliest stages","Testing at the end","Moving to the cloud"],"a":0,"e":"","lesson":1},{"q":"Model signing proves…","o":["The model file is unchanged since approval","The model is accurate","The model is fair"],"a":0,"e":"","lesson":1},{"q":"Drift is…","o":["The world changing so accuracy slowly falls","A network fault","A type of encryption"],"a":0,"e":"","lesson":1},{"q":"Defence in depth means…","o":["Several layers of protection","One very strong password","Deleting old data"],"a":0,"e":"","lesson":2},{"q":"Differential privacy adds…","o":["Measured random noise so individuals cannot be identified","More data","Faster training"],"a":0,"e":"","lesson":2},{"q":"Which category sets the amount and coverage of training data?","o":["Data requirements","Model requirements","Regulatory requirements"],"a":0,"e":"","lesson":3},{"q":"Specificity is…","o":["The share of healthy people correctly cleared","The share of sick people caught","Model speed"],"a":0,"e":"","lesson":3},{"q":"Why do requirements for AI need revising?","o":["Targets cannot be confirmed until a model is trained","Regulators insist on chaos","Code changes daily"],"a":0,"e":"","lesson":3},{"q":"Cohen's kappa measures…","o":["Agreement between two labellers beyond chance","Model accuracy","Image quality"],"a":0,"e":"","lesson":4},{"q":"Early models were less sensitive for some groups because…","o":["Those groups were under-represented in the data","The camera was faulty","Of a coding error"],"a":0,"e":"","lesson":4},{"q":"Calibration means…","o":["Confidence matches real accuracy","The model runs fast","The images are bright"],"a":0,"e":"","lesson":5},{"q":"SR-4 in the case covers…","o":["Robustness against adversarial images","Password length","Report formatting"],"a":0,"e":"","lesson":5},{"q":"A traceability matrix links each requirement to…","o":["Its source, design, code, tests and evidence","Its author's salary","Nothing"],"a":0,"e":"","lesson":6},{"q":"Smaller epsilon in differential privacy gives…","o":["Stronger privacy","Weaker privacy","Faster training"],"a":0,"e":"","lesson":7},{"q":"A model card is…","o":["A short summary of a model's use, performance and limits","A payment card","A test case"],"a":0,"e":"","lesson":7}]};
