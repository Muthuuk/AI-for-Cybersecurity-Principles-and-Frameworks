/* Chapter 14: Secure Coding Best Practices for AI (Guide to AI for Cybersecurity) */
const CH = {"id":"ch14","num":"14","title":"Secure Coding Best Practices for AI","summary":"Everyday secure coding habits for AI systems: frameworks from NCSC, NIST and Microsoft, the AI development life cycle, input validation, data and supply chain protection, safe model loading, adversarial defences, privacy-preserving training, secure deployment, monitoring and incident response.","outcomes":["Explain how AI adds data and model risks to traditional software risks","Combine the NCSC, NIST AI RMF and Microsoft SDL frameworks","Map security concerns onto each phase of the AI development life cycle","Apply secure coding, data protection and safe model loading practices","Compare adversarial and privacy-preserving defences and their costs","Design secure deployment, monitoring and AI incident response"],"starter":[{"q":"Do traditional secure coding rules still apply to AI systems?","o":["No","Yes, plus new AI-specific ones"],"a":1,"e":"AI adds risks; it does not remove old ones."},{"q":"Is it safe to load any downloaded model file?","o":["Yes","No, some formats can run hidden code"],"a":1,"e":"Lesson 5 explains safe loading."},{"q":"Can a model reveal whether a person's data was used to train it?","o":["No","Yes, through membership inference"],"a":1,"e":"Lesson 6 covers this attack."}],"lessons":[{"title":"Why AI needs its own security habits","minutes":3,"slides":[{"scene":{"type":"graph","title":"Every old risk, plus new ones from data and models","nodes":[{"id":"old","label":"Traditional risks:\ninjection, weak access,\nleaked secrets","p":[-5.2,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"po","label":"Poisoned\ntraining data","p":[-3.12,1.5,0.3],"c":"red","shape":"cyl","size":0.8,"ls":0.62},{"id":"ev","label":"Inputs crafted\nto fool the model","p":[-1.04,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"th","label":"Model theft\nthrough queries","p":[1.04,1.5,0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"pv","label":"Private data\nleaking from the model","p":[3.12,0.0,-0.3],"c":"pink","shape":"shield","size":0.8,"ls":0.62},{"id":"dr","label":"Drift over\ntime","p":[5.2,1.5,0.3],"c":"cyan","shape":"torus","size":0.8,"ls":0.62}],"links":[],"steps":["all",["old"],["po"],["ev"],["th"],["pv"],["dr"]]},"say":["Welcome to Chapter 14, Secure Coding Best Practices for AI, and I'm Sam, your tutor. Our running example is an AI system that helps doctors read medical images.","AI systems keep every traditional risk: injection, where commands are slipped into ordinary input, weak access control, vulnerable libraries and passwords left in code.","They add new ones. Whoever controls the training data can shape the model.","Inputs that look normal to a person can fool it.","Someone who asks enough questions can copy it.","It can reveal private details about people in its training data.","And drift, where the world changes so the training data no longer matches reality, can quietly make an accurate model worse. In healthcare, finance and transport, failures cost money, privacy and safety."]}],"keyPoint":"AI systems inherit every traditional software risk and add data and model risks. Secure coding for AI covers both.","plain":["Injection is typing commands where data should go.","Whoever controls the data can shape the model.","Drift is the world moving on while the model stands still.","A security failure in healthcare can become a safety incident."],"check":{"q":"Which is an AI-specific risk?","o":["Poisoned training data","A weak password","An unpatched server"],"a":0,"e":"Data shapes model behaviour.","retry":{"q":"What is drift?","o":["The world changing so the model slowly gets worse","A network fault","A coding style"],"a":0,"e":"Training data stops matching reality."}},"scenario":{"title":"The imaging system","setting":"Your team builds an AI that helps doctors read medical images.","steps":[{"prompt":"Which risk could cause direct patient harm?","choices":[{"t":"Poisoned data or crafted inputs causing missed disease","s":2,"fb":"Right. AI risks become safety risks."},{"t":"Slow page loading","s":1,"fb":"Annoying, but less harmful."},{"t":"Logo colour","s":0,"fb":"No."}]},{"prompt":"Do traditional secure coding rules still apply?","choices":[{"t":"Yes, all of them, plus AI-specific ones","s":2,"fb":"Right. AI adds, it does not replace."},{"t":"No, AI is different","s":0,"fb":"Old risks remain."},{"t":"Only for the website","s":0,"fb":"They apply throughout."}]}]},"lab":{"type":"sort","title":"Old or new risk?","prompt":"Is each risk traditional or AI-specific?","buckets":["Traditional","AI-specific"],"items":[{"t":"SQL injection in a search box","b":0},{"t":"Training data poisoned by an attacker","b":1},{"t":"Copying a model through thousands of queries","b":1},{"t":"Password stored in source code","b":0},{"t":"Revealing whether a patient's record trained the model","b":1},{"t":"Vulnerable third-party library","b":0}],"explain":"Secure AI coding has to cover both columns."}},{"title":"Three frameworks working together","minutes":4,"slides":[{"scene":{"type":"graph","title":"NCSC guidelines: four tracks","nodes":[{"id":"de","label":"Secure\ndesign","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"dv","label":"Secure\ndevelopment","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"dp","label":"Secure\ndeployment","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"op","label":"Secure\noperation","p":[5.2,1.5,0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[["de","dv",2],["dv","dp",2],["dp","op",2]],"steps":["all",["de"],["dv"],["dp"],["op"]]},"say":["Three frameworks fit together. The UK NCSC's 2023 Guidelines for Secure AI System Development tell builders what to do at each stage.","Secure design: model AI-specific threats and set security requirements early.","Secure development: vet training data sources, scan dependencies and build secure data pipelines.","Secure deployment: harden infrastructure and protect APIs.","Secure operation: watch for drift and attacks, keep incident response ready and apply updates."]},{"scene":{"type":"graph","title":"NIST AI RMF: four functions","nodes":[{"id":"gv","label":"Govern: who is in\ncharge, which policies","p":[-5.2,0.0,-0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"mp","label":"Map: what could\ngo wrong?","p":[-1.73,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ms","label":"Measure: how big\nare the risks?","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"mg","label":"Manage: accept, reduce,\ntransfer or avoid","p":[5.2,1.5,0.3],"c":"green","shape":"box","size":0.8,"ls":0.62}],"links":[["gv","mp",1],["gv","ms",1],["gv","mg",1],["mp","ms",2],["ms","mg",2]],"steps":["all",["gv"],["mp"],["ms"],["mg"]]},"say":["The US NIST AI Risk Management Framework helps leaders decide which risks matter.","Govern runs across everything: who is in charge and which policies apply.","Map: what is the system, who does it affect, and what could go wrong?","Measure: how big are those risks, using numbers where possible?","Manage: for each risk, accept it, reduce it, transfer it by contract or insurance, or avoid it altogether. Microsoft's Security Development Lifecycle adds quality gates, points a project cannot pass until security checks succeed. Builders, leaders and engineers are all covered."]}],"keyPoint":"NCSC guides builders through design, development, deployment and operation; NIST AI RMF helps leaders govern, map, measure and manage risk; Microsoft SDL gives engineers quality gates.","plain":["The frameworks are complementary, not rivals.","Govern runs across the other three NIST functions.","A quality gate is a checkpoint you cannot skip.","Transferring a risk means contract or insurance."],"check":{"q":"Which NIST function runs across all the others?","o":["Govern","Map","Measure"],"a":0,"e":"Leadership and policy frame everything.","retry":{"q":"What is a quality gate in the Microsoft SDL?","o":["A point a project cannot pass until security checks succeed","A physical door","A code formatter"],"a":0,"e":"Gates enforce security in everyday engineering."}},"scenario":{"title":"Avoid, reduce or accept?","setting":"For the imaging system, one feature would let the AI make final diagnoses without a doctor.","steps":[{"prompt":"Which risk response fits best?","choices":[{"t":"Avoid it: keep a doctor in the loop","s":2,"fb":"Right. Some risks are best avoided entirely."},{"t":"Accept it","s":0,"fb":"Patient safety is too important."},{"t":"Transfer it to an insurer","s":1,"fb":"Insurance does not prevent harm."}]},{"prompt":"Which framework helps engineers day to day?","choices":[{"t":"Microsoft SDL with its quality gates","s":2,"fb":"Right. Practical checkpoints."},{"t":"NIST Govern only","s":1,"fb":"Important for leaders."},{"t":"None","s":0,"fb":"The SDL does exactly this."}]}]},"lab":{"type":"sort","title":"Which framework?","prompt":"Match each item to its framework.","buckets":["NCSC guidelines","NIST AI RMF","Microsoft SDL"],"items":[{"t":"Four tracks: design, development, deployment, operation","b":0},{"t":"Govern, Map, Measure, Manage","b":1},{"t":"Quality gates from requirements to response","b":2},{"t":"Accept, reduce, transfer or avoid each risk","b":1},{"t":"Vet training data sources during development","b":0}],"explain":"Builders, leaders and engineers each have a framework."}},{"title":"The AI development life cycle","minutes":3,"slides":[{"scene":{"type":"graph","title":"AI adds data-centred phases, each with its own risk","nodes":[{"id":"pd","label":"Problem definition:\nunclear provenance","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"dc","label":"Data collection:\npoisoning, consent","p":[-3.12,1.5,0.3],"c":"red","shape":"cyl","size":0.8,"ls":0.62},{"id":"dpr","label":"Data preparation:\nlabel tampering, leaks","p":[-1.04,0.0,-0.3],"c":"pink","shape":"cyl","size":0.8,"ls":0.62},{"id":"tr","label":"Training:\nbackdoors, untrusted\npre-trained models","p":[1.04,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"ev","label":"Evaluation:\nadversarial examples","p":[3.12,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"dpl","label":"Deployment and\nmonitoring: theft, drift","p":[5.2,1.5,0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[["pd","dc",2],["dc","dpr",2],["dpr","tr",2],["tr","ev",2],["ev","dpl",2]],"steps":["all",["pd"],["dc"],["dpr"],["tr"],["ev"],["dpl"]]},"say":["A traditional life cycle runs from requirements to maintenance. The AI life cycle adds phases for data, because behaviour is learned from it.","Problem definition: unclear data provenance, meaning where data came from and who changed it, and unclear intended use.","Data collection, a new phase: poisoning, consent and licensing.","Data preparation, also new: label tampering and personal data leakage.","Training: backdoors, hidden behaviours such as treating any image with a small sticker as healthy, and untrusted pre-trained models.","Evaluation: test for adversarial examples and privacy leakage, not just accuracy.","Deployment and monitoring: model theft, insecure APIs, supply chain risk and drift. Security testing must cover data and models, not just code."]}],"keyPoint":"The AI life cycle adds data collection and preparation. Each phase has its own risk, so test data and models as well as code, and let evaluation block a release.","plain":["Provenance is a dataset's documented history.","A backdoor is a hidden trigger planted in a model.","Evaluation should include attack testing, not only accuracy.","Monitoring must watch for drift and copying."],"check":{"q":"Which phases does the AI life cycle add?","o":["Data collection and data preparation","Coding and testing","Marketing and sales"],"a":0,"e":"Behaviour comes from data, so data gets its own phases.","retry":{"q":"What is provenance?","o":["The documented origin and history of data","A file format","A type of encryption"],"a":0,"e":"Without it you cannot tell if data was tampered with."}},"scenario":{"title":"The release decision","setting":"Evaluation shows the imaging model is accurate but easily fooled by tiny image changes.","steps":[{"prompt":"Should evaluation be able to block the release?","choices":[{"t":"Yes, like any failed security test","s":2,"fb":"Right. Robustness is a release criterion."},{"t":"No, accuracy is all that matters","s":0,"fb":"Fragility is a safety risk."},{"t":"Only if the press notices","s":0,"fb":"Decide before release."}]},{"prompt":"Which phase should have caught a backdoor in a downloaded model?","choices":[{"t":"Training, by vetting pre-trained models","s":2,"fb":"Right. Untrusted models are a training-phase risk."},{"t":"Marketing","s":0,"fb":"No."},{"t":"Never","s":0,"fb":"It can be checked."}]}]},"lab":{"type":"sort","title":"Match phase and risk","prompt":"Place each risk in the AI life cycle phase where it mainly arises.","buckets":["Data collection","Data preparation","Training","Evaluation","Deployment"],"items":[{"t":"Data gathered without consent","b":0},{"t":"Labels secretly altered","b":1},{"t":"Backdoor in a downloaded model","b":2},{"t":"Model easily fooled by tiny changes","b":3},{"t":"Model copied through the public API","b":4}],"explain":"Every phase needs its own controls."}},{"title":"Secure coding practices for AI","minutes":4,"slides":[{"scene":{"type":"graph","title":"A daily checklist","nodes":[{"id":"iv","label":"Validate every\ninput","p":[0.0,3.2,0],"c":"cyan","shape":"shield","size":0.8,"ls":0.6},{"id":"pd","label":"Protect\nthe data","p":[3.64,1.9,0],"c":"violet","shape":"cyl","size":0.8,"ls":0.6},{"id":"lm","label":"Load models\nsafely","p":[3.64,-0.7,0],"c":"red","shape":"ico","size":0.8,"ls":0.6},{"id":"dm","label":"Manage\ndependencies","p":[0.0,-2.0,0],"c":"amber","shape":"torus","size":0.8,"ls":0.6},{"id":"eh","label":"Handle errors\nquietly","p":[-3.64,-0.7,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"lg","label":"Log without\nleaking","p":[-3.64,1.9,0],"c":"green","shape":"slab","size":0.8,"ls":0.6}],"links":[],"steps":["all",["iv"],["pd"],["lm"],["dm"],["eh"],["lg"]],"orbit":0.4},"say":["The chapter gives a practical checklist for anyone writing AI application code.","Validate every input: shape, type, range and plausibility. Reject 'not a number' and infinite values, which can crash a model or distort its answer.","Protect the data: encrypt at rest and in transit, track provenance and limit access.","Load models safely: avoid untrusted pickle files, use safer formats and verify hashes or signatures.","Manage dependencies: pin versions, scan for known flaws and keep a software bill of materials.","Handle errors quietly: log details privately and show users only a generic message, so attackers cannot probe step by step.","Log security events without leaking raw personal data, secrets or full inputs. Remember, input validation is only the first layer: a crafted adversarial example stays within normal ranges and will pass."]}],"keyPoint":"Validate inputs, protect data, load models safely, manage dependencies, give generic errors and log without leaking. Validation alone will not stop adversarial examples.","plain":["Detailed error messages are a map for attackers.","NaN means 'not a number'.","Logs must not become a store of personal data.","Layer defences beyond validation."],"check":{"q":"Why return the same generic error for every validation failure?","o":["So attackers cannot learn which check failed","To save bandwidth","Because users prefer it"],"a":0,"e":"Specific errors help attackers probe.","retry":{"q":"Will input range checks stop an adversarial example?","o":["Usually not, it stays within normal ranges","Always","Only on weekends"],"a":0,"e":"That is why more layers are needed."}},"scenario":{"title":"The helpful error","setting":"The API returns: 'Rejected: pixel 412 exceeds expected range 0–255'.","steps":[{"prompt":"What is the problem?","choices":[{"t":"It tells attackers exactly which check failed","s":2,"fb":"Right. Log it privately, show a generic message."},{"t":"It is too short","s":0,"fb":"Length is not the issue."},{"t":"Nothing","s":0,"fb":"It aids probing."}]},{"prompt":"What should the logs record about a rejected request?","choices":[{"t":"The event, time and reason, but not raw personal data","s":2,"fb":"Right. Log without leaking."},{"t":"The full medical image","s":0,"fb":"That stores personal data."},{"t":"Nothing","s":1,"fb":"You lose visibility."}]}]},"lab":{"type":"spot","title":"Spot the unsafe practices","prompt":"Pick out the unsafe practices in this model-serving code review.","parts":[{"lbl":"Inputs","t":"Checks shape, type and range, and rejects NaN values","bad":false,"why":"Good input validation."},{"lbl":"Model","t":"Loads model.pkl downloaded from a public forum with pickle.load","bad":true,"why":"Pickle can run hidden code on load; use safe formats and verify hashes."},{"lbl":"Secrets","t":"API key written directly in the source file","bad":true,"why":"Secrets belong in a vault, not in code."},{"lbl":"Errors","t":"Shows users a generic 'request could not be processed' message","bad":false,"why":"Generic errors deny attackers information."},{"lbl":"Logging","t":"Logs the full patient image with every request","bad":true,"why":"Logs must not store raw personal data."},{"lbl":"Dependencies","t":"Library versions pinned and scanned weekly","bad":false,"why":"Good dependency management."}],"explain":"Unsafe loading, hard-coded secrets and leaky logs are common, avoidable mistakes."}},{"title":"Data and supply chain security","minutes":4,"slides":[{"scene":{"type":"graph","title":"Five layers that protect data, and so the model","nodes":[{"id":"pv","label":"Provenance\ntracking","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"vl","label":"Data\nvalidation","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"en","label":"Encryption: AES-256\nat rest, TLS 1.3\nin transit","p":[0.0,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"ac","label":"Role-based access,\nleast privilege","p":[2.6,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"pd","label":"Poisoning\ndetection","p":[5.2,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[["pv","vl",2],["vl","en",2],["en","ac",2],["ac","pd",2]],"steps":["all",["pv"],["vl"],["en"],["ac"],["pd"]]},"say":["A model is only as trustworthy as its data, so protecting data is protecting the model.","Provenance tracking records each dataset's history from source to training run.","Data validation checks structure, statistics and outliers, catching suspicious records early.","Encryption scrambles data so only authorised systems can read it: AES-256 for stored data, TLS 1.3 for data in transit.","Role-based access with least privilege, so one stolen account cannot alter everything.","Poisoning detection watches for sudden shifts and clusters of unusual records. With hashes of each dataset version, you can trace problems back to their source."]},{"scene":{"type":"graph","title":"Loading a model safely: fail closed","nodes":[{"id":"dl","label":"Downloaded\nmodel file","p":[-5.2,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"fm","label":"Safe format?\n(safetensors, ONNX)","p":[-2.6,1.5,0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"hs","label":"Hash or signature\nmatches registry?","p":[0.0,0.0,-0.3],"c":"violet","shape":"shield","size":0.8,"ls":0.62},{"id":"ld","label":"Load the\nmodel","p":[2.6,1.5,0.3],"c":"green","shape":"ico","size":0.8,"ls":0.62},{"id":"rf","label":"Refuse to load\nif any check fails","p":[5.2,0.0,-0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["dl","fm",2],["fm","hs",2],["hs","ld",2],["ld","rf",2]],"steps":["all",["dl"],["fm"],["hs"],["ld"],["rf"]]},"say":["Many teams download pre-trained models from public hubs.","Python's pickle format can run hidden code the moment a file is opened. Prefer formats that store only numbers, such as safetensors or ONNX.","Check the file's SHA-256 hash, a digital fingerprint, or better a digital signature, against an approved registry.","Only then load it.","If any check fails, refuse to load: fail closed.","Also pin library versions, scan them with tools such as pip-audit, and keep a software bill of materials, plus a model bill of materials recording each model's origin, data and dependencies."]}],"keyPoint":"Protect data with provenance, validation, encryption, access control and poisoning detection. Load models only in safe formats with verified hashes or signatures, and fail closed.","plain":["Whoever controls the training data shapes the model.","A hash changes completely if one byte changes.","A signature also proves who produced the file.","Fail closed: when in doubt, stop."],"check":{"q":"Why is Python's pickle format risky for downloaded models?","o":["It can run hidden code when the file is opened","It is too slow","It cannot store numbers"],"a":0,"e":"Prefer safetensors or ONNX.","retry":{"q":"What does failing closed mean?","o":["Refusing to continue if any check fails","Closing the laptop","Always continuing"],"a":0,"e":"Safety over convenience."}},"scenario":{"title":"The slow poison","setting":"An attacker adds a few bad records to your training data each week.","steps":[{"prompt":"Which control helps detect it?","choices":[{"t":"Statistical poisoning detection plus provenance and dataset hashes","s":2,"fb":"Right. Track changes and spot drift in the data."},{"t":"A faster GPU","s":0,"fb":"Speed does not detect poison."},{"t":"Bigger datasets","s":1,"fb":"Dilutes, but does not detect."}]},{"prompt":"A library your model uses is reported as backdoored. What helps you respond fastest?","choices":[{"t":"Your software and model bills of materials","s":2,"fb":"Right. Find every affected system."},{"t":"Asking around the office","s":1,"fb":"Slow and unreliable."},{"t":"Waiting for symptoms","s":0,"fb":"Too late."}]}]},"lab":{"type":"order","title":"Load a model safely","prompt":"Put the safe loading steps in order.","items":["Receive the model file","Check it is a safe format","Verify the hash or signature against the registry","Load the model, or refuse if any check fails"],"explain":"Verify first, load second."}},{"title":"Adversarial attacks and defences","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four families of defence, each with a cost","nodes":[{"id":"at","label":"Adversarial training:\nresists attacks, may\nlose some accuracy","p":[-5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"ip","label":"Input preprocessing:\nwashes out changes,\nblurs detail","p":[-1.73,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"es","label":"Ensembles:\nharder to fool,\ncostlier to run","p":[1.73,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"dt","label":"Detection: rejects\nsuspicious inputs,\nadaptive attacks slip by","p":[5.2,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["at"],["ip"],["es"],["dt"]]},"say":["Adversarial machine learning studies attacks on models: poisoning training data, evasion with tiny changes that fool a working model, extraction by copying through queries, and inversion and membership inference, which pull information about training data back out. Research methods for making evasion examples include FGSM, PGD, Carlini and Wagner, and DeepFool. In healthcare, revealing membership alone can reveal a condition.","Adversarial training shows the model attack examples during training so it learns to resist them, usually at some cost to normal accuracy.","Input preprocessing, such as compressing images, can wash out small changes but also blurs useful detail.","Ensembles of different models are harder to fool together but cost more to run.","Detectors reject suspicious inputs, but an attacker who knows about the detector can often design inputs that slip past, called adaptive attacks. There is no perfect defence: layer them, and test against attackers who know what you have in place."]}],"keyPoint":"Poisoning, evasion, extraction, inversion and membership inference threaten models. Adversarial training, preprocessing, ensembles and detection each help at a cost; layer them and test adaptively.","plain":["An adversarial example is an optical illusion for a model.","Membership alone can reveal sensitive facts.","Adaptive attackers know your defences.","AI-assisted beats AI-controlled in safety-critical settings."],"check":{"q":"What is the usual cost of adversarial training?","o":["Some loss of accuracy on normal inputs","Higher licence fees","Slower networks"],"a":0,"e":"Robustness and accuracy trade off.","retry":{"q":"Why test defences against adaptive attackers?","o":["Real attackers learn your defences and work around them","Adaptive attackers do not exist","It is cheaper"],"a":0,"e":"A defence that fails when known gives false comfort."}},"scenario":{"title":"Safety-critical AI","setting":"Adversarial examples cannot be fully eliminated. Should the imaging AI be deployed?","steps":[{"prompt":"What is the wisest design?","choices":[{"t":"AI-assisted, with doctor review, layered defences and monitoring","s":2,"fb":"Right. Assist, not control."},{"t":"Fully automated diagnosis","s":0,"fb":"Too risky given known weaknesses."},{"t":"Never use AI in healthcare","s":1,"fb":"Over-cautious; careful design helps patients."}]},{"prompt":"Which defence would you add first for the imaging system?","choices":[{"t":"Adversarial training, accepting a small accuracy cost","s":2,"fb":"Right, then layer others."},{"t":"Delete the model","s":0,"fb":"Loses all benefit."},{"t":"Rely on detection only","s":1,"fb":"Adaptive attacks may slip past."}]}]},"lab":{"type":"sort","title":"Name the attack","prompt":"Match each scenario to its attack type.","buckets":["Poisoning","Evasion","Extraction","Membership inference"],"items":[{"t":"Bad records slipped into training data","b":0},{"t":"A sticker makes the model misread a scan","b":1},{"t":"Thousands of queries used to build a copy","b":2},{"t":"Testing whether a patient's record trained the model","b":3}],"explain":"Knowing the attack points to the right defence."}},{"title":"Privacy-preserving AI","minutes":3,"slides":[{"scene":{"type":"graph","title":"Differentially private training (DP-SGD)","nodes":[{"id":"cl","label":"Clip each example's\ninfluence","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ns","label":"Add calibrated\nGaussian noise","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ac","label":"Account for the\nprivacy budget (ε)","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"fl","label":"Federated learning:\ntrain where data lives","p":[5.2,1.5,0.3],"c":"green","shape":"cyl","size":0.8,"ls":0.62}],"links":[["cl","ns",2],["ns","ac",2]],"steps":["all",["cl"],["ns"],["ac"],["fl"]]},"say":["Differential privacy promises the model behaves almost the same with or without any one person's record, by adding carefully measured noise during training. Normal training, stochastic gradient descent, learns in small steps from small batches. DP-SGD changes three things.","Clipping: no single example can push the model too far.","Noise: individual examples are hidden in the crowd.","Accounting: a running total of privacy spent, the privacy budget, controlled by epsilon. Smaller epsilon means stronger privacy and usually lower accuracy. A common rule of thumb: below 1 strong, 1 to 10 moderate, above 10 weak. The Opacus library handles the accounting for PyTorch.","Federated learning sends the model to each data holder, such as each hospital, and brings back only updates. Updates can still leak information, so the two are often combined. Neither removes the need for governance and a lawful basis."]}],"keyPoint":"DP-SGD clips, adds noise and tracks a privacy budget; federated learning keeps data at home. Combine them, and keep governance and a lawful basis.","plain":["Differential privacy is hiding in a crowd.","Epsilon is the privacy dial.","The rule-of-thumb bands are a guide, not a standard.","Federated updates can still leak, so add DP."],"check":{"q":"What does clipping do in DP-SGD?","o":["Stops any single example pushing the model too far","Shortens file names","Speeds up training"],"a":0,"e":"It bounds each example's influence.","retry":{"q":"Three hospitals cannot share records. Which technique fits first?","o":["Federated learning, ideally with differential privacy","Emailing the data","Publishing it openly"],"a":0,"e":"Data stays in each hospital."}},"scenario":{"title":"Choosing epsilon","setting":"Your data scientists want epsilon 15 for accuracy; the privacy officer wants 0.5.","steps":[{"prompt":"Who should decide?","choices":[{"t":"Leadership, informed by both, weighing patient privacy against clinical accuracy","s":2,"fb":"Right. It is a governance decision."},{"t":"The data scientists alone","s":0,"fb":"Privacy is not only technical."},{"t":"Pick the average","s":1,"fb":"Arbitrary without reasoning."}]},{"prompt":"What does epsilon 15 suggest under the rule of thumb?","choices":[{"t":"Weak privacy","s":2,"fb":"Right. Above 10 is weak."},{"t":"Strong privacy","s":0,"fb":"The opposite."},{"t":"No privacy at all","s":1,"fb":"Some, but weak."}]}]},"lab":{"type":"sort","title":"Stronger privacy or better accuracy?","prompt":"Which does each choice favour?","buckets":["Stronger privacy","Better accuracy"],"items":[{"t":"Epsilon of 0.5","b":0},{"t":"Epsilon of 12","b":1},{"t":"More noise added","b":0},{"t":"Less clipping","b":1}],"explain":"Every private training run is a deliberate trade-off."}},{"title":"Deployment, monitoring and incident response","minutes":4,"slides":[{"scene":{"type":"graph","title":"Three layers around a live model","nodes":[{"id":"inf","label":"Infrastructure:\nsegmentation, scanning,\npatching","p":[-5.2,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"app","label":"Application: OAuth 2.0,\nrate limits, output\nfiltering","p":[0.0,1.5,0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"sec","label":"Data and secrets:\nencryption, vault,\ntested backups","p":[5.2,0.0,-0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62}],"links":[["inf","app",2],["app","sec",2]],"steps":["all",["inf"],["app"],["sec"]]},"say":["A live model sits inside three layers.","Infrastructure: network segmentation, so a break-in cannot spread, container scanning, intrusion detection and patching.","Application: API authentication such as OAuth 2.0, input validation, per-client rate limits and output filtering, so the model does not reveal exact confidence scores that help attackers copy or probe it.","Data and secrets: encryption, secrets in a vault and rotated regularly, access logging, and encrypted backups that are tested. Once live, monitor performance, security events, data drift, using measures such as the population stability index, and bursts of near-identical queries that suggest copying."]},{"scene":{"type":"graph","title":"Incident response, adapted for AI","nodes":[{"id":"dt","label":"Detect: poisoning,\nextraction, drift","p":[-5.2,0.0,-0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"ct","label":"Contain: roll back\nto a known-good model","p":[-2.6,1.5,0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62},{"id":"iv","label":"Investigate data,\nmodel files, dependencies","p":[0.0,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"cm","label":"Communicate, including\nthe ICO if required","p":[2.6,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"rc","label":"Recover: retrain,\nrevalidate, update\nthreat model","p":[5.2,0.0,-0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[["dt","ct",2],["ct","iv",2],["iv","cm",2],["cm","rc",2]],"steps":["all",["dt"],["ct"],["iv"],["cm"],["rc"]]},"say":["AI incidents follow the usual cycle, with extra capabilities.","Detect poisoning, extraction patterns, drift or systematic errors.","Contain by rolling back to a known-good model version, only possible if signed, versioned copies were kept, and restrict the affected API.","Investigate the training data, model files and dependencies, not just server logs.","Communicate with users and, where personal data is involved, regulators; in the UK that may be the Information Commissioner's Office.","Recover: retrain, revalidate, fix the root cause and update the threat model."]}],"keyPoint":"Protect live models in three layers, monitor performance, security, drift and adversarial activity, and adapt incident response with fast rollback and data and model forensics.","plain":["Rolling back a model is the AI version of unplugging an infected computer.","Exact confidence scores help attackers.","PSI measures how much a distribution has shifted.","Forensics now includes data and model files."],"check":{"q":"What is the AI equivalent of unplugging an infected computer?","o":["Rolling back to a known-good model version","Deleting all data","Rebooting the router"],"a":0,"e":"Keep signed, versioned models ready.","retry":{"q":"Why filter outputs such as exact confidence scores?","o":["They help attackers copy or probe the model","They are too long","Users dislike numbers"],"a":0,"e":"Return only what callers need."}},"scenario":{"title":"The one-hour rollback","setting":"The imaging model starts misclassifying a type of scan after an update.","steps":[{"prompt":"What must be prepared in advance to roll back within an hour?","choices":[{"t":"Signed, versioned copies of earlier models and their data","s":2,"fb":"Right. No versions, no rollback."},{"t":"A new vendor","s":0,"fb":"Too slow."},{"t":"Nothing","s":0,"fb":"Rollback needs preparation."}]},{"prompt":"Patient data may have leaked. Who might need to be told?","choices":[{"t":"Affected users and, where required, the ICO","s":2,"fb":"Right. UK GDPR may require notification."},{"t":"Nobody","s":0,"fb":"Notification may be a legal duty."},{"t":"Only the press","s":0,"fb":"Regulators and users come first."}]}]},"lab":{"type":"order","title":"Respond to an AI incident","prompt":"Put the incident response steps in order.","items":["Detect","Contain by rolling back","Investigate data, models and dependencies","Communicate","Recover and update the threat model"],"explain":"Preparation, especially versioned models, makes every step faster."}}],"test":[{"q":"Which is an AI-specific risk?","o":["Model theft through queries","Weak passwords","Unpatched servers"],"a":0,"e":"","lesson":0},{"q":"The NCSC guidelines have four tracks:","o":["Design, development, deployment, operation","Plan, buy, sell, retire","Code, test, ship, forget"],"a":0,"e":"","lesson":1},{"q":"NIST AI RMF's four functions are…","o":["Govern, Map, Measure, Manage","Plan, Do, Check, Act","Detect, Deny, Delay, Destroy"],"a":0,"e":"","lesson":1},{"q":"Which AI life cycle phase is new compared with traditional software?","o":["Data collection","Coding","Testing"],"a":0,"e":"","lesson":2},{"q":"A backdoor is…","o":["A hidden trigger planted in a model","A fire exit","A firewall rule"],"a":0,"e":"","lesson":2},{"q":"Error messages to users should be…","o":["Generic","Highly detailed","Omitted"],"a":0,"e":"","lesson":3},{"q":"Logs should never contain…","o":["Raw personal data or secrets","Timestamps","Event types"],"a":0,"e":"","lesson":3},{"q":"Safer model formats include…","o":["safetensors and ONNX","Untrusted pickle","Executable scripts"],"a":0,"e":"","lesson":4},{"q":"A SHA-256 hash is…","o":["A digital fingerprint of a file","A password","A model type"],"a":0,"e":"","lesson":4},{"q":"Least privilege means…","o":["Each person and service gets only the access it needs","Everyone is an administrator","No access for anyone"],"a":0,"e":"","lesson":4},{"q":"Evasion attacks…","o":["Fool a working model with small input changes","Copy a model","Corrupt training data"],"a":0,"e":"","lesson":5},{"q":"Adaptive attacks…","o":["Work around defences the attacker knows about","Never happen","Only target networks"],"a":0,"e":"","lesson":5},{"q":"In DP-SGD, smaller epsilon means…","o":["Stronger privacy","Weaker privacy","Faster training"],"a":0,"e":"","lesson":6},{"q":"Federated learning shares…","o":["Model updates, not raw data","All raw data","Passwords"],"a":0,"e":"","lesson":6},{"q":"Bursts of near-identical queries may signal…","o":["Model extraction","Normal use","A backup"],"a":0,"e":"","lesson":7},{"q":"Containing an AI incident often means…","o":["Rolling back to a known-good model","Deleting the logs","Ignoring it"],"a":0,"e":"","lesson":7}]};
