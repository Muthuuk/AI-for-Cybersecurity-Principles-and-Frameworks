/* Chapter 15: Automated Incident Response and Orchestration (Guide to AI for Cybersecurity) */
const CH = {"id":"ch15","num":"15","title":"Automated Incident Response and Orchestration","summary":"How AI and orchestration help security teams respond faster: the alert overload problem, where automation adds value in the response lifecycle, ML detection, playbooks and reinforcement learning, risk scoring, SOAR platforms, real cases and phasing automation safely.","outcomes":["Explain why manual incident response no longer scales","Identify where automation adds most value across the response lifecycle","Compare supervised, unsupervised and deep learning for detection","Design playbooks and judge when to use decision trees or reinforcement learning","Prioritise incidents with ML risk scoring and evaluate SOAR platforms","Plan phased automation with human oversight for high-impact actions"],"starter":[{"q":"Are most security alerts real attacks?","o":["Yes","No, most are false alarms"],"a":1,"e":"That is why alert fatigue is a problem."},{"q":"Which is safest to automate first?","o":["Adding context to alerts","Shutting down servers automatically"],"a":0,"e":"Enrichment is low risk and saves time."},{"q":"Should automation ever guess when a tool fails?","o":["Yes","No, it should escalate to a person"],"a":1,"e":"Lesson 4 explains why."}],"lessons":[{"title":"The incident response challenge","minutes":3,"slides":[{"scene":{"type":"graph","title":"Why manual response cannot keep up","nodes":[{"id":"al","label":"Thousands of\nalerts a day","p":[-5.2,0.0,-0.3],"c":"red","shape":"slab","size":0.8,"ls":0.62},{"id":"fa","label":"Alert fatigue:\nreal threats missed","p":[-2.6,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"sk","label":"Skills\nshortage","p":[0.0,0.0,-0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"sp","label":"Automated attacks\nmove faster","p":[2.6,1.5,0.3],"c":"pink","shape":"ico","size":0.8,"ls":0.62},{"id":"ans","label":"Machines do routine;\npeople judge","p":[5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["al"],["fa"],["sk"],["sp"],["ans"]]},"say":["Welcome to Chapter 15, Automated Incident Response and Orchestration, and I'm Sam, your tutor. A security operations centre, or SOC, watches an organisation's systems around the clock.","Its tools can produce thousands of alerts a day, most of them false alarms.","When most alerts are false, tired analysts skim. That is alert fatigue, and it is exactly when real attacks slip through.","There are not enough trained analysts to hire.","And automated attacks move faster than manual procedures. IBM reports attackers going unnoticed for around 200 days on average.","The answer is not replacing people. Machines handle routine, high-volume work at machine speed, so analysts can focus on judgement."]}],"keyPoint":"Alert overload, fatigue, skills shortages and fast attacks make manual response unsustainable. Automate the routine; keep people for judgement.","plain":["Alert fatigue is the boy who cried wolf, at scale.","Around 200 days to identify a breach gives attackers a long head start.","Doubling tools without changing process makes fatigue worse.","Automation frees analysts; it does not replace them."],"check":{"q":"What is alert fatigue?","o":["Analysts desensitised by too many false alarms","A broken screen","A type of malware"],"a":0,"e":"It is when real attacks get missed.","retry":{"q":"What should automation mainly take on?","o":["Routine, high-volume work","All decisions","Nothing"],"a":0,"e":"People keep judgement."}},"scenario":{"title":"Twice the tools","setting":"A team doubles its detection tools without changing anything else.","steps":[{"prompt":"What happens to alert fatigue?","choices":[{"t":"It gets worse: more alerts, same people","s":2,"fb":"Right. More tools need smarter triage."},{"t":"It disappears","s":0,"fb":"More alerts add load."},{"t":"No change","s":0,"fb":"Volume rises."}]},{"prompt":"What would help most?","choices":[{"t":"Automate enrichment and triage so analysts see fewer, richer alerts","s":2,"fb":"Right. Reduce noise first."},{"t":"Hire one more analyst","s":1,"fb":"Helps a little, not enough."},{"t":"Turn off half the tools","s":0,"fb":"Loses visibility."}]}]},"lab":{"type":"sort","title":"Machine or person?","prompt":"Who should handle each task?","buckets":["Automation","Analyst"],"items":[{"t":"Look up an IP address in threat feeds","b":0},{"t":"Decide whether to tell the regulator","b":1},{"t":"Log every action taken","b":0},{"t":"Judge an unusual attack never seen before","b":1},{"t":"Gather context for a new alert","b":0}],"explain":"Machines move fast on routine work; people decide."}},{"title":"The lifecycle and where automation helps","minutes":3,"slides":[{"scene":{"type":"graph","title":"Six phases of incident response","nodes":[{"id":"pr","label":"Preparation","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"da","label":"Detection and\nanalysis","p":[3.64,1.9,0],"c":"violet","shape":"ico","size":0.8,"ls":0.6},{"id":"cn","label":"Containment","p":[3.64,-0.7,0],"c":"amber","shape":"shield","size":0.8,"ls":0.6},{"id":"er","label":"Eradication","p":[0.0,-2.0,0],"c":"red","shape":"sphere","size":0.8,"ls":0.6},{"id":"rc","label":"Recovery","p":[-3.64,-0.7,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6},{"id":"pi","label":"Post-incident\nactivity","p":[-3.64,1.9,0],"c":"slate","shape":"torus","size":0.8,"ls":0.6}],"links":[["pr","da",2],["da","cn",2],["cn","er",2],["er","rc",2],["rc","pi",2],["pi","pr",2]],"steps":["all",["pr"],["da"],["cn"],["er"],["rc"],["pi"],"all"],"orbit":0.4},"say":["The chapter uses six phases of incident response.","Preparation: tools in place, procedures written, people trained.","Detection and analysis: noticing something is wrong and working out how serious it is. This is where machine learning has its biggest impact, because data volume is greatest.","Containment: stop it spreading, such as cutting an infected laptop off the network.","Eradication: remove the cause, such as malware or an attacker's account.","Recovery: restore systems and check they are clean.","Post-incident activity: review and improve.","Six jobs suit automation: detection, classification, enrichment, response, documentation and learning. Enrichment, adding context such as checking an address against threat feeds, and documentation are low-risk and save lots of time, so start there. Automated response carries the most risk, because a wrong action can cause an outage. NIST's 2025 guidance, SP 800-61 Revision 3, maps response onto the Cybersecurity Framework 2.0."]}],"keyPoint":"Prepare, detect and analyse, contain, eradicate, recover and review. Start automating with low-risk enrichment and documentation; be most careful with automated response actions.","plain":["Enrichment is adding context to an alert.","Threat intelligence feeds list known bad addresses, files and domains.","Automatic documentation helps audits and regulators.","Post-incident lessons improve detection and playbooks."],"check":{"q":"Which automation jobs are the best place to start?","o":["Enrichment and documentation","Fully automated server shutdowns","Firing staff"],"a":0,"e":"Low risk, big time savings.","retry":{"q":"Which phase stops an incident spreading?","o":["Containment","Preparation","Recovery"],"a":0,"e":"Eradication then removes the cause."}},"scenario":{"title":"First automation project","setting":"Your SOC has budget for one automation project this quarter.","steps":[{"prompt":"What should it be?","choices":[{"t":"Automatic enrichment of every alert with threat intelligence","s":2,"fb":"Right. Low risk, high value."},{"t":"Automatic isolation of any server that alerts","s":0,"fb":"High risk of outages."},{"t":"Nothing","s":0,"fb":"Routine work is ready to automate."}]},{"prompt":"How should post-incident reviews feed back?","choices":[{"t":"Into better detection rules and playbooks","s":2,"fb":"Right. Learning closes the loop."},{"t":"Into a drawer","s":0,"fb":"Lessons are lost."},{"t":"Only into the annual report","s":1,"fb":"Too slow to help."}]}]},"lab":{"type":"order","title":"Order the lifecycle","prompt":"Put the six incident response phases in order.","items":["Preparation","Detection and analysis","Containment","Eradication","Recovery","Post-incident activity"],"explain":"Lessons from the last phase strengthen the first."}},{"title":"Machine learning for incident detection","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three families of detection models","nodes":[{"id":"sup","label":"Supervised:\nrandom forests, SVMs;\nstrong on known threats","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"ico","size":0.8,"ls":0.62},{"id":"uns","label":"Unsupervised:\nisolation forest, K-means;\nfinds novel attacks","p":[0.0,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"dl","label":"Deep learning:\nCNNs, LSTMs,\ntransformers","p":[5.2,0.0,-0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62}],"links":[],"steps":["all",["sup"],["uns"],["dl"]]},"say":["Detection uses three families of machine learning.","Supervised learning learns from examples labelled normal or malicious. A random forest is many decision trees voting; each makes different mistakes, so averaging gives stable results. It is strong on known threats, but labels are slow and costly.","Unsupervised learning needs no labels. It learns normal and flags what differs, so it can catch new and zero-day attacks, but raises more false alarms. An isolation forest separates unusual points with very few random cuts.","Deep learning learns from raw data. LSTMs remember sequences, so they catch attacks spread over many steps; transformers weigh which events matter most. They need more data and computing power and are harder to explain. Decision trees choose questions by information gain, how much a split reduces entropy, a measure of how mixed a group is. Because attacks are rare, report precision, recall and F1, not just accuracy, and be wary of high benchmark scores that rarely transfer to real networks."]}],"keyPoint":"Supervised models know known threats, unsupervised models find new ones, deep learning handles complex sequences. Attacks are rare, so use precision, recall and F1, and test on your own network.","plain":["Entropy is 0 when a group is all one class, 1 when split 50/50.","Information gain is how much a question tidies the groups.","SMOTE creates synthetic examples of the rare class.","Benchmark scores rarely transfer to real networks."],"check":{"q":"Which family can flag a never-before-seen attack without labels?","o":["Unsupervised learning","Supervised learning only","None"],"a":0,"e":"It learns normal and flags what differs.","retry":{"q":"Why report precision and recall rather than accuracy?","o":["Attacks are rare, so accuracy can hide missed attacks","Accuracy is illegal","Precision is easier to spell"],"a":0,"e":"Class imbalance makes accuracy misleading."}},"scenario":{"title":"The 99 per cent paper","setting":"A paper reports 99 per cent accuracy on a classic benchmark dataset.","steps":[{"prompt":"What should you ask before using the model?","choices":[{"t":"How it performs on our own network data, and its precision and recall","s":2,"fb":"Right. Benchmarks rarely transfer."},{"t":"Nothing, 99 per cent is great","s":0,"fb":"Accuracy can mislead."},{"t":"What font the paper used","s":0,"fb":"No."}]},{"prompt":"Why might a random forest beat deep learning on tabular security data?","choices":[{"t":"It often suits tables, needs less data and is easier to explain","s":2,"fb":"Right. Choose by data and need."},{"t":"Deep learning never works","s":0,"fb":"It works well on sequences and raw data."},{"t":"Random forests are always best","s":1,"fb":"Compare on your data."}]}]},"lab":{"type":"sort","title":"Which family?","prompt":"Match each model to its family.","buckets":["Supervised","Unsupervised","Deep learning"],"items":[{"t":"Random forest trained on labelled alerts","b":0},{"t":"Isolation forest","b":1},{"t":"LSTM reading event sequences","b":2},{"t":"K-means clustering","b":1},{"t":"Support vector machine with labels","b":0},{"t":"Transformer with attention","b":2}],"explain":"Each family suits different data and threats."}},{"title":"Orchestrating the response","minutes":4,"slides":[{"scene":{"type":"graph","title":"A phishing playbook","nodes":[{"id":"ex","label":"Extract headers\nand links","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ti","label":"Check threat\nintelligence","p":[-3.12,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"sb","label":"Open attachments\nin a sandbox","p":[-1.04,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"rm","label":"Remove every copy\nof the email","p":[1.04,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62},{"id":"rs","label":"Reset credentials\nfor clickers","p":[3.12,0.0,-0.3],"c":"pink","shape":"shield","size":0.8,"ls":0.62},{"id":"up","label":"Update\nfilters","p":[5.2,1.5,0.3],"c":"green","shape":"box","size":0.8,"ls":0.62}],"links":[["ex","ti",2],["ti","sb",2],["sb","rm",2],["rm","rs",2],["rs","up",2]],"steps":["all",["ex"],["ti"],["sb"],["rm"],["rs"],["up"]]},"say":["A playbook is the team's standard procedure written so a machine can run it. Here is a phishing playbook.","Extract the email's headers and links.","Check them against threat intelligence.","Open attachments safely in a sandbox, an isolated test environment.","Remove every copy of a malicious email from mailboxes.","Reset credentials for anyone who clicked.","Update the filters. Two settings matter most for safety: on error, escalate to a person rather than let automation guess; and log every step for a full audit trail. Stored as text files, playbooks can be version-controlled, reviewed and tested like code."]},{"scene":{"type":"graph","title":"Three ways to decide a response","nodes":[{"id":"dtr","label":"Decision trees:\nreadable, auditable","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"pb","label":"Playbooks:\ncodified procedures","p":[0.0,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"rl","label":"Reinforcement learning:\nadaptive, needs simulation","p":[5.2,0.0,-0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62}],"links":[],"steps":["all",["dtr"],["pb"],["rl"]]},"say":["There are three ways to decide and run a response.","Decision trees ask questions about the incident, such as severity, asset type and sensitive data, and branch to an action and the human's role. They are easy to audit but only cover situations someone foresaw.","Playbooks run the procedure step by step, with a workflow engine handling order, waiting and errors. Most organisations use these today.","Reinforcement learning learns by trial and reward, balancing containment against disruption. Because it learns by trying things, it must train in realistic simulation, never on a live network, and needs strong human oversight."]}],"keyPoint":"Decision trees are auditable, playbooks codify procedures, and reinforcement learning adapts but needs simulation and oversight. Escalate on error and log every step.","plain":["A playbook is a recipe the machine can follow.","A sandbox is a safe room for opening suspicious files.","Escalate on error: never let automation guess.","RL is promising but closely supervised."],"check":{"q":"What should a playbook do when a connected tool stops responding?","o":["Escalate to an analyst","Guess and continue","Delete the case"],"a":0,"e":"Automation should not guess.","retry":{"q":"Why must reinforcement learning train in simulation?","o":["It learns by trying actions, which could disrupt a live network","Simulation is cheaper paper","It is required by GDPR"],"a":0,"e":"Experiments belong in safe environments."}},"scenario":{"title":"The hospital server","setting":"A playbook could automatically isolate any hospital server showing ransomware signs.","steps":[{"prompt":"Should that be fully automatic?","choices":[{"t":"Add a human approval step for clinical systems, unless clearly pre-approved","s":2,"fb":"Right. High-impact actions need oversight."},{"t":"Yes, always automatic","s":0,"fb":"Isolation could disrupt patient care."},{"t":"Never isolate","s":0,"fb":"Sometimes isolation is essential."}]},{"prompt":"What makes a playbook auditable?","choices":[{"t":"Logging every step and version-controlling the playbook","s":2,"fb":"Right. Full audit trail."},{"t":"Running it quickly","s":0,"fb":"Speed is not auditability."},{"t":"Keeping it secret","s":0,"fb":"Review needs visibility."}]}]},"lab":{"type":"order","title":"Run the phishing playbook","prompt":"Put the phishing playbook steps in order.","items":["Extract headers and links","Check threat intelligence","Open attachments in a sandbox","Remove every copy of the email","Reset credentials for clickers","Update filters"],"explain":"Gather evidence, confirm, contain, then prevent recurrence."}},{"title":"Prioritising incidents with risk scores","minutes":3,"slides":[{"scene":{"type":"graph","title":"Risk score = model(asset, threat, exposure)","nodes":[{"id":"as","label":"Asset\ncriticality","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"so","label":"Attack\nsophistication","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ex","label":"Data\nexposure","p":[0.0,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"ti","label":"Threat intelligence\ncontext","p":[2.6,1.5,0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"rs","label":"Urgency score,\nupdated as it unfolds","p":[5.2,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[["as","rs",1],["so","rs",1],["ex","rs",1],["ti","rs",1]],"steps":["all",["as"],["so"],["ex"],["ti"],["rs"]]},"say":["With hundreds of open incidents, order matters. Risk scoring gives each an urgency number learned from past outcomes.","How important is the affected system?","How sophisticated does the attack look?","How much sensitive data could be exposed?","What does threat intelligence say about it?","Gradient-boosted trees, many small trees each correcting the last, often suit this kind of table data, but compare methods on your own data. Scores update as new evidence appears, and multi-objective optimisation balances risk against limited analyst time. Beware: a model trained only on incidents analysts chose to investigate inherits their blind spots."]}],"keyPoint":"Score urgency from asset, threat, exposure and intelligence, update scores as incidents unfold, and watch for blind spots inherited from past choices.","plain":["Gradient boosting is a team where each member fixes the last one's mistakes.","A minor alert can jump the queue when new evidence arrives.","Multi-objective means balancing risk and resources.","Explain scores so analysts can challenge them."],"check":{"q":"What is a risk of training only on incidents analysts chose to investigate?","o":["The model inherits their blind spots","It becomes too accurate","It runs slowly"],"a":0,"e":"Uninvestigated threats never appear in training.","retry":{"q":"Why are scores updated during an incident?","o":["New evidence can change urgency","To confuse analysts","Scores never change"],"a":0,"e":"Dynamic reprioritisation keeps the queue current."}},"scenario":{"title":"The disagreeing analyst","setting":"An experienced analyst disagrees with a low risk score on an incident.","steps":[{"prompt":"What should happen?","choices":[{"t":"Show which inputs drove the score and let the analyst override, recording why","s":2,"fb":"Right. Explain and allow override."},{"t":"The model always wins","s":0,"fb":"Models can be wrong."},{"t":"Delete the model","s":0,"fb":"Too drastic."}]},{"prompt":"For a hospital, which input would you weight most heavily?","choices":[{"t":"Asset criticality for clinical systems and patient data","s":2,"fb":"Right. Patient safety comes first."},{"t":"Time of day","s":1,"fb":"Useful context, not the main driver."},{"t":"Logo on the alert","s":0,"fb":"No."}]}]},"lab":{"type":"sort","title":"Raise or lower priority?","prompt":"Does each fact raise or lower an incident's urgency?","buckets":["Raises urgency","Lowers urgency"],"items":[{"t":"The server holds patient records","b":0},{"t":"The address is on a known-bad list","b":0},{"t":"The device is a spare test laptop with no data","b":1},{"t":"The attack uses advanced techniques","b":0},{"t":"The file was already blocked and quarantined","b":1}],"explain":"Risk scoring weighs what an expert analyst would."}},{"title":"SOAR platforms","minutes":3,"slides":[{"scene":{"type":"graph","title":"Six components of a SOAR platform","nodes":[{"id":"cm","label":"Case\nmanagement","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"oe","label":"Orchestration\nengine","p":[3.64,1.9,0],"c":"violet","shape":"ico","size":0.8,"ls":0.6},{"id":"ig","label":"Integration\nframework (APIs)","p":[3.64,-0.7,0],"c":"amber","shape":"torus","size":0.8,"ls":0.6},{"id":"ti","label":"Threat\nintelligence","p":[0.0,-2.0,0],"c":"red","shape":"sphere","size":0.8,"ls":0.6},{"id":"ad","label":"Analytics\ndashboard","p":[-3.64,-0.7,0],"c":"pink","shape":"sphere","size":0.8,"ls":0.6},{"id":"al","label":"Automation\nlibrary","p":[-3.64,1.9,0],"c":"green","shape":"sphere","size":0.8,"ls":0.6}],"links":[],"steps":["all",["cm"],["oe"],["ig"],["ti"],["ad"],["al"]],"orbit":0.4},"say":["SOAR stands for Security Orchestration, Automation and Response. Orchestration means coordinating many tools so they act together.","Case management records each incident: owner, facts and actions.","The orchestration engine runs the playbooks.","The integration framework connects other tools, such as the SIEM, which collects logs, and EDR, which watches laptops and servers, through their APIs. This is where projects often struggle: APIs change, tools limit call rates, and connections fail.","Threat intelligence feeds enrich alerts.","Dashboards show performance.","And an automation library holds reusable actions. Platforms include Cortex XSOAR, Splunk SOAR, IBM SOAR, FortiSOAR and InsightConnect, though names and features change often. Choose on integrations, ML features, scale and total cost, including people to build playbooks. A very small organisation may get better value from managed services or simple scripts."]}],"keyPoint":"SOAR combines case management, orchestration, integrations, threat intelligence, dashboards and an automation library. Choose on fit and total cost, not features alone.","plain":["Orchestration is a conductor coordinating an orchestra of tools.","EDR watches endpoints; the SIEM collects logs.","Integration is where projects often struggle.","Small organisations may not need SOAR at all."],"check":{"q":"What does the integration framework do?","o":["Connects other security tools through their APIs","Writes reports by hand","Hires analysts"],"a":0,"e":"Integration is often the hardest part.","retry":{"q":"What hidden cost comes with SOAR beyond the licence?","o":["People to build and maintain playbooks","Free coffee","None"],"a":0,"e":"Count the people, not just the software."}},"scenario":{"title":"The small charity","setting":"A small charity with one IT person asks whether to buy a SOAR platform.","steps":[{"prompt":"What would you suggest?","choices":[{"t":"Probably not; consider managed services or simple scripted enrichment","s":2,"fb":"Right. Match cost to need."},{"t":"Buy the biggest platform","s":0,"fb":"Too costly to run."},{"t":"Do nothing about alerts","s":0,"fb":"Some automation still helps."}]},{"prompt":"In a trial, which component would you test hardest?","choices":[{"t":"Integrations with your existing tools","s":2,"fb":"Right. Fit beats features."},{"t":"Dashboard colours","s":0,"fb":"Not critical."},{"t":"The logo","s":0,"fb":"No."}]}]},"lab":{"type":"sort","title":"Which component?","prompt":"Match each function to its SOAR component.","buckets":["Case management","Orchestration engine","Integration framework","Automation library"],"items":[{"t":"Records who owns an incident and what was done","b":0},{"t":"Runs the phishing playbook steps","b":1},{"t":"Connects to the firewall's API","b":2},{"t":"Stores a reusable 'reset password' action","b":3}],"explain":"Each component plays a different role."}},{"title":"Case studies: a bank and a health system","minutes":3,"slides":[{"scene":{"type":"graph","title":"Two reported implementations","nodes":[{"id":"bk","label":"Global bank:\nML detection + SOAR","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"bkr","label":"Reported: 8 hours → 40 min,\nfalse alarms −73%,\npayback in 8 months","p":[-1.73,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"hs","label":"Regional health system:\n40+ sites, few staff","p":[1.73,0.0,-0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62},{"id":"hsr","label":"Reported: alerts −89%,\n4 hours → 12 min,\nrecords maintained","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["bk","bkr",2],["hs","hsr",2]],"steps":["all",["bk"],["bkr"],["hs"],["hsr"]]},"say":["The chapter reports two implementations. Neither organisation is named, so treat the figures as illustrative.","A global bank handling more than 50,000 transactions a day combined ML detection with SOAR orchestration.","It reported response time falling from 8 hours to 40 minutes, false alarms down 73 per cent, most common incident types automated, and payback in 8 months.","A regional health system with more than 40 sites, few security staff and strict privacy duties introduced automation in phases, building trust and checking actions did not disrupt clinical systems.","It reported alert volume down 89 per cent and response time from 4 hours to 12 minutes, with automatic documentation keeping regulators' records. Before believing similar vendor claims, ask about the baseline, how measures were defined, the time period, and what else changed."]}],"keyPoint":"The bank and health system cases show large reported gains from ML plus SOAR, phased carefully. Treat unverified figures sceptically and ask the right questions.","plain":["Phasing built trust in the health system.","Automatic documentation helps meet regulation.","Ask: what was the baseline?","Ask: what else changed at the same time?"],"check":{"q":"Why was phased deployment important in the health system?","o":["It built trust and avoided disrupting clinical systems","It was cheaper to print","Regulators banned automation"],"a":0,"e":"Patient care could not be put at risk.","retry":{"q":"What should you ask about a vendor's '90 per cent faster' claim?","o":["The baseline, definitions, time period and other changes","Only the price","Nothing"],"a":0,"e":"Context makes figures meaningful."}},"scenario":{"title":"The vendor pitch","setting":"A vendor shows a slide: 'Customers cut response time by 92 per cent.'","steps":[{"prompt":"What is your first question?","choices":[{"t":"Compared with what baseline, and measured how?","s":2,"fb":"Right. Numbers need context."},{"t":"Can we buy today?","s":0,"fb":"Not before evidence."},{"t":"What colour is the slide?","s":0,"fb":"No."}]},{"prompt":"What lesson from the cases applies to any industry?","choices":[{"t":"Combine detection and orchestration, and phase automation carefully","s":2,"fb":"Right. Transferable lessons."},{"t":"Automate everything on day one","s":0,"fb":"Both cases phased their approach."},{"t":"Avoid documentation","s":0,"fb":"Documentation helped compliance."}]}]},"lab":{"type":"sort","title":"Bank or health system?","prompt":"Which case does each detail belong to?","buckets":["Global bank","Regional health system"],"items":[{"t":"More than 50,000 transactions a day","b":0},{"t":"More than 40 facilities with few security staff","b":1},{"t":"Payback in 8 months","b":0},{"t":"Alert volume down 89 per cent","b":1},{"t":"Strict health privacy obligations","b":1}],"explain":"Different contexts, similar lessons."}},{"title":"Challenges and phasing in automation safely","minutes":3,"slides":[{"scene":{"type":"graph","title":"Phase in automation, with a human for high-impact actions","nodes":[{"id":"p1","label":"Phase 1: enrich\nand document","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"p2","label":"Phase 2: recommend;\nanalyst approves","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"p3","label":"Phase 3: automate routine,\nlow-impact actions","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"p4","label":"Phase 4: ML-driven,\naudited, overridable","p":[5.2,1.5,0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[["p1","p2",2],["p2","p3",2],["p3","p4",2]],"steps":["all",["p1"],["p2"],["p3"],["p4"]]},"say":["Four open problems limit how far response can be automated. Attackers craft inputs to evade detectors, an arms race met with adversarial training and diverse ensembles. Analysts and regulators need explanations; tools like LIME and SHAP show which features drove a decision. Cloud containers may vanish in minutes, taking evidence with them, so centralise logs and replace rather than repair. And quantum computing may break some encryption. So phase automation in.","Phase one: automate safe work such as gathering context and writing up incidents.","Phase two: the system recommends actions and an analyst approves, building a track record.","Phase three: pre-approved actions run alone for common, low-impact incidents.","Phase four: machine-learning-driven decisions with regular audits and a clear way to override. At every phase, keep a human in the loop for high-impact actions."]}],"keyPoint":"Adversarial ML, explainability, cloud-native complexity and quantum change all limit automation. Phase it in, from enrichment to audited ML decisions, keeping people over high-impact actions.","plain":["LIME and SHAP explain individual decisions.","Sometimes a slightly less accurate but explainable model is better.","Short-lived containers take evidence with them.","Recommend first, automate later."],"check":{"q":"What happens in Phase 2?","o":["The system recommends and an analyst approves","Everything runs automatically","Nothing is automated"],"a":0,"e":"It builds a track record and trust.","retry":{"q":"Why centralise logs for cloud containers?","o":["Containers may disappear before anyone looks","Logs are free","To slow attackers"],"a":0,"e":"Evidence must outlive the container."}},"scenario":{"title":"Accuracy or explanation?","setting":"Two detection models: one 2 per cent more accurate but unexplainable, one slightly weaker but clearly explainable.","steps":[{"prompt":"Which would you choose for blocking staff accounts?","choices":[{"t":"Often the explainable one, since people and regulators will ask why","s":2,"fb":"Right. Explanations support fairness and trust."},{"t":"Always the most accurate","s":1,"fb":"Accuracy matters, but so does accountability."},{"t":"Neither","s":0,"fb":"Detection is still needed."}]},{"prompt":"How might attackers exploit ML detection?","choices":[{"t":"By tweaking malware or traffic to slip past the model","s":2,"fb":"Right. Adversarial evasion."},{"t":"They cannot","s":0,"fb":"It is an active arms race."},{"t":"By asking nicely","s":0,"fb":"No."}]}]},"lab":{"type":"order","title":"Phase it in","prompt":"Put the automation phases in order.","items":["Enrich and document","Recommend, analyst approves","Automate routine low-impact actions","ML-driven decisions with audits"],"explain":"Trust is built step by step, with people over high-impact actions throughout."}}],"test":[{"q":"A SOC is…","o":["A security operations centre","A type of malware","A database"],"a":0,"e":"","lesson":0},{"q":"Average time to identify a breach, per IBM, is around…","o":["200 days","2 hours","2 years"],"a":0,"e":"","lesson":0},{"q":"Enrichment means…","o":["Adding context to an alert","Deleting alerts","Buying tools"],"a":0,"e":"","lesson":1},{"q":"Which phase removes the cause of an incident?","o":["Eradication","Preparation","Detection"],"a":0,"e":"","lesson":1},{"q":"An isolation forest finds…","o":["Outliers that are easy to separate","Labelled attacks only","Network cables"],"a":0,"e":"","lesson":2},{"q":"LSTMs are good at…","o":["Attacks spread over many steps","Spelling","Encryption"],"a":0,"e":"","lesson":2},{"q":"Entropy of a 50/50 group is…","o":["1","0","100"],"a":0,"e":"","lesson":2},{"q":"A sandbox is…","o":["An isolated environment for testing suspicious files","A playground","A backup"],"a":0,"e":"","lesson":3},{"q":"Reinforcement learning response must train…","o":["In realistic simulation","On the live network","Without rewards"],"a":0,"e":"","lesson":3},{"q":"A model trained only on investigated incidents may…","o":["Inherit analysts' blind spots","Be perfect","Run faster"],"a":0,"e":"","lesson":4},{"q":"SOAR stands for…","o":["Security Orchestration, Automation and Response","Server Operations and Recovery","Safe Online Access Rules"],"a":0,"e":"","lesson":5},{"q":"EDR watches…","o":["Laptops and servers","Office doors","Websites only"],"a":0,"e":"","lesson":5},{"q":"The bank case reported response time falling from 8 hours to…","o":["40 minutes","4 hours","8 days"],"a":0,"e":"","lesson":6},{"q":"Before believing vendor figures, ask about…","o":["The baseline and how measures were defined","The logo","The office location"],"a":0,"e":"","lesson":6},{"q":"LIME and SHAP help with…","o":["Explaining individual model decisions","Encrypting data","Patching"],"a":0,"e":"","lesson":7},{"q":"High-impact actions should keep…","o":["A human in the loop","No oversight","Random timing"],"a":0,"e":"","lesson":7}]};
