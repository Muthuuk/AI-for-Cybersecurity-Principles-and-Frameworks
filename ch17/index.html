/* Chapter 17: AI Security and Adversarial Defences (Guide to AI for Cybersecurity) */
const CH = {"id":"ch17","num":"17","title":"AI Security and Adversarial Defences","summary":"How AI systems themselves are attacked and defended: the attack surface across data, models and deployment, adversarial examples and FGSM, evasion defences, poisoning and backdoors, model extraction and watermarking, defence in depth, and secure operations.","outcomes":["Explain why AI is both a defender and a target","Map vulnerabilities across the data pipeline, model and deployment","Describe how adversarial examples and FGSM work, and use them to test models","Compare defences against evasion and poisoning attacks","Protect models against extraction and prove ownership with watermarks","Design defence in depth and secure operations for AI systems"],"starter":[{"q":"Can a tiny change invisible to people fool an image classifier?","o":["No","Yes"],"a":1,"e":"That is an adversarial example."},{"q":"Can someone copy a model just by sending it questions?","o":["No","Yes, through model extraction"],"a":1,"e":"Lesson 6 explains how and how to defend."},{"q":"Is hiding a model's gradients a strong defence?","o":["Yes","No, attackers use a substitute model"],"a":1,"e":"Lesson 4 explains why."}],"lessons":[{"title":"The AI security paradox","minutes":3,"slides":[{"scene":{"type":"graph","title":"AI is both defender and target","nodes":[{"id":"def","label":"Defender: machine-speed\ndetection and response","p":[-5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"tgt","label":"Target: can be fooled,\ncorrupted or copied","p":[-1.73,1.5,0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"op","label":"Opaque weights hide\ntampering","p":[1.73,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"eco","label":"Economic incentives\ndrive both sides","p":[5.2,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["def"],["tgt"],["op"],["eco"]]},"say":["Welcome to Chapter 17, AI Security and Adversarial Defences, and I'm Sam, your tutor. This chapter is defensive: we study attacks so we can test and protect our own systems, never to use against others.","AI detects threats at machine speed, automates responses and spots patterns in huge volumes of data.","The same systems are valuable targets: a model can be fooled into a wrong answer, corrupted during training, or stolen through its public interface.","Deep learning models contain millions of learned numbers, called weights or parameters. Nobody can read them directly, so tampering is hard to see.","Attackers gain from fooling, corrupting or copying models. Every AI defence we deploy is also something we must defend. Probing someone else's AI service without permission may break the law."]}],"keyPoint":"AI defends and is attacked. Its opacity hides tampering, and incentives drive attackers, so every AI system needs protecting. Study attacks only to defend your own systems.","plain":["Weights are the millions of numbers a model learns.","Opacity makes tampering hard to spot.","An AI defence is also an AI target.","Test only systems you own or have permission to test."],"check":{"q":"Why is tampering with a deep learning model hard to see?","o":["Its millions of learned weights cannot be read directly","It has no weights","Models are always transparent"],"a":0,"e":"Opacity is a security problem.","retry":{"q":"Is it acceptable to probe someone else's AI service for weaknesses without permission?","o":["No, it may break the law and terms of service","Yes, for learning","Only on weekends"],"a":0,"e":"Defensive study uses your own systems."}},"scenario":{"title":"The airport camera","setting":"You protect a facial recognition system at an airport.","steps":[{"prompt":"Which attack would worry you most?","choices":[{"t":"Evasion: someone fooling the camera to avoid recognition","s":2,"fb":"A strong answer; poisoning and extraction matter too."},{"t":"Nothing, cameras are reliable","s":0,"fb":"AI can be fooled."},{"t":"Too many photos","s":0,"fb":"Volume is not the threat."}]},{"prompt":"Why might nobody notice the model was tampered with?","choices":[{"t":"Its weights are opaque and it may still pass normal tests","s":2,"fb":"Right. Tampering hides well."},{"t":"Tampering is impossible","s":0,"fb":"It is possible."},{"t":"Alarms always sound","s":0,"fb":"Not for subtle tampering."}]}]},"lab":{"type":"sort","title":"Defender or target?","prompt":"Is each statement about AI as defender or AI as target?","buckets":["AI as defender","AI as target"],"items":[{"t":"Spots unusual logins in seconds","b":0},{"t":"Can be fooled by tiny input changes","b":1},{"t":"Automates containment of malware","b":0},{"t":"Can be copied through its API","b":1},{"t":"Training data can be poisoned","b":1}],"explain":"The same system plays both roles."}},{"title":"Mapping the AI attack surface","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three layers of vulnerability","nodes":[{"id":"dp","label":"Data pipeline:\npoisoned data, flipped labels,\nunclear provenance","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"ma","label":"Model: revealing gradients,\ntransferable attacks,\nhidden backdoors","p":[0.0,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"de","label":"Deployment: API abuse,\nexcessive queries,\ncascading failures","p":[5.2,0.0,-0.3],"c":"amber","shape":"torus","size":0.8,"ls":0.62}],"links":[["dp","ma",2],["ma","de",2]],"steps":["all",["dp"],["ma"],["de"]]},"say":["Think of an AI system as three layers, each with its own vulnerabilities.","At the bottom, the data pipeline: where data is collected, cleaned, labelled and stored. Slip in bad data or flip some labels and the model learns the wrong lessons. Provenance, knowing where each piece of data came from and who changed it, is essential, and crowdsourced labelling adds risk.","In the middle, the model. Its gradients, how its output changes when the input changes, show attackers where it is fragile. Attacks built against one model often transfer to another trained for the same task. And backdoors can hide in the weights.","At the top, deployment, usually an API that people send requests to. It can be flooded with queries, overloaded, or used as a stepping stone into connected systems. Firewalls and patching are necessary, but they do not stop a poisoned dataset or a fooled classifier."]}],"keyPoint":"Vulnerabilities span the data pipeline, the model and deployment. Each layer needs its own controls; traditional IT security alone is not enough.","plain":["Provenance is a dataset's family history.","Gradients are a map of where the model is fragile.","Transferability lets attackers practise on their own copy.","A firewall cannot spot a poisoned dataset."],"check":{"q":"Which layer includes flipped labels and unclear provenance?","o":["The data pipeline","Deployment","The office network"],"a":0,"e":"Bad data teaches wrong lessons.","retry":{"q":"What does transferability mean?","o":["An attack built against one model often works on another","Models move between servers","Data copies itself"],"a":0,"e":"Attackers can rehearse on substitutes."}},"scenario":{"title":"Buying pre-trained models","setting":"Your organisation buys pre-trained models from suppliers rather than training its own.","steps":[{"prompt":"Which layer is hardest to protect?","choices":[{"t":"The data pipeline and model, because you cannot see how they were built","s":2,"fb":"Right. Treat them as supply-chain risks."},{"t":"Deployment only","s":1,"fb":"You control deployment more easily."},{"t":"None","s":0,"fb":"All layers still matter."}]},{"prompt":"Give a case where a normal IT control would not help.","choices":[{"t":"A firewall cannot detect a poisoned training dataset","s":2,"fb":"Right. AI needs its own controls."},{"t":"A firewall blocks port scans","s":0,"fb":"That is a case where it does help."},{"t":"Antivirus finds every backdoor","s":0,"fb":"Model backdoors are invisible to it."}]}]},"lab":{"type":"sort","title":"Which layer?","prompt":"Place each vulnerability in its layer.","buckets":["Data pipeline","Model","Deployment"],"items":[{"t":"Crowdsourced labels flipped by a bad actor","b":0},{"t":"Gradients revealing fragile spots","b":1},{"t":"Millions of queries to the API","b":2},{"t":"Hidden backdoor in the weights","b":1},{"t":"Unknown origin of a training dataset","b":0},{"t":"Overloading the prediction service","b":2}],"explain":"Each layer needs its own defences."}},{"title":"Adversarial examples and evasion","minutes":4,"slides":[{"scene":{"type":"graph","title":"How FGSM fools a model","nodes":[{"id":"x","label":"Original input x:\ncorrectly classified","p":[-5.2,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"g","label":"Gradient: which way\nmakes the model wrong","p":[-2.6,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"s","label":"Keep only the sign\n(+1 or −1)","p":[0.0,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"e","label":"Scale by budget ε\n(e.g. 8\n255)","p":[2.6,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"xa","label":"x_adv: looks the same,\nconfidently wrong","p":[5.2,0.0,-0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[["x","g",2],["g","s",2],["s","e",2],["e","xa",2]],"steps":["all",["x"],["g"],["s"],["e"],["xa"]]},"say":["An adversarial example is an input changed so slightly that a person sees no difference, yet the model confidently gets it wrong. Many tiny pixel changes add up to push it across the model's decision boundary. This is evasion: it happens at prediction time.","Start with an input the model classifies correctly.","Compute the gradient of the loss, a score of how wrong the model is. It shows, for each pixel, which direction makes the model more wrong.","Keep only the sign of that direction, plus or minus one.","Multiply by epsilon, the budget for how much any pixel may change. With pixels from 0 to 255, epsilon of 8 over 255 lets a pixel of 128 move only between 120 and 136.","The result looks unchanged but is misclassified. Training walks downhill to reduce error; FGSM takes one step uphill. PGD takes many small steps and is the standard strong test. Defenders use these to stress-test their own models: the smaller the epsilon needed, the more fragile the model."]}],"keyPoint":"FGSM nudges every pixel a tiny amount in the direction that most increases error. Defenders use FGSM and PGD to measure how fragile their own models are.","plain":["Training goes downhill; FGSM steps uphill.","Epsilon is the budget of change per pixel.","White-box attacks know the model; black-box ones see only outputs.","Physical attacks work through cameras and sensors."],"check":{"q":"In FGSM, what does epsilon control?","o":["The maximum change allowed per pixel","The number of layers","The learning rate"],"a":0,"e":"It is the attack budget.","retry":{"q":"Why do defenders run FGSM against their own models?","o":["To measure how easily they can be fooled","To steal data","To speed up training"],"a":0,"e":"A small epsilon flipping answers means fragility."}},"scenario":{"title":"The graffiti stop sign","setting":"Your car's object detector misreads stop signs with graffiti on them.","steps":[{"prompt":"What should you test?","choices":[{"t":"Robustness with PGD and physical-style changes, then retrain adversarially","s":2,"fb":"Right. Measure, then harden."},{"t":"Nothing, graffiti is rare","s":0,"fb":"Safety demands testing."},{"t":"Only the brake pads","s":0,"fb":"The vision model is the issue."}]},{"prompt":"Why use only the sign of the gradient?","choices":[{"t":"It gives a simple, bounded step within the budget","s":2,"fb":"Right. Every pixel moves at most epsilon."},{"t":"Signs are prettier","s":0,"fb":"No."},{"t":"Gradients are always zero","s":0,"fb":"They are not."}]}]},"lab":{"type":"order","title":"Build an FGSM test","prompt":"Put the FGSM steps in order.","items":["Start with a correctly classified input","Compute the gradient of the loss","Keep only its sign","Scale by epsilon and add to the input","Check whether the model is now wrong"],"explain":"Defenders use this to stress-test their own models."}},{"title":"Defending against evasion","minutes":3,"slides":[{"scene":{"type":"graph","title":"Defences and their trade-offs","nodes":[{"id":"at","label":"Adversarial training:\nmost used, costs time\nand some accuracy","p":[-5.2,0.0,-0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"cd","label":"Certified defences:\nmathematical guarantee\nwithin a set size","p":[-2.6,1.5,0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"it","label":"Input transformation\nand detection tests","p":[0.0,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"en","label":"Ensembles of\ndifferent models","p":[2.6,1.5,0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"gm","label":"Gradient masking:\nNOT a real defence","p":[5.2,0.0,-0.3],"c":"red","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["at"],["cd"],["it"],["en"],["gm"]]},"say":["Several defences resist evasion, each with trade-offs.","Adversarial training adds adversarial examples, often from PGD, to training so the model learns to resist them. It is the most widely used, but costs training time and often a little normal accuracy.","Certified defences, such as randomised smoothing, give a mathematical guarantee that no change within a set size can flip the answer. Empirical defences have only been shown to resist the attacks tried.","Input transformation can wash out small changes, and detection tests look for suspicious inputs.","Ensembles of diverse models are harder to fool together, because attacks often fail to transfer across different designs. Defensive distillation trains a second model on the first's soft probability outputs.","Gradient masking, simply hiding gradients, is not a real defence: attackers get round it with a substitute model. Remember the trade-offs: robustness against normal accuracy, and detection against computing cost."]}],"keyPoint":"Adversarial training is the workhorse, certified defences give bounded guarantees, ensembles and detection add layers. Hiding gradients is not a defence.","plain":["Certified means proven within a stated size of change, not proven against everything.","Diverse ensembles resist transfer attacks.","Gradient masking gives false comfort.","No model is perfectly accurate and perfectly robust."],"check":{"q":"Why is gradient masking not a real defence?","o":["Attackers use a substitute model to get round it","It is too expensive","It makes models faster"],"a":0,"e":"Hiding a weakness does not remove it.","retry":{"q":"What does a certified defence guarantee?","o":["No change within a set size can flip the answer","Total immunity","Faster training"],"a":0,"e":"Guarantees are bounded."}},"scenario":{"title":"Perfect and robust?","setting":"A manager asks for a model that is perfectly accurate and perfectly robust.","steps":[{"prompt":"What do you explain?","choices":[{"t":"There is a trade-off, so we manage risk with layered defences","s":2,"fb":"Right. Risk management, not perfection."},{"t":"It is easy","s":0,"fb":"It is not achievable."},{"t":"Robustness does not matter","s":0,"fb":"It matters greatly."}]},{"prompt":"Which defence would you start with?","choices":[{"t":"Adversarial training with PGD, measuring the accuracy cost","s":2,"fb":"Right. The standard first step."},{"t":"Gradient masking","s":0,"fb":"Not a real defence."},{"t":"None","s":0,"fb":"Fragile models invite attack."}]}]},"lab":{"type":"sort","title":"Real defence or false comfort?","prompt":"Classify each approach.","buckets":["Real defence","False comfort"],"items":[{"t":"Adversarial training with PGD","b":0},{"t":"Hiding gradients from attackers","b":1},{"t":"Randomised smoothing certification","b":0},{"t":"Diverse model ensembles","b":0},{"t":"Assuming attackers will not try","b":1}],"explain":"Real defences survive an attacker who knows them."}},{"title":"Poisoning attacks and prevention","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three poisoning attacks","nodes":[{"id":"av","label":"Availability:\nworse for everyone,\neasy, noticed","p":[-5.2,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"ti","label":"Targeted integrity:\nchosen inputs fail,\nmedium stealth","p":[0.0,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"bd","label":"Backdoor:\nsecret trigger,\nhigh stealth, critical","p":[5.2,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[],"steps":["all",["av"],["ti"],["bd"]]},"say":["Adversarial examples attack a finished model; poisoning attacks it while it learns.","An availability attack adds noise or contradictory labels so accuracy drops for everyone. It is easy, but quickly noticed.","A targeted integrity attack is surgical, for example making one malware family look safe while everything else works.","A backdoor adds training examples carrying a small trigger, such as a tiny patch in an image's corner, with the wrong label. The model behaves perfectly until it sees the trigger, so it passes normal accuracy tests. Defences: outlier detection, with people reviewing what it flags; provenance tracking to find and remove a compromised supplier's data; RONI, Reject On Negative Impact, which tests each new batch on a trusted set; robust learning, which limits any small group's influence; and tools such as Neural Cleanse that look for triggers. Treat third-party models and datasets as supply-chain risks."]}],"keyPoint":"Availability attacks are loud, targeted attacks are surgical, and backdoors are stealthy and pass normal tests. Layer outlier detection, provenance, RONI, robust learning and backdoor scans.","plain":["A backdoor is a secret password that changes the model's answer.","RONI rejects data that makes the model worse.","Unusual but genuine data can also look like an outlier, so people review.","Downloaded models are a supply chain risk."],"check":{"q":"Which poisoning attack passes normal accuracy tests?","o":["Backdoor","Availability","None"],"a":0,"e":"It only misbehaves on the trigger.","retry":{"q":"What does RONI do?","o":["Rejects a data batch that makes the model worse on a trusted set","Encrypts data","Speeds up training"],"a":0,"e":"Reject On Negative Impact."}},"scenario":{"title":"The suspicious classifier","setting":"Your malware classifier suddenly rates one malware family as safe, while all other results stay accurate.","steps":[{"prompt":"Which attack fits?","choices":[{"t":"A targeted integrity poisoning attack","s":2,"fb":"Right. Surgical and selective."},{"t":"An availability attack","s":1,"fb":"That would hurt everything."},{"t":"Nothing is wrong","s":0,"fb":"Selective failure is a warning sign."}]},{"prompt":"How would you investigate?","choices":[{"t":"Check training data provenance and recent batches for that family","s":2,"fb":"Right. Trace the data."},{"t":"Delete the model","s":0,"fb":"Investigate first."},{"t":"Retrain on the same data","s":0,"fb":"That repeats the poisoning."}]}]},"lab":{"type":"sort","title":"Which defence?","prompt":"Match each poisoning defence to what it does.","buckets":["Outlier detection","Provenance tracking","RONI","Neural Cleanse"],"items":[{"t":"Find training points that do not fit","b":0},{"t":"Trace which supplier sent each dataset","b":1},{"t":"Reject a batch that lowers trusted-set accuracy","b":2},{"t":"Search for small trigger patterns","b":3}],"explain":"Layered checks catch what single checks miss."}},{"title":"Model extraction and protecting your models","minutes":4,"slides":[{"scene":{"type":"graph","title":"How models are copied through their API","nodes":[{"id":"eq","label":"Equation solving:\nsimple models, d+1 queries","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"kd","label":"Knowledge distillation:\ntrain a substitute copy","p":[-1.73,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"al","label":"Active learning:\nquery near boundaries","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"mi","label":"Membership inference:\nwas this record used?","p":[5.2,1.5,0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["eq"],["kd"],["al"],["mi"]]},"say":["Model extraction builds a copy of someone else's model by sending questions and recording the answers.","For a simple linear model with d features, about d plus one well-chosen queries give enough equations to solve for every parameter.","For complex models, knowledge distillation trains a substitute to mimic the victim's answers, especially its probability scores.","Active learning chooses queries near decision boundaries, copying the model with fewer queries. A copy lets attackers craft adversarial examples offline and may leak private data.","Membership inference asks whether a person's record was in the training data, because models are often more confident on data they have seen. For a medical model, membership alone could reveal someone is a patient."]},{"scene":{"type":"graph","title":"Making copying slower, costlier and provable","nodes":[{"id":"rl","label":"Rate limiting,\nadaptive","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"pp","label":"Prediction perturbation:\nless detail in outputs","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"ad","label":"Anomaly detection:\nsystematic sweeps","p":[0.0,0.0,-0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"wm","label":"Watermarks and\nfingerprinting","p":[2.6,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"lg","label":"Legal and\neconomic controls","p":[5.2,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["rl"],["pp"],["ad"],["wm"],["lg"]]},"say":["Defences work in tiers.","Rate limiting caps queries per user and tightens when patterns look suspicious.","Prediction perturbation returns less detail, such as 'high confidence' instead of 0.8734, which also weakens membership inference.","Anomaly detection spots queries sweeping the input space or clustering near boundaries. Calibrate carefully: too strict annoys customers, too loose leaks the model.","Watermarks prove ownership: a backdoor watermark gives a secret answer to inputs only the owner knows, and fingerprinting gives each customer a slightly different version so a leak reveals its source.","Legal controls, contracts, copyright, trade secrets and laws such as the UK Computer Misuse Act, complement the technical ones."]}],"keyPoint":"Models can be copied through queries and can leak membership. Defend with rate limits, less detailed outputs and anomaly detection, and prove ownership with watermarks and legal controls.","plain":["Extraction is copying a recipe by tasting the dish thousands of times.","Rounding scores slows thieves and protects privacy.","Fingerprinting traces a leak to its source.","Watermarks can be weakened by fine-tuning or pruning."],"check":{"q":"How many well-chosen queries can reveal a linear model with d features?","o":["About d + 1","Exactly 1","Millions always"],"a":0,"e":"Enough equations to solve for each parameter.","retry":{"q":"Why return 'high confidence' instead of 0.8734?","o":["Less detail slows extraction and weakens membership inference","It looks friendlier","Numbers are banned"],"a":0,"e":"Prediction perturbation."}},"scenario":{"title":"The suspicious competitor","setting":"A competitor releases a model that behaves suspiciously like yours.","steps":[{"prompt":"How could you prove theft?","choices":[{"t":"Test it with your secret watermark inputs and compare fingerprints","s":2,"fb":"Right. Watermarks support attribution."},{"t":"Ask them nicely","s":0,"fb":"Not proof."},{"t":"You cannot","s":0,"fb":"Watermarks exist for this."}]},{"prompt":"How do you defend your public sentiment API without annoying customers?","choices":[{"t":"Adaptive rate limits, rounded outputs and monitoring, tuned on real usage","s":2,"fb":"Right. Calibrate the balance."},{"t":"Block everyone","s":0,"fb":"Kills the service."},{"t":"No limits at all","s":0,"fb":"Invites extraction."}]}]},"lab":{"type":"sort","title":"Attack or defence?","prompt":"Is each item an extraction attack technique or a defence?","buckets":["Attack technique","Defence"],"items":[{"t":"Training a substitute on the victim's answers","b":0},{"t":"Rate limiting per API key","b":1},{"t":"Querying near decision boundaries","b":0},{"t":"Returning rounded confidence scores","b":1},{"t":"Hiding a watermark in model behaviour","b":1},{"t":"Guessing whether a record was in training data","b":0}],"explain":"Know the attack to choose the defence."}},{"title":"Defence in depth","minutes":3,"slides":[{"scene":{"type":"graph","title":"Five layers, read from the bottom up","nodes":[{"id":"l1","label":"1. Data protection:\nsanitise, provenance","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"l2","label":"2. Model hardening:\nadversarial training,\ncertification","p":[-2.6,1.5,0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"l3","label":"3. Query defences:\nrate limits, rounding,\nanomaly detection","p":[0.0,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"l4","label":"4. Watermarks and\nmonitoring","p":[2.6,1.5,0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"l5","label":"5. Legal and\nincident response","p":[5.2,0.0,-0.3],"c":"red","shape":"sphere","size":0.8,"ls":0.62}],"links":[["l1","l2",2],["l2","l3",2],["l3","l4",2],["l4","l5",2]],"steps":["all",["l1"],["l2"],["l3"],["l4"],["l5"]]},"say":["No single defence is enough, so the chapter brings them together in five layers.","Data protection comes first, because everything is built on the data: sanitise training data and track provenance.","Model hardening makes the model resist small changes, with adversarial training and certified robustness. Madry and colleagues showed in 2018 that PGD-based adversarial training gives good resistance, though clean accuracy usually falls slightly and training takes several times longer.","Query defences protect the doorway: rate limits, output rounding and anomaly detection.","Watermarks and monitoring watch for drift, odd queries and falling accuracy, and support proof of ownership.","Legal protection and a tested incident response plan cover what happens when something goes wrong anyway. The layers address different threats: adversarial training does not stop extraction, rate limits do not stop poisoning, and watermarks help only afterwards."]}],"keyPoint":"Data protection, model hardening, query defences, watermarks and monitoring, and legal and incident response together make attacks harder, slower and more visible.","plain":["Each layer catches what the others miss.","Watermarks help after theft; they do not prevent it.","Measure the robustness-accuracy trade-off yourself.","Certified guarantees hold only within a stated change size."],"check":{"q":"Which layer helps prove ownership after a model is stolen?","o":["Watermarks and monitoring","Data protection","Rate limiting alone"],"a":0,"e":"Watermarks support attribution.","retry":{"q":"Does adversarial training stop model extraction?","o":["No, different threats need different layers","Yes, completely","Only on Fridays"],"a":0,"e":"Layers address different threats."}},"scenario":{"title":"The medical AI","setting":"You protect a medical diagnosis AI with a limited budget.","steps":[{"prompt":"Which layer would you invest in first?","choices":[{"t":"Data protection, since everything is built on trusted data","s":2,"fb":"A strong answer; hardening is a close second."},{"t":"Legal contracts only","s":1,"fb":"Useful, but prevention comes first."},{"t":"None","s":0,"fb":"Patient safety needs protection."}]},{"prompt":"What do certified defences NOT guarantee?","choices":[{"t":"Protection against changes larger than the stated size","s":2,"fb":"Right. Guarantees are bounded."},{"t":"Anything at all","s":0,"fb":"They do guarantee within bounds."},{"t":"Faster inference","s":0,"fb":"Not their purpose."}]}]},"lab":{"type":"order","title":"Stack the layers","prompt":"Put the five defence layers in order, from the foundation up.","items":["Data protection","Model hardening","Query defences","Watermarks and monitoring","Legal and incident response"],"explain":"Read from the bottom up: data first, response last."}},{"title":"Operating AI securely","minutes":3,"slides":[{"scene":{"type":"graph","title":"Security after deployment","nodes":[{"id":"dm","label":"Drift\nmonitoring","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"ico","size":0.8,"ls":0.62},{"id":"vr","label":"Versioning and\nrollback","p":[-2.6,1.5,0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62},{"id":"rt","label":"Red teaming\n(MITRE ATLAS)","p":[0.0,0.0,-0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62},{"id":"fo","label":"AI forensics:\nattack or drift?","p":[2.6,1.5,0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"gv","label":"Governance:\nowners, approvals","p":[5.2,0.0,-0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[],"steps":["all",["dm"],["vr"],["rt"],["fo"],["gv"]]},"say":["A model secure on launch day may not be secure six months later.","Drift monitors compare live data and performance with training. A slow, deliberate injection of manipulated data can look like natural drift, so alerts need investigation.","Versioning stores every model and dataset version so a compromised model can be replaced quickly with a known-good one.","Red teaming means an authorised team acting as attackers against your own system, within agreed rules. MITRE ATLAS catalogues adversarial techniques and real cases for planning exercises.","AI forensics asks whether odd behaviour is an attack or natural change, using provenance, version history, query logs and comparison with a trusted earlier model.","Governance gives every model an owner, a risk assessment, approval before release and a review cycle. Security is risk management, not a one-off certificate."]}],"keyPoint":"Monitor drift, version everything for rollback, red-team your own systems, investigate with AI forensics, and govern every model. Security is ongoing risk management.","plain":["Slow poisoning can look like natural drift.","Versioning enables fast rollback.","Red teams attack with permission to find weaknesses first.","MITRE ATLAS is a catalogue of AI attack techniques."],"check":{"q":"What is red teaming?","o":["An authorised team simulating attacks on your own system","Painting servers red","A sports team"],"a":0,"e":"Find weaknesses before attackers do.","retry":{"q":"Why can drift alerts need investigation?","o":["Slow deliberate poisoning can look like natural drift","Drift is always harmless","Alerts are always wrong"],"a":0,"e":"Forensics separates attack from change."}},"scenario":{"title":"Disclose or not?","setting":"A researcher finds a serious weakness in a widely used AI model before any defence exists.","steps":[{"prompt":"What is the responsible path?","choices":[{"t":"Coordinated disclosure: tell the owner first, agree a timeline, then publish","s":2,"fb":"Right. Balance safety and openness."},{"t":"Publish immediately with attack code","s":0,"fb":"Puts users at risk."},{"t":"Never tell anyone","s":0,"fb":"The weakness stays unfixed."}]},{"prompt":"An adversarial example causes an accident. Who bears responsibility?","choices":[{"t":"It is shared and debated: developer, deployer and attacker each have a role","s":2,"fb":"Right. Governance should set expectations in advance."},{"t":"Only the attacker","s":1,"fb":"The attacker is culpable, but design duties matter."},{"t":"Nobody","s":0,"fb":"Accountability matters."}]}]},"lab":{"type":"sort","title":"Which practice?","prompt":"Match each activity to its operational practice.","buckets":["Drift monitoring","Versioning","Red teaming","AI forensics","Governance"],"items":[{"t":"Alert when input statistics shift","b":0},{"t":"Restore last month's trusted model","b":1},{"t":"Authorised staff try to fool the model","b":2},{"t":"Decide whether odd behaviour was an attack","b":3},{"t":"Require approval before each release","b":4}],"explain":"Operations keep a model secure long after launch."}}],"test":[{"q":"Model weights are…","o":["The numbers a model learns","Server weights","File sizes"],"a":0,"e":"","lesson":0},{"q":"Provenance is…","o":["Where data came from and who changed it","A file format","A firewall"],"a":0,"e":"","lesson":1},{"q":"Transferability means…","o":["Attacks on one model often work on another","Data moves itself","Models are portable"],"a":0,"e":"","lesson":1},{"q":"FGSM takes…","o":["One step uphill in the direction of more error","Many steps downhill","No steps"],"a":0,"e":"","lesson":2},{"q":"PGD is…","o":["A many-step, stronger attack used as the standard robustness test","A database","A privacy law"],"a":0,"e":"","lesson":2},{"q":"Adversarial training's usual cost is…","o":["Training time and a little clean accuracy","Nothing","More data breaches"],"a":0,"e":"","lesson":3},{"q":"Gradient masking is…","o":["Not a real defence","The best defence","Required by law"],"a":0,"e":"","lesson":3},{"q":"A backdoor attack…","o":["Activates only on a secret trigger","Lowers accuracy for everyone","Copies the model"],"a":0,"e":"","lesson":4},{"q":"RONI stands for…","o":["Reject On Negative Impact","Run Only New Inputs","Random Output Noise Injection"],"a":0,"e":"","lesson":4},{"q":"Knowledge distillation extraction…","o":["Trains a substitute on the victim's answers","Deletes the model","Encrypts data"],"a":0,"e":"","lesson":5},{"q":"Membership inference asks…","o":["Whether a record was in the training data","Who owns the model","How fast it runs"],"a":0,"e":"","lesson":5},{"q":"Fingerprinting helps…","o":["Trace which customer leaked a model","Speed up training","Remove bias"],"a":0,"e":"","lesson":5},{"q":"The first defence layer is…","o":["Data protection","Legal response","Rate limiting"],"a":0,"e":"","lesson":6},{"q":"Watermarks…","o":["Help prove ownership after theft","Prevent all theft","Improve accuracy"],"a":0,"e":"","lesson":6},{"q":"MITRE ATLAS is…","o":["A catalogue of adversarial AI techniques","A map of servers","A cloud provider"],"a":0,"e":"","lesson":7},{"q":"Versioning enables…","o":["Rapid rollback to a known-good model","Faster typing","Cheaper storage"],"a":0,"e":"","lesson":7}]};
