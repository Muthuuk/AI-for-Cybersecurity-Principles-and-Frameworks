/* Chapter 6: AI Security Implementation Case Studies (Guide to AI for Cybersecurity) */
const CH = {"id":"ch06","num":"6","title":"AI Security Implementation Case Studies","summary":"Why good AI security technology still produces disappointing projects, and what successful organisations do differently: three success cases, three failures, costs and returns, change management, vendor selection, scaling, compliance and a decision framework.","outcomes":["Score an implementation across six weighted success dimensions","Explain what made the bank, defence and hospital cases succeed","Diagnose the shared root causes behind failed projects","Calculate total cost of ownership and simple payback","Plan change management, vendor selection and phased scaling","Apply a five-phase implementation decision framework"],"starter":[{"q":"Most disappointing AI security projects fail mainly because of…","o":["Weak algorithms","Organisational factors such as readiness and planning","Too much testing"],"a":1,"e":"The chapter attributes about 70 per cent of success to organisational factors."},{"q":"The price of the software is…","o":["The whole cost of the project","Only part of the total cost","Usually the hidden cost"],"a":1,"e":"Technology is typically only 30 to 40 per cent of three-year total cost."},{"q":"Before buying an AI security product, the best test is…","o":["The vendor's demo","A trial on your own data and systems","A low price"],"a":1,"e":"A proof of concept on real data exposes problems early."}],"lessons":[{"title":"The implementation gap","minutes":3,"slides":[{"scene":{"type":"graph","title":"Six weighted dimensions of success","nodes":[{"id":"tp","label":"Technical\nperformance 25%","p":[0.0,3.2,0],"c":"cyan","shape":"ico","size":0.8,"ls":0.6},{"id":"or","label":"Organisational\nreadiness 20%","p":[3.64,1.9,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"se","label":"Stakeholder\nengagement 15%","p":[3.64,-0.7,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"ra","label":"Resource\nallocation 15%","p":[0.0,-2.0,0],"c":"green","shape":"cyl","size":0.8,"ls":0.6},{"id":"rm","label":"Risk\nmanagement 15%","p":[-3.64,-0.7,0],"c":"red","shape":"shield","size":0.8,"ls":0.6},{"id":"ls","label":"Long-term\nsustainability 10%","p":[-3.64,1.9,0],"c":"pink","shape":"torus","size":0.8,"ls":0.6}],"links":[],"steps":["all",["tp"],["or"],["se"],["ra"],["rm"],["ls"],"all"],"orbit":0.4},"say":["Welcome to Chapter 6, AI Security Implementation Case Studies, and I'm Sam, your tutor. The surprise in this chapter is that good technology still produces disappointing projects, usually for organisational reasons.","Technical performance carries a quarter of the weight: accuracy, speed and scale, with accuracy above 95 per cent as the warning line.","Organisational readiness, a fifth: skills, infrastructure and culture.","Stakeholder engagement: buy-in, training and support from everyone affected by the project.","Resource allocation: budget, people and timeline, kept within ten per cent of plan.","Risk management: mitigation, monitoring and response.","And long-term sustainability: a maintenance plan of five years or more.","Together the people and process dimensions carry far more weight than technology alone, which is why the chapter says roughly 70 per cent of success is organisational. The weights are a starting point to tailor."]}],"keyPoint":"Most AI security projects that disappoint fail for organisational reasons. A weighted framework turns 'it went quite well' into a score you can compare across projects.","plain":["Think of a car: a great engine is no use without a trained driver, fuel and a map.","A stakeholder is anyone affected by the project or able to affect it.","Each dimension has a warning line below which trouble is likely.","The headline failure figures are often reported, not precise measurements."],"check":{"q":"According to the chapter, what mostly decides whether an AI security project succeeds?","o":["The algorithm chosen","Organisational factors such as readiness, people and planning","The size of the budget"],"a":1,"e":"About 70 per cent of success is attributed to organisational factors.","retry":{"q":"In the car picture, what does the trained driver stand for?","o":["The organisation's people and readiness","The AI model","The vendor"],"a":0,"e":"Technology is the engine; people make it go somewhere."}},"scenario":{"title":"The brilliant pilot","setting":"A vendor demo shows 99 per cent accuracy. Your board wants to buy today and \"sort the people side later\".","steps":[{"prompt":"What is the main risk?","choices":[{"t":"Staff are not ready, so the system is ignored","s":2,"fb":"Right. That is the most common failure pattern."},{"t":"The accuracy figure is too high","s":1,"fb":"Worth checking on your data, but people are the bigger risk."},{"t":"There is no risk with 99 per cent accuracy","s":0,"fb":"Technology alone rarely decides success."}]},{"prompt":"What would you propose?","choices":[{"t":"Score readiness across all six dimensions before committing","s":2,"fb":"Right. That turns a hunch into evidence."},{"t":"Buy now and train later","s":0,"fb":"That is how the chapter's failures began."},{"t":"Cancel AI entirely","s":0,"fb":"The right project can still succeed."}]}]},"lab":{"type":"sort","title":"Which dimension?","prompt":"Place each concern in its success dimension.","buckets":["Technical","Organisational","Stakeholders","Resources","Risk","Sustainability"],"items":[{"t":"Detection accuracy on live traffic","b":0},{"t":"Analysts lack data skills","b":1},{"t":"Managers have not bought in","b":2},{"t":"Budget overrun of 25 per cent","b":3},{"t":"No incident response for model failure","b":4},{"t":"No plan for updates after year one","b":5}],"explain":"Scoring each dimension shows exactly where a project is weak."}},{"title":"Case 1: a global bank's phased roll-out","minutes":3,"slides":[{"scene":{"type":"graph","title":"Eighteen months, one proven phase at a time","nodes":[{"id":"as","label":"Assessment and\nproof of concept\nmonths 1–3","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"pi","label":"Pilot in three\ndata centres\nmonths 4–9","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"rg","label":"Regional\ndeployment\nmonths 10–15","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"gl","label":"Global roll-out\nmonths 16–18","p":[5.2,1.5,0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[["as","pi",2],["pi","rg",2],["rg","gl",2]],"steps":["all",["as"],["pi"],["rg"],["gl"],"all"]},"say":["The first success story is a composite global bank with more than 50,000 staff, regulated for financial reporting and card payments. It began with 45 per cent false alarms and a mean time to detect, the average delay before noticing an attack, of eight and a half hours.","First came assessment, with a two-month proof of concept on the bank's own data.","Then a pilot in three data centres.","Then regional deployment, where European data protection rules appeared that had been invisible in North America.","Finally the global roll-out. Detection time fell to about two hours, false alarms to about 7 per cent, and payback came in about 14 months.","Three of its four success factors were about people: thorough planning, rigorous vendor evaluation, about 800,000 dollars on change management, and executive sponsorship."]}],"keyPoint":"Measure the starting point, set targets in advance, prove each phase before the next, and invest in people. Phasing also gives time to discover hidden requirements such as GDPR.","plain":["Like climbing a mountain with base camps: you stop, check and acclimatise before going higher.","Mean time to detect is how long an attack runs before anyone notices.","Without a baseline you cannot prove improvement.","Hidden rules often appear only when you enter a new region."],"check":{"q":"Why did the bank's phased approach help with GDPR?","o":["GDPR does not apply to banks","It had time to deal with GDPR before going global","It skipped Europe"],"a":1,"e":"Phasing exposed the requirement before the full roll-out.","retry":{"q":"In the mountain picture, what are the base camps?","o":["Validation points between phases","The vendors","The data centres"],"a":0,"e":"Each phase proves itself before the next climb."}},"scenario":{"title":"Six months instead of eighteen?","setting":"A new chief executive asks why the bank could not have done it in six months.","steps":[{"prompt":"What is the honest answer?","choices":[{"t":"It could, but hidden problems would have hit everywhere at once","s":2,"fb":"Right. Phasing limits the damage."},{"t":"It is impossible to go faster","s":1,"fb":"Not impossible, just riskier."},{"t":"Speed has no downside","s":0,"fb":"Rushing caused all three of the chapter's failures."}]},{"prompt":"Which success factor matters most for a small firm on a tight budget?","choices":[{"t":"Keep executive sponsorship and invest in training","s":2,"fb":"Right. These people factors cost little and matter most."},{"t":"Copy the bank's 800,000-dollar budget","s":0,"fb":"Adapt the idea, not the amount."},{"t":"Skip the proof of concept","s":0,"fb":"That is how the manufacturer failed."}]}]},"lab":{"type":"order","title":"Order the roll-out","prompt":"Put the bank's phases in order.","items":["Assessment and proof of concept","Pilot in three data centres","Regional deployment","Global roll-out"],"explain":"Each phase had to prove itself before the next began."}},{"title":"Case 2: malware analysis behind an air gap","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four ways to analyse malware samples","nodes":[{"id":"man","label":"Manual experts:\n4–6 hours, 98.5%","p":[-5.2,0.0,-0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"trad","label":"Traditional automation:\n30–45 min, 92.1%","p":[-1.73,1.5,0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"ai","label":"AI only:\n3–5 min, 96.8%","p":[1.73,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"hyb","label":"Hybrid human + AI:\n5–8 min, 99.2%","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["man"],["trad"],["ai"],["hyb"],"all"]},"say":["The second case is a defence agency on air-gapped networks, meaning physically cut off from the internet, like an island. No commercial cloud AI is allowed, and models are trained offline.","Manual experts were very accurate but took hours per sample, managing only two or three an hour.","Traditional automation was faster but less accurate.","AI alone was fastest, two to three hundred samples an hour, but less accurate than the experts.","The hybrid won: AI handles the routine bulk and sends novel, high-risk or low-confidence cases, below 88 per cent confidence, to experts. It gave the highest accuracy of all and dozens of times more throughput than people alone.","The no-cloud rule shaped every other decision, from vendor choice to how models are updated."]}],"keyPoint":"Constraints shape design. A hybrid that lets AI take routine work and sends uncertain cases to experts beat both humans alone and AI alone.","plain":["An air gap is like an island: everything arrives by controlled boat.","AI is the fast sorter; experts are the specialists for the hard cases.","A confidence threshold decides which cases go to people.","Say 'dozens of times more throughput', not inflated percentages."],"check":{"q":"Why did the hybrid beat AI alone?","o":["It used more servers","Experts reviewed the uncertain and novel cases","It ignored low-risk samples"],"a":1,"e":"Combining speed with expert judgement gave the highest accuracy.","retry":{"q":"What does air-gapped mean?","o":["Physically cut off from the internet","Running in the cloud","Using wireless networks"],"a":0,"e":"Like an island, everything is brought in through controlled processes."}},"scenario":{"title":"The cloud offer","setting":"A contractor proposes a cloud AI service to speed up the agency's malware analysis.","steps":[{"prompt":"What is the problem?","choices":[{"t":"It breaks the air-gap and security rules","s":2,"fb":"Right. No commercial cloud AI is allowed."},{"t":"Cloud is always slower","s":0,"fb":"Speed is not the issue."},{"t":"There is no problem","s":0,"fb":"It breaks the agency's core constraint."}]},{"prompt":"What compliant alternative exists?","choices":[{"t":"On-premises models trained offline, with expert review of uncertain cases","s":2,"fb":"Right. That is the hybrid the agency chose."},{"t":"Email samples to the vendor","s":0,"fb":"That moves secrets outside the air gap."},{"t":"Stop analysing malware","s":0,"fb":"The mission still needs analysis."}]}]},"lab":{"type":"sort","title":"Who handles it?","prompt":"In the hybrid design, who handles each sample?","buckets":["AI handles it","Expert reviews it"],"items":[{"t":"A known malware family, 97 per cent confidence","b":0},{"t":"A never-seen-before sample","b":1},{"t":"Confidence of 72 per cent","b":1},{"t":"A routine variant of common adware","b":0},{"t":"A sample linked to a high-risk target","b":1}],"explain":"Routine, confident cases stay with the AI; novel, risky or uncertain ones go to people."}},{"title":"Case 3: watching access without seeing patient data","minutes":3,"slides":[{"scene":{"type":"graph","title":"Privacy by design in a hospital group","nodes":[{"id":"col","label":"Collect logs\nwithout health data","p":[-5.2,0.0,-0.3],"c":"slate","shape":"slab","size":0.8,"ls":0.62},{"id":"pp","label":"Protect privacy:\nstrip identifiers, encrypt","p":[-1.73,1.5,0.3],"c":"cyan","shape":"shield","size":0.8,"ls":0.62},{"id":"ba","label":"Behaviour analytics\non metadata","p":[1.73,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"inv","label":"Human investigation\nwith audit trail","p":[5.2,1.5,0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[["col","pp",2],["pp","ba",2],["ba","inv",2]],"steps":["all",["col"],["pp"],["ba"],["inv"],"all"]},"say":["The third case is a hospital group with about two million patients under HIPAA, the US health privacy law. Staff were looking at records with no reason to, and old tools caught only 23 per cent of such cases.","It collects access logs without any patient health information.","It strips identifiers and encrypts, replacing names with codes. This is called pseudonymisation, and only authorised people can reverse it.","Behaviour analytics looks for unusual timing, such as 3 am access, unusual volume, such as bulk lookups, and unusual behaviour, such as viewing a celebrity patient.","People investigate, with every step recorded. Insider detection rose from 23 to 87 per cent, and privacy violations fell to zero.","An alert reads like: user 47852, nurse role, opened 127 records between 2 and 4 am. Suspicious, yet no medical detail is exposed."]}],"keyPoint":"Security and privacy can improve together when privacy is designed in from the start. Analyse metadata, use pseudonyms, and unmask identities only through a controlled process.","plain":["Pseudonymisation is like a cloakroom ticket: only the attendant can match the ticket to the coat.","Metadata is information about an action, such as when and how many, not the content.","Privacy by design means building it in, not bolting it on.","Unmasking needs a justified investigation."],"check":{"q":"How did the hospital monitor staff without exposing patient data?","o":["It read every medical record","It analysed access metadata with pseudonymised identities","It stopped monitoring"],"a":1,"e":"Metadata and pseudonyms kept medical details hidden.","retry":{"q":"In the cloakroom picture, who can match a code to a real person?","o":["Anyone in IT","Only authorised people under defined conditions","Nobody, ever"],"a":1,"e":"Re-identification is controlled and justified."}},"scenario":{"title":"The 3 am lookups","setting":"An alert shows a pseudonymous user opened 127 records between 2 and 4 am from an unusual location.","steps":[{"prompt":"What should happen first?","choices":[{"t":"Start a controlled investigation and unmask only if justified","s":2,"fb":"Right. That respects both security and privacy."},{"t":"Publish the user's name to all staff","s":0,"fb":"That breaches privacy and fairness."},{"t":"Ignore it, night shifts exist","s":1,"fb":"Context matters, but 127 records deserves a look."}]},{"prompt":"Who should approve unmasking?","choices":[{"t":"A named role such as the privacy officer, with a recorded reason","s":2,"fb":"Right. Controlled and auditable."},{"t":"Any analyst who is curious","s":0,"fb":"Unmasking must be justified."},{"t":"The vendor","s":0,"fb":"The organisation keeps that control."}]}]},"lab":{"type":"sort","title":"Timing, volume or behaviour?","prompt":"Classify each anomaly the hospital system looks for.","buckets":["Timing","Volume","Behaviour"],"items":[{"t":"Access at 3 am","b":0},{"t":"Opening hundreds of records in an hour","b":1},{"t":"Looking up a celebrity patient","b":2},{"t":"Access while on annual leave","b":0},{"t":"Copying data just before leaving the job","b":2}],"explain":"Different anomaly types catch different kinds of insider misuse."}},{"title":"Three failures, one story","minutes":3,"slides":[{"scene":{"type":"graph","title":"Different industries, the same root causes","nodes":[{"id":"mf","label":"Manufacturing:\ncheapest vendor,\nno proof of concept","p":[-5.2,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"gov","label":"Government:\nno privacy assessment,\nunauthorised cloud","p":[-1.73,1.5,0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62},{"id":"rt","label":"Retail:\npoorly tested model,\n60% false alarms","p":[1.73,0.0,-0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"root","label":"Shared causes:\nplanning, skills,\nintegration","p":[5.2,1.5,0.3],"c":"slate","shape":"ico","size":0.8,"ls":0.62}],"links":[["mf","root",2,"red"],["gov","root",2,"red"],["rt","root",2,"red"]],"steps":["all",["mf"],["gov"],["rt"],["root"]]},"say":["Three failed projects cost a combined 8.2 million dollars, and every one was preventable.","A manufacturer chose the cheapest vendor without a proof of concept. It could not work with old industrial control systems, raised 60 per cent false alarms, and was cancelled.","A government agency's system worked technically, but it trained on unprotected personal data, used an unauthorised cloud and skipped the privacy impact assessment. It was terminated.","A retailer launched a poorly trained model whose false alarms blocked genuine customers; lost sales exceeded the fraud saved.","All three shared poor planning, skills gaps and integration problems. Some mistakes, like a fundamental mismatch with legacy systems, cannot be fixed by spending more."]}],"keyPoint":"Failures come from ordinary early decisions: choosing on price, leaving compliance out, launching untested models. Upfront planning is cheap compared with what it prevents.","plain":["A fundamental mismatch is like buying a plug that does not fit your sockets; no budget makes it fit.","A proof of concept tests a product on your own systems before you commit.","Treat failures as learning, not blame.","Organisations that discuss failures improve faster."],"check":{"q":"What did all three failures have in common?","o":["Exotic technology going wrong","Inadequate planning, skills gaps and integration problems","Too much testing"],"a":1,"e":"The root causes were ordinary and preventable.","retry":{"q":"In the plug picture, why can't money fix the manufacturer's project?","o":["The mismatch with legacy systems is fundamental","The vendor was too expensive","The staff were too skilled"],"a":0,"e":"The only real fix is restarting with proper vendor selection."}},"scenario":{"title":"Rescue mission","setting":"You are asked to rescue the manufacturing project with an unlimited budget.","steps":[{"prompt":"Can you?","choices":[{"t":"Not by spending; the product is fundamentally incompatible, so restart vendor selection","s":2,"fb":"Right. Some mistakes cannot be optimised away."},{"t":"Yes, buy more servers","s":0,"fb":"Hardware does not fix incompatibility."},{"t":"Yes, retrain the staff","s":1,"fb":"Training helps adoption, not compatibility."}]},{"prompt":"What single step would have prevented it?","choices":[{"t":"A proof of concept on the factory's real systems","s":2,"fb":"Right. It would have exposed the mismatch early."},{"t":"A bigger launch event","s":0,"fb":"Publicity does not test compatibility."},{"t":"A cheaper vendor","s":0,"fb":"Price drove the problem."}]}]},"lab":{"type":"sort","title":"Name the failure","prompt":"Which failed project does each mistake belong to?","buckets":["Manufacturing","Government","Retail"],"items":[{"t":"No proof of concept on legacy systems","b":0},{"t":"Skipped the privacy impact assessment","b":1},{"t":"False alarms blocked real customers","b":2},{"t":"Used an unauthorised cloud","b":1},{"t":"Chose the cheapest supplier","b":0}],"explain":"Different triggers, same underlying causes."}},{"title":"ROI and total cost of ownership","minutes":3,"slides":[{"scene":{"type":"graph","title":"What a three-year project really costs","nodes":[{"id":"tech","label":"Technology\n30–40%","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"impl","label":"Implementation\nservices 25–35%","p":[-2.6,1.5,0.3],"c":"violet","shape":"cyl","size":0.8,"ls":0.62},{"id":"trn","label":"Training and\nchange 15–25%","p":[0.0,0.0,-0.3],"c":"amber","shape":"cyl","size":0.8,"ls":0.62},{"id":"ops","label":"Ongoing operations\n10–15%","p":[2.6,1.5,0.3],"c":"green","shape":"cyl","size":0.8,"ls":0.62},{"id":"hid","label":"Hidden costs\n5–10%","p":[5.2,0.0,-0.3],"c":"red","shape":"cyl","size":0.8,"ls":0.62}],"links":[],"steps":["all",["tech"],["impl"],["trn"],["ops"],["hid"],"all"]},"say":["Total cost of ownership, or TCO, is everything a system costs over its life, not just the price tag.","Technology is only 30 to 40 per cent.","Implementation services add 25 to 35 per cent.","Training and change management, 15 to 25 per cent.","Ongoing operations, 10 to 15 per cent.","And hidden costs such as delays and lost productivity, 5 to 10 per cent.","Budgeting only for technology leaves most of the real cost unplanned. For return on investment, compare all benefits, including efficiency, with the full cost. Simple payback is total cost divided by annual benefit: the bank's 4.2 million dollars over 3.1 million a year is about 16 months, and the chapter reports 14 because of when costs actually fell."]}],"keyPoint":"Count the full cost and all the benefits. Test the case with pessimistic assumptions; a business case that still works then is far more credible.","plain":["The price of a car is not what it costs to run one.","Payback is how long benefits take to cover the cost.","Sensitivity analysis asks: what if we are wrong by 30 per cent?","Net present value treats a dollar next year as worth less than a dollar today."],"check":{"q":"Budgeting only for technology typically leaves how much of the real cost unplanned?","o":["About 10 per cent","About 60 to 70 per cent","None"],"a":1,"e":"Technology is only 30 to 40 per cent of three-year TCO.","retry":{"q":"A project costs 2 million and saves 1 million a year. Simple payback is about…","o":["Two years","Six months","Ten years"],"a":0,"e":"Cost divided by annual benefit: 2 ÷ 1 = 2 years."}},"scenario":{"title":"The sceptical finance director","setting":"Your business case shows payback in 12 months. The finance director asks what happens if it takes 50 per cent longer and benefits are 30 per cent lower.","steps":[{"prompt":"What should your case already contain?","choices":[{"t":"A sensitivity analysis with pessimistic scenarios","s":2,"fb":"Right. That makes the case credible."},{"t":"Only the best case","s":0,"fb":"That invites rejection."},{"t":"No numbers at all","s":0,"fb":"Finance needs figures."}]},{"prompt":"Which benefit is most often forgotten?","choices":[{"t":"Efficiency gains such as analyst productivity","s":2,"fb":"Right. It is often worth a great deal."},{"t":"Breaches avoided","s":1,"fb":"Usually counted, sometimes over-counted."},{"t":"The vendor's logo","s":0,"fb":"Not a benefit."}]}]},"lab":{"type":"sort","title":"Where does it go?","prompt":"Place each cost in its TCO category.","buckets":["Technology","Implementation services","Training and change","Ongoing operations","Hidden costs"],"items":[{"t":"Software licences","b":0},{"t":"Integration consultants","b":1},{"t":"Hands-on lab training for analysts","b":2},{"t":"Monthly model monitoring","b":3},{"t":"Productivity lost during a delayed launch","b":4}],"explain":"Most of the cost lies outside the technology itself."}},{"title":"Change management","minutes":3,"slides":[{"scene":{"type":"graph","title":"Each group has different worries","nodes":[{"id":"ex","label":"Executives:\nreturn and risk","p":[-5.2,0.0,-0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"an","label":"Analysts:\njobs and trust in AI","p":[-1.73,1.5,0.3],"c":"violet","shape":"sphere","size":0.8,"ls":0.62},{"id":"it","label":"IT operations:\ncomplexity and support","p":[1.73,0.0,-0.3],"c":"cyan","shape":"sphere","size":0.8,"ls":0.62},{"id":"eu","label":"End users:\nprocess changes","p":[5.2,1.5,0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ex"],["an"],["it"],["eu"],"all"]},"say":["Change management means helping people move from the old way of working to the new one. A system analysts quietly ignore delivers nothing.","Executives worry about return and risk, so give them a business case, quick wins and progress reports.","Analysts worry about job loss and trusting the AI. Give hands-on training and a new role as supervisors of the AI; in the bank, the same team handled far more work.","IT operations worry about complexity and maintenance. Give documentation and a RACI chart showing who is Responsible, Accountable, Consulted and Informed.","End users worry about changes to their routine. Give simple steps and clear benefits.","The bank spent about 800,000 dollars on change and reached 90 per cent adoption. The manufacturer spent almost nothing and failed."]}],"keyPoint":"Plan adoption for each group separately: executives, analysts, IT operations and end users. Hands-on practice gives the best training results.","plain":["Analysts can sink a project simply by not using it.","Their role changes rather than disappears.","A RACI chart says who fixes what.","Early involvement in the pilot builds trust."],"check":{"q":"Which group can most quickly sink a project by quietly not using it?","o":["Executives","Security analysts","The vendor"],"a":1,"e":"Analysts' adoption decides whether the system delivers value.","retry":{"q":"What does a RACI chart record?","o":["Who is Responsible, Accountable, Consulted and Informed","Server temperatures","Attack signatures"],"a":0,"e":"It clarifies who does what."}},"scenario":{"title":"The worried analysts","setting":"Analysts fear the new AI system will replace them, and adoption in the pilot is low.","steps":[{"prompt":"What helps most?","choices":[{"t":"Involve them early, train them hands-on and explain their new supervisory role","s":2,"fb":"Right. Trust grows from involvement."},{"t":"Mandate use and track who resists","s":0,"fb":"Pressure without trust breeds workarounds."},{"t":"Delay training until after go-live","s":0,"fb":"Training must come first."}]},{"prompt":"What is non-negotiable in a minimum change programme?","choices":[{"t":"Executive sponsorship and hands-on training","s":2,"fb":"Right. These matter most."},{"t":"Branded mugs","s":0,"fb":"Nice, not essential."},{"t":"A launch party","s":0,"fb":"Not the priority."}]}]},"lab":{"type":"sort","title":"What does each group need?","prompt":"Match each support measure to the group it mainly serves.","buckets":["Executives","Analysts","IT operations","End users"],"items":[{"t":"Quarterly progress reports with quick wins","b":0},{"t":"Hands-on lab training","b":1},{"t":"A RACI chart for maintenance","b":2},{"t":"Simple step-by-step guidance","b":3},{"t":"A new role supervising the AI","b":1}],"explain":"Tailored support for each group drives adoption."}},{"title":"Choosing a vendor","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four steps to a decision without regret","nodes":[{"id":"req","label":"1. Define\nrequirements","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"mkt","label":"2. Research\nthe market","p":[-1.73,1.5,0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"ev","label":"3. Evaluate and test\n(proof of concept)","p":[1.73,0.0,-0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"dec","label":"4. Decide: weighted\nscore and risks","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[["req","mkt",2],["mkt","ev",2],["ev","dec",2]],"steps":["all",["req"],["mkt"],["ev"],["dec"],"all"]},"say":["The chapter offers a structured four-step vendor process.","First, agree functional, technical and business requirements before talking to sellers.","Second, research the market for candidate vendors.","Third, evaluate and test: demonstrations, financial checks, reference calls and, above all, a proof of concept on your own data. It is the step most likely to reveal integration problems.","Fourth, decide with weighted scoring and a risk assessment. The suggested weights put technical capability at 30 per cent and integration at 20.","The cheapest vendor often ends up most expensive, and the top score is not automatically right: a close second with lower risk may be better. Source code escrow, a copy held by a third party, can protect you if a small supplier fails."]}],"keyPoint":"Requirements first, proof of concept on your own data, weighted scoring, then judgement about risk. Cheapest is rarely cheapest in the end.","plain":["A proof of concept is a test drive on your own roads, not the dealer's track.","Vendor viability asks whether the company will exist in five years.","Data format problems are common, so plan for them.","Escrow is insurance against a supplier disappearing."],"check":{"q":"Which step is most likely to reveal integration problems before money is committed?","o":["The sales presentation","A proof of concept on your own data","Reading the brochure"],"a":1,"e":"Testing on real data and systems exposes problems early.","retry":{"q":"In the test-drive picture, where should you drive?","o":["On your own roads, with your own data","Only on the dealer's track","Nowhere"],"a":0,"e":"Vendor demo data hides your real problems."}},"scenario":{"title":"Two finalists","setting":"Vendor A scores 86 but is a two-year-old start-up. Vendor B scores 83 and is long established.","steps":[{"prompt":"Which do you choose?","choices":[{"t":"Weigh the risk: B may be wiser, or A with escrow and safeguards","s":2,"fb":"Right. The score informs, judgement decides."},{"t":"Always the highest score","s":1,"fb":"Scores matter, but risk matters too."},{"t":"Neither, start again","s":0,"fb":"Both may be viable."}]},{"prompt":"What safeguard reduces the start-up risk?","choices":[{"t":"Source code escrow in the contract","s":2,"fb":"Right. It protects you if the supplier fails."},{"t":"A longer brochure","s":0,"fb":"No protection."},{"t":"Paying everything up front","s":0,"fb":"That increases risk."}]}]},"lab":{"type":"order","title":"Run the selection","prompt":"Put the vendor selection steps in order.","items":["Define requirements","Research the market","Evaluate and run a proof of concept","Score, assess risk and negotiate"],"explain":"Requirements before vendors, testing before contracts."}},{"title":"Scaling from pilot to enterprise","minutes":3,"slides":[{"scene":{"type":"graph","title":"Phased deployment with go/no-go gates","nodes":[{"id":"p1","label":"Priority environments\n15–25%","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"p2","label":"Core infrastructure\n50–60%","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"p3","label":"Business units\n75–85%","p":[0.0,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"p4","label":"Complete enterprise\n100%","p":[2.6,1.5,0.3],"c":"red","shape":"box","size":0.8,"ls":0.62},{"id":"p5","label":"Ongoing\noptimisation","p":[5.2,0.0,-0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[["p1","p2",2],["p2","p3",2],["p3","p4",2],["p4","p5",2]],"steps":["all",["p1"],["p2"],["p3"],["p4"],["p5"],"all"]},"say":["A successful pilot, with dedicated people and favourable conditions, does not guarantee enterprise success.","Phase one covers priority environments, a quarter or less of the estate.","Phase two, core infrastructure, about half.","Phase three, the business units.","Phase four, the complete enterprise, where risk is highest. In the chapter's example, twenty times the pilot's data pushed detection delay from 3 to 45 seconds and doubled false alarms until the system was tuned.","Then ongoing optimisation.","Each phase ends at a validation gate, a go or no-go decision on agreed measures. A gate only works if the organisation is truly willing to stop and fix problems."]}],"keyPoint":"Scale in phases with validation gates. Problems invisible in a pilot multiply at scale, and hidden requirements appear as deployment expands.","plain":["A pilot is like a dress rehearsal in an empty theatre; opening night is different.","A validation gate is a checkpoint you must pass, not a formality.","Training must keep pace with roll-out.","Phasing limits the damage when something goes wrong."],"check":{"q":"What should happen if a phase fails its validation gate?","o":["Carry on anyway","Stop, fix the problems, then re-test","Cancel the whole programme immediately"],"a":1,"e":"Gates exist so that problems are fixed before expanding.","retry":{"q":"In the theatre picture, why is opening night harder than rehearsal?","o":["More people, systems and data","The actors forget lines","There is no difference"],"a":0,"e":"Real scale brings complexity the pilot never saw."}},"scenario":{"title":"Everywhere at once?","setting":"Leadership wants to skip phases and deploy to all 40 data centres next month to save time.","steps":[{"prompt":"What is the risk?","choices":[{"t":"Problems hit everywhere at once, with no chance to learn","s":2,"fb":"Right. Phasing limits damage."},{"t":"None, the pilot worked","s":0,"fb":"Pilots hide scale problems."},{"t":"It will be slightly slower","s":0,"fb":"The risk is failure, not speed."}]},{"prompt":"Phase one shows latency rising from 3 to 45 seconds. What now?","choices":[{"t":"Hold the gate, tune and re-test before Phase two","s":2,"fb":"Right. That is what gates are for."},{"t":"Proceed and hope it improves","s":0,"fb":"It usually gets worse at scale."},{"t":"Remove the monitoring","s":0,"fb":"That hides the problem."}]}]},"lab":{"type":"order","title":"Order the scale-up","prompt":"Put the deployment phases in order.","items":["Priority environments","Core infrastructure","Business units","Complete enterprise","Ongoing optimisation"],"explain":"Coverage grows only after each gate is passed."}},{"title":"Optimisation, compliance and the decision framework","minutes":4,"slides":[{"scene":{"type":"graph","title":"Compliance timing decided two outcomes","nodes":[{"id":"gov","label":"Government agency:\ncompliance considered late,\nproject terminated","p":[-5.2,0.0,-0.3],"c":"red","shape":"shield","size":0.8,"ls":0.62},{"id":"hos","label":"Hospital group:\nprivacy by design,\n98% audit score","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["gov"],["hos"]]},"say":["Deployment is not the finish line. Live systems need tuning, and you should measure the real bottleneck first: algorithm, infrastructure, data processing or model tuning, such as adjusting hyperparameters, the settings chosen before training.","Compliance cannot be bolted on. The government agency left compliance experts out of procurement, so its problems were baked into data and suppliers.","The hospital built privacy in from day one and passed audits with zero violations. Auditors expect documentation of how models were built and tested and a log of every change. Technical success counts for nothing if the system breaks the law."]},{"scene":{"type":"graph","title":"Five-phase implementation decision framework","nodes":[{"id":"as","label":"1. Assess\nreadiness","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"st","label":"2. Develop\nstrategy","p":[-2.6,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"pl","label":"3. Plan","p":[0.0,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"ex","label":"4. Execute","p":[2.6,1.5,0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"op","label":"5. Optimise","p":[5.2,0.0,-0.3],"c":"green","shape":"torus","size":0.8,"ls":0.62}],"links":[["as","st",2],["st","pl",2],["pl","ex",2],["ex","op",2]],"steps":["all",["as"],["st"],["pl"],["ex"],["op"],"all"]},"say":["The chapter closes with a five-phase framework that pulls everything together.","Assess readiness: score technical, organisational and financial readiness out of 100 and average them. Over 80, proceed; 60 to 80, close gaps first; under 60, delay.","Develop a strategy with measurable objectives and agreed success criteria.","Plan the budget, staffing, a realistic timeline with gates, and a risk register listing each risk, its owner and its mitigation.","Execute, combining project management, change management and quality assurance.","Optimise: monitor, improve and track the return.","All three successes piloted first; all three failures rushed. Implementation is an ongoing capability, not a project with an end."]}],"keyPoint":"Tune by measuring the real bottleneck, build compliance in from the start, and use the five-phase framework: assess, strategise, plan, execute, optimise.","plain":["Measure before you fix, like a doctor diagnosing before prescribing.","A readiness score of 70 means adapt and close gaps, not stop.","A risk register lists each risk with an owner.","Pilot first, always."],"check":{"q":"A readiness assessment averages 65. What does the framework suggest?","o":["Proceed at full speed","Modify the approach and close gaps before committing","Abandon AI"],"a":1,"e":"Between 60 and 80 means close specific gaps first.","retry":{"q":"What is the key lesson from the government failure?","o":["Compliance must be built in from the start","Cloud is always forbidden","Audits are optional"],"a":0,"e":"Retrofitting compliance is often impossible and always expensive."}},"scenario":{"title":"The 2,000-person health organisation","setting":"A readiness check scores technical 65, organisational 55 and financial 75.","steps":[{"prompt":"What do you recommend?","choices":[{"t":"Delay, invest in training and hiring, then run a limited pilot","s":2,"fb":"Right. The average of 65 says close gaps first."},{"t":"Full roll-out next month","s":0,"fb":"Readiness is too low."},{"t":"Never use AI","s":0,"fb":"The gaps can be closed."}]},{"prompt":"Executives expect results in 12 months. What do you say?","choices":[{"t":"Reset expectations to a realistic 18 months","s":2,"fb":"Right. Honest timelines protect the project."},{"t":"Promise 6 months","s":0,"fb":"Over-promising led to the failures."},{"t":"Say nothing","s":0,"fb":"Expectations must be managed."}]}]},"lab":{"type":"order","title":"Apply the framework","prompt":"Put the five phases of the decision framework in order.","items":["Assess readiness","Develop strategy","Plan","Execute","Optimise"],"explain":"Skipping the assessment is the most common and costly shortcut."}}],"test":[{"q":"What share of success does the chapter attribute to organisational factors?","o":["About 30 per cent","About 70 per cent","About 95 per cent"],"a":1,"e":"Readiness, people and planning dominate.","lesson":0},{"q":"Which success dimension carries the highest single weight?","o":["Technical performance","Sustainability","Resource allocation"],"a":0,"e":"25 per cent, though people dimensions together outweigh it.","lesson":0},{"q":"What did the bank do before its pilot?","o":["A two-month proof of concept on its own data","A global launch","Nothing"],"a":0,"e":"Assessment included a real-data proof of concept.","lesson":1},{"q":"Mean time to detect measures…","o":["How long before an attack is noticed","How long a patch takes","Model training time"],"a":0,"e":"It is the delay between attack and detection.","lesson":1},{"q":"Which approach gave the highest accuracy in the defence case?","o":["AI only","Hybrid human + AI","Traditional automation"],"a":1,"e":"99.2 per cent, with experts reviewing uncertain cases.","lesson":2},{"q":"Pseudonymisation means…","o":["Replacing names with codes only authorised people can reverse","Deleting all data","Publishing data openly"],"a":0,"e":"It hides identity while allowing controlled investigation.","lesson":3},{"q":"The hospital's insider detection rose from 23 to…","o":["50 per cent","87 per cent","100 per cent"],"a":1,"e":"Metadata analytics made the difference.","lesson":3},{"q":"What sank the manufacturing project?","o":["Choosing the cheapest vendor without a proof of concept","Too much training","Strict regulation"],"a":0,"e":"Incompatibility with legacy systems was baked in.","lesson":4},{"q":"Why was the government project terminated?","o":["Compliance failures such as an unauthorised cloud and no privacy assessment","Low accuracy","Vendor bankruptcy"],"a":0,"e":"It worked technically but broke the rules.","lesson":4},{"q":"Technology is typically what share of three-year TCO?","o":["30 to 40 per cent","90 per cent","5 per cent"],"a":0,"e":"Most cost lies elsewhere.","lesson":5},{"q":"Sensitivity analysis asks…","o":["What if our assumptions are wrong?","Which vendor is cheapest?","How fast is the network?"],"a":0,"e":"Pessimistic scenarios make a case credible.","lesson":5},{"q":"Which group can sink a project by not using it?","o":["Security analysts","Auditors","Vendors"],"a":0,"e":"Adoption by analysts is decisive.","lesson":6},{"q":"Which vendor step best reveals integration problems?","o":["Proof of concept on your own data","Reference brochure","Price comparison"],"a":0,"e":"Real data, real systems.","lesson":7},{"q":"What is a validation gate?","o":["A go/no-go decision between phases","A firewall rule","A vendor contract"],"a":0,"e":"It must be willing to stop the roll-out.","lesson":8},{"q":"A readiness score above 80 suggests…","o":["Proceed","Delay","Abandon"],"a":0,"e":"Over 80 means ready to proceed.","lesson":9},{"q":"Before tuning a slow system you should…","o":["Measure the real bottleneck","Buy GPUs immediately","Rewrite everything"],"a":0,"e":"Diagnose first, then fix.","lesson":9}]};
