/* Chapter 16: Ethics, Governance, Risks, Compliance and Sovereignty of AI for Cybersecurity (Guide to AI for Cybersecurity) */
const CH = {"id":"ch16","num":"16","title":"Ethics, Governance, Risks, Compliance and Sovereignty of AI for Cybersecurity","summary":"How to build AI security that is effective and responsible: turning ethics into testable requirements, levels of automated defence, governance at three levels, technical and ethical risks, compliance, digital sovereignty, an integrated lifecycle, AI-enhanced social engineering and future trends.","outcomes":["Explain why responsible AI is a security issue","Turn fairness, transparency, accountability and privacy into testable requirements","Match human control to four levels of automated defence","Design governance across international, national and organisational levels","Analyse technical and ethical risks and map compliance duties","Address digital sovereignty and AI-enhanced social engineering"],"starter":[{"q":"Is 'the system shall be fair' a testable requirement?","o":["Yes","No, it needs a metric, threshold and test"],"a":1,"e":"Lesson 2 shows how to rewrite it."},{"q":"In the UK, is hacking back against an attacker lawful?","o":["Yes","No, it can breach the Computer Misuse Act"],"a":1,"e":"Level 4 defence carries extreme legal risk."},{"q":"If you get an urgent payment call in your manager's voice, you should…","o":["Pay quickly","Verify by calling back on a number you already hold"],"a":1,"e":"Voices can be cloned."}],"lessons":[{"title":"Why responsible AI is a security issue","minutes":3,"slides":[{"scene":{"type":"graph","title":"Four problems behind irresponsible AI","nodes":[{"id":"ag","label":"Accountability gap:\nwho is responsible?","p":[-5.2,0.0,-0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"bb","label":"Black box:\nno explanation","p":[-1.73,1.5,0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"ba","label":"Bias amplification\nat scale","p":[1.73,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"gf","label":"Global fragmentation:\nthreats ignore borders,\nlaws do not","p":[5.2,1.5,0.3],"c":"violet","shape":"torus","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ag"],["bb"],["ba"],["gf"]]},"say":["Welcome to Chapter 16, Ethics, Governance, Risks, Compliance and Sovereignty of AI for Cybersecurity, and I'm Sam, your tutor. Security AI often watches people and acts on what it sees, so its mistakes can stop a nurse treating a patient or wrongly mark an employee as a suspect.","The accountability gap: when an AI errs, it is often unclear who is responsible.","The black box: complex models struggle to explain their decisions.","Bias amplification: training data can encode past discrimination and repeat it at scale.","Global fragmentation: threats ignore borders, but laws do not. Technology moves faster than regulation, so organisations cannot wait for the law. Technical excellence is necessary but not sufficient, and ethics can be engineered: fairness can be measured, bias tested and decisions logged."]}],"keyPoint":"Responsible AI is a security issue: accountability, explainability, bias and jurisdiction all affect real people. Treat ethics as engineering that can be measured and tested.","plain":["A black box is a model whose reasoning is hard to follow.","Bias here means systematic unfairness.","Jurisdiction is the area where a set of laws applies.","Ethics can be measured, tested and logged."],"check":{"q":"What is the accountability gap?","o":["Uncertainty about who is responsible when AI errs","A gap in the firewall","A missing backup"],"a":0,"e":"Responsibility must be designed in.","retry":{"q":"How can ethics be treated as engineering?","o":["Measure fairness, test bias, log decisions","Ignore it","Write a poem"],"a":0,"e":"Ethics becomes testable requirements."}},"scenario":{"title":"The locked-out nurse","setting":"An automated system wrongly locks out a nurse during an emergency.","steps":[{"prompt":"Who is responsible?","choices":[{"t":"Shared, but a named owner must answer, and design should prevent it","s":2,"fb":"Right. Accountability must be clear in advance."},{"t":"Nobody, it was the AI","s":0,"fb":"AI cannot be accountable."},{"t":"Only the nurse","s":0,"fb":"She did nothing wrong."}]},{"prompt":"What design would prevent harm?","choices":[{"t":"Emergency 'break-glass' access with review afterwards","s":2,"fb":"Right. Safety first, checks after."},{"t":"Lock everyone out more often","s":0,"fb":"That worsens the harm."},{"t":"Remove all security","s":0,"fb":"Security is still needed."}]}]},"lab":{"type":"sort","title":"Name the problem","prompt":"Match each situation to the responsible-AI problem.","buckets":["Accountability gap","Black box","Bias amplification","Global fragmentation"],"items":[{"t":"Nobody knows who approved the blocking rule","b":0},{"t":"The model cannot say why it flagged a user","b":1},{"t":"One region is flagged far more often than others","b":2},{"t":"Data cannot legally cross a border to stop an attack","b":3}],"explain":"Each problem needs a different safeguard."}},{"title":"Turning ethics into requirements","minutes":4,"slides":[{"scene":{"type":"graph","title":"Four ethical principles","nodes":[{"id":"fa","label":"Fairness:\nsimilar error rates\nacross groups","p":[-5.2,0.0,-0.3],"c":"green","shape":"sphere","size":0.8,"ls":0.62},{"id":"tr","label":"Transparency:\ndocumented logic\nand limits","p":[-1.73,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"ac","label":"Accountability:\nowners, oversight,\naudit trails","p":[1.73,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"pv","label":"Privacy:\ncollect only\nwhat is needed","p":[5.2,1.5,0.3],"c":"violet","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["fa"],["tr"],["ac"],["pv"]]},"say":["Building ethics in from the start is called AI ethics by design, and requirements are the cheapest place to begin.","Fairness: similar error rates across groups. A practical test is whether false alarm rates are similar across users, departments or regions.","Transparency: documented decision logic and clear limits.","Accountability: clear responsibility, human oversight and audit trails, tamper-resistant records of what the system did and why.","Privacy: collect only what is needed and use privacy-enhancing technologies. 'The system shall be fair' is not testable. 'False positive rates within two percentage points across groups, checked quarterly' is. A good requirement has a metric, a threshold, a frequency, a test and an owner."]},{"scene":{"type":"graph","title":"Four levels of automated defence","nodes":[{"id":"l1","label":"Level 1: passive\nmonitoring, alerts","p":[-5.2,0.0,-0.3],"c":"green","shape":"box","size":0.8,"ls":0.62},{"id":"l2","label":"Level 2: low-impact,\nreversible actions","p":[-1.73,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"l3","label":"Level 3: high-impact actions,\nhuman authorisation","p":[1.73,0.0,-0.3],"c":"amber","shape":"shield","size":0.8,"ls":0.62},{"id":"l4","label":"Level 4: offensive\n'hack back'","p":[5.2,1.5,0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62}],"links":[["l1","l2",2],["l2","l3",2],["l3","l4",2]],"steps":["all",["l1"],["l2"],["l3"],["l4"]]},"say":["The chapter sets out four levels of automated defence; the more harmful the action, the more human control it needs.","Level 1: observing, logging and alerting, with low ethical risk.","Level 2: low-impact, reversible actions, such as blocking one suspicious connection.","Level 3: high-impact actions such as locking accounts or isolating systems, which need human authorisation.","Level 4: offensive action, hacking back, with extreme legal and ethical risk. In the UK, accessing another computer without permission is an offence under the Computer Misuse Act 1990 even if they attacked you first, and attackers often route through innocent third parties' machines."]}],"keyPoint":"Turn fairness, transparency, accountability and privacy into requirements with metrics, thresholds, frequencies, tests and owners. Match human control to the harm an action can cause.","plain":["A false positive is a false alarm.","Five questions: measure what, how close, how often, how tested, who owns it?","Break-glass access lets emergencies through, with review afterwards.","Hacking back is illegal in the UK."],"check":{"q":"Which requirement is testable?","o":["False positive rates within 2 points across groups, checked quarterly","The system shall be fair","The AI shall be nice"],"a":0,"e":"It has a metric, threshold and frequency.","retry":{"q":"Which defence level needs human authorisation?","o":["Level 3, high-impact actions","Level 1, monitoring","None"],"a":0,"e":"Account locks and isolation affect people significantly."}},"scenario":{"title":"The 2 am doctor","setting":"An AI locks a doctor's account after unusual 2 am record access. She was treating an emergency.","steps":[{"prompt":"Which principles are in tension?","choices":[{"t":"Security and patient safety, with fairness and accountability","s":2,"fb":"Right. Design must balance them."},{"t":"None","s":0,"fb":"Clear tensions exist."},{"t":"Only cost","s":0,"fb":"People's safety is at stake."}]},{"prompt":"What is a better design?","choices":[{"t":"Break-glass emergency access, logged and reviewed afterwards","s":2,"fb":"Right. Let care happen, check later."},{"t":"Block all night access","s":0,"fb":"Harms patients."},{"t":"No logging","s":0,"fb":"Accountability needs records."}]}]},"lab":{"type":"sort","title":"Which level?","prompt":"Place each automated action at its defence level.","buckets":["Level 1","Level 2","Level 3","Level 4"],"items":[{"t":"Alerting an analyst about odd logins","b":0},{"t":"Blocking one suspicious connection","b":1},{"t":"Locking a member of staff's account","b":2},{"t":"Attacking the attacker's server","b":3},{"t":"Isolating a production server","b":2}],"explain":"Higher levels need more human control, and Level 4 is usually unlawful."}},{"title":"Governance at three levels","minutes":3,"slides":[{"scene":{"type":"graph","title":"Obligations cascade downwards","nodes":[{"id":"int","label":"International: ISO\nIEC 42001,\nOECD, UNESCO","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"sphere","size":0.8,"ls":0.62},{"id":"nat","label":"National and regional:\nGDPR, EU AI Act, CCPA","p":[-1.73,1.5,0.3],"c":"violet","shape":"shield","size":0.8,"ls":0.62},{"id":"org","label":"Organisational: ethics committees,\npolicies, audit trails","p":[1.73,0.0,-0.3],"c":"amber","shape":"box","size":0.8,"ls":0.62},{"id":"day","label":"Daily practice:\nnamed owners, escalation","p":[5.2,1.5,0.3],"c":"green","shape":"box","size":0.8,"ls":0.62}],"links":[["int","nat",2],["nat","org",2],["org","day",2]],"steps":["all",["int"],["nat"],["org"],["day"]]},"say":["Governance means the structures, rules and people that oversee how AI is built and used. It answers: who decides, and how are they held to account?","Internationally, bodies agree standards and principles. ISO/IEC 42001, published in 2023, is the first international management system standard for AI.","National and regional laws set binding duties, such as GDPR, the EU AI Act and California's CCPA.","Organisations turn those duties into committees, policies, reviews and audit trails. For example, the EU AI Act's human oversight duty becomes a policy naming who may override the AI and how overrides are recorded.","Day to day: a named owner for each system, a cross-functional committee, scheduled audits, escalation by risk, automatic for low risk, notify for medium, authorise for high, and blame-free learning from every wrong decision."]}],"keyPoint":"Governance cascades from international standards to national law to organisational policy to daily practice: named owners, committees, audits, escalation by risk and learning.","plain":["ISO/IEC 42001 does for AI what ISO/IEC 27001 does for information security.","A committee brings technical, legal, business and ethics voices together.","Escalation matches human involvement to risk.","Learn from mistakes rather than blame."],"check":{"q":"What is ISO/IEC 42001?","o":["An international management system standard for AI","A US privacy law","A firewall product"],"a":0,"e":"Published in 2023.","retry":{"q":"Under risk-based escalation, high-risk actions need…","o":["A human to authorise them","No oversight","Only logging"],"a":0,"e":"Low risk is automatic, medium notifies."}},"scenario":{"title":"50,000 users","setting":"You design governance for a system that makes automated blocking decisions for 50,000 users.","steps":[{"prompt":"Who should be able to override it?","choices":[{"t":"A named on-call role, with overrides logged and reviewed","s":2,"fb":"Right. Authority with accountability."},{"t":"Anyone who asks","s":0,"fb":"Overrides could be abused."},{"t":"Nobody","s":0,"fb":"Humans must be able to intervene."}]},{"prompt":"A competitor in a less regulated country is cheaper and faster. How should you respond?","choices":[{"t":"Treat compliance and trust as strengths, and keep meeting the standard","s":2,"fb":"Right. Trust is a competitive asset."},{"t":"Ignore the EU AI Act","s":0,"fb":"That brings legal risk."},{"t":"Move all data offshore","s":0,"fb":"That may breach the law."}]}]},"lab":{"type":"sort","title":"Which level?","prompt":"Place each item at its governance level.","buckets":["International","National or regional","Organisational"],"items":[{"t":"OECD AI Principles","b":0},{"t":"EU AI Act","b":1},{"t":"AI ethics committee","b":2},{"t":"ISO/IEC 42001","b":0},{"t":"UK GDPR","b":1},{"t":"Audit trail of overrides","b":2}],"explain":"Duties flow down from standards to law to policy."}},{"title":"Technical and ethical risks, and compliance","minutes":3,"slides":[{"scene":{"type":"graph","title":"Risks to the AI and risks from the AI","nodes":[{"id":"dp","label":"Data poisoning:\ncorrupted learning","p":[-5.2,0.0,-0.3],"c":"red","shape":"cyl","size":0.8,"ls":0.62},{"id":"mi","label":"Model inversion:\ndata pulled back out","p":[-3.12,1.5,0.3],"c":"pink","shape":"box","size":0.8,"ls":0.62},{"id":"ea","label":"Evasion attacks:\nslipping past detection","p":[-1.04,0.0,-0.3],"c":"violet","shape":"ico","size":0.8,"ls":0.62},{"id":"bi","label":"Bias and\nunfairness","p":[1.04,1.5,0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62},{"id":"fc","label":"Function creep:\ndata reused for\nanother purpose","p":[3.12,0.0,-0.3],"c":"slate","shape":"box","size":0.8,"ls":0.62},{"id":"tg","label":"Transparency\ngaps","p":[5.2,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62}],"links":[],"steps":["all",["dp"],["mi"],["ea"],["bi"],["fc"],["tg"]]},"say":["Technical risks are attacks on the AI itself; ethical risks are harms it can cause even when nobody attacks.","Data poisoning corrupts what the model learns, like contaminating a recipe's ingredients.","Model inversion pulls sensitive information about the training data back out of the model.","Evasion attacks craft inputs, such as network traffic shaped to fool an intrusion detection system.","Bias: some groups or regions are flagged far more often.","Function creep: data collected for security is later used for something else, such as monitoring staff performance.","Transparency gaps leave people unable to understand or challenge decisions. Compliance frameworks include GDPR, with fines up to 20 million euros or 4 per cent of global turnover; the EU AI Act, with conformity assessments for high-risk systems; ISO/IEC 27001 and 42001; and the voluntary NIST AI Risk Management Framework. GDPR has no simple general 'right to explanation'; duties come from Article 22 and Articles 13 to 15. Compliance is continuous, not a certificate."]}],"keyPoint":"Guard against poisoning, inversion and evasion, and against bias, function creep and opacity. Compliance with GDPR, the EU AI Act and ISO standards is continuous.","plain":["Function creep is mission drift for data.","GDPR's highest fines reach 4 per cent of global turnover.","A conformity assessment is a formal check before market.","Whether security AI is 'high-risk' depends on its use."],"check":{"q":"Using security data to monitor staff performance is an example of…","o":["Function creep","Data poisoning","Evasion"],"a":0,"e":"Data used beyond its original purpose.","retry":{"q":"Does GDPR contain a simple general 'right to explanation'?","o":["No; duties come from Article 22 and Articles 13–15","Yes, Article 1","Only in the US"],"a":0,"e":"The old idea overstates it."}},"scenario":{"title":"Too much data","setting":"You discover your AI security system collects more personal data than it needs, but cutting it lowers detection accuracy.","steps":[{"prompt":"What do you do?","choices":[{"t":"Reduce collection to what is necessary and find other ways to recover accuracy","s":2,"fb":"Right. Minimisation is a legal duty."},{"t":"Keep collecting, accuracy matters more","s":0,"fb":"That breaches GDPR."},{"t":"Hide the excess data","s":0,"fb":"That compounds the breach."}]},{"prompt":"Which risk is harder to manage over time?","choices":[{"t":"Ethical risks often, because they shift with context and use","s":2,"fb":"A reasonable view: both need continuous attention."},{"t":"Neither needs managing","s":0,"fb":"Both do."},{"t":"Only technical risks matter","s":0,"fb":"Ethical harms are real."}]}]},"lab":{"type":"sort","title":"Technical or ethical risk?","prompt":"Classify each risk.","buckets":["Technical (attack on the AI)","Ethical (harm from the AI)"],"items":[{"t":"Poisoned training data","b":0},{"t":"One region flagged far more often","b":1},{"t":"Traffic crafted to fool an IDS","b":0},{"t":"Security data reused for appraisals","b":1},{"t":"Rebuilding training data from outputs","b":0},{"t":"Users unable to challenge decisions","b":1}],"explain":"Both kinds need controls, owners and monitoring."}},{"title":"Sovereignty and trust","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three kinds of digital sovereignty","nodes":[{"id":"ds","label":"Data sovereignty:\nwhere data lives,\ntransfer controls","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"cyl","size":0.8,"ls":0.62},{"id":"is","label":"Infrastructure sovereignty:\nlocally controlled cloud","p":[-1.73,1.5,0.3],"c":"violet","shape":"box","size":0.8,"ls":0.62},{"id":"as","label":"Algorithmic sovereignty:\nmodels you can\ninspect and audit","p":[1.73,0.0,-0.3],"c":"amber","shape":"ico","size":0.8,"ls":0.62},{"id":"fl","label":"Partial answers: federated\nlearning, share indicators\nnot personal data","p":[5.2,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ds"],["is"],["as"],["fl"]]},"say":["Digital sovereignty is the ability to control your own digital infrastructure, data and AI without undue dependence on others. It is about who controls a system, not only where data sits.","Data sovereignty: where data lives, controls on cross-border transfer, and limits on foreign government access. Data localisation laws require some data to stay in-country.","Infrastructure sovereignty: could your cloud be cut off, or its operator compelled by a foreign government to hand over data?","Algorithmic sovereignty: can you inspect and audit the model making decisions about your systems and people?","The tension: attacks cross borders in seconds, but sovereignty laws can block sharing threat data. Partial answers include federated learning, sharing what models learned rather than raw data; regional autonomy with central coordination; legal transfer mechanisms; and sharing threat indicators, such as malicious addresses and file fingerprints, rather than personal data. Each gives up some effectiveness, cost or simplicity."]}],"keyPoint":"Sovereignty covers data, infrastructure and algorithms. Federated learning, regional designs and sharing indicators instead of personal data ease the tension with global security.","plain":["Sovereignty is about control, not just location.","Threat indicators can often be shared without personal data.","A model trained in one region may perform poorly in another.","There is no perfect solution, only trade-offs."],"check":{"q":"What is algorithmic sovereignty?","o":["Being able to inspect and audit the models that make decisions","Owning the most algorithms","Writing code in your own language"],"a":0,"e":"Control over decision logic.","retry":{"q":"What can usually be shared across borders without personal data?","o":["Threat indicators such as malicious addresses and file hashes","Full staff email archives","Customer records"],"a":0,"e":"Indicators help without exposing people."}},"scenario":{"title":"The 40-country attack","setting":"A coordinated attack hits 40 countries, but laws forbid moving detailed threat data across borders.","steps":[{"prompt":"Which architecture helps?","choices":[{"t":"Regional detection with central coordination, sharing indicators and federated updates","s":2,"fb":"Right. Cooperate without moving raw data."},{"t":"Ignore the laws during attacks","s":0,"fb":"That creates legal risk."},{"t":"Do nothing","s":0,"fb":"Coordination is still possible."}]},{"prompt":"Is a foreign company's cloud in a local data centre 'sovereign'?","choices":[{"t":"It depends on who controls it and which laws can compel access","s":2,"fb":"Right. Location alone does not decide."},{"t":"Yes, always","s":0,"fb":"Control and legal access matter."},{"t":"No, never","s":1,"fb":"Sometimes it can be, with safeguards."}]}]},"lab":{"type":"sort","title":"Which sovereignty?","prompt":"Match each concern to its kind of sovereignty.","buckets":["Data","Infrastructure","Algorithmic"],"items":[{"t":"Must patient data stay in the country?","b":0},{"t":"Could a foreign supplier switch off our cloud?","b":1},{"t":"Can we audit why the model blocked someone?","b":2},{"t":"Controls on cross-border transfers","b":0},{"t":"Dependence on a single overseas vendor","b":1}],"explain":"Each kind asks a different question about control."}},{"title":"One integrated lifecycle","minutes":3,"slides":[{"scene":{"type":"graph","title":"Five concerns running through every phase","nodes":[{"id":"rq","label":"Requirements:\nfairness, privacy,\nownership","p":[0.0,3.2,0],"c":"cyan","shape":"sphere","size":0.8,"ls":0.6},{"id":"de","label":"Design: central or\nfederated, sovereignty","p":[3.99,1.4,0],"c":"violet","shape":"sphere","size":0.8,"ls":0.6},{"id":"it","label":"Implementation and\ntesting: bias tests","p":[2.47,-1.51,0],"c":"amber","shape":"sphere","size":0.8,"ls":0.6},{"id":"dp","label":"Deployment:\noversight, compliance","p":[-2.47,-1.51,0],"c":"green","shape":"shield","size":0.8,"ls":0.6},{"id":"op","label":"Operation: monitoring,\nlessons feed back","p":[-3.99,1.4,0],"c":"pink","shape":"torus","size":0.8,"ls":0.6}],"links":[["rq","de",2],["de","it",2],["it","dp",2],["dp","op",2],["op","rq",2]],"steps":["all",["rq"],["de"],["it"],["dp"],["op"],"all"],"orbit":0.4},"say":["Ethics, governance, risk, compliance and sovereignty are not one-off checkboxes. They are continuous, connected and built in from the first requirement.","In requirements, weak fairness requirements become gaps in design.","In design, choices such as central or federated architecture enable or limit sovereignty.","In implementation and testing, bias found in testing usually reveals a missing requirement, not only a coding error.","At deployment, oversight and compliance checkpoints apply.","In operation, experience, such as new kinds of false alarm, shapes the next version's requirements, closing the loop.","An ethical failure quickly becomes a governance, compliance and possibly sovereignty problem. Keep one linked set of documents: requirements with owners and tests, design rationale, risk registers, compliance checkpoints and monitoring plans."]}],"keyPoint":"The five concerns run through the whole lifecycle and depend on each other. Keep linked requirements, design rationale, risks, compliance and monitoring in one set of documents.","plain":["Missing requirements cannot be designed or tested for.","Centralising data in one country can block sovereignty later.","Bias in testing often points back to requirements.","Operation feeds the next version's requirements."],"check":{"q":"Bias found during testing usually reveals…","o":["A missing or weak requirement","Only a typo","Nothing"],"a":0,"e":"Fix requirements, not just code.","retry":{"q":"Why decide central versus federated architecture early?","o":["It enables or limits sovereignty, and changing later is costly","It affects only colours","It does not matter"],"a":0,"e":"Design choices constrain later options."}},"scenario":{"title":"The expensive discovery","setting":"A team discovers in operation that its system cannot meet a country's data localisation law.","steps":[{"prompt":"Where should this have been caught?","choices":[{"t":"Requirements and design, by stating sovereignty needs early","s":2,"fb":"Right. Earliest is cheapest."},{"t":"Never","s":0,"fb":"It could have been foreseen."},{"t":"Only in operation","s":0,"fb":"That is the most expensive point."}]},{"prompt":"Who should own the integrated framework?","choices":[{"t":"A clearly named owner, supported by an AI ethics committee and the DPO","s":2,"fb":"Right. Shared input, single accountability."},{"t":"Nobody","s":0,"fb":"Ownership matters."},{"t":"Only the vendor","s":0,"fb":"The organisation remains accountable."}]}]},"lab":{"type":"order","title":"Follow the lifecycle","prompt":"Put the integrated lifecycle phases in order.","items":["Requirements","Design","Implementation and testing","Deployment","Operation"],"explain":"Operation's lessons loop back to the next requirements."}},{"title":"AI-enhanced social engineering","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three layers of defence","nodes":[{"id":"ba","label":"Behavioural analytics:\nunusual requests, times,\ndestinations","p":[-5.2,0.0,-0.3],"c":"cyan","shape":"ico","size":0.8,"ls":0.62},{"id":"sv","label":"Strong verification:\ncall back, signatures,\ntwo-person approval","p":[0.0,1.5,0.3],"c":"green","shape":"shield","size":0.8,"ls":0.62},{"id":"hf","label":"Human factors:\ntraining, culture,\nblame-free reporting","p":[5.2,0.0,-0.3],"c":"amber","shape":"sphere","size":0.8,"ls":0.62}],"links":[],"steps":["all",["ba"],["sv"],["hf"]]},"say":["Social engineering means tricking people rather than computers. AI makes it cheaper and more convincing: language models write fluent, personalised spear-phishing emails, aimed at specific people using details gathered automatically; cloned voices impersonate executives on the phone, called vishing; and deepfake video, generated or altered by AI, can appear in video calls. The old warning signs, such as poor spelling, disappear.","Behavioural analytics learn normal communication and flag oddities, such as a payment request from someone who never makes one, at an unusual time or to an unusual destination.","Strong verification never trusts only the channel a request arrived on: call back on a number you already hold, use digital signatures, and require two-person approval for payments.","Human factors: train staff on AI threats, build a culture where questioning senior people is normal, make reporting blame-free, and practise with simulated exercises run with consent. A culture that lets people say 'let me check' is itself a security control."]}],"keyPoint":"AI makes phishing, voice cloning and deepfakes convincing. Defend with behavioural analytics, out-of-band verification and a culture where checking is normal.","plain":["Spear phishing targets a specific person using personal details.","Vishing is voice phishing.","Out-of-band verification uses a different channel you already trust.","'Let me check' is a security control."],"check":{"q":"What is out-of-band verification?","o":["Confirming through a separate channel you already trust","Replying to the same email","Ignoring the request"],"a":0,"e":"Call back on a number you already hold.","retry":{"q":"Why are AI-written phishing emails harder to spot?","o":["They are fluent and personalised, without old warning signs","They are shorter","They use capital letters"],"a":0,"e":"Assume messages and voices can be faked."}},"scenario":{"title":"The urgent call","setting":"You get a call in your manager's voice asking for an urgent payment to a new supplier.","steps":[{"prompt":"What should you do?","choices":[{"t":"Hang up and call back on the number you already hold, then follow two-person approval","s":2,"fb":"Right. Verify out of band."},{"t":"Pay quickly, it is urgent","s":0,"fb":"Urgency is a classic pressure tactic."},{"t":"Email the same number back","s":1,"fb":"Better, but use a channel you already trust."}]},{"prompt":"Is a simulated deepfake phishing exercise on staff ethical?","choices":[{"t":"With clear policy, consent and blame-free follow-up","s":2,"fb":"Right. Conditions matter."},{"t":"Always, without telling anyone","s":0,"fb":"Trust and wellbeing matter."},{"t":"Never","s":1,"fb":"Can be valuable with safeguards."}]}]},"lab":{"type":"sort","title":"Which defence layer?","prompt":"Match each measure to its defence layer.","buckets":["Behavioural analytics","Strong verification","Human factors"],"items":[{"t":"Flag a payment to a never-used destination","b":0},{"t":"Call back on a known number","b":1},{"t":"Blame-free reporting of suspicious calls","b":2},{"t":"Two-person approval for payments","b":1},{"t":"Training on deepfake voices","b":2}],"explain":"Layers together beat any single control."}},{"title":"Future directions","minutes":3,"slides":[{"scene":{"type":"graph","title":"Three trends shaping responsible AI security","nodes":[{"id":"au","label":"Autonomous security:\nmachine-speed response","p":[-5.2,0.0,-0.3],"c":"red","shape":"ico","size":0.8,"ls":0.62},{"id":"xai","label":"Explainable AI maturing:\nincluding neurosymbolic","p":[0.0,1.5,0.3],"c":"cyan","shape":"box","size":0.8,"ls":0.62},{"id":"gh","label":"Global harmonisation,\nor fragmentation?","p":[5.2,0.0,-0.3],"c":"violet","shape":"torus","size":0.8,"ls":0.62}],"links":[],"steps":["all",["au"],["xai"],["gh"]]},"say":["The chapter looks ahead at three trends.","Autonomous security systems detect and respond at machine speed, which makes accountability harder: who answers for a decision made in milliseconds?","Explainable AI is maturing, including neurosymbolic approaches that combine neural networks with logical rules, so decisions can be explained in human terms.","International frameworks try to bridge jurisdictions, but geopolitical tensions may fragment the landscape. Responsible AI security means being effective, ethical, governed, compliant and respectful of sovereignty, all at once."]}],"keyPoint":"Autonomous security, maturing explainable AI and uncertain global harmonisation will shape the field. Responsible means effective, ethical, governed, compliant and sovereign together.","plain":["Faster systems make accountability harder.","Neurosymbolic AI mixes neural networks with logical rules.","Harmonisation may lose out to fragmentation.","Design for all five concerns at once."],"check":{"q":"Why does autonomous security make accountability harder?","o":["Decisions happen at machine speed with less human involvement","It is cheaper","It uses less data"],"a":0,"e":"Accountability must be designed in advance.","retry":{"q":"What does neurosymbolic AI combine?","o":["Neural networks and logical rules","Cloud and paper","Hardware and furniture"],"a":0,"e":"It can make decisions easier to explain."}},"scenario":{"title":"Hack back?","setting":"A board member proposes letting the security AI automatically attack servers that attack the company.","steps":[{"prompt":"What is your advice?","choices":[{"t":"Do not: it is unlawful in the UK and may hit innocent third parties","s":2,"fb":"Right. Level 4 action carries extreme risk."},{"t":"Yes, it deters attackers","s":0,"fb":"It breaks the law and risks harm."},{"t":"Only on weekends","s":0,"fb":"Timing does not change legality."}]},{"prompt":"What should guide autonomous defence?","choices":[{"t":"Human authorisation for high-impact actions and clear accountability","s":2,"fb":"Right. Speed with oversight."},{"t":"No rules","s":0,"fb":"Rules keep it lawful and fair."},{"t":"Whatever is fastest","s":0,"fb":"Speed is not the only value."}]}]},"lab":{"type":"sort","title":"Which trend?","prompt":"Match each development to its trend.","buckets":["Autonomous security","Explainable AI","Global harmonisation"],"items":[{"t":"Response actions taken in milliseconds without a person","b":0},{"t":"Combining neural networks with logical rules","b":1},{"t":"International frameworks bridging jurisdictions","b":2},{"t":"Tools that show why a decision was made","b":1}],"explain":"Each trend raises new questions about responsibility."}}],"test":[{"q":"The black box problem is…","o":["Models struggling to explain their decisions","A broken server","A type of firewall"],"a":0,"e":"","lesson":0},{"q":"A good requirement includes…","o":["A metric, threshold, frequency, test and owner","Only a slogan","A logo"],"a":0,"e":"","lesson":1},{"q":"Level 2 automated defence takes…","o":["Low-impact, reversible actions","Offensive action","No action"],"a":0,"e":"","lesson":1},{"q":"Break-glass access is…","o":["Emergency access with review afterwards","A broken window","A password reset"],"a":0,"e":"","lesson":1},{"q":"ISO/IEC 42001 is…","o":["An AI management system standard","A US privacy law","A firewall"],"a":0,"e":"","lesson":2},{"q":"Risk-based escalation makes high-risk actions…","o":["Need human authorisation","Automatic","Hidden"],"a":0,"e":"","lesson":2},{"q":"Model inversion…","o":["Pulls training data back out of a model","Flips images","Encrypts data"],"a":0,"e":"","lesson":3},{"q":"Function creep is…","o":["Using data for a purpose beyond the original one","Slow software","A bug"],"a":0,"e":"","lesson":3},{"q":"GDPR's highest fines reach…","o":["4 per cent of global turnover or 20 million euros","100 euros","Nothing"],"a":0,"e":"","lesson":
